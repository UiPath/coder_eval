[project]
name = "coder-eval"
version = "0.1.0"
description = "A robust, extensible framework for evaluating AI coding agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "typer>=0.24.1",
    "rich>=14.3.3",
    "python-dotenv>=1.2.2",
    "anthropic>=0.86.0",
    "claude-agent-sdk>=0.2.82",
    "anyio>=4.13.0",
    "uipath>=2.10.31",
    "uipath-llmgw-client>=1.0.0",
    "pylint>=4.0.5",
    "radon>=6.0.1",
    "tqdm>=4.67.3",
    "aiohttp>=3.13.3",
    "jmespath>=1.1.0",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist[psutil]>=3.0.0",
    "mcp>=1.26.0",
    "ruff>=0.15.7",
    "pyright>=1.1.408",
    "pip-audit>=2.10.0",
    "bandit[toml]>=1.9.4",
    "pre-commit>=4.5.1",
]

[project.scripts]
coder-eval = "coder_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coder_eval"]

[tool.hatch.build.targets.wheel.force-include]
"src/coder_eval/resources" = "coder_eval/resources"
"experiments/default.yaml" = "coder_eval/resources/default_experiment.yaml"

[[tool.uv.index]]
name = "uipath"
url = "https://uipath.pkgs.visualstudio.com/_packaging/ml-packages/pypi/simple/"
publish-url = "https://uipath.pkgs.visualstudio.com/_packaging/ml-packages/pypi/upload/"
explicit = true

constraint-dependencies = [
    # Fix known CVEs in transitive dependencies
    "cryptography>=46.0.5",
    "langgraph>=1.0.10",
    "langsmith>=0.6.3",
    "orjson>=3.11.6",
    "pyjwt>=2.12.0",
    "python-multipart>=0.0.22",
    "requests>=2.33.0",
    "starlette>=0.49.1",
    "urllib3>=2.6.3",
]

[tool.uv.sources]
uipath-llmgw-client = { index = "uipath" }

[tool.ruff]
line-length = 120
target-version = "py313"
# templates/flow-v2-shared/ vendors scripts from the flow-v2 repo; we
# don't own their style and want easy re-sync, so exclude them from lint.
extend-exclude = ["templates/flow-v2-shared/generate_connectors.py", "templates/flow-v2-shared/convert_library_to_md.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
external = [
    "CE001",
    "CE002",
    "CE003",
    "CE004",
    "CE005",
    "CE006",
    "CE007",
    "CE008",
    "CE009",
]  # custom architectural lint rules (tests/lint/)

[tool.ruff.lint.per-file-ignores]
"tests/lint/**" = ["N802"]  # visit_* methods must match AST node class names (PascalCase required by ast.NodeVisitor)

[tool.ruff.lint.isort]
known-first-party = ["coder_eval"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
include = ["src/coder_eval"]
exclude = [
    "data",
    "tmp",
    "**/__pycache__",
    "**/.pytest_cache",
    "tests",
    ".venv",
    "ref",
]
venvPath = "."
venv = ".venv"

# Global baseline
typeCheckingMode = "standard"
useLibraryCodeForTypes = true

# Keep "unknown type" noise off
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"

# Import/runtime hygiene (useful, low-noise)
reportMissingImports = "error"
reportImportCycles = "warning"
reportDuplicateImport = "information"

# Catch real logic bugs with minimal churn
reportUnboundVariable = "error"
reportPossiblyUnboundVariable = "warning"

# None-safety (very helpful; tune as warnings)
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalSubscript = "warning"
reportOptionalOperand = "warning"

# Generics hygiene (helps with List/Dict/etc. without demanding full typing)
reportMissingTypeArgument = "warning"
reportInvalidTypeVarUse = "warning"

# OO correctness, but not too strict
reportIncompatibleMethodOverride = "warning"
reportInconsistentConstructor = "warning"

# Small quality-of-life checks that catch slip-ups
reportImplicitStringConcatenation = "warning"

# Keep these quiet unless you want more discipline later
reportPrivateUsage = "none"
reportConstantRedefinition = "none"
reportUntypedFunctionDecorator = "none"
reportUntypedClassDecorator = "none"
reportUntypedBaseClass = "none"
reportUntypedNamedTuple = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Exclude specific directories from test discovery
norecursedirs = [
    ".*",
    "build",
    "dist",
    "*.egg",
    "venv",
    ".venv",
    "node_modules",
    "ref",
]

# Default pytest options
addopts = [
    "-n", "auto",       # Parallel execution across all CPU cores
    "-v",               # Verbose output
    "--strict-markers", # Fail on undefined markers
    "--strict-config",  # Fail on config errors
    "--tb=short",       # Shorter traceback format
    "-ra",              # Show summary of all test outcomes
    "--showlocals",     # Show local variables in tracebacks
    "--color=yes",      # Force colored output
]

# Asyncio configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Test markers (define all custom markers here)
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "requires_api_key: marks tests that need real API keys",
    "live: marks tests that hit real external services (LLM Gateway, etc.)",
    "lint: marks tests that enforce custom architectural lint rules",
]

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Warnings configuration
filterwarnings = [
    "error",                             # Turn warnings into errors
    "ignore::DeprecationWarning",        # Ignore deprecation warnings from dependencies
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",           # Ignore unclosed resources (handled by cleanup)
]

# Coverage integration (when using --cov)
[tool.coverage.run]
source = ["src/coder_eval"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*", "*/test_*.py"]
branch = true                                                       # Measure branch coverage

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
