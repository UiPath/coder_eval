[project]
name = "coder-eval"
version = "0.1.0"
description = "A robust, extensible framework for evaluating AI coding agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer[all]>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "anthropic>=0.25",
    "claude-agent-sdk>=0.1.1",
    "anyio>=4.11.0",
    "uipath>=2.1.134",
    "uipath-llmgw-client>=0.1.33",
    "pylint>=3.3.9",
    "radon>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=1.2.0",
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "mcp>=1.16.0",
    "ruff>=0.14.0",
    "pyright>=1.1.406",
    "pip-audit>=2.6",
    "bandit[toml]>=1.7",
    "pre-commit>=3.0",
]

[project.scripts]
coder-eval = "coder_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coder_eval"]

[tool.hatch.build.targets.wheel.force-include]
"coder_eval/resources" = "coder_eval/resources"

[[tool.uv.index]]
name = "uipath"
url = "https://uipath.pkgs.visualstudio.com/_packaging/ml-packages/pypi/simple/"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["coder_eval"]
force-single-line = false
lines-after-imports = 2

[tool.pyright]
pythonVersion = "3.13"
include = ["coder_eval"]
exclude = [
    "data",
    "tmp",
    "**/__pycache__",
    "**/.pytest_cache",
    "tests",
    ".venv",
    "ref",
]
venvPath = "."
venv = ".venv"

# Global baseline
typeCheckingMode = "standard"
useLibraryCodeForTypes = true

# Keep "unknown type" noise off
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"

# Import/runtime hygiene (useful, low-noise)
reportMissingImports = "error"
reportImportCycles = "warning"
reportDuplicateImport = "information"

# Catch real logic bugs with minimal churn
reportUnboundVariable = "error"
reportPossiblyUnboundVariable = "warning"

# None-safety (very helpful; tune as warnings)
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalSubscript = "warning"
reportOptionalOperand = "warning"

# Generics hygiene (helps with List/Dict/etc. without demanding full typing)
reportMissingTypeArgument = "warning"
reportInvalidTypeVarUse = "warning"

# OO correctness, but not too strict
reportIncompatibleMethodOverride = "warning"
reportInconsistentConstructor = "warning"

# Small quality-of-life checks that catch slip-ups
reportImplicitStringConcatenation = "warning"

# Keep these quiet unless you want more discipline later
reportPrivateUsage = "none"
reportConstantRedefinition = "none"
reportUntypedFunctionDecorator = "none"
reportUntypedClassDecorator = "none"
reportUntypedBaseClass = "none"
reportUntypedNamedTuple = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Exclude specific directories from test discovery
norecursedirs = [
    ".*",
    "build",
    "dist",
    "*.egg",
    "venv",
    ".venv",
    "node_modules",
    "ref",
]

# Default pytest options
addopts = [
    "-v",               # Verbose output
    "--strict-markers", # Fail on undefined markers
    "--strict-config",  # Fail on config errors
    "--tb=short",       # Shorter traceback format
    "-ra",              # Show summary of all test outcomes
    "--showlocals",     # Show local variables in tracebacks
    "--color=yes",      # Force colored output
]

# Asyncio configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Test markers (define all custom markers here)
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "requires_api_key: marks tests that need real API keys",
]

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Warnings configuration
filterwarnings = [
    "error",                             # Turn warnings into errors
    "ignore::DeprecationWarning",        # Ignore deprecation warnings from dependencies
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",           # Ignore unclosed resources (handled by cleanup)
]

# Coverage integration (when using --cov)
[tool.coverage.run]
source = ["coder_eval"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*", "*/test_*.py"]
branch = true                                                       # Measure branch coverage

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
