# Activation suite template. Replace every `my-skill` with the bare name of the
# skill under test (the directory name of its SKILL.md — never a `plugin:skill`
# form), and rewrite the rows in activation-rows.jsonl as real user requests.
#
# One row per prompt; each row is scored on whether the agent engaged the skill.
# Positive rows set expected_skill to the skill's name, distractor rows set "".
#
# Rows also carry a `split` — `train` or `test`. `/coder-eval:optimize-skill`
# proposes description rewrites against `train` and confirms the winner on `test`,
# so an improvement has to survive rows it was not fitted to. Select one with
# `coder-eval run <this file> --split train`; with no --split every row runs.
#
# A split HALVES each side, so it multiplies the sizing rule: a suite you intend to
# optimize wants 16-24 of each polarity, not the 8-12 a one-shot check aims for.
# The six rows below are the illustrative minimum, not a target — split 4/2 they are
# too small to gate an optimization round on, and optimize-skill will say so.
task_id: "my-skill-activation"
description: "Does the agent engage `my-skill` when it should, and leave it alone when it shouldn't?"
tags: [activation]

# REPLACE: the skill under test must be REACHABLE by the sandboxed agent, or every
# positive row scores 0 and the suite reports recall 0.0 — which reads exactly like a
# broken skill.
#
# `path` must be a PLUGIN ROOT: a directory holding a `skills/` subdirectory, i.e.
# `<path>/skills/<skill-name>/SKILL.md`. A `.claude-plugin/plugin.json` is optional —
# without one the namespace defaults to the directory's own name.
#
# So for `.claude/skills/my-skill/SKILL.md` the path is `.claude` — NOT `.claude/skills`.
# Pointing at a bare directory of skill directories loads NOTHING, silently, and produces
# exactly the recall 0.0 this comment warns about.
#
#   export SKILL_SOURCE_PATH=/abs/path/to/.claude
#
# Supplied through an environment variable so the committed suite stays portable across
# machines and CI. An unset or wrong path is only a warning, so confirm the first run's
# recall is non-zero before trusting a low score.
#
# `skill_name` below stays the BARE name even when a plugin namespaces the skill as
# `plugin:skill` — the checker strips the namespace before comparing.
agent:
  # The discriminator is required for `setting_sources` to be in schema — it is a
  # claude-code field, not a field on the shared agent base. Running this suite with
  # `--type codex` therefore fails resolution and reports the task as skipped; a Codex
  # user should drop both this line and `setting_sources` below.
  type: "claude-code"
  plugins:
    - type: "local"
      path: "$SKILL_SOURCE_PATH"
  # The agent must not need the host project's CLAUDE.md or settings — this measures the
  # skill listing, and injecting a 20 KB project guide into every call is both expensive
  # and a confound.
  setting_sources: []

# Activation is decided in the first assistant turn: either the skill is engaged or it is
# not. Without caps the agent spends turns exploring a sandbox that deliberately holds no
# eval files, and a row that times out is EXCLUDED from the confusion matrix rather than
# scored — shrinking the denominator the metrics are computed over (watch `completion_rate`
# in the rollup). Cap tightly: it buys signal, not just cost.
run_limits:
  max_turns: 2
  turn_timeout: 120
  task_timeout: 300

dataset:
  paths:
    - "activation-rows.jsonl"
  # Row field naming each row's split. `coder-eval run --split train` keeps only
  # matching rows, and filters before any sampling so the selection is predictable.
  split_field: "split"

initial_prompt: |
  ${row.prompt}

success_criteria:
  - type: "skill_triggered"
    description: "my-skill activation for row ${row.id}"
    skill_name: "my-skill"
    expected_skill: "${row.expected_skill}"
    # Suite-level gate over all rows: recall = of the rows that should have
    # engaged the skill, how many did; precision = of the rows where it engaged,
    # how many should have. Raise these once you have a baseline.
    suite_thresholds:
      recall.yes: 0.7
      precision.yes: 0.7
