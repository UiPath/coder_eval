# Activation suite template. Replace every `my-skill` with the bare name of the
# skill under test (the directory name of its SKILL.md — never a `plugin:skill`
# form), and rewrite the rows in activation-rows.jsonl as real user requests.
#
# One row per prompt; each row is scored on whether the agent engaged the skill.
# Positive rows set expected_skill to the skill's name, distractor rows set "".
#
# Rows also carry a `split` — `tune` or `holdout`. `/coder-eval:optimize-skill`
# proposes description rewrites against `tune` and confirms the winner on `holdout`,
# so an improvement has to survive rows it was not fitted to. Select one with
# `coder-eval run <this file> --split tune`; with no --split every row runs.
#
# A split HALVES each side, so it multiplies the sizing rule: a suite you intend to
# optimize wants 16-24 of each polarity, not the 8-12 a one-shot check aims for.
# The six rows below are the illustrative minimum, not a target — split 4/2 they are
# too small to gate an optimization round on, and optimize-skill will say so.
task_id: "my-skill-activation"
description: "Does the agent engage `my-skill` when it should, and leave it alone when it shouldn't?"
tags: [activation]

# REPLACE: the skill under test must be REACHABLE by the sandboxed agent, or every
# positive row scores 0 and the suite reports recall 0.0 — which reads exactly like a
# broken skill. `path` is the directory CONTAINING the skill's directory (for
# `.claude/skills/my-skill/SKILL.md` that is `.claude/skills`), supplied through an
# environment variable so the committed suite stays portable across machines and CI:
#
#   export SKILL_SOURCE_PATH=/abs/path/to/.claude/skills
#
# An unset variable is logged as a warning and leaves the skill unreachable, so check
# the first run's recall before trusting a low score.
agent:
  plugins:
    - type: "local"
      path: "$SKILL_SOURCE_PATH"

dataset:
  paths:
    - "activation-rows.jsonl"
  # Row field naming each row's split. `coder-eval run --split tune` keeps only
  # matching rows, and filters before any sampling so the selection is predictable.
  split_field: "split"

initial_prompt: |
  ${row.prompt}

success_criteria:
  - type: "skill_triggered"
    description: "my-skill activation for row ${row.id}"
    skill_name: "my-skill"
    expected_skill: "${row.expected_skill}"
    # Suite-level gate over all rows: recall = of the rows that should have
    # engaged the skill, how many did; precision = of the rows where it engaged,
    # how many should have. Raise these once you have a baseline.
    suite_thresholds:
      recall.yes: 0.7
      precision.yes: 0.7
