# Marketplace listing titles are globally unique across actions, users AND orgs,
# and `coder-eval` is taken by an unrelated org, hence the underscored repo name.
# Display only: consumers reference the action by repo path.
name: coder_eval
author: UiPath
description: Install a pinned coder-eval and run evaluation tasks as a CI gate, with JUnit XML output.
branding:
  icon: check-circle
  color: orange

# Agent-agnostic: this installs `coder-eval`, not any coding-agent runtime. Tasks
# on the default `claude-code` agent need the `claude` CLI on PATH, supplied by
# the calling job. See the README's "Use as a GitHub Action".
#
# SECURITY: evaluated tasks execute agent-generated code. Do NOT run this action
# under `pull_request_target` with secrets exposed to untrusted fork PRs.
#
# No input forwards a `coder-eval run` flag, deliberately: GitHub silently
# IGNORES an input the referenced tag does not define, so a forwarding input that
# is mistyped or newer than the pinned tag yields a green run that measured
# something else, where a wrong CLI flag is a hard error. Flags go through `args`.
# An input lives here only when the action uses the value for more than passing
# it on.
inputs:
  version:
    description: coder-eval version to install from PyPI, or "local" to install from the action checkout
    required: false
    default: "0.11.5"   # <-- kept in sync with releases by release.yml
  extras:
    description: >-
      Comma-separated coder-eval extras (`codex`, `antigravity,litellm`), composed
      into the install requirement rather than installed afterwards: `uv tool
      install` builds an isolated environment whose shims shadow anything else
      named `coder-eval` on PATH. Each name must match
      ^[A-Za-z0-9][A-Za-z0-9._-]*$.
    required: false
    default: ""
  extra-packages:
    description: >-
      Extra requirements installed INTO coder-eval's tool environment (`uv tool
      install --with`), one per line: a PEP 508 specifier, or a path relative to
      `working-directory`. The only way an out-of-tree coder-eval plugin becomes
      discoverable, since an entry point is found only when the plugin shares a
      virtualenv with its host.
    required: false
    default: ""
  install-flags:
    description: >-
      Flags for `uv tool install`, one per line, appended verbatim — resolver
      control this action does not model (`--prerelease=allow`,
      `--extra-index-url <url>`).
    required: false
    default: ""
  args:
    description: >-
      Arguments appended to `coder-eval run`, ONE PER LINE, each verbatim — no
      word splitting, no pathname expansion. The only channel for the CLI's flags
      and for the task paths themselves. A flag and its value are two lines (`-D`,
      then `key=[a,b]`) or one line in `=` form (`--model=x`); sharing a line
      makes one malformed token. Globs reach the CLI unexpanded and it expands
      them itself (`**` included), exiting 1 if nothing matches. Blank lines, `#`
      comments and surrounding whitespace are ignored here, in `install-flags` and
      in `extra-packages`.
    required: false
    default: ""
  env:
    description: >-
      Newline-separated NAME=VALUE pairs, handed to the coder-eval process only.
      Never written to $GITHUB_ENV and never exported into the action's own
      shell, so a forwarded secret cannot bleed into later job steps, nor rewrite
      what this step runs. The sole channel for credentials and backend config
      (ANTHROPIC_API_KEY, API_BACKEND, model vars, plugin paths). Names must match
      ^[A-Za-z_][A-Za-z0-9_]*$; PATH and the loader/shell-startup names are
      rejected outright (use $GITHUB_PATH for a tool directory). Wire values from
      repository secrets; never inline a literal.
    required: false
    default: ""
  working-directory:
    description: >-
      Directory every step of this action runs in, and what `run-dir`, the task
      paths in `args` and relative `extra-packages` entries resolve against.
      GitHub rejects `working-directory:` on a `uses:` step and a job-level
      `defaults.run` does not reach inside a composite, so this input is the only
      way to run the gate from a subdirectory.
    required: false
    default: "."
  run-dir:
    description: >-
      Run directory (--run-dir), reported as given. The JUnit and markdown reports
      are written inside it and reported as outputs, so there is no separate
      `junit-path` input.
    required: false
    default: "runs/ci"

outputs:
  run-dir:
    description: The run directory, as given, containing run.json/run.md
    value: ${{ steps.run.outputs.run-dir }}
  junit-path:
    description: Path to the written JUnit XML report (`<run-dir>/junit.xml`)
    value: ${{ steps.run.outputs.junit-path }}
  run-md-path:
    description: >-
      Path to the markdown run report (`<run-dir>/run.md`). The action does not
      append it to $GITHUB_STEP_SUMMARY, because a consumer that has to redact the
      report first cannot undo a write that already happened;
      `cat "$RUN_MD" >> "$GITHUB_STEP_SUMMARY"` is the whole of what that replaces.
    value: ${{ steps.run.outputs.run-md-path }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
    - name: Install coder-eval
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CE_VERSION: ${{ inputs.version }}
        CE_EXTRAS: ${{ inputs.extras }}
        CE_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        CE_INSTALL_FLAGS: ${{ inputs.install-flags }}
        CE_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # The one line-list parser for `install-flags`, `extra-packages` and `args`.
        # Emits to stdout instead of filling a nameref array, which bash 3.2 (macOS
        # runners) lacks. tests/test_action_inputs.py asserts the two copies of this
        # function are byte-identical.
        clean_lines() {
          local line
          while IFS= read -r line; do
            line="${line%$'\r'}"                       # tolerate CRLF inputs
            line="${line#"${line%%[![:space:]]*}"}"    # left-trim
            line="${line%"${line##*[![:space:]]}"}"    # right-trim
            [ -z "$line" ] && continue
            case "$line" in '#'*) continue ;; esac      # allow comment lines
            printf '%s\n' "$line"
          done
        }

        # Into the requirement string rather than a follow-up install: the tool
        # environment's shims shadow any other coder-eval on PATH, so an extra
        # added beside it is never imported. Validated, since it reaches a resolver.
        extras=""
        if [ -n "$CE_EXTRAS" ]; then
          if [[ ! "$CE_EXTRAS" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*(,[A-Za-z0-9][A-Za-z0-9._-]*)*$ ]]; then
            echo "::error::extras must be a comma-separated list of extra names, got '$CE_EXTRAS'"; exit 1
          fi
          extras="[$CE_EXTRAS]"
        fi

        install_args=(tool install)
        while IFS= read -r flag; do
          install_args+=("$flag")
        done < <(clean_lines <<< "$CE_INSTALL_FLAGS")

        # One argv entry each: a path can contain spaces and a specifier `[`, `]`
        # or `>`, none of which survive word splitting.
        while IFS= read -r req; do
          install_args+=(--with "$req")
        done < <(clean_lines <<< "$CE_EXTRA_PACKAGES")

        if [ "$CE_VERSION" = "local" ]; then
          install_args+=("${CE_ACTION_PATH}${extras}")
        else
          install_args+=("coder-eval${extras}==${CE_VERSION}")
        fi
        uv "${install_args[@]}"
    - name: Run coder-eval
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CE_ARGS: ${{ inputs.args }}
        CE_RUN_DIR: ${{ inputs.run-dir }}
        CE_ENV: ${{ inputs.env }}
      run: |
        set -uo pipefail

        # The one line-list parser for `install-flags`, `extra-packages` and `args`.
        # Emits to stdout instead of filling a nameref array, which bash 3.2 (macOS
        # runners) lacks. tests/test_action_inputs.py asserts the two copies of this
        # function are byte-identical.
        clean_lines() {
          local line
          while IFS= read -r line; do
            line="${line%$'\r'}"                       # tolerate CRLF inputs
            line="${line#"${line%%[![:space:]]*}"}"    # left-trim
            line="${line%"${line##*[![:space:]]}"}"    # right-trim
            [ -z "$line" ] && continue
            case "$line" in '#'*) continue ;; esac      # allow comment lines
            printf '%s\n' "$line"
          done
        }

        # COLLECTED, not exported. `export` mutates THIS shell, and the name
        # filter below admits `CE_ARGS`, `CE_RUN_DIR` and `PATH`, all of which
        # are read after this loop. The reachable case is not a hostile workflow author
        # but a VALUE carrying a newline: the loop is line-based, so one
        # forwarded secret or interpolated workflow expression whose value holds
        # `\nCE_RUN_DIR=...` became a second honoured entry that could rewrite
        # the argv, redirect where results land, or shadow which coder-eval ran.
        # Handing the pairs to `env` instead makes the documented contract
        # ("for the coder-eval process only") true rather than aspirational.
        #
        # Only NAME is validated; VALUE is opaque data and is never eval'd. Not
        # clean_lines, because right-trimming would silently alter a credential
        # that legitimately ends in whitespace.
        ce_env=()
        n=0
        while IFS= read -r line; do
          n=$((n + 1))
          line="${line%$'\r'}"                       # tolerate CRLF inputs
          line="${line#"${line%%[![:space:]]*}"}"    # left-trim
          [ -z "$line" ] && continue
          case "$line" in '#'*) continue ;; esac      # allow comment lines
          # Report by position, never echoing the line: a caller who forgot the
          # `NAME=` prefix would otherwise print a secret GitHub cannot mask.
          if [ "$line" = "${line#*=}" ]; then
            echo "::error::env entry #$n is not NAME=VALUE (no '=' found)"; exit 1
          fi
          name="${line%%=*}"
          if [[ ! "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::env entry #$n has an invalid name (must match ^[A-Za-z_][A-Za-z0-9_]*\$)"; exit 1
          fi
          # Rejected by name: these change how the child RESOLVES code, not how
          # it behaves, and this channel exists for credentials and backend
          # config. A tool directory belongs on $GITHUB_PATH in a step of your
          # own, which is scoped and visible in the log.
          case "$name" in
            PATH|IFS|ENV|BASH_ENV|SHELLOPTS|BASHOPTS|LD_PRELOAD|LD_LIBRARY_PATH|DYLD_INSERT_LIBRARIES|DYLD_LIBRARY_PATH)
              echo "::error::env entry #$n uses the reserved name '$name'. Put a tool directory on \$GITHUB_PATH in an earlier step instead."; exit 1 ;;
          esac
          ce_env+=("$name=${line#*=}")
        done <<< "$CE_ENV"

        # Reports live inside the run directory; `%/` keeps a trailing slash on the
        # input from doubling the separator in the reported paths.
        run_dir="${CE_RUN_DIR%/}"
        junit="$run_dir/junit.xml"
        run_md="$run_dir/run.md"

        args=(run --run-dir "$CE_RUN_DIR" --junit-xml "$junit")
        while IFS= read -r arg; do
          args+=("$arg")
        done < <(clean_lines <<< "$CE_ARGS")

        set +e
        # `${a[@]+"${a[@]}"}` because bash 3.2 (macOS runners) treats an empty
        # array as unset under `set -u`. `--` so a NAME=VALUE pair can never be
        # read as an option to env itself.
        env -- ${ce_env[@]+"${ce_env[@]}"} coder-eval "${args[@]}"
        CODE=$?
        set -e

        # Written before the exit so a red run still reports where its artifacts
        # are. Output propagation from a failed composite step is not a documented
        # guarantee, so a consumer chasing a failed run should key off the paths it
        # passed in rather than these.
        {
          echo "run-dir=$CE_RUN_DIR"
          echo "junit-path=$junit"
          echo "run-md-path=$run_md"
        } >> "$GITHUB_OUTPUT"

        exit "$CODE"
