version: 2

# Registry authentication for private package indices
registries:
  uipath-registry:
    type: python-index
    url: https://uipath.pkgs.visualstudio.com/_packaging/ml-packages/pypi/simple/
    username: ${{ secrets.UV_INDEX_UIPATH_USERNAME }}
    password: ${{ secrets.UV_INDEX_UIPATH_PASSWORD }}

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"  # Changed from weekly to monthly (longest interval)
    open-pull-requests-limit: 1  # Only 1 PR at a time
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Use the UiPath registry for package resolution
    registries:
      - uipath-registry
    # Only get security updates and major version updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"  # Longest interval
    open-pull-requests-limit: 1  # Only 1 PR at a time
    labels:
      - "dependencies"
      - "github-actions"
    # Only get major version updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
