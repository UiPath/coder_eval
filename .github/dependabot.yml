version: 2

# Registry authentication for private package indices
registries:
  uipath-registry:
    type: python-index
    url: https://uipath.pkgs.visualstudio.com/_packaging/ml-packages/pypi/simple/
    username: ${{ secrets.UV_INDEX_UIPATH_USERNAME }}
    password: ${{ secrets.UV_INDEX_UIPATH_PASSWORD }}

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Use the UiPath registry for package resolution
    registries:
      - uipath-registry
    # Group patch updates to reduce PR noise
    groups:
      patch-updates:
        update-types:
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
