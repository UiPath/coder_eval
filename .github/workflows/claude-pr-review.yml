name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Cancel outdated runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only run on non-fork PRs (secrets required), or on @claude mentions
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.pull_request) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository)

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          claude_args: "--model claude-opus-4-6"
          prompt: |
            Review this PR focusing on:
            - Architecture: Does new code live in the right layer? Flag domain-specific logic in core modules, leaky abstractions, and reversed dependencies
            - Correctness: logic errors, edge cases, off-by-one errors, truthiness traps (if x where 0/[]/'' is valid), None used as both sentinel and domain value
            - Security: injection, credential exposure, unsafe inputs, secrets or reference data in log statements, ReDoS from config-sourced regexes
            - Performance: unnecessary allocations, N+1 queries, missing async
            - Maintainability: unclear naming, missing error handling, code duplication
            - Config & data files: Copy-paste errors across similar YAMLs, path globs in pyproject.toml that don't match real files, stale docs after behavior changes
            - Test coverage: New logic without tests, bug fixes without regression tests, missing edge-case coverage
            - DRY principle: Is there duplicated logic that should be consolidated? But also: is DRY being over-applied (premature abstraction)?
            - Simplicity: No unnecessary abstractions, speculative features, or "just in case" code. Could a junior developer follow this?
            - Alignment: adherence to CLAUDE.md guidelines and best practices
            Be concise. Only flag issues that matter. Skip style nits.
        env:
          UV_EXTRA_INDEX_URL: "https://${{ secrets.UV_INDEX_UIPATH_USERNAME }}:${{ secrets.UV_INDEX_UIPATH_PASSWORD }}@uipath.pkgs.visualstudio.com/_packaging/ml-packages/pypi/simple/"
