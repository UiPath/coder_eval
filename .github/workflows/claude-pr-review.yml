name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Cancel outdated runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

# Workflow-default: zero permissions. Each job must opt in to what it needs.
# The claude-review job below escalates as required.
permissions: {}

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Trusted triggers only — this repo is public.
    # Comment & review events run privileged (repo secrets + write token, base-branch
    # context) regardless of who authored the comment, so they are gated on
    # author_association to keep untrusted users from invoking a privileged run.
    #   - pull_request: non-fork PRs only (pushing a non-fork branch requires write access).
    #   - issue_comment: PR comments only, @claude, from an owner / member / collaborator.
    #   - review (comment / submission): non-fork PRs, @claude, from an owner / member / collaborator.
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Claude Code Action
        # Route through AWS Bedrock via the bearer-token path. The `use_bedrock`
        # input causes the action's composite inner step to set
        # CLAUDE_CODE_USE_BEDROCK=1 and forward AWS_BEARER_TOKEN_BEDROCK /
        # AWS_REGION into the SDK env (see action.yml lines 299-309). Without
        # this input the composite shadows our outer-env CLAUDE_CODE_USE_BEDROCK
        # to empty and the SDK falls back to direct Anthropic, rejecting the
        # dummy api_key. OIDC + IAM role is the action's documented Bedrock
        # path; this bearer-token path skips that infra and is the same one
        # the Claude CLI uses directly (exercised end-to-end by the
        # live-tests BedrockRoute step).
        uses: anthropics/claude-code-action@09f876c77e9d2d627cdf3e2f83d4d7b75106807e  # v1.0.134
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # FIXME(SDK#24168): Claude Code SDK injects x-anthropic-billing-header
          # which Bedrock rejects as a reserved keyword (HTTP 400). Drop once SDK fixes this.
          CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: ${{ vars.CLAUDE_REVIEWER_USE_BEDROCK }}
          # Dummy value to satisfy the action's pre-flight validator, which
          # requires anthropic_api_key OR claude_code_oauth_token regardless
          # of provider. With use_bedrock: true the SDK ignores this key and
          # uses AWS_BEARER_TOKEN_BEDROCK from env instead.
          anthropic_api_key: "sk-ant-bedrock-routed-dummy"
          track_progress: true
          claude_args: "--model ${{ vars.CLAUDE_REVIEWER_MODEL }}"
          prompt: |
            Review this PR following the guidelines in .github/code_review.md.

            1. Read .github/code_review.md for review standards, process, and output format.
            2. Read CLAUDE.md for project conventions.
            3. Run `git diff origin/main...HEAD` to see the full diff.
            4. Run `gh pr view ${{ github.event.pull_request.number || github.event.issue.number }} --comments` to read existing PR conversation.
            5. For each changed file, read the FULL file (not just the diff hunk) so you see surrounding context.
            6. Follow the cross-file consistency checks, "what's missing" analysis, and design-level scrutiny sections from code_review.md. Do not skip these.

            Follow the output format specified in code_review.md. Include the "What's Missing" section even if empty.
