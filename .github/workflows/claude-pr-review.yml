name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Cancel outdated runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

# Workflow-default: zero permissions. Each job must opt in to what it needs.
# The claude-review job below escalates as required.
permissions: {}

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only run on non-fork PRs (secrets required), or on @claude mentions
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository)

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout UiPath/skills @ main (cross-repo context for reviewer)
        # Pulls skills into ./skills so the reviewer can grep for downstream
        # usages of TaskDefinition / loader fields it sees changing in the
        # diff. UiPath/skills is public — no PAT needed.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: UiPath/skills
          ref: main
          path: skills
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv and project dependencies (hash-verified from uv.lock)
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --extra dev
        env:
          # uv sync resolves named-index credentials from UV_INDEX_<NAME>_{USERNAME,PASSWORD}
          # (the segment after UV_INDEX_ is the pyproject.toml index name uppercased).
          # UV_EXTRA_INDEX_URL is kept in parallel for any uv pip-style invocations.
          UV_INDEX_UIPATH_USERNAME: ${{ secrets.UV_INDEX_UIPATH_USERNAME }}
          UV_INDEX_UIPATH_PASSWORD: ${{ secrets.UV_INDEX_UIPATH_PASSWORD }}
          UV_EXTRA_INDEX_URL: "https://${{ secrets.UV_INDEX_UIPATH_USERNAME }}:${{ secrets.UV_INDEX_UIPATH_PASSWORD }}@uipath.pkgs.visualstudio.com/_packaging/ml-packages/pypi/simple/"

      - name: Claude Code Action
        # Route through AWS Bedrock via the bearer-token path. The `use_bedrock`
        # input causes the action's composite inner step to set
        # CLAUDE_CODE_USE_BEDROCK=1 and forward AWS_BEARER_TOKEN_BEDROCK /
        # AWS_REGION into the SDK env (see action.yml lines 299-309). Without
        # this input the composite shadows our outer-env CLAUDE_CODE_USE_BEDROCK
        # to empty and the SDK falls back to direct Anthropic, rejecting the
        # dummy api_key. OIDC + IAM role is the action's documented Bedrock
        # path; this bearer-token path skips that infra and is the same one
        # the Claude CLI uses directly (exercised end-to-end by the
        # live-tests BedrockRoute step).
        uses: anthropics/claude-code-action@1dc994ee7a008f0ecc866d9ac23ef036b7229f84  # v1.0.127
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # FIXME(SDK#24168): Claude Code SDK injects x-anthropic-billing-header
          # which Bedrock rejects as a reserved keyword (HTTP 400). Drop once SDK fixes this.
          CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: ${{ vars.CLAUDE_REVIEWER_USE_BEDROCK }}
          # Dummy value to satisfy the action's pre-flight validator, which
          # requires anthropic_api_key OR claude_code_oauth_token regardless
          # of provider. With use_bedrock: true the SDK ignores this key and
          # uses AWS_BEARER_TOKEN_BEDROCK from env instead.
          anthropic_api_key: "sk-ant-bedrock-routed-dummy"
          track_progress: true
          claude_args: "--model ${{ vars.CLAUDE_REVIEWER_MODEL }}"
          prompt: |
            Review this PR following the guidelines in .github/code_review.md.

            1. Read .github/code_review.md for review standards, process, and output format.
            2. Read CLAUDE.md for project conventions.
            3. Run `git diff origin/main...HEAD` to see the full diff.
            4. Run `gh pr view ${{ github.event.pull_request.number || github.event.issue.number }} --comments` to read existing PR conversation.
            5. For each changed file, read the FULL file (not just the diff hunk) so you see surrounding context.
            6. Follow the cross-file consistency checks, "what's missing" analysis, and design-level scrutiny sections from code_review.md. Do not skip these.

            Cross-repo check: the UiPath/skills repo is checked out at ./skills/ and is a primary downstream consumer (226 task YAMLs under skills/tests/tasks/). Decide whether the diff has plausible cross-repo blast radius based on what it changes, not which files it touches — pydantic schema or field changes, validator logic, loader/orchestration code, experiment defaults, success-criterion shapes, agent-config surface, or dependency bumps that affect YAML parsing all qualify regardless of file path. If yes, grep ./skills/tests/tasks/ for usages of the changed surface and flag any skills task YAML that would break. When you need ground truth on a specific suspicious YAML, run `.venv/bin/coder-eval plan ./skills/tests/tasks/<file>` — the same deterministic validator the validate-skills-yamls CI job uses. The validate-skills-yamls CI job catches schema-load failures, but it won't catch semantic drift (e.g. a field renamed AND added back as an alias) — that's your job. If the diff has no plausible consumer impact (docs, dashboard, evalboard, tests for unrelated subsystems), skip this check.

            Follow the output format specified in code_review.md. Include the "What's Missing" section even if empty.
