name: PR Quality Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

# Cancel outdated runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Format, Lint, Type, Test, Security)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
            .pytest_cache
            .ruff_cache
          key: ${{ runner.os }}-py3.13-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py3.13-

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install project dependencies
        env:
          UV_EXTRA_INDEX_URL: "https://${{ secrets.UIPATH_PACKAGE_INDEX_USERNAME }}:${{ secrets.UIPATH_PACKAGE_INDEX_PASSWORD }}@uipath.pkgs.visualstudio.com/_packaging/ml-packages/pypi/simple/"
        run: uv pip install --system -e ".[dev]"

      # PHASE 1: Fast checks (fail early)
      - name: Check code formatting (ruff format)
        run: uv run ruff format --check coder_eval/ tests/

      - name: Lint code (ruff check)
        run: uv run ruff check coder_eval/ tests/

      # PHASE 2: Type checking
      - name: Type check with pyright
        run: uv run pyright

      # PHASE 3: Security scanning
      - name: Security - Dependency vulnerabilities (pip-audit)
        run: uv run pip-audit --desc --skip-editable

      - name: Security - Code analysis (bandit)
        run: uv run bandit -r coder_eval/ -ll --format json -o bandit-report.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

      # PHASE 4: Test suite with coverage
      - name: Run test suite with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=coder_eval \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      # Summary
      - name: Summary
        if: always()
        run: |
          echo "✅ Quality gate complete!"
          echo "📊 All checks passed: formatting, linting, types, security, tests"
