name: Release

# Manually-triggered release: build the CURRENT version (from pyproject.toml)
# and publish it to public PyPI + the UiPath `coder_eval` Azure Artifacts feed
# (wheel) and GHCR (agent image), then push the `v<version>` git tag.
#
# Version management: `main` is protected by a ruleset (changes via PR only),
# so this workflow does NOT commit a version bump to main. Bump `version` in
# pyproject.toml (+ src/coder_eval/__init__.py) through a normal PR; once that
# merges, run this workflow to release whatever version main currently
# declares. It refuses to run if the `v<version>` tag already exists (i.e. you
# forgot to bump). Only the git TAG is pushed -- tags are outside the branch
# ruleset -- never a commit to main.
# (Continuous :latest / :sha- agent images still publish on every main push via
# docker-publish.yml -- only the versioned release artifacts gate on this run.)

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The release pushes only the `v<version>` git TAG (tags are not covered by
# the branch ruleset protecting main), so the built-in GITHUB_TOKEN with
# contents: write suffices -- no GitHub App / ruleset bypass required.
permissions:
  contents: write  # push the v<version> tag
  packages: write  # push the versioned agent image to ghcr.io on release

jobs:
  release:
    name: Bump version and publish
    # GitHub-hosted so cutting a release does not depend on the self-hosted
    # `uipath-ubuntu-latest` pool. uv, twine, and the docker buildx -> GHCR
    # push all run fine here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Exposed so the downstream publish-pypi job can gate on a real release
      # having been cut (empty => no version bumped => skip PyPI publish).
      version: ${{ steps.release.outputs.version }}
    env:
      # The self-hosted `uipath-ubuntu-latest` runners enforce a minimum
      # package-age safe-chain check on uv installs; on GitHub-hosted runners
      # this is a no-op. Kept (matching pr-checks.yml) so parity is preserved
      # if the job ever moves back to the self-hosted pool.
      SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "openai-codex-cli-bin,openai-codex"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: true

      - name: Resolve version + guard against re-release
        id: release
        run: |
          set -euo pipefail
          # Version is whatever main currently declares. Bumps land via a PR
          # (main is ruleset-protected); this workflow never rewrites it.
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Releasing coder-eval ${VERSION}"
          # Refuse to re-release an existing version: a PyPI version is
          # immutable, so this is almost always a forgotten version bump.
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists. Bump 'version' in pyproject.toml (+ src/coder_eval/__init__.py) via a PR before releasing."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist
        if: steps.release.outputs.version != ''
        run: uv build

      # Hand the exact built artifacts to the publish-pypi job. Publishing to
      # public PyPI runs in its own environment-gated job (OIDC), so it must
      # consume these files rather than rebuild them.
      - name: Upload dist for PyPI publish
        if: steps.release.outputs.version != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

      - name: Publish to coder_eval feed
        # Best-effort: the private Azure feed is a UiPath-internal target; its
        # failure (e.g. an expired PAT) must NOT block the public PyPI publish.
        continue-on-error: true
        if: steps.release.outputs.version != ''
        env:
          # Azure Artifacts accepts any non-empty username when paired with a
          # PAT, so we hardcode it. The PAT (Packaging Read & write scope)
          # comes from UV_INDEX_UIPATH_PASSWORD, reused from pr-checks.yml.
          TWINE_USERNAME: "azure-artifacts"
          TWINE_PASSWORD: ${{ secrets.UV_INDEX_UIPATH_PASSWORD }}
          TWINE_REPOSITORY_URL: https://pkgs.dev.azure.com/uipath/ML%20Platform/_packaging/coder_eval/pypi/upload/
        run: uv tool run --from twine twine upload --non-interactive --verbose dist/*

      # Build + push the agent image HERE, in the release job, tagged with the
      # version main declares. docker-publish.yml only publishes :latest / :sha-
      # on every main push, so this is the authoritative versioned image; it
      # also repoints `:latest` to the exact release artifact.
      - name: Lowercase owner for GHCR
        if: steps.release.outputs.version != ''
        id: img
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        continue-on-error: true  # GHCR image is internal/best-effort; don't block PyPI
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GHCR
        continue-on-error: true  # GHCR image is internal/best-effort; don't block PyPI
        if: steps.release.outputs.version != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned agent image
        continue-on-error: true  # GHCR image is internal/best-effort; don't block PyPI
        if: steps.release.outputs.version != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.owner_lc }}/coder-eval-agent:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.img.outputs.owner_lc }}/coder-eval-agent:latest
          build-args: |
            CODER_EVAL_VERSION=${{ steps.release.outputs.version }}
          secrets: |
            "uv_index_username=${{ secrets.UV_INDEX_UIPATH_USERNAME }}"
            "uv_index_password=${{ secrets.UV_INDEX_UIPATH_PASSWORD }}"
          # Read the shared buildcache docker-publish.yml writes; don't write it
          # back from here, to avoid two concurrent writers racing the cache tag.
          cache-from: type=registry,ref=ghcr.io/${{ steps.img.outputs.owner_lc }}/coder-eval-agent:buildcache

  # Publish the SAME wheel+sdist to public PyPI (pkgs live alongside the private
  # Azure Artifacts feed, which the release job above still populates). This runs
  # as its own job so OIDC Trusted Publishing is scoped to a dedicated,
  # environment-gated context on GitHub-hosted runners -- no PyPI token/secret is
  # stored. Gated on the release job having actually cut a version.
  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/coder-eval/${{ needs.release.outputs.version }}/
    permissions:
      # OIDC token minting for Trusted Publishing; no long-lived credentials.
      id-token: write
    steps:
      - name: Download built dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          # Trusted Publisher is configured on pypi.org for this repo +
          # workflow (release.yml) + environment (pypi); no password needed.
          packages-dir: dist/

  # Tag the release ONLY after PyPI has published, so a `v<version>` tag marks a
  # completed public release and the re-release guard never blocks retrying a
  # failed publish. Tags are outside the branch ruleset, so GITHUB_TOKEN suffices.
  tag-release:
    name: Push release tag
    needs: [release, publish-pypi]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # push the v<version> tag
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Push v<version> tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
