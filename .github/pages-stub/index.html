    <title>Coder Eval documentation has moved</title>

    <!--
      This page replaces the MkDocs build that used to be published here.

      Two copies of the same docs were live — this GitHub Pages mirror and
      coder-eval.com/docs — each declaring itself canonical, which splits search
      signals and lets the wrong host rank. The docs are now published only at
      coder-eval.com/docs; this stub exists so anything still pointing here
      (a crawl queue entry, an internal link) lands somewhere useful instead of
      on a 404.

      `noindex, follow` rather than a canonical pointing at /docs: this page's
      content differs from the target, and Google both discourages combining
      noindex with rel=canonical and ignores canonicals across substantially
      different pages. noindex keeps the stub out of the index while its links
      are still followed.

      Self-contained by design: the logo is inlined from the website's
      src/assets/logo-light.svg with its navy fills swapped to `currentColor`
      (the "Eval" wordmark and the icon arc stay brand orange), so one copy
      serves both colour schemes. No external stylesheets, fonts, or images.
    -->
    <meta name="robots" content="noindex, follow" />

    <style>
      :root {
        color-scheme: light dark;
        /* Brand palette, matching the website's src/assets logos. */
        --orange: #fa4616;
        --navy: #10233a;
        --offwhite: #f5f7fa;

        --fg: var(--navy);
        --muted: #5b6b7c;
        --bg: #ffffff;
        --border: #e3e8ee;
        --on-orange: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: var(--offwhite);
          --muted: #9aabbc;
          --bg: #0b1826;
          --border: #21354a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 34rem;
      }
      /* The inlined wordmark inherits `color` for its navy parts. */
      .logo {
        display: block;
        width: 11rem;
        max-width: 60%;
        height: auto;
        margin-bottom: 1.75rem;
        color: var(--fg);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        line-height: 1.3;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }
      ul {
        margin: 0 0 1.75rem;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--border);
      }
      li {
        border-bottom: 1px solid var(--border);
      }
      ul a {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 0.75rem;
        align-items: baseline;
        padding: 0.9rem 0.25rem;
        color: var(--orange);
        font-weight: 600;
        text-decoration: none;
      }
      ul a:hover,
      ul a:focus-visible {
        text-decoration: underline;
      }
      ul a span {
        color: var(--muted);
        font-weight: 400;
        font-size: 0.9375rem;
      }
      /* Repo bar: brand-orange pill with the repo name and live star/fork counts. */
      .repo {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.9rem;
        padding: 0.7rem 1rem;
        border-radius: 0.5rem;
        background: var(--orange);
        color: var(--on-orange);
        text-decoration: none;
        font-weight: 600;
      }
      .repo:hover,
      .repo:focus-visible {
        filter: brightness(1.07);
      }
      .repo svg {
        flex: none;
        fill: currentColor;
      }
      .repo-name {
        margin-right: auto;
      }
      .stat {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-variant-numeric: tabular-nums;
      }
      /* Visually hidden, still announced — the counts are bare numbers otherwise. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <script>
      // The counts above are a committed snapshot so the bar is never blank or
      // half-rendered; this refreshes them to live values. Unauthenticated
      // api.github.com allows 60 requests/hour/IP, which is ample for a stub
      // nobody should be landing on. Any failure (offline, rate limit, schema
      // change) silently leaves the snapshot in place.
      fetch("https://api.github.com/repos/UiPath/coder_eval")
        .then((r) => (r.ok ? r.json() : null))
        .then((d) => {
          if (!d) return;
          const set = (key, value) => {
            const el = document.querySelector(`[data-stat="${key}"]`);
            if (el && Number.isFinite(value)) el.textContent = value.toLocaleString();
          };
          set("stars", d.stargazers_count);
          set("forks", d.forks_count);
        })
        .catch(() => {});
    </script>
