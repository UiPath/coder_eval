# Experiment: Flow Complexity Analysis
#
# Benchmark coding agent performance across 5 complexity tiers (5, 10, 25, 50,
# 100 nodes). Measures duration, error rates, accuracy (criteria pass rate),
# and token consumption at each tier.
#
# Tasks are independent and run in parallel via run_batch. Each variant
# targets a different model to enable cross-model comparison at every
# complexity level.
#
# Usage (all tasks, default model):
#   coder-eval run \
#     tasks/uipath_flow/complexity_analysis/generate_flow_5_nodes.yaml \
#     tasks/uipath_flow/complexity_analysis/generate_flow_10_nodes.yaml \
#     tasks/uipath_flow/complexity_analysis/generate_flow_25_nodes.yaml \
#     tasks/uipath_flow/complexity_analysis/generate_flow_50_nodes.yaml \
#     tasks/uipath_flow/complexity_analysis/generate_flow_100_nodes.yaml \
#     -e experiments/flow-complexity-analysis.yaml \
#     --parallel 5
#
# Usage (single tier, compare models):
#   coder-eval run \
#     tasks/uipath_flow/complexity_analysis/generate_flow_50_nodes.yaml \
#     -e experiments/flow-complexity-analysis.yaml
#
# Report generation:
#   coder-eval report <run-dir> --format markdown --format json

experiment_id: flow-complexity-analysis
description: >
  Benchmark agent flow-generation across complexity tiers (5/10/25/50/100 nodes).
  Captures duration, error rates, accuracy, and token consumption per tier and
  per model variant. All 5 tasks run in parallel for maximum throughput.

defaults:
  task_timeout: 2400

  agent:
    type: claude-code
    permission_mode: acceptEdits
    allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

variants:
  # ── Sonnet (fast, cost-effective baseline) ──────────────────────────────
  - variant_id: plugin_cli
    agent:
      max_turns: 1000
      turn_timeout: 1200
      plugins:
        - type: "local"
          path: "$CLI_PLUGIN_PATH"

  - variant_id: plugin_json
    agent:
      max_turns: 1000
      turn_timeout: 1200
      plugins:
        - type: "local"
          path: "$JSON_PLUGIN_PATH"

  - variant_id: plugin_refactored
    agent:
      max_turns: 1000
      turn_timeout: 1200
      plugins:
        - type: "local"
          path: "$REFACTORED_PLUGIN_PATH"
