experiment_id: early-stop-ab
description: |
  Smoke vs. e2e flavors from ONE task file via opt-in early-stop. Both variants
  share the same tasks, criteria, and max_turns. Arming is per-criterion (the
  `stop_early:` blocks in the task file), so the `smoke` variant needs NO
  override at all — the armed criteria decide when it cuts off. The `e2e`
  variant throws the run-level kill switch (`run_limits.stop_early: false`,
  field-merged, so it does not replace the task's run_limits block) to
  force-disarm every block and run every task to completion.

  Expect the `smoke` variant significantly lower on turns, duration, and tokens.
  Verdict parity is one-sided: the armed subset gates an early-stopped run
  (other criteria are advisory, clearly marked), a fail-stop preserves the e2e
  verdict, but a pass-stop can miss a distractor that would only misfire later —
  authoritative precision/recall belongs on the e2e variant.

variants:
  - variant_id: e2e
    description: "Full run to completion — no early stop (the reference flavor)."
    run_limits:
      stop_early: false

  - variant_id: smoke
    description: "Early stop as armed in the task — cut off once the armed criteria are decided."
    # No override needed: the task's per-criterion stop_early: blocks arm the watcher.
