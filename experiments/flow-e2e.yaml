# Experiment: Flow E2E Tests
#
# End-to-end flow generation tests covering OOTB nodes, resource nodes, and IS connectors.
#
# Usage:
#   coder-eval run tasks/uipath_flow/e2e/*/*.yaml -e experiments/flow-e2e.yaml

experiment_id: flow-e2e
description: >
  End-to-end flow generation with the local skills plugin.

defaults:
  max_iterations: 1
  task_timeout: 2400

  agent:
    type: claude-code
    permission_mode: acceptEdits
    allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
    turn_timeout: 1200

variants:
  - variant_id: with-skill
    agent:
      max_turns: 200
      plugins:
        - type: "local"
          path: "$UIPATH_PLUGIN_MARKETPLACE_DIR"
