# Experiment: Test whether providing the flow folder ID in CLAUDE.md improves task performance.
#
# Single variant that injects a CLAUDE.md file into the sandbox with the
# folder ID for TestFlowSolution (ID 2553540, key 44d4ea33-...), which
# contains Flow and Flow 1 processes.
#
# Usage:
#   coder-eval run tasks/<flow-task>.yaml -e experiments/flow-folder-hint.yaml

experiment_id: flow-folder-hint
description: "Provide flow folder context via CLAUDE.md starter file"

defaults:
  agent:
    type: claude-code
    permission_mode: bypassPermissions
    disallowed_tools:
      - TodoWrite
  turn_timeout: 600

variants:
  - variant_id: with-folder-hint
    max_turns: 30
    template_sources:
      - type: starter_files
        files:
          - path: CLAUDE.md
            content: |
              # UiPath Flow Context

              The flows in this tenant are located in the **TestFlowSolution** folder.

              - Folder name: TestFlowSolution
              - Folder ID: 2553540
              - Folder key: 44d4ea33-f9c0-471f-a18d-376a3a5ef8d6

              When using `uip maestro flow` commands, pass `--folder-id 2553540` to target this folder.

              ## Known Issues
              The `[ERROR] Failed to load tool codedapp-tool` message on stderr is
              expected and harmless. The actual JSON result is on stdout. Ignore this error.
