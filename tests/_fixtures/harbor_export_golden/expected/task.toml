schema_version = "1.4"

[task]
name = "coder-eval/golden_export_example"
description = "A canonical task exercising every C2 mapping row at once (golden fixture — do not edit casually)."
keywords = [
    "golden",
    "harbor-export",
]

[environment]
workdir = "/app"
memory_mb = 1024
cpus = 2
network_mode = "no-network"

[environment.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
ANTHROPIC_MODEL = "${ANTHROPIC_MODEL:-}"
ANTIGRAVITY_MODEL = "${ANTIGRAVITY_MODEL:-}"
API_BACKEND = "${API_BACKEND:-}"
AWS_BEARER_TOKEN_BEDROCK = "${AWS_BEARER_TOKEN_BEDROCK:-}"
AWS_REGION = "${AWS_REGION:-}"
BEDROCK_MODEL = "${BEDROCK_MODEL:-}"
CLAUDE_CODE_USE_BEDROCK = "${CLAUDE_CODE_USE_BEDROCK:-}"
CODEX_API_KEY = "${CODEX_API_KEY:-}"
CODEX_BASE_URL = "${CODEX_BASE_URL:-}"
CODEX_MODEL = "${CODEX_MODEL:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
LITELLM_AUTH_TOKEN = "${LITELLM_AUTH_TOKEN:-}"
LITELLM_BASE_URL = "${LITELLM_BASE_URL:-}"
LITELLM_COST_LOG = "${LITELLM_COST_LOG:-}"
LITELLM_MODEL = "${LITELLM_MODEL:-}"
LITELLM_SMALL_MODEL = "${LITELLM_SMALL_MODEL:-}"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
UIPATH_ACCESS_TOKEN = "${UIPATH_ACCESS_TOKEN:-}"
UIPATH_CLI_DISABLE_VERSION_SYNC = "${UIPATH_CLI_DISABLE_VERSION_SYNC:-}"
UIPATH_LLM_BACKEND = "${UIPATH_LLM_BACKEND:-}"
UIPATH_ORGANIZATION_ID = "${UIPATH_ORGANIZATION_ID:-}"
UIPATH_TENANT_ID = "${UIPATH_TENANT_ID:-}"
UIPATH_URL = "${UIPATH_URL:-}"

[verifier]
timeout_sec = 300.0

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
ANTHROPIC_MODEL = "${ANTHROPIC_MODEL:-}"
ANTIGRAVITY_MODEL = "${ANTIGRAVITY_MODEL:-}"
API_BACKEND = "${API_BACKEND:-}"
AWS_BEARER_TOKEN_BEDROCK = "${AWS_BEARER_TOKEN_BEDROCK:-}"
AWS_REGION = "${AWS_REGION:-}"
BEDROCK_MODEL = "${BEDROCK_MODEL:-}"
CLAUDE_CODE_USE_BEDROCK = "${CLAUDE_CODE_USE_BEDROCK:-}"
CODEX_API_KEY = "${CODEX_API_KEY:-}"
CODEX_BASE_URL = "${CODEX_BASE_URL:-}"
CODEX_MODEL = "${CODEX_MODEL:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
LITELLM_AUTH_TOKEN = "${LITELLM_AUTH_TOKEN:-}"
LITELLM_BASE_URL = "${LITELLM_BASE_URL:-}"
LITELLM_COST_LOG = "${LITELLM_COST_LOG:-}"
LITELLM_MODEL = "${LITELLM_MODEL:-}"
LITELLM_SMALL_MODEL = "${LITELLM_SMALL_MODEL:-}"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
UIPATH_ACCESS_TOKEN = "${UIPATH_ACCESS_TOKEN:-}"
UIPATH_CLI_DISABLE_VERSION_SYNC = "${UIPATH_CLI_DISABLE_VERSION_SYNC:-}"
UIPATH_LLM_BACKEND = "${UIPATH_LLM_BACKEND:-}"
UIPATH_ORGANIZATION_ID = "${UIPATH_ORGANIZATION_ID:-}"
UIPATH_TENANT_ID = "${UIPATH_TENANT_ID:-}"
UIPATH_URL = "${UIPATH_URL:-}"

[agent]
timeout_sec = 300.0
