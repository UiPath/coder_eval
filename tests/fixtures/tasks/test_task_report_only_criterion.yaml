task_id: test_task_report_only
description: A weight-8 gating criterion passes; a weight-1 report_only criterion fails.
initial_prompt: Test
# agent block required by TaskDefinition schema but unused in evaluate-only mode
agent:
  type: claude-code
sandbox:
  driver: tempdir
  python: null
success_criteria:
  - type: file_exists
    path: app.py
    description: app.py must exist (gating)
    weight: 8.0
    pass_threshold: 1.0
  - type: file_exists
    path: missing.py
    description: report-only side-effect check (keeps its weight, must not gate)
    weight: 1.0
    report_only: true
