task_id: "harbor_e2e_baseline"
description: >
  Harbor E2E baseline: a real claude-code agent turn against the default
  coder-eval-agent image (no dockerfile_path, no template_sources, no
  llm_judge). Exercises the plain export -> CoderEvalAgent -> --workspace-dir
  -> verifier round trip with nothing else layered on top.

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Read", "Write", "Bash"]

sandbox:
  driver: docker
  docker:
    image: coder-eval-agent:latest

initial_prompt: >
  Create a Python file named app.py in the current working directory that
  prints 'Hello, Claude!' on one line, and today's date in YYYY-MM-DD format
  on the next line. Use the datetime module. Then run the script with:
  python app.py

success_criteria:
  - type: "file_exists"
    path: "app.py"
    description: "The file app.py must be created."
  - type: "file_contains"
    path: "app.py"
    includes: ["Hello, Claude!", "datetime"]
    description: "The script must contain the required string and import."
  - type: "run_command"
    command: "python app.py"
    timeout: 10
    description: "The script must execute successfully."
