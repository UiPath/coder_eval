task_id: "harbor_e2e_template_sources"
description: >
  Harbor E2E template_sources case: a real claude-code agent turn against a
  task using sandbox.template_sources + sandbox.python.env_packages, on
  driver: docker. Exercises the packager copying the TemplateDirSource
  directory into environment/templates/ and rewriting its path, plus
  environment/task.yaml's sandbox block being field-merged (not replaced).

run_limits:
  expected_turns: 3

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Bash"]

sandbox:
  driver: docker
  docker:
    image: coder-eval-agent:latest
  python:
    env_packages:
      - pytest
  template_sources:
    - type: template_dir
      path: "../../../templates/fibonacci-starter"

initial_prompt: >
  Implement the fibonacci function in src/main.py.
  The file has a stub function already defined with a docstring.
  The tests in tests/test_main.py define the expected behavior.
  Make all tests pass.

success_criteria:
  - type: run_command
    description: "All tests pass"
    command: "python -m pytest tests/"
    timeout: 60
