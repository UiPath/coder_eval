# Default file/directory patterns to ignore during file operations
# These patterns apply to:
# - Template directory copying (sandbox setup)
# - Workspace copying into an agent_judge sub-agent sandbox

# Virtual environments
virtual_environments:
  - ".venv"
  - "venv"
  - "ENV"
  - "env"
  - "virtualenv"

# Version control
version_control:
  - ".git"
  - ".svn"
  - ".hg"

# Python artifacts
python_artifacts:
  - "__pycache__"
  - "*.pyc"
  - "*.pyo"
  - "*.pyd"
  - ".pytest_cache"
  - ".ruff_cache"
  - "*.egg-info"
  - ".eggs"
  - "dist"
  - "build"

# IDE and editor files
ide_files:
  - ".vscode"
  - ".idea"
  - "*.swp"
  - "*.swo"
  - "*~"
  - ".DS_Store"
  - "Thumbs.db"

# Package managers
package_managers:
  - "node_modules"
  - ".npm"
  - "bower_components"

# Test and coverage
test_coverage:
  - ".coverage"
  - "htmlcov"
  - ".tox"
  - ".nox"

# Compiled files
compiled:
  - "*.so"
  - "*.dylib"
  - "*.dll"

# Harness-generated content, not agent work: SandboxConfig.record_cli writes
# recording shims and the invocation log here. Excluded from the agent_judge
# workspace copy so a Bash-enabled judge does not read them as authored files.
# Artifact capture uses a separate list, so the log is still preserved as evidence.
harness_generated:
  - "cli_mocks"
