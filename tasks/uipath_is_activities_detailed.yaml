task_id: uipath-is-activities-detailed
description: >
  Detailed-prompt evaluation: agent follows step-by-step instructions to list
  Integration Service activities using uip CLI.
tags: [is, uipcli, detailed]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 6

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Use the `uip` CLI tool to list all non-trigger Integration Service activities
  for the Zoho Desk connector and save the output to activities.json in the current directory.

  Steps:
  1. Check login status with `uip login status --output json`.
     If expired or not logged in, run `uip login` to re-authenticate first.
  2. Run `uip is activities list uipath-zoho-desk --output json > activities.json`
     to list activities and save directly to file in one command.

  Be efficient: redirect output directly to the file instead of running the command
  twice. Do not run unnecessary verification commands — the file will be validated
  automatically.

  Notes:
  - The `uip` CLI is already available in the environment.
  - Some commands (like connectors list) work without auth, but activities list
    requires an active login session.
  - Only non-trigger activities are returned by the activities list command.
  - Use `--output json` for JSON output.

success_criteria:
  - type: file_exists
    description: "activities.json file exists"
    path: "activities.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran uip is activities list"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+activities\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "activities.json is valid JSON"
    command: "python -c \"import json; json.load(open('activities.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "activities.json contains activity data"
    path: "activities.json"
    includes:
      - "ActivityList"
      - "Name"
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 2

llm_reviewer:
  enabled: true
