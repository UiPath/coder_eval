task_id: "uipath_add_evaluations"
description: |
  Add comprehensive evaluation test cases to an existing temperature converter UiPath agent.
  This is a bit harder as it needs to learn about targetOutputKey.
initial_prompt: |
  I have a temperature converter UiPath agent here that converts Celsius temperatures to Fahrenheit.
  I want to add evaluation tests so I can verify it works correctly. Do NOT modify the agent code.

  Please create a smoke test evaluation set with the following test cases:
  - 0°C → fahrenheit: 32.0
  - 100°C → fahrenheit: 212.0

  Put the evaluation set at `evaluations/eval-sets/smoke-test.json` and the evaluator definition
  at `evaluations/evaluators/exact-match.json`. The ID of the evaluator should be "ExactMatch".
max_iterations: 3
tags: [uipath, coded-agents, evaluate]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Glob", "Grep"]
  plugins:
    - type: "local"
      path: $UIPATH_PLUGIN_MARKETPLACE_DIR/plugins/uipath-coded-agents/

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: templates/temperature-converter

success_criteria:
  - type: "file_exists"
    path: "evaluations/eval-sets/smoke-test.json"
    description: "Smoke test eval set must be created"

  - type: "file_exists"
    path: "evaluations/evaluators/exact-match.json"
    description: "Smoke test evaluator must be created"

  - type: "uipath_eval"
    description: "Verify calculator agent evaluation metrics"
    agent_name: main
    eval_set: evaluations/eval-sets/smoke-test.json
    thresholds:
      ExactMatch: 1.0
