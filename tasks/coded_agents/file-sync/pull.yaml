task_id: "uipath_pull"
description: "Set up file synchronization configuration for a UiPath agent project."
initial_prompt: |
  I have a UiPath agent project in the current directory that I want to sync with UiPath Studio Web.
  My project ID is "FOOBAR".
  Assume that you are authenticated already.
  I want you to pull the project from studio web.

  If you ever need to re-authenticate, stop immediately.
max_iterations: 2
tags: [uipath, coded-agents, file-sync]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Glob", "Grep"]
  plugins:
    - type: "local"
      path: $UIPATH_PLUGIN_MARKETPLACE_DIR/plugins/uipath-coded-agents/

sandbox:
  driver: "tempdir"
  python: {}
  network_enabled: false
  template_sources:
    - type: "template_dir"
      path: templates/text-processor

success_criteria:
  - type: "file_contains"
    path: ".env"
    includes: ["UIPATH_PROJECT_ID","FOOBAR"]
    description: ".env must contain UIPATH_PROJECT_ID variable with FOOBAR"

  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath pull.*"
    min_count: 1
    description: "Agent must run uipath pull"
