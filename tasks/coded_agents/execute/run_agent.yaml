task_id: "uipath_execute_agent"
description: "Execute a pre-built temperature converter UiPath agent with multiple test inputs and save results."
initial_prompt: |
  I have a temperature converter UiPath agent in the current directory. Please run it to get temperature of 0C to F.
max_iterations: 3
tags: [uipath, coded-agents, execute]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Glob", "Grep"]
  plugins:
    - type: "local"
      path: $UIPATH_PLUGIN_MARKETPLACE_DIR/plugins/uipath-coded-agents/

sandbox:
  driver: "tempdir"
  python: {}
  network_enabled: false
  template_sources:
    - type: "template_dir"
      path: templates/temperature-converter

success_criteria:
  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath run main.*celsius.*0.*"
    min_count: 1
    description: "Agent must attempt to run the agent at least once using the uipath run command."
    require_success: true
