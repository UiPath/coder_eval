task_id: "mock_path_dirs_template_dir"
description: >
  End-to-end smoke for SandboxConfig.mock_path_dirs using template_dir: a folder of
  shell-script mocks is copied wholesale into the sandbox, marked +x, and prepended
  to PATH. The agent invokes them by bare name and the mock implementations win.
tags: [mock, template-dir]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Bash", "Write"]

sandbox:
  template_sources:
    - type: "template_dir"
      path: "./mock-cli-bins"
  mock_path_dirs:
    - "mocks"

initial_prompt: |
  Two mock CLI binaries (`say_hello`, `echo_args`) have been placed on the agent's
  PATH via the sandbox's mock_path_dirs feature.

  Run, in this order, capturing stdout to the named files (do not write the files
  yourself -- they must be produced by shell redirection from the command):

    1. `say_hello world` -> `say_hello.out`
    2. `echo_args one two three` -> `echo_args.out`

  Confirm afterwards that both output files exist.

# Each mock composes its receipt at runtime from the invocation (argument count
# and argument lengths), so none of the asserted lines exist verbatim in the
# scripts that ship into the sandbox. Reading the mock sources is therefore not a
# shortcut to satisfying these criteria -- the mocks have to be executed.
success_criteria:
  - type: "file_exists"
    path: "say_hello.out"
    description: "say_hello.out must be produced by the say_hello mock's stdout."
  - type: "file_contains"
    path: "say_hello.out"
    includes: ["MOCK_PATH_OK say_hello argc=1 argchars=5"]
    description: "say_hello.out must contain the receipt say_hello computes from its arguments."
  - type: "file_exists"
    path: "echo_args.out"
    description: "echo_args.out must be produced by the echo_args mock."
  - type: "file_contains"
    path: "echo_args.out"
    includes: ["ECHO_ARGS_OK argc=3 argchars=11", "arg[3]=one", "arg[3]=two", "arg[5]=three"]
    description: "echo_args.out must contain the receipt echo_args computes from its arguments."
