# Test task to verify LLM Gateway integration - intentionally fails first iteration
task_id: test_llmgw_fail
name: Test LLM Gateway Integration with Failure
description: Create a specific file to test LLM Gateway reviewer when criteria fail
tags: [integration, llm-review, network]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash"]

sandbox:
  driver: tempdir
  python: {}

success_criteria:
  - type: file_exists
    path: "greetings.py"
    description: "A greetings.py file should exist"

  - type: file_contains
    path: "greetings.py"
    includes:
      - "print"
      - "Hello, World!"
      - "def greet()"
    description: "greetings.py should have print, Hello World, and a greet function"

initial_prompt: "Create a file called hello.py that prints 'Hi there!'"
