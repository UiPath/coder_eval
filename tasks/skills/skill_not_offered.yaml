task_id: skill-not-offered
description: >-
  Misuse fixture for the skill_triggered gate. The criterion names a skill the
  staged plugin root does not offer, so the run must finish ERROR with the
  misuse message, never score it. Run from the repo root.

tags:
  - skills-misuse

agent:
  plugins:
    - type: local
      path: tasks/skills/probe_plugin

initial_prompt: "Use the probe-skill skill and reply."

success_criteria:
  - type: skill_triggered
    description: "absent-skill was engaged"
    skill_name: absent-skill
    expected_skill: absent-skill
