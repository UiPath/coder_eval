# Activation suite for the plugin's own `lint-tasks` skill, with `task` as the named
# sibling. Written by following /coder-eval:check-skill, then split-labelled so
# /coder-eval:optimize-skill can propose against `train` and confirm on `test`.
#
# Reachability: `path` must be a PLUGIN ROOT — a directory holding a `skills/` subdirectory
# (a `.claude-plugin/plugin.json` is optional; without one the namespace defaults to the
# directory name). Pointing a local plugin at a bare directory of skill directories loads
# NOTHING. Here that root is the plugin itself, which mounts all seven skills at once —
# the point, since activation is a competition between descriptions:
#
#   export SKILL_SOURCE_PATH="$(pwd)/plugins/coder-eval"
#
# An unset or wrong path is only a warning and leaves every skill unreachable, so confirm
# the first run's recall is non-zero before trusting any low score.
#
# `skill_name` below stays the BARE name even though the plugin namespaces these as
# `coder-eval:lint-tasks` — the checker strips the namespace before comparing.
task_id: "lint-tasks-activation"
description: "Does the agent engage `lint-tasks` when it should, leave it alone when it shouldn't, and not steal `task`'s requests?"
tags: [activation, skills]

agent:
  # The discriminator is required for `setting_sources` to be in schema — it is a
  # claude-code field, not a field on the shared agent base.
  type: "claude-code"
  plugins:
    - type: "local"
      path: "$SKILL_SOURCE_PATH"
  # The agent must not need the host project's CLAUDE.md or settings — this measures the
  # skill listing, and injecting a 20 KB project guide into every call is both expensive
  # and a confound.
  setting_sources: []

# Activation is decided in the first assistant turn: either the skill is engaged or it is
# not. Without caps the agent spends turns exploring a sandbox that deliberately holds no
# eval files, and a row that times out is EXCLUDED from the confusion matrix rather than
# scored — shrinking the denominator the metrics are computed over (watch `completion_rate`
# in the rollup). Cap tightly: it buys signal, not just cost.
run_limits:
  max_turns: 2
  turn_timeout: 120
  task_timeout: 300

dataset:
  paths:
    - "lint-tasks-activation-rows.jsonl"
  split_field: "split"

initial_prompt: |
  ${row.prompt}

success_criteria:
  # The skill under test. Positive rows expect engagement; distractor and sibling-owned
  # rows expect none.
  - type: "skill_triggered"
    description: "lint-tasks activation for row ${row.id}"
    skill_name: "lint-tasks"
    expected_skill: "${row.expected_skill}"
    # MEASURED 2026-08-15 on claude-sonnet-4-6, 28 rows x 2 replicates (56 scored),
    # run dir runs/rebaseline-lint-tasks, completion_rate 1.000:
    #   recall.yes 1.000 · precision.yes 1.000
    # (2 of the 56 replicates ended MAX_TURNS_EXHAUSTED; every criterion on them still scored,
    # so completion_rate is genuinely 1.000 rather than an eroded denominator.)
    # Re-measured after `skill_triggered` began requiring the skill body to have been
    # DELIVERED (a refused / in-flight / crash-closed Skill call now scores `no`, where it
    # previously scored `yes`). That rule re-baselines suites DOWNWARD, so this suite was
    # re-measured before its gate could be trusted — it did not move. Thresholds left as they
    # were: `measured - 0.10` is 0.90, which is ABOVE the committed 0.7, and a re-baseline is
    # not a licence to tighten a gate nobody asked to tighten.
    suite_thresholds:
      recall.yes: 0.7
      precision.yes: 0.7

  # The sibling. Stacking one criterion per skill yields a per-skill confusion matrix from
  # the same traces, which turns "this misfired" into "this stole `task`'s requests".
  # No suite_thresholds: this criterion is the sibling-regression read-out, not a gate.
  - type: "skill_triggered"
    description: "task (sibling) activation for row ${row.id}"
    skill_name: "task"
    expected_skill: "${row.expected_skill}"

  - type: "skill_triggered"
    description: "analyze (sibling) activation for row ${row.id}"
    skill_name: "analyze"
    expected_skill: "${row.expected_skill}"

  # NOTE on the two setup rows (`hard-3`, `hard-6`) and the absent `init` criterion.
  # Two independent reasons not to write one:
  #
  # 1. coder-eval's `init` sets `disable-model-invocation: true`, so the model will not
  #    reach for it on its own. `expected_skill: "init"` would assert something the run
  #    cannot satisfy — a criterion that can never pass, exactly what `lint-tasks` flags.
  # 2. `skill_name` is matched on the BARE name (the checker strips any `plugin:` prefix),
  #    and Claude Code ships its own unscoped `init` skill. A bare-name criterion cannot
  #    tell the two apart, so it would silently score a different skill's activation.
  #    Observed live: these rows engage that other `init`.
  #
  # Labelled `""` instead, which asks the question that has an answer: does a
  # model-invokable sibling wrongly claim setup requests? It scores against every criterion
  # above, and `task` does misfire here intermittently.
