task_id: "pi_smoke_test"
description: "Smoke-test the Pi agent harness: create and run a small Python script."
initial_prompt: "Create a Python file named app.py in the current working directory that prints 'Hello, Pi!' on one line, and today's date in YYYY-MM-DD format on the next line. Use the datetime module. Then run the script with: python app.py"
# No `smoke-pass`: that tag routes a task into the CI E2E bucket, which runs on
# Bedrock runners with no `pi` CLI and no OpenRouter credentials. Run this task
# locally (or in a job that installs both) instead —
# `npm install -g @earendil-works/pi-coding-agent`, then export OPENROUTER_API_KEY.
tags: [smoke, basic, pure-python, pi]

run_limits:
  expected_turns: 5
  # The CLI drives a full agent loop per invocation; give it room but keep the
  # smoke bounded so a hung provider fails fast instead of stalling a suite.
  task_timeout: 600

agent:
  type: "pi"
  # Pi addresses models as provider/model and speaks OpenRouter natively
  # (authenticated by OPENROUTER_API_KEY), so it needs no LiteLLM proxy. Real
  # per-call cost lands on the turn: Pi reports `cost` on every turn_end event
  # and the harness folds it into token_usage.total_cost_usd (falling back to the
  # rate card only when the stream omits it). Spike-verified working model;
  # swappable to any Pi-addressable provider/id.
  model: "openrouter/moonshotai/kimi-k3"
  permission_mode: "acceptEdits"

success_criteria:
  - type: "file_exists"
    path: "app.py"
    description: "The file app.py must be created."
  - type: "file_contains"
    path: "app.py"
    includes: ["Hello, Pi!", "datetime"]
    description: "The script must contain the required string and import."
  - type: "run_command"
    command: "python app.py"
    timeout: 10
    description: "The script must execute successfully."
