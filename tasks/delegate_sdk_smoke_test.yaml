task_id: "delegate_sdk_smoke_test"
description: "Smoke-test the UiPath Delegate SDK agent harness: create and run a small Python script."
initial_prompt: "Create a Python file named app.py in the current working directory that prints 'Hello, Delegate!' on one line, and today's date in YYYY-MM-DD format on the next line. Use the datetime module. Then run the script with: python app.py"
# No `smoke-pass`: that tag routes a task into the CI E2E bucket, which runs on
# Bedrock runners with no @uipath/delegate-stdio host and no UiPath auth. Run
# this task locally (or in a job that installs both) instead — see
# docs/agents/DELEGATE_SDK.md.
tags: [smoke, basic, pure-python, delegate-sdk]

run_limits:
  expected_turns: 5
  # The host drives a full agent loop per turn against the UiPath backend; give
  # it room but keep the smoke bounded so a stalled backend fails fast.
  task_timeout: 600

agent:
  type: "delegate-sdk"
  permission_mode: "acceptEdits"
  # Cloud env slug (alpha/staging/production) is not a task field — it comes
  # from the DELEGATE_SDK_ENV environment variable (defaults to "alpha").
  # Pin a UiPath-native model: the inherited default (claude-sonnet-4-6 from
  # experiments/default.yaml) is rejected by the deployed alpha Delegate backend
  # ("Model 'claude_sonnet_4_6' is not available"). virtuoso-1-5 is the Delegate
  # SDK default and is priced in src/coder_eval/pricing.py.
  model: "virtuoso-1-5"

sandbox:
  driver: "tempdir"
  python: {}

success_criteria:
  - type: "file_exists"
    path: "app.py"
    description: "The file app.py must be created."
  - type: "file_contains"
    path: "app.py"
    includes: ["Hello, Delegate!", "datetime"]
    description: "The script must contain the required string and import."
  - type: "run_command"
    command: "python app.py"
    timeout: 10
    description: "The script must execute successfully."
