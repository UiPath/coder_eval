task_id: record_cli_responses
description: |
  Probe: does a generated `record_cli` shim really serve a different canned
  response per invocation, inside a container, and does the agent see it?

  Everything below is covered by unit tests EXCEPT the one thing this task
  exists for: the shim is generated by the in-container orchestrator, so its
  shebang interpreter is `os.path.realpath(sys.executable)` as resolved INSIDE
  the container. `run_task_internal_command` rewrites `driver: docker` ->
  `tempdir` before building that orchestrator, so nothing running on the host
  can exercise that path. Hence `driver: docker`.

  What it exercises end to end:

    1. Shim generation inside the container, with the container's python baked
       into the shebang.
    2. The SIDECAR import: `argv_match.py` is written into `cli_mocks/` beside
       the shim and imported as a sibling. If that import fails, the shim serves
       the entry fallback for everything and books `sidecar_error` on every
       record; the two `cli_called` criteria then fail with the precise
       diagnostic ("could not import its matcher module"), which is the one to
       read first.
    3. Per-invocation rule dispatch: `ixp dummy1` and `ixp dummy2` must answer
       DIFFERENTLY, and `ixp nope` must fall through to the entry default.
    4. `cli_called` grading the resulting JSON Lines log.

  Why three criterion families and not just `cli_called`: the two `cli_called`
  criteria prove the invocations were RECORDED. They cannot tell per-rule
  dispatch from every rule serving the entry default -- both look identical in
  the log's argv.

  The two regex checks on cli_mocks/calls.jsonl are the AUTHORITATIVE dispatch
  detectors: the shim writes `"rule": N` only when rule N actually answered, so
  no prompt-compliance failure can suppress it, and unlike the captured text it
  cannot be satisfied by reading this YAML. Each pattern ties one argv to ITS OWN
  rule index, because requiring `"rule": 0` and `"rule": 1` to appear merely
  somewhere would accept a regression that swapped them -- dispatch happening,
  but on the wrong invocations.

  What they are NOT is tamper-proof. The log lives in the sandbox the agent
  writes to, so a determined agent could append a matching line -- the same
  property that lets any `cli_called` criterion be satisfied by a hand-written
  record. This probe is a REGRESSION detector against coder_eval's own codegen,
  aimed at a cooperative agent; it is not an anti-cheat control. The adversarial
  probe is tasks/anti_cheat_reference.

  The `captured.txt` check is the weaker, end-user-visible half: it shows the
  response text reached the AGENT, not just the log. It is deliberately NOT
  treated as dispatch proof, because this YAML is serialised to /work/input
  (readable) and mounted again at /work/task_dir, so RESPONSE_ONE / RESPONSE_TWO
  are reachable with `cat` -- an agent that found empty stdout and went looking
  could transcribe them. Keeping them out of the prompt (pinned by
  tests/test_tags.py::TestRecordCliProbeIntegrity) narrows that path but cannot
  close it; the log criterion is what closes it.

  Run it with:
    coder-eval run tasks/record_cli_responses.yaml

  PREREQUISITE: `make docker-image`. This is a `driver: docker` task; without
  the image it fails at sandbox setup.

  CI: tagged smoke-pass, so it lands in the e2e-smoke "expect all to succeed"
  bucket and is counted by EXPECTED_SMOKE_PASS_RUN / _SUCCEEDED in
  .github/workflows/pr-checks.yml. That bucket is BLOCKING.

  If this task ever proves flaky, the lever is to drop every AGENT-DEPENDENT
  criterion to `weight: 0.0` -- the two `cli_called` and both `captured.txt`
  criteria -- and let the two `cli_mocks/calls.jsonl` regexes gate alone. They need
  nothing from the agent beyond having run the two commands, so what survives
  still proves dispatch rather than proving nothing. `is_gating` is `weight > 0`,
  so there is no "advisory but gating" middle setting.

tags:
  # smoke / smoke-pass put this in the CI e2e-smoke "expect all to succeed"
  # bucket, which globs `tasks/*.yaml`. This file is FLAT on purpose so that
  # glob matches it and neither the workflow step nor Makefile SMOKE_GLOBS needs
  # a new path. Adding/removing it means bumping the EXPECTED_SMOKE_PASS_* pair.
  - smoke
  - smoke-pass
  - record-cli
  - docker

agent:
  type: claude-code
  permission_mode: acceptEdits
  # Mirrors anti_cheat_reference. Read is kept deliberately: Claude Code's Write
  # tool refuses to overwrite a file the session has not read, so an agent that
  # wants to correct or extend captured.txt would otherwise burn turns against
  # max_turns discovering the Bash heredoc fallback. Restricting tools would NOT
  # make the response strings unreachable anyway -- see the description block.
  allowed_tools:
    - Bash
    - Read
    - Write
  # No MCP servers needed; keeps the host project's CLAUDE.md and settings out
  # of the sandbox (and out of every API call).
  setting_sources: []

sandbox:
  driver: docker
  docker:
    # bridge, not none: the agent needs to reach its own model API. Network
    # isolation is not what this task tests.
    network: bridge
  # No `limits:` block: ResourceLimits.timeout binds only Sandbox.run_command's
  # subprocess timeout, and this task declares no run_command criterion. The
  # agent's caps are run_limits below.
  record_cli:
    - tool: uip
      # Entry fallback, deliberately distinct from both rules in exit code AND
      # streams, so "the fallback answered everything" is distinguishable from a
      # pass (pinned by TestRecordCliProbeIntegrity).
      exit_code: 1
      stderr: "uip: unknown command\n"
      responses:
        - when: {verb: "ixp dummy1"}
          stdout: "RESPONSE_ONE\n"
        - when: {verb: "ixp dummy2"}
          stdout: "RESPONSE_TWO\n"

initial_prompt: |
  This sandbox has a `uip` command on your PATH. Your job is to report exactly
  what it prints.

  Run these three commands, in this order, and capture the full output of each:

    1. `uip ixp dummy1`
    2. `uip ixp dummy2`
    3. `uip ixp nope`

  The third command is expected to FAIL with a non-zero exit status. That is a
  valid, useful result, not a problem to work around: record what it printed and
  move on. Do not retry it, do not try to install or repair `uip`, and do not
  guess at what any of the three commands "should" print -- run them and report
  what you actually saw.

  Then write a file `captured.txt` in your working directory containing the
  verbatim output of all three commands, each under a heading naming the command
  that produced it.

success_criteria:
  - type: cli_called
    verb: "ixp dummy1"
    min_count: 1
    description: "The agent invoked the first stubbed subcommand, and it was recorded."
    weight: 1.0

  - type: cli_called
    verb: "ixp dummy2"
    min_count: 1
    description: "The agent invoked the second stubbed subcommand, and it was recorded."
    weight: 1.0

  # THE load-bearing criterion, and the only one here independent of the agent:
  # the shim writes `"rule": N` only when rule N actually answered, so this fails
  # if dispatch breaks no matter what the agent does, and passes even if the
  # agent names its capture file something else. Note weight does not confer
  # gate priority -- `all_criteria_passed` is a strict AND over every criterion
  # with weight > 0, so the 1.0-weighted ones fail the task just as hard. The
  # weight only shapes the reported score.
  # One per rule, CORRELATING argv with the rule index that served it. Merely
  # requiring `"rule": 0` and `"rule": 1` somewhere in the log would accept a
  # regression that swapped them -- dispatch happening, but wrong.
  - type: file_matches_regex
    path: cli_mocks/calls.jsonl
    pattern: '"argv": \["ixp", "dummy1"\][^\n]*"rule": 0'
    must_match: true
    description: >-
      The first stubbed subcommand was served by ITS OWN rule (index 0), proving
      real per-invocation dispatch rather than the entry fallback -- which the
      cli_called pair above cannot distinguish.
    weight: 2.0

  - type: file_matches_regex
    path: cli_mocks/calls.jsonl
    pattern: '"argv": \["ixp", "dummy2"\][^\n]*"rule": 1'
    must_match: true
    description: "The second stubbed subcommand was served by its own rule (index 1)."
    weight: 2.0

  # The agent-visible half: proves the response text reached the AGENT, not just
  # the log. NOT dispatch proof on its own -- this YAML is readable at
  # /work/input, so the strings are transcribable (see the description block).
  - type: file_contains
    path: captured.txt
    includes: ["RESPONSE_ONE", "RESPONSE_TWO"]
    description: >-
      Both per-invocation responses reached the agent, not merely the log.
    weight: 1.0

  # Redundant with the file_contains above on the same path (that checker already
  # fails a missing file), kept only as an explicit, readable statement that the
  # agent must produce the capture file at all.
  - type: file_exists
    path: captured.txt
    description: "The agent produced its capture file."
    weight: 1.0

# No cli_called criterion on `ixp nope`: the fallback is already implied by the
# two rules above answering differently, and a positive assertion on a command a
# model may skip after two successes is a pure flake source in a blocking bucket.

run_limits:
  max_turns: 6
  task_timeout: 300
  turn_timeout: 150
