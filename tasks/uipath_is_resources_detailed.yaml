task_id: uipath-is-resources-detailed
description: >
  Detailed-prompt evaluation: agent follows step-by-step instructions to use
  UiPath Integration Service resources commands via uip CLI with Zoho Desk
  connector. Covers listing resources (with options), describing objects, resolving
  reference fields, and executing a create operation with a properly constructed body.
tags: [is, uipcli, detailed]

max_turns: 22
agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  You are working with the UiPath Integration Service CLI (`uip`).
  Your goal is to demonstrate the full resources workflow using the Zoho Desk
  connector (`uipath-zoho-desk`), including creating a real ticket by resolving
  all required field dependencies. Save a summary report at the end.

  Be efficient: use `tee` to save output AND see it in one command (avoids
  reading files back). Don't verify files manually. Don't use todo lists.

  ## Step 0: Check login
  Run `uip login status --output json`. If expired or not logged in,
  run `uip login` first.

  ## Step 1: List resources + connections (ALL 5 in ONE parallel batch)
  IMPORTANT: Run all 5 commands as separate parallel tool calls in a SINGLE batch:
    uip is resources list uipath-zoho-desk --output json | tee resources_list.json
    uip is connections list uipath-zoho-desk --output json | tee zoho_connections.json
    uip is resources list uipath-zoho-desk --output json --refresh > resources_list_refresh.json
    uip is resources list uipath-zoho-desk --output yaml > resources_list.yaml
    uip is resources list uipath-zoho-desk --operation List --output json > resources_list_operation.json
  Use `tee` for the first two so you can see output. Use `>` for the rest.
  Do NOT split these into multiple batches — they are all independent.

  ## Step 2: Describe + resolve references (ALL 4 in ONE parallel batch)
  From Step 1 output, get a connection ID. These 4 commands are all independent
  — run them ALL in a SINGLE parallel batch:
  a) Describe create_ticket fields:
       uip is resources describe uipath-zoho-desk create_ticket --connection-id <id> --operation Create --output json | tee resource_describe.json
  b) Describe tickets with List operation:
       uip is resources describe uipath-zoho-desk tickets --connection-id <id> --operation List --output json > resource_describe_operation.json
  c) Fetch departments (needed for departmentId in create body):
       uip is resources execute list uipath-zoho-desk departments --connection-id <id> --output json | tee resolve_departments.json
  d) Fetch contacts (needed for contact email in create body):
       uip is resources execute list uipath-zoho-desk contacts --connection-id <id> --query "limit=1" --output json | tee resolve_contacts.json
  If no connections, write skip notes and go to Step 5.

  ## Step 3: Execute create (create a real ticket)
  Using the resolved references from Step 2c/2d, construct the --body JSON:
    - subject: any descriptive text
    - departmentId: the ID from Step 2c
    - contact: {"email": "<email from Step 2d>"}  <- MUST be nested object, NOT flat "contact.email"
    - description: any text
    - priority: "Low"
    - status: "Open"

  IMPORTANT: Dot-notation fields like `contact.email` from the describe output
  must be sent as NESTED JSON objects in --body: `{"contact": {"email": "..."}}`
  NOT as flat keys like `{"contact.email": "..."}` (that will cause a 422 error).

  Run:
    uip is resources execute create uipath-zoho-desk create_ticket --connection-id <id> --body '<json>' --output json | tee execute_create.json

  The body JSON must use the ACTUAL IDs resolved from Step 2, not placeholders.

  ## Step 4: Execute list (read back tickets)
  Verify the ticket was created by listing tickets:
    uip is resources execute list uipath-zoho-desk tickets --connection-id <id> --query "limit=5" --output json > execute_list.json

  ## Step 5: Write summary report
  Create resources_report.json:
    {
      "connector_used": "uipath-zoho-desk",
      "resources_found": <count of objects>,
      "connection_id_used": "<id or null>",
      "describe_object": "create_ticket",
      "fields_discovered": ["<list of fields from describe>"],
      "references_resolved": {
        "departmentId": "<resolved department id>",
        "contact_email": "<resolved contact email>"
      },
      "ticket_created": <true|false>,
      "ticket_id": "<id from create response or null>",
      "execute_attempted": true,
      "options_exercised": ["--output json", "--output yaml", "--refresh", "--operation", "--connection-id", "--query", "--body"],
      "steps_completed": ["list_resources", "list_with_options", "connections", "describe", "resolve_references", "execute_create", "execute_list", "report"]
    }

  Important notes:
  - The `uip` CLI is already available.
  - Use --output json unless testing other formats.
  - The connector key is `uipath-zoho-desk`.
  - Execute and describe commands require --connection-id.
  - Dot-notation fields (e.g., `contact.email`) must be nested in --body JSON.
  - Do NOT guess IDs — fetch them from the API.
  - Do NOT use `timeout` command (not on macOS). Do NOT use TodoWrite.
  - Maximize parallelism: Step 1 = 5 parallel calls, Step 2 = 4 parallel calls.

success_criteria:
  # -- Step 1: List resources + connections --
  - type: command_executed
    description: "Agent listed resources for zoho-desk"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+list\s+uipath-zoho-desk'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "resources_list.json file exists"
    path: "resources_list.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --refresh option on resources list"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+list\s+uipath-zoho-desk.*--refresh'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "resources_list_refresh.json exists"
    path: "resources_list_refresh.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --output yaml on resources list"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+list\s+uipath-zoho-desk.*--output\s+yaml'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "resources_list.yaml exists"
    path: "resources_list.yaml"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --operation filter on resources list"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+list\s+uipath-zoho-desk.*--operation'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "resources_list_operation.json exists"
    path: "resources_list_operation.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed connections for zoho-desk"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+connections\s+list\s+uipath-zoho-desk'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "zoho_connections.json exists"
    path: "zoho_connections.json"
    weight: 0.5
    pass_threshold: 1.0

  # -- Step 2: Describe + resolve references --
  - type: command_executed
    description: "Agent described create_ticket with --operation Create"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+describe\s+uipath-zoho-desk\s+create_ticket.*--operation\s+Create'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "resource_describe.json exists"
    path: "resource_describe.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "resource_describe_operation.json exists"
    path: "resource_describe_operation.json"
    weight: 0.5
    pass_threshold: 1.0

  # -- Step 2 (continued): Resolve references --
  - type: command_executed
    description: "Agent fetched departments to resolve departmentId"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+execute\s+list\s+uipath-zoho-desk\s+departments.*--connection-id'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "resolve_departments.json exists"
    path: "resolve_departments.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched contacts to resolve contact email"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+execute\s+list\s+uipath-zoho-desk\s+contacts.*--connection-id'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "resolve_contacts.json exists"
    path: "resolve_contacts.json"
    weight: 0.5
    pass_threshold: 1.0

  # -- Step 3: Execute create --
  - type: command_executed
    description: "Agent executed create with --body"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+execute\s+create\s+uipath-zoho-desk\s+create_ticket.*--body'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "execute_create.json exists"
    path: "execute_create.json"
    weight: 1.0
    pass_threshold: 1.0

  # -- Step 4: Execute list --
  - type: file_exists
    description: "execute_list.json exists"
    path: "execute_list.json"
    weight: 1.0
    pass_threshold: 1.0

  # -- Step 5: Summary report --
  - type: file_exists
    description: "resources_report.json summary exists"
    path: "resources_report.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "resources_report.json is valid JSON"
    command: "python -c \"import json; json.load(open('resources_report.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Report contains expected summary fields"
    path: "resources_report.json"
    includes:
      - "connector_used"
      - "resources_found"
      - "connection_id_used"
      - "describe_object"
      - "fields_discovered"
      - "references_resolved"
      - "ticket_created"
      - "execute_attempted"
      - "options_exercised"
      - "steps_completed"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Report confirms options were exercised"
    path: "resources_report.json"
    includes:
      - "--output json"
      - "--output yaml"
      - "--refresh"
      - "--operation"
      - "--connection-id"
      - "--body"
      - "--query"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Report shows references were resolved"
    path: "resources_report.json"
    includes:
      - "departmentId"
      - "contact_email"
    weight: 1.0
    pass_threshold: 1.0
