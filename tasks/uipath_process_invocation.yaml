task_id: uipath-process-invocation
description: "Create a script that starts a UiPath process and monitors its execution"
tags: [golden, integration, uipath-python, network]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash"]

sandbox:
  driver: tempdir
  python:
    env_packages:
      - uipath>=2.1.75
      - python-dotenv>=1.0
  template_sources:
    - type: template_dir
      path: "../templates/uipath-starter"

initial_prompt: |
  Create a Python script called process_invocation.py that starts a UiPath process
  and polls until it finishes.

  The script should kick off a process by name with some input arguments, then keep
  checking the job status until it's done (not pending or running anymore). Print the
  job state as it progresses and show the output arguments when it completes. Handle
  errors gracefully in case the process doesn't exist or something goes wrong.

  Use the UiPath Python SDK for process and job operations. Put everything in a
  def main() function — don't call the SDK at module level since credentials aren't
  available at import time. Add if __name__ == "__main__": main() at the bottom.
  Load env vars with dotenv.

  Keep it to one file.

success_criteria:
  - type: file_exists
    description: "process_invocation.py file exists"
    path: "process_invocation.py"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Script imports required modules"
    path: "process_invocation.py"
    includes:
      - "UiPath"
      - "load_dotenv"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Script invokes process correctly"
    path: "process_invocation.py"
    includes:
      - "processes.invoke"
    weight: 2.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Script retrieves job status"
    path: "process_invocation.py"
    includes:
      - "jobs.retrieve"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Script monitors job state"
    path: "process_invocation.py"
    includes:
      - ".state"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Has main() function entrypoint"
    path: "process_invocation.py"
    includes:
      - "def main"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Python syntax is valid"
    command: "python -m py_compile process_invocation.py"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Module imports resolve correctly"
    command: "python -c 'import process_invocation'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.5
    pass_threshold: 1.0

max_iterations: 1

reference:
  code: |
    import time
    from dotenv import load_dotenv
    from uipath.platform import UiPath


    def main():
        load_dotenv()
        sdk = UiPath()

        process_name = "MyProcess"

        try:
            job = sdk.processes.invoke(
                process_name,
                {"param1": "value1", "param2": 100},
            )
            print(f"Process started, Job Key: {job.key}")

            while job.state in ("Pending", "Running"):
                time.sleep(5)
                job = sdk.jobs.retrieve(job.key)
                print(f"  State: {job.state}")

            print(f"Final state: {job.state}")
            if job.output_arguments:
                print(f"Output: {job.output_arguments}")

        except Exception as e:
            print(f"Error: {e}")


    if __name__ == "__main__":
        main()

llm_reviewer:
  enabled: true
  prompt: |
    Evaluate if the process invocation script is complete and correct:

    1. Does it use sdk.processes.invoke(name, input_arguments) (NOT invoke_process or ProcessStartInfo)?
    2. Does invoke() return a Job object (NOT a raw response)?
    3. Does it access Job attributes like .key, .state, .output_arguments (NOT response.json())?
    4. Does it use sdk.jobs.retrieve(job_key) to monitor status?
    5. Does it poll until job.state leaves Pending/Running?
    6. Does it handle errors gracefully?
