task_id: "opencode_smoke_test"
description: "Smoke-test the OpenCode agent harness: create and run a small Python script."
initial_prompt: "Create a Python file named app.py in the current working directory that prints 'Hello, OpenCode!' on one line, and today's date in YYYY-MM-DD format on the next line. Use the datetime module. Then run the script with: python app.py"
tags: [smoke, smoke-pass, basic, pure-python, opencode]

run_limits:
  expected_turns: 5
  # The CLI drives a full agent loop per invocation; give it room but keep the
  # smoke bounded so a hung provider fails fast instead of stalling a suite.
  task_timeout: 600

agent:
  type: "opencode"
  # OpenCode addresses models as provider/model and speaks OpenRouter natively
  # (authenticated by OPENROUTER_API_KEY), so it does NOT need the LiteLLM proxy —
  # that shim exists to translate Anthropic <-> OpenAI for the Claude Code SDK.
  # Real per-call cost still lands on the turn: OpenCode reports `cost` on every
  # step_finish event and the harness folds it into token_usage.total_cost_usd
  # (falling back to the rate card when the stream omits or zeroes it).
  model: "openrouter/deepseek/deepseek-v4-pro"
  permission_mode: "acceptEdits"

success_criteria:
  - type: "file_exists"
    path: "app.py"
    description: "The file app.py must be created."
  - type: "file_contains"
    path: "app.py"
    includes: ["Hello, OpenCode!", "datetime"]
    description: "The script must contain the required string and import."
  - type: "run_command"
    command: "python app.py"
    timeout: 10
    description: "The script must execute successfully."
