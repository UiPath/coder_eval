task_id: flow-planning-impl
description: >
  Given an approved .arch.plan.md, produce a .impl.plan.md with resolved
  details — tests Phase 2 of the two-phase planning methodology.
tags: [flow, planning, impl, tier-3]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 40

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/cli@0.1.21"
  template_sources:
    - type: template_dir
      path: "./artifacts"

initial_prompt: |
  Before starting, load the uipath-maestro-flow skill. Read and follow its workflow steps exactly.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation.

  I have an approved architectural plan: WeatherAlert.arch.plan.md
  Read it carefully.

  Now produce the Phase 2 implementation plan: WeatherAlert.impl.plan.md

  Follow the planning guide's Phase 2 instructions:
  1. Run `uip maestro flow registry get` for each node type to validate definitions
  2. Resolve all placeholders from Phase 1
  3. Document any changes from the architectural plan
  4. Include the resolved node and edge tables

  Do NOT build the flow — just produce the implementation plan document.

success_criteria:
  - type: file_exists
    description: "Implementation plan exists"
    path: "WeatherAlert.impl.plan.md"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Plan has resolved node types"
    path: "WeatherAlert.impl.plan.md"
    includes: ["core.trigger.scheduled", "core.action.http", "core.logic.decision"]
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Plan references registry validation"
    path: "WeatherAlert.impl.plan.md"
    includes: ["registry"]
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used registry get to validate node types"
    tool_name: "Bash"
    command_pattern: "uip.*registry.*get"
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Plan has edge table"
    path: "WeatherAlert.impl.plan.md"
    includes: ["Edge"]
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 1
