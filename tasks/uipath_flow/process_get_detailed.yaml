task_id: uipath-flow-process-get-detailed
description: >
  Detailed-prompt evaluation: agent follows step-by-step instructions to get
  the schema and details of a UiPath Flow process using uipcli CLI.
tags: [flow, uipcli, detailed]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 12

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Use the `uipcli` CLI tool to get the schema and details of a Flow process.

  Be efficient: redirect output directly to files. Do not run unnecessary
  verification commands.

  ## Step 0: Check login
  Run `uipcli login status --format json`. If expired or not logged in,
  run `uipcli login` first.

  ## Step 1: List processes
  Run `uipcli flow process list --format json > processes.json`
  to discover available processes.

  ## Step 2: Get process details
  From the processes list, extract a `process-key` (e.g., `MyFlow.flow.Flow:1.0.0`)
  and `feed-id`. Then run:
    uipcli flow process get <process-key> <feed-id> --format json > process_details.json
  If no processes are available, write to process_details.json:
    {"status": "skipped", "reason": "no processes found"}

  ## Step 3: Get process details in YAML format
  Run the same get command with `--format yaml`:
    uipcli flow process get <process-key> <feed-id> --format yaml > process_details.yaml
  If no processes, write: {"status": "skipped", "reason": "no processes found"}

  ## Step 4: Write summary report
  Create process_get_report.json:
    {
      "command_used": "uipcli flow process get",
      "process_key": "<process-key or null>",
      "feed_id": "<feed-id or null>",
      "formats_tested": ["json", "yaml"],
      "steps_completed": ["list_processes", "get_json", "get_yaml", "report"]
    }

  Important notes:
  - The `uipcli` CLI is already available in the environment.
  - `flow process get` requires two positional args: process-key and feed-id.
  - These values come from the `flow process list` output.

success_criteria:
  - type: command_executed
    description: "Agent listed processes"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+process\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "processes.json file exists"
    path: "processes.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran uipcli flow process get"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+process\s+get'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "process_details.json file exists"
    path: "process_details.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "process_details.json is valid JSON"
    command: "python -c \"import json; json.load(open('process_details.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --format yaml on process get"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+process\s+get.*--format\s+yaml'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "process_details.yaml exists"
    path: "process_details.yaml"
    weight: 0.5
    pass_threshold: 1.0

  - type: file_exists
    description: "process_get_report.json summary exists"
    path: "process_get_report.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "process_get_report.json is valid JSON"
    command: "python -c \"import json; json.load(open('process_get_report.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Report contains expected summary fields"
    path: "process_get_report.json"
    includes:
      - "command_used"
      - "process_key"
      - "feed_id"
      - "formats_tested"
      - "steps_completed"
    weight: 1.5
    pass_threshold: 1.0

max_iterations: 2

llm_reviewer:
  enabled: true
