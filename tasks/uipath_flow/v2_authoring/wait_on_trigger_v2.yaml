task_id: uipath-flow-v2-wait-on-trigger
description: >
  Flow v2 FIL authoring task for a mid-flow webhook event wait using
  waitOnTrigger plus local flow-run --trigger-event replay. No v1 conversion is
  required because the v1 catch-event mapping is intentionally deferred.
tags: [flow-v2, fil, generate, wait-on-trigger, webhook, event-trigger]

run_limits:
  max_turns: 50
  turn_timeout: 1200
  task_timeout: 1200

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  ignore_patterns:
    - "!dist"          # vendored flow-v2 JS toolchain (tools/*/dist/cli.js)
    - "!node_modules"  # vendored wabt runtime dep (tools/node_modules/wabt)
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"

initial_prompt: |
  Author a UiPath Flow v2 project named **WebhookCustomerUpdate** in the
  current directory. Read `SKILL.md` first -- it describes the v2 file shape,
  FIL syntax, event triggers, `waitOnTrigger`, and the authoring loop using
  `verify.sh`.

  ## Scenario

  The flow starts manually, then pauses mid-flow waiting for a webhook event
  from `/customer-update`. The webhook payload has this shape:

  ```json
  {
    "customerId": "C-1001",
    "status": "updated",
    "priority": "high"
  }
  ```

  After the event arrives:

  - If `status === "updated"` and `priority === "high"`, dispatch an action
    named `expediteCustomer` with input:
    `{ "customerId": "<id>", "route": "expedite", "message": "expedite customer <id>" }`.
  - Otherwise, dispatch an action named `recordCustomer` with input:
    `{ "customerId": "<id>", "route": "record", "message": "record customer <id>" }`.

  Use `mock` actions with fixtures for both branch actions so `verify.sh` can
  run locally without connector credentials.

  ## Event trigger requirements

  Use exactly one start trigger and one event trigger:

  ```typescript
  trigger manualStart: start;
  trigger webhookTrigger: webhook@1.0 {
    id: "customer-update",
    rawInputs: { path: "/customer-update" },
    fixture: { customerId: "C-1001", status: "updated", priority: "high" },
  };
  ```

  In `main()`, wait for the webhook event using the `waitOnTrigger` guidance
  from `SKILL.md`, then parse the raw JSON event payload before routing. Do not
  put `waitOnTrigger` inside `Promise.all` or `Promise.any`, and do not call it
  without direct `await`.

  ## Files to write (project root)

  - `WebhookCustomerUpdate.fil` FIL source
  - `bindings.json`             Connection IDs; this flow uses only mock
                                actions, so an empty bindings array is fine

  ## Authoring loop

  ```bash
  ./parse-fil.sh WebhookCustomerUpdate.fil
  ./verify.sh
  printf '{"customerId":"C-1001","status":"updated","priority":"high"}' > event-high.json
  ./verify.sh --trigger-event customer-update=event-high.json
  ```

  This task intentionally does not require `convert.sh`: v1 conversion of
  `waitOnTrigger` flows is guarded until the mid-flow catch-event mapping lands.
  Do NOT run flow debug.

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "WebhookCustomerUpdate.fil"
    weight: 1.0

  - type: file_exists
    description: "Bindings file exists"
    path: "bindings.json"
    weight: 1.0

  - type: run_command
    description: "FIL parses cleanly"
    command: "./parse-fil.sh WebhookCustomerUpdate.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "verify.sh dry-run succeeds using the trigger fixture"
    command: "./verify.sh"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "verify.sh accepts an injected high-priority webhook event"
    command: |
      python3 - <<'PY'
      import json, subprocess, sys
      payload = {"customerId": "C-1001", "status": "updated", "priority": "high"}
      open("_eval-high.json", "w").write(json.dumps(payload))
      r = subprocess.run(
          ["./verify.sh", "--trigger-event", "customer-update=_eval-high.json"],
          text=True,
          capture_output=True,
      )
      print(r.stdout)
      print(r.stderr, file=sys.stderr)
      sys.exit(r.returncode)
      PY
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Injected high-priority event is persisted and routes to expediteCustomer"
    command: |
      python3 -c "
      import json
      h = open('.flow-run/history.yaml').read()
      assert 'triggerEvent: customer-update' in h, h
      assert 'payload: {\"customerId\":\"C-1001\",\"status\":\"updated\",\"priority\":\"high\"}' in h, h
      d = json.load(open('.flow-run/decisions.json'))
      assert d.get('success') is True, d
      decisions = d.get('decisions') or []
      assert any(x.get('kind') == 'trigger' and x.get('nodeId') == 'customer-update' for x in decisions), decisions
      expedite = [x for x in decisions if x.get('nodeId') == 'expediteCustomer']
      assert expedite, decisions
      inp = expedite[0].get('input') or {}
      assert inp.get('customerId') == 'C-1001', inp
      assert inp.get('route') == 'expedite', inp
      assert inp.get('message') == 'expedite customer C-1001', inp
      print('OK: high-priority event persisted and expedited')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "verify.sh accepts an injected normal webhook event and routes to recordCustomer"
    command: |
      python3 - <<'PY'
      import json, subprocess, sys
      payload = {"customerId": "C-2002", "status": "updated", "priority": "normal"}
      open("_eval-normal.json", "w").write(json.dumps(payload))
      r = subprocess.run(
          ["./verify.sh", "--trigger-event", "webhookTrigger=_eval-normal.json"],
          text=True,
          capture_output=True,
      )
      print(r.stdout)
      print(r.stderr, file=sys.stderr)
      if r.returncode:
          sys.exit(r.returncode)
      d = json.load(open('.flow-run/decisions.json'))
      decisions = d.get('decisions') or []
      record = [x for x in decisions if x.get('nodeId') == 'recordCustomer']
      assert record, decisions
      inp = record[0].get('input') or {}
      assert inp.get('customerId') == 'C-2002', inp
      assert inp.get('route') == 'record', inp
      assert inp.get('message') == 'record customer C-2002', inp
      print('OK: normal event routed to recordCustomer')
      PY
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL source uses waitOnTrigger and the required event-trigger shape"
    command: |
      python3 -c "
      content = open('WebhookCustomerUpdate.fil').read()
      lower = content.lower()
      compact = ''.join(lower.split())
      assert 'trigger manualstart' in lower and ': start' in lower, 'missing manual start trigger'
      assert 'trigger webhooktrigger' in lower, 'missing webhook trigger declaration'
      assert 'webhook@1.0' in lower or 'core.trigger.webhook' in lower, 'missing webhook type'
      assert 'id:' in lower and 'customer-update' in lower, 'missing effective trigger id'
      assert 'rawinputs' in lower and '/customer-update' in lower, 'missing rawInputs.path'
      assert 'fixture' in lower and 'c-1001' in lower, 'missing trigger fixture'
      assert 'waitontrigger(webhooktrigger)' in compact, 'missing waitOnTrigger call'
      assert 'json.parse(eventraw)' in compact, 'eventRaw must be parsed with JSON.parse'
      assert 'promise.any' not in lower and 'promise.all' not in lower, 'waitOnTrigger must not be in Promise combinators'
      print('OK: waitOnTrigger FIL markers present')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "No converted v1 flow is required or produced"
    command: "test ! -f WebhookCustomerUpdate.flow"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow implements a mid-flow webhook wait and routes by event payload"
    prompt: |
      Did the agent author a v2 FIL Flow that:
      (a) declares exactly one start trigger and one webhook event trigger;
      (b) configures the webhook trigger with `id: "customer-update"` and
          `rawInputs.path: "/customer-update"`;
      (c) directly awaits `waitOnTrigger(webhookTrigger)` and parses the raw
          JSON event string;
      (d) routes high-priority updated customers to `expediteCustomer`;
      (e) routes all other event payloads to `recordCustomer`;
      (f) uses mock actions/fixtures so local `verify.sh --trigger-event` can
          run without connector credentials?

      Do not penalize the lack of `.flow` conversion; v1 catch-event mapping is
      deliberately deferred for this feature.
    files:
      - "WebhookCustomerUpdate.fil"
    weight: 2.0
    pass_threshold: 0.7
