task_id: uipath-flow-v2-decision
description: >
  v2 port of the EmailClassifier decision-flow task: 3-way switch with mock
  placeholder nodes for each branch. Exercises FIL's `if`/`else if`/`else`
  pattern and core.logic.mock dispatch.
tags: [flow-v2, fil, generate, decision, mock]

run_limits:
  max_turns: 50
  turn_timeout: 1200

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  ignore_patterns:
    - "!dist"          # vendored flow-v2 JS toolchain (tools/*/dist/cli.js)
    - "!node_modules"  # vendored wabt runtime dep (tools/node_modules/wabt)
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"

initial_prompt: |
  Author a UiPath Flow v2 project named **EmailClassifier** in the current
  directory. Read `SKILL.md` first — it describes the v2 file shape, FIL
  syntax (including the top-level `flow`/`action`/`trigger` declarations),
  the authoring loop using `verify.sh`, and how to use mock nodes
  (`core.logic.mock`) for offline placeholders.
  There is a worked example in `example/`.

  ## Scenario

  Classify an email into one of three categories: `needs-response`,
  `take-action`, `other`. Each branch ends after a per-category action.

  1. Manual trigger.
  2. A `core.logic.mock` placeholder for "read email" (since the email
     connector isn't available offline). Configure its fixture to return
     `{ "category": "needs-response" }` (or any one of the three categories
     so the agent can verify the branch they expect runs).
  3. FIL `if`/`else if`/`else` on `category`, with three branches.
  4. Each branch has its own `core.logic.mock` action node.
  5. End.

  ## Files to write (project root)

  - `EmailClassifier.fil`   FIL source (declare each mock action with a
                            top-level `fixture: { … }` body field for
                            offline replay)
  - `bindings.json`         Empty bindings array

  ## Authoring loop

  ```bash
  ./verify.sh           # compile + binding check; mock fixtures returned by flow-run
  ./verify.sh --live    # confirms which branch the configured mock drives
  ./convert.sh EmailClassifier
  uip maestro flow validate EmailClassifier.flow
  uip maestro flow format EmailClassifier.flow
  ```

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "EmailClassifier.fil"
    weight: 1.0
  - type: file_exists
    description: "Bindings file exists"
    path: "bindings.json"
    weight: 1.0
  - type: run_command
    description: "FIL compiles"
    command: "./parse-fil.sh EmailClassifier.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "verify.sh dry-run succeeds"
    command: "./verify.sh"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "v2 → v1 conversion succeeds"
    command: "./convert.sh EmailClassifier"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "Converted .flow validates"
    command: "uip maestro flow validate EmailClassifier.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "format succeeds"
    command: "uip maestro flow format EmailClassifier.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: run_command
    description: "Converted flow has 3+ mock nodes (one per branch + email reader)"
    command: |
      python3 -c "
      import json, sys
      ns = json.load(open('EmailClassifier.flow'))['nodes']
      mocks = [n for n in ns if n['type'] == 'core.logic.mock']
      assert len(mocks) >= 3, f'expected 3+ mocks, got {len(mocks)}'
      print(f'{len(mocks)} mock nodes')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: llm_judge
    description: "Flow classifies email into 3 categories with separate branches"
    prompt: |
      Did the agent author a v2 Flow that:
      (a) reads an email via a core.logic.mock placeholder,
      (b) branches three ways on the email's category (needs-response,
          take-action, other) using FIL if/else if/else,
      (c) has a separate action mock per branch?
      The FIL source is included below.
    files:
      - "EmailClassifier.fil"
    weight: 2.0
    pass_threshold: 0.7
