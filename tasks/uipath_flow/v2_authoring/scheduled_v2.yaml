task_id: uipath-flow-v2-scheduled
description: >
  v2 port of flow-json-scheduled: a scheduled-start weather alert authored as
  FIL + bindings instead of hand-written .flow JSON. Mirrors the v1 task for
  A/B comparison of scheduled-trigger authoring cost and reliability.
tags: [flow-v2, fil, generate, scheduled, http, decision]

run_limits:
  max_turns: 50
  turn_timeout: 1200
  task_timeout: 1200

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  ignore_patterns:
    - "!dist"          # vendored flow-v2 JS toolchain (tools/*/dist/cli.js)
    - "!node_modules"  # vendored wabt runtime dep (tools/node_modules/wabt)
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"

initial_prompt: |
  Author a UiPath Flow v2 project named **ScheduledWeatherAlert** in the
  current directory. Read `SKILL.md` first -- it describes the v2 file shape,
  FIL syntax, scheduled triggers, binding requirements, and the authoring loop
  using `verify.sh`.

  ## Scenario

  The flow runs every hour. It fetches Bellevue, WA weather from open-meteo,
  formats a summary with a script, and uses a decision to produce:

  - `{ message: "nice day" }` when the current temperature is greater than 60F.
  - `{ message: "bring a jacket" }` otherwise.

  Bellevue, WA coordinates: latitude 47.6101, longitude -122.2015.
  Use `temperature_unit=fahrenheit` on the open-meteo URL.

  ## Scheduled trigger

  Use exactly one trigger, and make it scheduled -- do not include a manual
  trigger. The trigger must use `rawInputs`, not `inputs`, so v2 to v1
  conversion preserves the timer metadata:

  ```typescript
  trigger scheduledStart: scheduled@1.1 {
    label: "Every Hour",
    rawInputs: {
      entryPointId: "11111111-2222-3333-4444-555555555555",
      timerType: "timeCycle",
      timerPreset: "R/PT1H",
    },
    outputs: {
      output: { type: "object", source: "=result.response", var: "output" },
    },
  };
  ```

  Use an HTTP action for open-meteo, a script action to format/read the
  response, and an explicit `if`/`else` in FIL so the converted v1 flow has a
  `core.logic.decision` node. Keep `main()` as `Promise<void>` for the local
  verifier. On each branch, dispatch a script action that returns the branch
  message object. Do not make `main()` return `Promise<json>` after awaited
  node calls.

  ## Files to write (project root)

  - `ScheduledWeatherAlert.fil` FIL source
  - `bindings.json`             Connection IDs; this flow has no connectors,
                                so an empty bindings array is fine

  ## Authoring loop

  ```bash
  ./parse-fil.sh ScheduledWeatherAlert.fil
  ./verify.sh
  ./convert.sh ScheduledWeatherAlert
  uip maestro flow validate ScheduledWeatherAlert.flow
  uip maestro flow format   ScheduledWeatherAlert.flow
  ```

  Iterate against `verify.sh` first. Only run `convert.sh` once verify is happy.
  Do NOT run flow debug.

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "ScheduledWeatherAlert.fil"
    weight: 1.0

  - type: file_exists
    description: "Bindings file exists"
    path: "bindings.json"
    weight: 1.0

  - type: run_command
    description: "FIL parses cleanly"
    command: "./parse-fil.sh ScheduledWeatherAlert.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "verify.sh dry-run succeeds"
    command: "./verify.sh"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "v2 to v1 conversion produces ScheduledWeatherAlert.flow"
    command: "./convert.sh ScheduledWeatherAlert"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Converted v1 .flow exists"
    path: "ScheduledWeatherAlert.flow"
    weight: 1.0

  - type: run_command
    description: "Converted .flow passes uip maestro flow validate"
    command: "uip maestro flow validate ScheduledWeatherAlert.flow"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow format succeeds"
    command: "uip maestro flow format ScheduledWeatherAlert.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow has scheduled trigger and hourly timer metadata"
    command: |
      python3 -c "
      import json
      f = json.load(open('ScheduledWeatherAlert.flow'))
      triggers = [n for n in f['nodes'] if str(n.get('type', '')).startswith('core.trigger.')]
      assert len(triggers) == 1, f'expected exactly one trigger, got {[(n.get(\"id\"), n.get(\"type\")) for n in triggers]}'
      t = triggers[0]
      assert t.get('type') == 'core.trigger.scheduled', f'not scheduled: {t.get(\"type\")}'
      inputs = t.get('inputs') or {}
      assert inputs.get('entryPointId'), 'missing entryPointId'
      assert inputs.get('timerType') == 'timeCycle', inputs
      assert inputs.get('timerPreset') == 'R/PT1H', inputs
      outputs = t.get('outputs') or {}
      assert (outputs.get('output') or {}).get('source') == '=result.response', outputs
      print('OK: scheduled trigger converted')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow has HTTP, script, decision, and complete definitions"
    command: |
      python3 -c "
      import json
      f = json.load(open('ScheduledWeatherAlert.flow'))
      types = [n.get('type', '') for n in f['nodes']]
      assert 'core.trigger.manual' not in types, 'manual trigger should not be used'
      assert any(t.startswith('core.action.http') for t in types), f'no HTTP node: {types}'
      required = {'core.action.script', 'core.logic.decision', 'core.control.end'}
      missing = required - set(types)
      assert not missing, f'missing node types: {missing}'
      used = set(types)
      defined = {d.get('nodeType', '') for d in f.get('definitions', [])}
      missing_defs = used - defined
      assert not missing_defs, f'missing definitions for: {missing_defs}'
      scheduled = [d for d in f.get('definitions', []) if d.get('nodeType') == 'core.trigger.scheduled']
      assert scheduled, 'missing scheduled trigger definition'
      model = scheduled[0].get('model') or {}
      assert model.get('type') == 'bpmn:StartEvent', model
      assert model.get('eventDefinition') == 'bpmn:TimerEventDefinition', model
      print('OK: structure and definitions present')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL source includes rawInputs timer fields and weather behavior markers"
    command: |
      python3 -c "
      content = open('ScheduledWeatherAlert.fil').read().lower()
      assert 'trigger scheduledstart' in content or 'core.trigger.scheduled' in content, 'no scheduled trigger declaration'
      assert 'rawinputs' in content, 'scheduled timer fields must be in rawInputs'
      assert 'timertype' in content and 'timecycle' in content, 'missing timeCycle'
      assert 'timerpreset' in content and 'r/pt1h' in content, 'missing hourly preset'
      assert 'open-meteo' in content or 'openmeteo' in content, 'missing open-meteo URL'
      assert '60' in content, 'missing 60F threshold'
      assert 'nice day' in content and 'jacket' in content, 'missing output messages'
      print('OK: FIL markers present')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow implements the scheduled weather-alert behavior"
    prompt: |
      Did the agent author a v2 FIL Flow that:
      (a) declares exactly one scheduled start trigger, not a manual trigger,
          with timer metadata in `rawInputs`;
      (b) fetches Bellevue weather via `core.action.http` from open-meteo;
      (c) extracts or otherwise reads the current temperature;
      (d) branches on whether temperature is greater than 60F;
      (e) produces exactly `{ message: "nice day" }` on the warm branch and
          `{ message: "bring a jacket" }` otherwise?

      Do not penalize minor FIL style choices. The scheduled trigger and the
      behavior are what matter.
    files:
      - "ScheduledWeatherAlert.fil"
    weight: 2.0
    pass_threshold: 0.7
