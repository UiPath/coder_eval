task_id: uipath-flow-v2-api-workflow-invocation
description: >
  Author a two-file Flow v2 project that invokes a published API Workflow
  process resource, branches on the dry-run fixture output, and converts
  cleanly to v1.
tags: [flow-v2, fil, generate, api-workflow, decision, mock, non-is-node]

run_limits:
  max_turns: 70
  turn_timeout: 1200
  task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  ignore_patterns:
    - "!dist"          # vendored flow-v2 JS toolchain (tools/*/dist/cli.js)
    - "!node_modules"  # vendored wabt runtime dep (tools/node_modules/wabt)
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2-process-resources"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"

initial_prompt: |
  Author a UiPath Flow v2 project named **ApiAgeLookup** in the current
  directory. Read `SKILL.md` first. Use the current two-file model:
  `ApiAgeLookup.fil` plus `bindings.json`. Do NOT create a
  `ApiAgeLookup.manifest.flow` sidecar.

  ## Scenario

  The flow invokes a published API Workflow that maps a name to an age, then
  branches on the returned age.

  Use this published API Workflow resource exactly:

  - Action type: `uipath.core.api-workflow.346b8959-c126-48d3-9c46-942abcf944d7@1.0.0`
  - Action id: `nameToAge`
  - Display label: `Name To Age`
  - Resource key: `Shared/test-darwin-apis.API Workflow`
  - API Workflow name binding id: `bApiName`
  - API Workflow name binding default: `API Workflow`
  - API Workflow folderPath binding id: `bApiFolder`
  - API Workflow folderPath binding default: `Shared/test-darwin-apis`
  - Runtime service type: `Orchestrator.ExecuteApiWorkflowAsync`
  - Resource sub type: `Api`
  - Orchestrator type: `api`
  - Section: `Published`

  ## Required FIL structure

  `ApiAgeLookup.fil` must include:

  - `flow api-age-lookup { name: "API Age Lookup", version: "1.0.0" };`
  - `trigger manualStart: start;`
  - `action nameToAge: uipath.core.api-workflow.346b8959-c126-48d3-9c46-942abcf944d7@1.0.0 { ... };`
  - mock actions named `adultRoute` and `minorRoute`
  - `async function main(): Promise<void> { ... }`

  The `nameToAge` action body must include:

  ```typescript
  label: "Name To Age",
  rawInputs: { name: "tomasz" },
  resource: {
    resource: "process",
    resourceSubType: "Api",
    resourceKey: "Shared/test-darwin-apis.API Workflow",
    orchestratorType: "api",
    serviceType: "Orchestrator.ExecuteApiWorkflowAsync",
    section: "Published",
  },
  resourceBindings: {
    name: "bApiName",
    folderPath: "bApiFolder",
  },
  outputs: {
    error: {
      type: "object",
      description: "Error information if the node fails",
      source: "=Error",
      var: "error",
    },
  },
  fixture: { response: { age: 42 } },
  ```

  In `main()`, invoke the API Workflow by action identifier:

  ```typescript
  const raw: string = await executeNode(nameToAge, JSON.stringify({
    name: "tomasz"
  }));
  ```

  Do not call `executeNode("nameToAge", ...)` by string literal.

  Parse the dry-run output as `{ "response": { "age": 42 } }`. If age is
  greater than or equal to 18, call `adultRoute`; otherwise call
  `minorRoute`.

  ## Required bindings.json

  `bindings.json` must include:

  - `bApiName`: `resource: "process"`, `resourceSubType: "Api"`,
    `resourceKey: "Shared/test-darwin-apis.API Workflow"`,
    `propertyAttribute: "name"`, `default: "API Workflow"`
  - `bApiFolder`: `resource: "process"`, `resourceSubType: "Api"`,
    `resourceKey: "Shared/test-darwin-apis.API Workflow"`,
    `propertyAttribute: "folderPath"`,
    `default: "Shared/test-darwin-apis"`

  ## Verifying your work

  ```bash
  ./parse-fil.sh ApiAgeLookup.fil
  ./verify.sh
  ./convert.sh ApiAgeLookup
  uip maestro flow validate ApiAgeLookup.flow
  uip maestro flow format ApiAgeLookup.flow
  ```

  Do not run `./verify.sh --live`; live API Workflow dispatch is intentionally
  unsupported until the direct Orchestrator path is confirmed.

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "ApiAgeLookup.fil"
    weight: 1.0

  - type: file_exists
    description: "Bindings exist"
    path: "bindings.json"
    weight: 1.0

  - type: run_command
    description: "No manifest sidecar was authored"
    command: "test ! -e ApiAgeLookup.manifest.flow"
    timeout: 5
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL parses cleanly"
    command: "./parse-fil.sh ApiAgeLookup.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL and bindings use the required API Workflow process-resource shape"
    command: "python3 $TASK_DIR/../shared/check_process_resource_flow.py --kind api --fil ApiAgeLookup.fil --bindings bindings.json"
    timeout: 10
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "flow-run dry-run passes with API Workflow process-resource preflight"
    command: "./verify.sh"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "v2 to v1 conversion succeeds"
    command: "./convert.sh ApiAgeLookup"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Converted v1 .flow exists"
    path: "ApiAgeLookup.flow"
    weight: 1.0

  - type: run_command
    description: "Converted .flow contains the required API Workflow node, definition, and bindings"
    command: "python3 $TASK_DIR/../shared/check_process_resource_flow.py --kind api --v1-flow ApiAgeLookup.flow"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow validates"
    command: "uip maestro flow validate ApiAgeLookup.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: "uip maestro flow format ApiAgeLookup.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow invokes the API Workflow and branches on response.age"
    prompt: |
      Did the agent author a two-file v2 Flow that:
      (a) declares the exact API Workflow action `nameToAge` in FIL;
      (b) uses resource/resourceBindings for an Orchestrator
          `ExecuteApiWorkflowAsync` process resource with
          `resourceSubType: "Api"`;
      (c) invokes `nameToAge` by action identifier, not a string;
      (d) uses the dry-run fixture `{ response: { age: 42 } }`;
      (e) branches on `response.age >= 18` to `adultRoute` or
          `minorRoute`;
      (f) converts to a valid v1 `.flow`?

      Score 1.0 if all six pieces are present. Subtract 0.15 per missing
      piece. If a manifest sidecar is required for the solution, cap at 0.4.
    files:
      - "ApiAgeLookup.fil"
      - "bindings.json"
      - "ApiAgeLookup.flow"
    weight: 3.0
    pass_threshold: 0.7
