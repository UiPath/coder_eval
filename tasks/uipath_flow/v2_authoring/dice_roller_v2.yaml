task_id: uipath-flow-v2-dice-roller
description: >
  v2 port of the dice-roller task: a single script node that simulates a
  six-sided die. The simplest reasonable v2 task — exercises FIL's script
  inlining (__script_<id> sync helper).
tags: [flow-v2, fil, generate, script]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 50
  turn_timeout: 900

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2"

initial_prompt: |
  Author a UiPath Flow v2 project named **DiceRoller** in the current
  directory. Read `SKILL.md` first — it describes the v2 file shape, FIL
  syntax, the manifest envelope, and the authoring loop using `verify.sh`.
  There is a worked example in `example/`.

  ## Scenario

  Simulate rolling a six-sided die. Output a random integer 1-6.

  **Important — replay safety:** `Math.random()` is non-deterministic, so
  it cannot live in an inlined `__script_<id>` helper (those run on every
  FIL replay; each replay would roll a different number and break the
  history). Instead, invoke a script node via `await executeNode(...)`,
  whose result is captured in history and reused on subsequent replays.
  See SKILL.md → "Non-deterministic calls must go through executeNode."

  Pattern:

  ```typescript
  async function main(): Promise<void> {
    const rolledRaw: string = await executeNode("roll", "{}");
    // rolledRaw is preserved in history; replays see the same value.
  }
  ```

  In the manifest, `roll` is a `core.action.script@1.0.0` node whose
  `rawInputs.script` body is the random expression
  (e.g. `return Math.floor(Math.random() * 6) + 1;`).

  ## Files to write (project root)

  - `DiceRoller.fil.ts`         FIL source
  - `DiceRoller.manifest.flow`  Manifest
  - `bindings.json`             Connection IDs (empty array — no connectors)

  ## Authoring loop

  ```bash
  ./verify.sh                            # compile + binding check; runs the script
  ./convert.sh DiceRoller                # writes DiceRoller.flow
  uip maestro flow validate DiceRoller.flow
  uip maestro flow tidy DiceRoller.flow
  ```

  flow-run will execute the `roll` script node and store its result in
  `.flow-run/decisions.json` so you can confirm it produced an integer 1-6.

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "DiceRoller.fil.ts"
    weight: 1.0
  - type: file_exists
    description: "Manifest exists"
    path: "DiceRoller.manifest.flow"
    weight: 1.0
  - type: file_exists
    description: "Bindings file exists"
    path: "bindings.json"
    weight: 1.0
  - type: run_command
    description: "FIL compiles"
    command: "./parse-fil.sh DiceRoller.fil.ts"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "verify.sh dry-run succeeds"
    command: "./verify.sh"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "v2 → v1 conversion succeeds"
    command: "./convert.sh DiceRoller"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "Converted .flow validates"
    command: "uip maestro flow validate DiceRoller.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "tidy succeeds"
    command: "uip maestro flow tidy DiceRoller.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: llm_judge
    description: "Flow implements a replay-safe six-sided die roll"
    prompt: |
      Two things matter:

      1. The flow simulates a fair six-sided die — produces a uniformly
         distributed integer in {1,2,3,4,5,6}. Any algebraically correct
         formula counts (e.g. `Math.floor(Math.random() * 6) + 1`,
         `Math.ceil(Math.random() * 6)`, etc.). Don't penalize stylistic
         choices.

      2. **Replay safety**: the random call lives in a script node
         invoked via `await executeNode("...", ...)`, NOT inside an
         inlined `__script_<id>` helper. The FIL must look like:

         ```typescript
         async function main(): Promise<void> {
           const rolledRaw: string = await executeNode("roll", "{}");
         }
         ```

         and the manifest's `roll` node has `type:
         core.action.script@1.0.0` with `rawInputs.script` containing the
         random expression.

         If `Math.random()` is inside a `function __script_<id>():
         json { ... }` helper that is *called* (not awaited) from main(),
         that's replay-broken — score this criterion ≤ 0.4.

      Scoring:
        • 1.0 if both: correct 1-6 die AND replay-safe (executeNode wrapper).
        • 0.5 if the die is correct but the random call is in an inlined
          script helper (replay-unsafe).
        • 0.3 if the die range is wrong but at least the structure is right.
        • 0   if no random output at all.

      The FIL source and manifest are included below.
    files:
      - "DiceRoller.fil.ts"
      - "DiceRoller.manifest.flow"
    weight: 2.0
    pass_threshold: 0.7
