task_id: uipath-flow-v2-calculator
description: >
  v2 port of the calculator task: takes two numeric inputs (a, b),
  multiplies them, returns the result. Tests FIL's input-variable handling
  (`async function main(a: i32, b: i32)` becomes v1 `in` flow variables)
  plus script multiplication.
tags: [flow-v2, fil, generate, script, variables]

run_limits:
  max_turns: 50
  turn_timeout: 900

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  ignore_patterns:
    - "!dist"          # vendored flow-v2 JS toolchain (tools/*/dist/cli.js)
    - "!node_modules"  # vendored wabt runtime dep (tools/node_modules/wabt)
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"

initial_prompt: |
  Author a UiPath Flow v2 project named **Calculator** in the current
  directory. Read `SKILL.md` first — it describes the v2 file shape, FIL
  syntax (including the top-level `flow`/`action`/`trigger` declarations),
  and the authoring loop using `verify.sh`. There is a worked example in
  `example/`.

  ## Scenario

  Take two numeric inputs `a` and `b`, multiply them, return the result.

  Two things must be true in the FIL source:

  1. `a` and `b` must be **declared** so they end up as v1 flow variables.
     Per SKILL.md, the simplest way is to make them parameters on `main()`:
     ```typescript
     async function main(a: f64, b: f64): Promise<void> { … }
     ```
     `let a: f64 = 0;` / `let b: f64 = 0;` at function scope also works
     (becomes `inout` flow variables instead of `in`); either is fine.

  2. The multiplication itself goes inside a `__script_<id>` sync helper.
     Its body is the v1 script expression — for variables declared via
     `main()` parameters or `let`, that's
     `$vars.start.output.a * $vars.start.output.b` (or, if you used
     `let` at function scope, `$vars.a * $vars.b`).

  ## Files to write (project root)

  - `Calculator.fil`        FIL source (carries the flow/action declarations)
  - `bindings.json`         Empty bindings array

  ## Authoring loop

  ```bash
  ./verify.sh                            # compile + binding check
  ./convert.sh Calculator                # writes Calculator.flow
  uip maestro flow validate Calculator.flow
  uip maestro flow format Calculator.flow
  ```

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "Calculator.fil"
    weight: 1.0
  - type: file_exists
    description: "Bindings file exists"
    path: "bindings.json"
    weight: 1.0
  - type: run_command
    description: "FIL compiles"
    command: "./parse-fil.sh Calculator.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "verify.sh dry-run succeeds"
    command: "./verify.sh"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "v2 → v1 conversion succeeds"
    command: "./convert.sh Calculator"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "Converted .flow validates"
    command: "uip maestro flow validate Calculator.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "format succeeds"
    command: "uip maestro flow format Calculator.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: run_command
    description: "Converted flow declares `a` and `b` as flow variables"
    command: |
      python3 -c "
      import json
      f = json.load(open('Calculator.flow'))
      v = f.get('variables', {}) or {}
      pool = (v.get('globals') or []) + (v.get('inputs') or []) + (v.get('nodes') or [])
      ids = {x.get('id') or x.get('name') for x in pool}
      assert 'a' in ids and 'b' in ids, f'expected a,b among flow variables; got {ids}'
      print(f'OK: a,b present in {sorted(ids)}')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: llm_judge
    description: "Flow multiplies a and b"
    prompt: |
      Does the flow compute the product of two numeric inputs `a` and `b`?

      Score 1.0 if:
        • `a` and `b` are declared as flow variables (any of: parameters
          on main(), `let` declarations at function scope, or a typed
          `const` — all become v1 flow variables per SKILL.md), AND
        • a `__script_<id>` helper (or the script-node entry directly)
          multiplies them, e.g.
          `$vars.start.output.a * $vars.start.output.b` or
          `$vars.a * $vars.b`.

      Don't penalize the choice between parameters vs `let` — both
      produce flow variables; the v1 difference is `in` vs `inout`
      direction, which doesn't affect "the flow multiplies them."

      Score 0.5 if multiplication is present but `a`/`b` aren't declared
      as flow variables (e.g. hardcoded constants).

      Score 0 if the flow doesn't multiply.

      The FIL source is included below.
    files:
      - "Calculator.fil"
    weight: 2.0
    pass_threshold: 0.7
