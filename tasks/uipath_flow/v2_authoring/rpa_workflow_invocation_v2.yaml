task_id: uipath-flow-v2-rpa-workflow-invocation
description: >
  Author a two-file Flow v2 project that invokes a published RPA Workflow
  process resource, branches on the dry-run fixture output, and converts
  cleanly to v1.
tags: [flow-v2, fil, generate, rpa-workflow, decision, mock, non-is-node]

run_limits:
  max_turns: 70
  turn_timeout: 1200
  task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2-process-resources"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"

initial_prompt: |
  Author a UiPath Flow v2 project named **RpaWorkflowGate** in the current
  directory. Read `SKILL.md` first. Use the current two-file model:
  `RpaWorkflowGate.fil` plus `bindings.json`. Do NOT create a
  `RpaWorkflowGate.manifest.flow` sidecar.

  ## Scenario

  The flow invokes a published RPA Workflow process, then branches based on
  the returned job id.

  Use this published RPA Workflow resource exactly:

  - Action type: `uipath.core.rpa-workflow.7648307a-b180-467c-81f3-06f49a87313b@1.0.0`
  - Action id: `runRobot`
  - Display label: `RPA Workflow12Feb`
  - Resource key: `Shared/sol_with_all_projects.RPA Workflow12Feb`
  - RPA Workflow name binding id: `bRpaName`
  - RPA Workflow name binding default: `RPA Workflow12Feb`
  - RPA Workflow folderPath binding id: `bRpaFolder`
  - RPA Workflow folderPath binding default: `Shared/sol_with_all_projects`
  - Runtime service type: `Orchestrator.StartJob`
  - Resource sub type: `Process`
  - Orchestrator type: `process`
  - Section: `Published`

  ## Required FIL structure

  `RpaWorkflowGate.fil` must include:

  - `flow rpa-workflow-gate { name: "RPA Workflow Gate", version: "1.0.0" };`
  - `trigger manualStart: start;`
  - `action runRobot: uipath.core.rpa-workflow.7648307a-b180-467c-81f3-06f49a87313b@1.0.0 { ... };`
  - mock actions named `robotStarted` and `robotEscalated`
  - `async function main(): Promise<void> { ... }`

  The `runRobot` action body must include:

  ```typescript
  label: "RPA Workflow12Feb",
  rawInputs: { newArgument: "" },
  resource: {
    resource: "process",
    resourceSubType: "Process",
    resourceKey: "Shared/sol_with_all_projects.RPA Workflow12Feb",
    orchestratorType: "process",
    serviceType: "Orchestrator.StartJob",
    section: "Published",
  },
  resourceBindings: {
    name: "bRpaName",
    folderPath: "bRpaFolder",
  },
  outputs: {
    error: {
      type: "object",
      description: "Error information if the node fails",
      source: "=Error",
      var: "error",
    },
  },
  fixture: { output: { jobId: "dry-run-job" } },
  ```

  In `main()`, invoke the RPA Workflow by action identifier:

  ```typescript
  const raw: string = await executeNode(runRobot, JSON.stringify({
    newArgument: ""
  }));
  ```

  Do not call `executeNode("runRobot", ...)` by string literal.

  Parse the dry-run output as `{ "output": { "jobId": "dry-run-job" } }`.
  If `output.jobId` is not an empty string, call `robotStarted`; otherwise
  call `robotEscalated`.

  ## Required bindings.json

  `bindings.json` must include:

  - `bRpaName`: `resource: "process"`, `resourceSubType: "Process"`,
    `resourceKey: "Shared/sol_with_all_projects.RPA Workflow12Feb"`,
    `propertyAttribute: "name"`, `default: "RPA Workflow12Feb"`
  - `bRpaFolder`: `resource: "process"`, `resourceSubType: "Process"`,
    `resourceKey: "Shared/sol_with_all_projects.RPA Workflow12Feb"`,
    `propertyAttribute: "folderPath"`,
    `default: "Shared/sol_with_all_projects"`

  ## Verifying your work

  ```bash
  ./parse-fil.sh RpaWorkflowGate.fil
  ./verify.sh
  ./convert.sh RpaWorkflowGate
  uip maestro flow validate RpaWorkflowGate.flow
  uip maestro flow format RpaWorkflowGate.flow
  ```

  Do not run `./verify.sh --live`; live RPA Workflow dispatch is intentionally
  unsupported until the direct Orchestrator path is confirmed.

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "RpaWorkflowGate.fil"
    weight: 1.0

  - type: file_exists
    description: "Bindings exist"
    path: "bindings.json"
    weight: 1.0

  - type: run_command
    description: "No manifest sidecar was authored"
    command: "test ! -e RpaWorkflowGate.manifest.flow"
    timeout: 5
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL parses cleanly"
    command: "./parse-fil.sh RpaWorkflowGate.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL and bindings use the required RPA Workflow process-resource shape"
    command: "python3 $TASK_DIR/../shared/check_process_resource_flow.py --kind rpa --fil RpaWorkflowGate.fil --bindings bindings.json"
    timeout: 10
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "flow-run dry-run passes with RPA Workflow process-resource preflight"
    command: "./verify.sh"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "v2 to v1 conversion succeeds"
    command: "./convert.sh RpaWorkflowGate"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Converted v1 .flow exists"
    path: "RpaWorkflowGate.flow"
    weight: 1.0

  - type: run_command
    description: "Converted .flow contains the required RPA Workflow node, definition, and bindings"
    command: "python3 $TASK_DIR/../shared/check_process_resource_flow.py --kind rpa --v1-flow RpaWorkflowGate.flow"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow validates"
    command: "uip maestro flow validate RpaWorkflowGate.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: "uip maestro flow format RpaWorkflowGate.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow invokes the RPA Workflow and branches on output.jobId"
    prompt: |
      Did the agent author a two-file v2 Flow that:
      (a) declares the exact RPA Workflow action `runRobot` in FIL;
      (b) uses resource/resourceBindings for an Orchestrator `StartJob`
          process resource with `resourceSubType: "Process"`;
      (c) invokes `runRobot` by action identifier, not a string;
      (d) uses the dry-run fixture `{ output: { jobId: "dry-run-job" } }`;
      (e) branches on `output.jobId` being present/non-empty to
          `robotStarted` or `robotEscalated`;
      (f) converts to a valid v1 `.flow`?

      Score 1.0 if all six pieces are present. Subtract 0.15 per missing
      piece. If a manifest sidecar is required for the solution, cap at 0.4.
    files:
      - "RpaWorkflowGate.fil"
      - "bindings.json"
      - "RpaWorkflowGate.flow"
    weight: 3.0
    pass_threshold: 0.7
