task_id: uipath-flow-v2-library-daily-digest
description: >
  Library-discovery comparison task. Same authoring shape as the other v2
  tasks, but the agent is steered to discover connector node types and
  input schemas via the shared markdown library at `$FLOW_V2_LIBRARY_MD`
  (populated once by the `uipath-flow-v2-setup-library` task) instead of
  `uip maestro flow registry`.
  Scenario uses four connectors + HTTP so the discovery loop is exercised
  several times. Pair this against an equivalent registry-CLI task to
  measure the impact of in-template discovery.
tags: [flow-v2, fil, library, multi-connector, generate]

run_limits:
  max_turns: 80
  turn_timeout: 1500
  task_timeout: 1500

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2-library"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"

initial_prompt: |
  Author a UiPath Flow v2 project named **DailyDigest** in the current
  directory. Read `SKILL.md` first — it describes the v2 file shape, FIL
  syntax, the binding requirements, and (importantly) how to discover
  connector metadata from the **shared markdown library at `$FLOW_V2_LIBRARY_MD` directory**.

  ## Scenario

  A daily standup digest for an engineering team. Each morning the flow:

  1. Searches Jira for issues currently in flight on project `MAESTRO`
     (status = `In Progress`, sorted by recently updated). Use the
     **search-issues-by-jql** action with a JQL string.
  2. Fetches the latest 5 commits on the `main` branch of
     `https://api.github.com/repos/UiPath/coder_eval/commits?sha=main&per_page=5`
     via `core.action.http` (no auth needed at this rate; the public API
     allows 60 req/hr unauthenticated).
  3. Reads the most-recent page from the team's Confluence space using the
     **search-content** action. CQL: `space = "ENG" AND lastModified >= now("-1d")`.
  4. Formats the three results into a markdown digest in a `script` action
     (see SKILL.md → "Script-action calling convention" — read prior node
     outputs via `\$vars.<nodeId>.output.<...>`).
  5. **Fan-out** of the formatted digest:
     - **Outlook**: `send-email` to `team@example.com`, subject
       `"[Standup] {today's date}"`, HTML body = the formatted digest.
     - **Slack**: `send-message-to-channel` to `#eng-standup`, body =
       the formatted digest.

  ## Connector discovery — use the bundled library, NOT the CLI

  The connector library is bundled at `$FLOW_V2_LIBRARY_MD`. Discover the
  NodeTypes and input schemas from there:

  ```bash
  # Find the Jira ops:
  jq '.entries[] | select(.connectorKey == "uipath-atlassian-jira") | {nodeType, label}' "$FLOW_V2_LIBRARY_MD/index.json"

  # Read an op's input schema:
  jq '.inputSchema.fields[] | {name, type, required, description}' \
    "$FLOW_V2_LIBRARY_MD/uipath-atlassian-jira/search-issues-by-jql@1.0.0.md"
  ```

  Do not call `uip maestro flow registry`. The bundled library has the
  same data, faster.

  ## Files to write (project root, not under `example/`)

  - `DailyDigest.fil`     FIL source — top-level `flow` / `trigger` /
                          `action` declarations + `main()` body.
  - `bindings.json`       Connection IDs. Stub UUIDs (`00000000-...`) are
                          fine **only as scaffolding while iterating**.
                          The task is NOT done until every `resourceKey`
                          and `default` is a real connection ID from
                          your tenant. Look up the values upfront with:
                          ```bash
                          uip is connections list --output-filter "[*].{Id:Id,ConnectorKey:ConnectorKey,FolderKey:FolderKey,Name:Name}"
                          ```
                          `--output-filter` is a JMESPath applied directly
                          to `.Data` (so `[*]` / `[?…]`, not `Data[*]`).
                          Match each binding's `propertyAttribute`
                          (`ConnectionId` or `FolderKey`) to the matching
                          column. `verify.sh` refuses to pass while any
                          stubs remain.

  ## Verifying your work

  ```bash
  ./parse-fil.sh DailyDigest.fil
  ./verify.sh                            # flow-run --dry-run: validates
                                          # bindings + library lookups,
                                          # lists what would dispatch.
  ./convert.sh DailyDigest                # v2 → v1
  uip maestro flow validate DailyDigest.flow
  uip maestro flow tidy DailyDigest.flow
  ```

  Iterate against `verify.sh` first — its errors are more actionable than
  `uip maestro flow validate`'s.

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "DailyDigest.fil"
    weight: 1.0
  - type: file_exists
    description: "Bindings exist"
    path: "bindings.json"
    weight: 1.0
  - type: run_command
    description: "FIL parses cleanly"
    command: "./parse-fil.sh DailyDigest.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "verify.sh dry-run succeeds"
    command: "./verify.sh"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "v2 → v1 conversion succeeds"
    command: "./convert.sh DailyDigest"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: file_exists
    description: "v1 .flow exists"
    path: "DailyDigest.flow"
    weight: 1.0
  - type: run_command
    description: "v1 .flow validates"
    command: "uip maestro flow validate DailyDigest.flow"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "tidy succeeds"
    command: "uip maestro flow tidy DailyDigest.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: run_command
    description: "v1 .flow uses Jira, HTTP/GitHub, Confluence, Outlook, Slack"
    command: |
      python3 -c "
      import json
      f = json.load(open('DailyDigest.flow'))
      all_nodes = list(f.get('nodes', []))
      for s in f.get('subflows', {}).values():
          all_nodes.extend(s.get('nodes', []))
      types = [n.get('type', '') for n in all_nodes]
      blob = json.dumps(f)
      assert any(t.startswith('core.action.http') for t in types), f'no HTTP node: {types}'
      assert 'api.github.com' in blob, 'GitHub API URL not in flow'
      assert any('uipath-atlassian-jira' in t for t in types), f'no Jira node: {types}'
      assert any('uipath-atlassian-confluence' in t for t in types), f'no Confluence node: {types}'
      assert any('uipath-microsoft-outlook365' in t for t in types), f'no Outlook node: {types}'
      assert any('uipath-salesforce-slack' in t for t in types), f'no Slack node: {types}'
      print('all five required pieces present')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: llm_judge
    description: "Flow implements the described daily-digest behavior"
    prompt: |
      Did the agent author a v2 Flow that:
      (a) searches Jira via `search-issues-by-jql` for in-progress issues
          on the MAESTRO project,
      (b) fetches recent GitHub commits via an HTTP node pointing at
          `https://api.github.com/repos/UiPath/coder_eval/commits`,
      (c) reads recent Confluence pages via `search-content`,
      (d) formats the three results into a digest (via a script node or
          inline string composition),
      (e) sends the digest via both Outlook (`send-email`) and Slack
          (`send-message-to-channel`)?

      Don't penalize stylistic choices — JQL phrasing, exact CQL filter,
      script vs. inline formatting, fan-out order. The five connectors +
      HTTP must all be present and each used for its stated purpose.

      The FIL source is included below.
    files:
      - "DailyDigest.fil"
    weight: 2.0
    pass_threshold: 0.7
