task_id: uipath-flow-v2-queue
description: >
  Author a two-file Flow v2 FIL project that invokes OOTB Orchestrator Queue
  create and create-and-wait actions with queue resource bindings, dry-runs
  with fixtures, and converts cleanly to v1.
tags: [flow-v2, fil, generate, queue, orchestrator, data-operations, non-is-node]

run_limits:
  max_turns: 80
  turn_timeout: 1200
  task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"
      include_patterns:
        - "tools/*/dist"
        - "tools/*/dist/**"

pre_run:
  - command: "mkdir -p .flow-v2-library-json && printf '{\"version\":1,\"entries\":[]}\n' > .flow-v2-library-json/index.json && (cd tools && npm ci --omit=dev)"
    timeout: 120

initial_prompt: |
  Author a UiPath Flow v2 project named **QueueOperationsDemo** in the
  current directory. Read `SKILL.md` first. Use the current two-file model:
  `QueueOperationsDemo.fil` plus `bindings.json`. Do NOT create a
  `QueueOperationsDemo.manifest.flow` sidecar.

  Task-specific override: Queue create/create-and-wait are OOTB Orchestrator
  actions that are intentionally not available from the local Flow node
  registry in this sandbox yet. Do NOT run `uip tools update`,
  `uip maestro flow registry pull`, or registry `get/search` commands to
  discover them. Use the FIL action shape below and the local Flow v2
  verifier/converter.

  ## Scenario

  The flow starts manually, creates one queue item, creates a second queue item
  and waits for processing, and returns both Queue action responses.

  Use this queue resource:

  ```json
  { "name": "InvoiceProcessingQueue", "folderPath": "Shared", "key": "queue-key-001" }
  ```

  ## Required FIL structure

  `QueueOperationsDemo.fil` must include:

  - `flow queue-operations-demo { name: "Queue Operations Demo", version: "1.0.0" };`
  - `trigger manualStart: start;`
  - `action enqueueInvoice: core.action.queue.create@1.0 { ... };`
  - `action processInvoiceAndWait: core.action.queue.create-and-wait@1.0 { ... };`
  - `async function main(): Promise<json> { ... }`

  The `enqueueInvoice` action body must include:

  ```typescript
  label: "Enqueue Invoice",
  resource: {
    resource: "queue",
    resourceKey: "queue-key-001",
    serviceType: "Orchestrator.CreateQueueItem",
  },
  resourceBindings: { name: "bQueueName", folderPath: "bQueueFolder" },
  rawInputs: {
    queue: { name: "InvoiceProcessingQueue", folderPath: "Shared", key: "queue-key-001" },
    itemData: { invoiceId: "INV-1001", amount: 123.45, source: "flow-v2-eval" },
    priority: "High",
    reference: "INV-1001",
    deferDate: "",
    dueDate: "2026-06-01T17:00:00Z",
  },
  outputs: {
    output: { type: "object", source: "=response", var: "output" },
    error: { type: "object", source: "=Error", var: "error" },
  },
  fixture: { Id: "dry-run-queue-item", Status: "New", Reference: "INV-1001" },
  ```

  The `processInvoiceAndWait` action body must include the same queue resource,
  resource bindings, outputs, and queue input, except:

  ```typescript
  label: "Process Invoice And Wait",
  resource: {
    resource: "queue",
    resourceKey: "queue-key-001",
    serviceType: "Orchestrator.CreateAndWaitForQueueItem",
  },
  rawInputs: {
    queue: { name: "InvoiceProcessingQueue", folderPath: "Shared", key: "queue-key-001" },
    itemData: { invoiceId: "INV-1002", amount: 987.65, needsResult: true },
    priority: "Normal",
    reference: "INV-1002",
    deferDate: "",
    dueDate: "2026-06-02T17:00:00Z",
  },
  fixture: { Id: "dry-run-processed-item", Status: "Successful", Output: { approved: true } },
  ```

  Important wire-shape requirements:

  - The node types are `core.action.queue.create@1.0` and
    `core.action.queue.create-and-wait@1.0`, not `1.0.0`.
  - Queue actions use `resource` and `resourceBindings`; do not use connector
    `binding`, `folderBinding`, `ConnectionId`, `FolderKey`, or process
    `resourceSubType` metadata.
  - `rawInputs.itemData` may be authored as an object in FIL. The converter
    serializes it to the v1 `inputs.itemData` JSON string.
  - Do not create or copy embedded definition blobs.

  In `main()`, invoke both Queue actions by action identifier:

  ```typescript
  const createdRaw: string = await executeNode(enqueueInvoice, "{}");
  const processedRaw: string = await executeNode(processInvoiceAndWait, "{}");
  return ({
    created: JSON.parse(createdRaw),
    processed: JSON.parse(processedRaw),
  });
  ```

  Do not call `executeNode("enqueueInvoice", ...)` or
  `executeNode("processInvoiceAndWait", ...)` by string literal.

  ## Required bindings.json

  `bindings.json` must be present and must contain the two Queue resource
  bindings referenced by `resourceBindings`:

  ```json
  {
    "schemaVersion": "1",
    "bindings": [
      {
        "id": "bQueueName",
        "name": "name",
        "type": "string",
        "resource": "queue",
        "resourceKey": "queue-key-001",
        "default": "InvoiceProcessingQueue",
        "propertyAttribute": "name"
      },
      {
        "id": "bQueueFolder",
        "name": "folderPath",
        "type": "string",
        "resource": "queue",
        "resourceKey": "queue-key-001",
        "default": "Shared",
        "propertyAttribute": "folderPath"
      }
    ]
  }
  ```

  ## Verifying your work

  The sandbox has a local empty JSON library at `.flow-v2-library-json`
  because this task uses only the OOTB Queue nodes, not connector definitions.
  Use that local library for `verify.sh` and `convert.sh`. Do not run
  `setup-library.sh`.

  ```bash
  ./parse-fil.sh QueueOperationsDemo.fil
  FLOW_V2_LIBRARY_JSON="$PWD/.flow-v2-library-json" ./verify.sh
  FLOW_V2_LIBRARY_JSON="$PWD/.flow-v2-library-json" ./convert.sh QueueOperationsDemo
  uip maestro flow validate QueueOperationsDemo.flow
  uip maestro flow format QueueOperationsDemo.flow
  ```

  Do not run `./verify.sh --live`; live Queue dispatch is intentionally
  unsupported in Flow v2 for this task.

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "QueueOperationsDemo.fil"
    weight: 1.0

  - type: file_exists
    description: "Bindings exist"
    path: "bindings.json"
    weight: 1.0

  - type: run_command
    description: "No manifest sidecar was authored"
    command: "test ! -e QueueOperationsDemo.manifest.flow"
    timeout: 5
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL parses cleanly"
    command: "./parse-fil.sh QueueOperationsDemo.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "flow-run dry-run passes with Queue fixtures"
    command: 'FLOW_V2_LIBRARY_JSON="$PWD/.flow-v2-library-json" ./verify.sh'
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "v2 to v1 conversion succeeds"
    command: 'FLOW_V2_LIBRARY_JSON="$PWD/.flow-v2-library-json" ./convert.sh QueueOperationsDemo'
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Converted v1 .flow exists"
    path: "QueueOperationsDemo.flow"
    weight: 1.0

  - type: run_command
    description: "Converted .flow contains the required Queue shape and validates"
    command: "python3 $TASK_DIR/../shared/check_queue_flow.py --fil QueueOperationsDemo.fil --converted-flow QueueOperationsDemo.flow"
    timeout: 90
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow validates"
    command: "uip maestro flow validate QueueOperationsDemo.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: "uip maestro flow format QueueOperationsDemo.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow invokes Queue create and create-and-wait with queue resource bindings"
    prompt: |
      Did the agent author a two-file v2 Flow that:
      (a) declares the exact Queue actions `enqueueInvoice:
          core.action.queue.create@1.0` and `processInvoiceAndWait:
          core.action.queue.create-and-wait@1.0` in FIL;
      (b) includes `bindings.json` Queue resource bindings `bQueueName` and
          `bQueueFolder` using `resource: "queue"` and
          `resourceKey: "queue-key-001"`;
      (c) gives both action declarations the required `resource` and
          `resourceBindings` metadata wired to those binding ids;
      (d) sets each action's `rawInputs.queue`, object `rawInputs.itemData`,
          priority, reference, deferDate, and dueDate exactly as requested;
      (e) invokes both Queue actions by action identifier, not string literal;
      (f) returns `created` and `processed` from the Queue action outputs;
      (g) converts to a valid v1 `.flow` with no
          `QueueOperationsDemo.manifest.flow` sidecar?

      Important grading notes:
      - `bindings.json` is the required second file in the Flow v2 two-file
        model. Do not treat `bindings.json` as a manifest sidecar.
      - Queue actions use `resource` and `resourceBindings`, not connector
        bindings or process `resourceSubType` metadata.
      - FIL may keep `itemData` as an object; the converter should serialize it
        to a v1 JSON string.

      Score 1.0 if all seven pieces are present. Subtract 0.12 per missing
      piece. If the solution uses connector/process bindings instead of Queue
      resource bindings, cap at 0.5. If a manifest sidecar is required, cap at
      0.4.
    files:
      - "QueueOperationsDemo.fil"
      - "bindings.json"
      - "QueueOperationsDemo.flow"
    weight: 3.0
    pass_threshold: 0.7
