task_id: uipath-flow-hitl-quickform-v2
description: >
  Author a two-file Flow v2 FIL project with a HITL quickform approval node,
  downstream decision, dry-run fixture, and clean v1 conversion.
tags: [flow-v2, fil, generate, hitl, quickform, decision, mock, non-is-node]

run_limits:
  max_turns: 70
  turn_timeout: 1200
  task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"

initial_prompt: |
  Author a UiPath Flow v2 project named **ExpenseApprovalHitl** in the
  current directory. Read `SKILL.md` first. Use the current two-file model:
  `ExpenseApprovalHitl.fil` plus `bindings.json`. Do NOT create an
  `ExpenseApprovalHitl.manifest.flow` sidecar.

  ## Scenario

  A manager reviews an expense in an Action Center HITL quickform. The form
  shows the amount as read-only input, then captures approval and comments.
  The flow branches after the human task completes.

  ## Required FIL structure

  `ExpenseApprovalHitl.fil` must include:

  - `flow expense-approval-hitl { name: "Expense Approval HITL", version: "1.0.0" };`
  - `trigger manualStart: start;`
  - `action reviewExpense: uipath.human-in-the-loop@1.0 { ... };`
  - mock actions named `approvedRoute` and `rejectedRoute`
  - `async function main(): Promise<void> { ... }`

  The `reviewExpense` action body must include:

  ```typescript
  label: "Review Expense",
  rawInputs: {
    type: "quick",
    schema: {
      schemaId: "11111111-2222-3333-4444-555555555555",
      fields: [
        {
          id: "amount",
          label: "Amount",
          type: "number",
          direction: "input",
          binding: "vars.manualStart.output.amount",
        },
        {
          id: "approved",
          label: "Approved",
          type: "boolean",
          direction: "output",
          variable: "vars.approved",
        },
        {
          id: "comments",
          label: "Comments",
          type: "text",
          direction: "output",
          variable: "vars.comments",
        },
      ],
      outcomes: [
        { id: "approve", name: "Approve", type: "string", isPrimary: true, action: "Continue" },
        { id: "reject", name: "Reject", type: "string", isPrimary: false, action: "Continue" },
      ],
    },
    recipient: {
      channels: ["ActionCenter"],
      connections: {},
      assignee: { type: "group" },
    },
    priority: "Low",
  },
  outputs: {
    output: {
      type: "object",
      description: "Task result data",
      source: "=result",
      var: "output",
      properties: {
        approved: { type: "boolean" },
        comments: { type: "string" },
        Action: {
          type: "string",
          enum: ["Approve", "Reject"],
          default: "Approve",
        },
      },
    },
    status: {
      type: "string",
      description: "Task completion status",
      source: "=result.Action",
      var: "status",
      enum: ["Approve", "Reject"],
      default: "Approve",
    },
  },
  fixture: { approved: true, comments: "Looks good", Action: "Approve" },
  ```

  In `main()`, invoke the HITL quickform by action identifier:

  ```typescript
  const raw: string = await executeNode(reviewExpense, "{}");
  ```

  Do not call `executeNode("reviewExpense", ...)` by string literal.

  Parse the dry-run output as
  `{ "approved": true, "comments": "Looks good", "Action": "Approve" }`.
  If `approved` is true, call `approvedRoute`; otherwise call
  `rejectedRoute`.

  ## Required bindings.json

  `bindings.json` must be present and may use an empty bindings array:

  ```json
  {
    "schemaVersion": "1",
    "bindings": []
  }
  ```

  ## Verifying your work

  ```bash
  ./parse-fil.sh ExpenseApprovalHitl.fil
  ./verify.sh
  ./convert.sh ExpenseApprovalHitl
  uip maestro flow validate ExpenseApprovalHitl.flow
  uip maestro flow format ExpenseApprovalHitl.flow
  ```

  Do not run `./verify.sh --live`; live Action Center dispatch is
  intentionally unsupported in Flow v2 for this task.

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "ExpenseApprovalHitl.fil"
    weight: 1.0

  - type: file_exists
    description: "Bindings exist"
    path: "bindings.json"
    weight: 1.0

  - type: run_command
    description: "No manifest sidecar was authored"
    command: "test ! -e ExpenseApprovalHitl.manifest.flow"
    timeout: 5
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL parses cleanly"
    command: "./parse-fil.sh ExpenseApprovalHitl.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "flow-run dry-run passes with the HITL fixture"
    command: "./verify.sh"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "v2 to v1 conversion succeeds"
    command: "./convert.sh ExpenseApprovalHitl"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Converted v1 .flow exists"
    path: "ExpenseApprovalHitl.flow"
    weight: 1.0

  - type: run_command
    description: "Converted .flow contains the required HITL quickform shape and validates"
    command: "python3 $TASK_DIR/../shared/check_hitl_quickform_flow.py --fil ExpenseApprovalHitl.fil --converted-flow ExpenseApprovalHitl.flow"
    timeout: 90
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow validates"
    command: "uip maestro flow validate ExpenseApprovalHitl.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: "uip maestro flow format ExpenseApprovalHitl.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow uses a HITL quickform and branches on approval"
    prompt: |
      Did the agent author a two-file v2 Flow that:
      (a) declares the exact HITL quickform action `reviewExpense` in FIL;
      (b) includes quickform rawInputs, output fields `approved` and
          `comments`, and outcomes `Approve` and `Reject`;
      (c) invokes `reviewExpense` by action identifier, not a string;
      (d) uses the dry-run fixture
          `{ approved: true, comments: "Looks good", Action: "Approve" }`;
      (e) branches true approval to `approvedRoute` and rejection to
          `rejectedRoute`;
      (f) converts to a valid v1 `.flow`?

      Score 1.0 if all six pieces are present. Subtract 0.15 per missing
      piece. If a manifest sidecar is required for the solution, cap at 0.4.
    files:
      - "ExpenseApprovalHitl.fil"
      - "bindings.json"
      - "ExpenseApprovalHitl.flow"
    weight: 3.0
    pass_threshold: 0.7
