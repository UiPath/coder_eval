task_id: uipath-flow-v2-inline-agent
description: >
  Author a Flow v2 FIL project that invokes an inline low-code UiPath Agent,
  keeps the Agent sidecar beside the v2 files, and converts cleanly to v1
  without copying an embedded v1 definition blob or authoring a manifest.
tags: [flow-v2, fil, generate, agent, inline-agent, non-is-node]

run_limits:
  max_turns: 80
  turn_timeout: 1200
  task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  ignore_patterns:
    - "!dist"          # vendored flow-v2 JS toolchain (tools/*/dist/cli.js)
    - "!node_modules"  # vendored wabt runtime dep (tools/node_modules/wabt)
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"

initial_prompt: |
  Author a UiPath Flow v2 project named **InlineAgentReply** in the current
  directory. Read `SKILL.md` first. Use the current FIL model:
  `InlineAgentReply.fil` plus `bindings.json`, with the inline Agent sidecar
  folder beside those files. Do NOT create an `InlineAgentReply.manifest.flow`
  sidecar.

  ## Scenario

  The flow drafts a concise customer email reply with an inline low-code
  Agent, then records the drafted content through a mock node.

  Use this inline Agent:

  - Node type: `uipath.agent.autonomous@1.0`
  - Action id: `draftReplyAgent`
  - Display label: `Draft Reply Agent`
  - Inline Agent source/sidecar folder: `11111111-2222-3333-4444-555555555555`
  - Runtime service type after conversion: `Orchestrator.StartInlineAgentJob`

  ## Flow behavior

  1. In `main()`, use a hardcoded sample customer email string.
  2. Invoke the Agent with:

     ```typescript
     const raw: string = await executeNode(draftReplyAgent, JSON.stringify({
       emailText: emailText
     }));
     ```

  3. Parse the Agent result. In dry-run, the action fixture must make the
     Agent return:

     ```json
     { "response": { "content": "Thanks for reaching out. I can help with pricing." } }
     ```

  4. Pass the parsed `response.content` to a mock node named `recordDraft`.

  ## Files to write

  - `InlineAgentReply.fil`
  - `bindings.json`
  - `11111111-2222-3333-4444-555555555555/agent.json`

  ## Required FIL structure

  `InlineAgentReply.fil` must include:

  - `flow inline-agent-reply { name: "Inline Agent Reply", version: "1.0.0" };`
  - `trigger manualStart: start;`
  - `action draftReplyAgent: uipath.agent.autonomous@1.0 { ... };`
  - a mock action named `recordDraft`
  - `async function main(): Promise<void> { ... }`

  The `draftReplyAgent` action body must use the inline low-code Agent shape
  from `SKILL.md`:

  ```typescript
  label: "Draft Reply Agent",
  rawInputs: {
    source: "11111111-2222-3333-4444-555555555555",
    systemPrompt: "You write concise customer email replies.",
    userPrompt: "Draft a reply for the provided email.",
    model: "gpt-4o-2024-11-20",
    agentInputVariables: [
      { id: "emailText", type: "string", binding: "=js:$vars.manualTrigger1.output.emailText" },
    ],
    agentOutputVariables: [
      { id: "content", type: "string" },
    ],
  },
  fixture: { response: { content: "Thanks for reaching out. I can help with pricing." } },
  ```

  Do **not** add `resource`, `resourceBindings`, `embeddedDefinitions`, or a
  manifest sidecar for the inline Agent. Flow v2 now synthesizes the v1 inline
  Agent definition during conversion.

  ## Sidecar requirements

  Keep the inline Agent sidecar at the CLI-compatible path:

  ```text
  11111111-2222-3333-4444-555555555555/agent.json
  ```

  The sidecar JSON must describe the same system prompt, user prompt,
  `emailText` input variable, and `content` output variable used by the
  action body. Do not invent an `agents/` wrapper directory.

  ## Verifying your work

  ```bash
  ./parse-fil.sh InlineAgentReply.fil
  ./verify.sh
  ./convert.sh InlineAgentReply
  uip maestro flow validate InlineAgentReply.flow
  uip maestro flow format InlineAgentReply.flow
  ```

  Do not use `./verify.sh --live`; live inline Agent dispatch is intentionally
  unsupported in this first Flow v2 slice.

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "InlineAgentReply.fil"
    weight: 1.0

  - type: file_exists
    description: "Bindings exist"
    path: "bindings.json"
    weight: 1.0

  - type: run_command
    description: "No manifest sidecar was authored"
    command: "test ! -e InlineAgentReply.manifest.flow"
    timeout: 5
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Inline Agent sidecar exists at the source path"
    path: "11111111-2222-3333-4444-555555555555/agent.json"
    weight: 2.0

  - type: run_command
    description: "FIL parses cleanly"
    command: "./parse-fil.sh InlineAgentReply.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "verify.sh dry-run passes with inline Agent preflight"
    command: "./verify.sh"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL uses inline Agent rawInputs and no published-Agent resource binding shape"
    command: |
      python3 -c "
      text = open('InlineAgentReply.fil').read()
      assert 'embeddedDefinitions' not in text
      assert 'resourceBindings' not in text
      assert 'action draftReplyAgent: uipath.agent.autonomous@1.0' in text
      for s in ['rawInputs', 'source', '11111111-2222-3333-4444-555555555555', 'systemPrompt', 'userPrompt', 'model', 'agentInputVariables', 'emailText', 'agentOutputVariables', 'content', 'fixture', 'Thanks for reaching out']:
          assert s in text, s
      assert 'executeNode(draftReplyAgent' in text
      print('inline Agent FIL shape ok')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Sidecar agent.json mirrors action prompts and variables"
    command: |
      python3 -c "
      import json
      p = '11111111-2222-3333-4444-555555555555/agent.json'
      sidecar = json.load(open(p))
      text = json.dumps(sidecar)
      assert 'You write concise customer email replies.' in text, sidecar
      assert 'Draft a reply for the provided email.' in text, sidecar
      assert 'emailText' in text, sidecar
      assert 'content' in text, sidecar
      print('inline Agent sidecar shape ok')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "v2 to v1 conversion succeeds"
    command: "./convert.sh InlineAgentReply"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow validates"
    command: "uip maestro flow validate InlineAgentReply.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow contains inline Agent node and synthesized definition"
    command: |
      python3 -c "
      import json
      f = json.load(open('InlineAgentReply.flow'))
      nodes = f.get('nodes', [])
      defs = f.get('definitions', [])
      inline_nodes = [n for n in nodes if n.get('type') == 'uipath.agent.autonomous']
      assert inline_nodes, 'no inline Agent node in converted flow'
      node = inline_nodes[0]
      assert node.get('inputs', {}).get('source') == '11111111-2222-3333-4444-555555555555', node.get('inputs')
      assert node.get('model') is None, node.get('model')
      defs_for_agent = [d for d in defs if d.get('nodeType') == 'uipath.agent.autonomous']
      assert defs_for_agent, 'no synthesized inline Agent definition'
      model = defs_for_agent[0].get('model') or {}
      assert model.get('source') is True, model
      assert model.get('serviceType') == 'Orchestrator.StartInlineAgentJob', model
      print('converted inline Agent flow ok')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: "uip maestro flow format InlineAgentReply.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Inline Agent output controls the business path"
    prompt: |
      Evaluate whether this Flow v2 project actually invokes the inline
      Agent in the business path and uses its parsed output.

      Required:
      1. FIL declares the exact inline Agent action `draftReplyAgent`.
      2. FIL calls `executeNode(draftReplyAgent, ...)`.
      3. FIL parses the returned JSON and reads `response.content`.
      4. FIL passes the parsed draft content to `recordDraft`.
      5. The action body describes `draftReplyAgent` as `uipath.agent.autonomous`
         with `rawInputs.source`, prompt/model fields, and variable arrays,
         not as a published Agent resource or connector.
      6. The sidecar lives directly under the source folder name.

      Score 1.0 if all six are clearly true; 0.5 if the inline Agent node
      exists but the output is weakly used; 0 if the Agent is not in the
      actual path.
    files:
      - "InlineAgentReply.fil"
      - "bindings.json"
      - "11111111-2222-3333-4444-555555555555/agent.json"
