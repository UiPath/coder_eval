task_id: uipath-flow-v2-agentic-process
description: >
  Author a two-file Flow v2 project that invokes a published Agentic Process
  resource, branches on the dry-run fixture output, and converts cleanly to v1.
tags: [flow-v2, fil, generate, agentic-process, process-orchestration, decision, mock, non-is-node]

run_limits:
  max_turns: 80
  turn_timeout: 1200
  task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2-process-resources"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"
      include_patterns:
        - "tools/*/dist"
        - "tools/*/dist/**"

pre_run:
  - command: "mkdir -p .flow-v2-library-json && printf '{\"version\":1,\"entries\":[]}\n' > .flow-v2-library-json/index.json && (cd tools && npm ci --omit=dev)"
    timeout: 120

initial_prompt: |
  Author a UiPath Flow v2 project named **CustomerIntakeOrchestration** in the
  current directory. Read `SKILL.md` first. Use the current two-file model:
  `CustomerIntakeOrchestration.fil` plus `bindings.json`. Do NOT create a
  `CustomerIntakeOrchestration.manifest.flow` sidecar.

  ## Scenario

  The flow invokes a published Agentic Process for customer intake, then
  branches on the returned status.

  Use this published Agentic Process resource exactly:

  - Action type: `uipath.core.agentic-process.5f9ad95a-b862-46c7-98c3-a9be2e5b922f@1.0.0`
  - Action id: `runOrchestration`
  - Display label: `Run Customer Intake`
  - Resource key: `Shared.Customer Intake Orchestration`
  - Agentic Process name binding id: `bAgenticProcessName`
  - Agentic Process name binding default: `Customer Intake Orchestration`
  - Agentic Process folderPath binding id: `bAgenticProcessFolder`
  - Agentic Process folderPath binding default: `Shared`
  - Runtime service type: `Orchestrator.StartAgenticProcessAsync`
  - Resource sub type: `ProcessOrchestration`
  - Section: `Published`

  ## Required FIL structure

  `CustomerIntakeOrchestration.fil` must include:

  - `flow customer-intake-orchestration { name: "Customer Intake Orchestration", version: "1.0.0" };`
  - `trigger manualStart: start;`
  - `action runOrchestration: uipath.core.agentic-process.5f9ad95a-b862-46c7-98c3-a9be2e5b922f@1.0.0 { ... };`
  - mock actions named `acceptedRoute` and `reviewRoute`
  - `async function main(): Promise<void> { ... }`

  The `runOrchestration` action body must include:

  ```typescript
  label: "Run Customer Intake",
  rawInputs: { customerName: "Ada Lovelace" },
  resource: {
    resource: "process",
    resourceSubType: "ProcessOrchestration",
    resourceKey: "Shared.Customer Intake Orchestration",
    serviceType: "Orchestrator.StartAgenticProcessAsync",
    section: "Published",
  },
  resourceBindings: {
    name: "bAgenticProcessName",
    folderPath: "bAgenticProcessFolder",
  },
  outputs: {
    output: {
      type: "object",
      description: "The return value of the agentic process",
      source: "=result.response",
      var: "output",
    },
    error: {
      type: "object",
      description: "Error information if the agentic process fails",
      source: "=result.Error",
      var: "error",
    },
  },
  fixture: { response: { status: "accepted", priority: "high" } },
  ```

  In `main()`, invoke the Agentic Process by action identifier:

  ```typescript
  const raw: string = await executeNode(runOrchestration, JSON.stringify({
    customerName: "Ada Lovelace"
  }));
  ```

  Do not call `executeNode("runOrchestration", ...)` by string literal.

  Parse the dry-run output as `{ "response": { "status": "accepted", "priority": "high" } }`.
  If status is `accepted`, call `acceptedRoute`; otherwise call `reviewRoute`.

  ## Required bindings.json

  `bindings.json` must include:

  - `bAgenticProcessName`: `resource: "process"`,
    `resourceSubType: "ProcessOrchestration"`,
    `resourceKey: "Shared.Customer Intake Orchestration"`,
    `propertyAttribute: "name"`,
    `default: "Customer Intake Orchestration"`
  - `bAgenticProcessFolder`: `resource: "process"`,
    `resourceSubType: "ProcessOrchestration"`,
    `resourceKey: "Shared.Customer Intake Orchestration"`,
    `propertyAttribute: "folderPath"`,
    `default: "Shared"`

  ## Verifying your work

  The sandbox has a local empty JSON library at `.flow-v2-library-json`
  because this task only uses non-connector Flow v2 actions. Use that local
  library when running `verify.sh` and `convert.sh`; do not run the global
  `setup-library.sh`.

  ```bash
  ./parse-fil.sh CustomerIntakeOrchestration.fil
  FLOW_V2_LIBRARY_JSON="$PWD/.flow-v2-library-json" ./verify.sh
  FLOW_V2_LIBRARY_JSON="$PWD/.flow-v2-library-json" ./convert.sh CustomerIntakeOrchestration
  uip maestro flow validate CustomerIntakeOrchestration.flow
  uip maestro flow format CustomerIntakeOrchestration.flow
  ```

  Do not run `./verify.sh --live` or `setup-library.sh`; live Agentic Process
  dispatch is intentionally unsupported in Flow v2 for this task.

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "CustomerIntakeOrchestration.fil"
    weight: 1.0

  - type: file_exists
    description: "Bindings exist"
    path: "bindings.json"
    weight: 1.0

  - type: run_command
    description: "No manifest sidecar was authored"
    command: "test ! -e CustomerIntakeOrchestration.manifest.flow"
    timeout: 5
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL parses cleanly"
    command: "./parse-fil.sh CustomerIntakeOrchestration.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL and bindings use the required Agentic Process resource shape"
    command: "python3 $TASK_DIR/../shared/check_process_resource_flow.py --kind agentic-process --fil CustomerIntakeOrchestration.fil --bindings bindings.json"
    timeout: 10
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "flow-run dry-run passes with Agentic Process fixture"
    command: 'FLOW_V2_LIBRARY_JSON="$PWD/.flow-v2-library-json" ./verify.sh'
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "v2 to v1 conversion succeeds"
    command: 'FLOW_V2_LIBRARY_JSON="$PWD/.flow-v2-library-json" ./convert.sh CustomerIntakeOrchestration'
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Converted v1 .flow exists"
    path: "CustomerIntakeOrchestration.flow"
    weight: 1.0

  - type: run_command
    description: "Converted .flow contains the required Agentic Process node, definition, and bindings"
    command: "python3 $TASK_DIR/../shared/check_process_resource_flow.py --kind agentic-process --v1-flow CustomerIntakeOrchestration.flow"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow validates"
    command: "uip maestro flow validate CustomerIntakeOrchestration.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: "uip maestro flow format CustomerIntakeOrchestration.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow invokes the Agentic Process and branches on response.status"
    prompt: |
      Did the agent author a two-file v2 Flow that:
      (a) declares the exact Agentic Process action `runOrchestration` in FIL;
      (b) uses resource/resourceBindings for an Orchestrator
          `StartAgenticProcessAsync` process resource with
          `resourceSubType: "ProcessOrchestration"`;
      (c) invokes `runOrchestration` by action identifier, not a string;
      (d) uses the dry-run fixture `{ response: { status: "accepted", priority: "high" } }`;
      (e) branches on `response.status === "accepted"` to `acceptedRoute`
          or `reviewRoute`;
      (f) converts to a valid v1 `.flow` with a `bpmn:CallActivity`
          Agentic Process node?

      Score 1.0 if all six pieces are present. Subtract 0.15 per missing
      piece. If a manifest sidecar is required for the solution, cap at 0.4.
    files:
      - "CustomerIntakeOrchestration.fil"
      - "bindings.json"
      - "CustomerIntakeOrchestration.flow"
    weight: 3.0
    pass_threshold: 0.7
