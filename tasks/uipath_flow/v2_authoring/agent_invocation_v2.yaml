task_id: uipath-flow-v2-agent-invocation
description: >
  Author a two-file Flow v2 FIL project that invokes a published UiPath Agent
  resource, branches on the Agent output, and converts cleanly to v1 without
  copying an embedded v1 definition blob.
tags: [flow-v2, fil, generate, agent, decision, mock, non-is-node]

run_limits:
  max_turns: 80
  turn_timeout: 1200
  task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  ignore_patterns:
    - "!dist"          # vendored flow-v2 JS toolchain (tools/*/dist/cli.js)
    - "!node_modules"  # vendored wabt runtime dep (tools/node_modules/wabt)
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2"
    - type: template_dir
      path: "../../../templates/flow-v2-shared"

initial_prompt: |
  Author a UiPath Flow v2 project named **AgentClassifier** in the current
  directory. Read `SKILL.md` first. Use the current two-file model:
  `AgentClassifier.fil` plus `bindings.json`. Do NOT create an
  `AgentClassifier.manifest.flow` sidecar.

  ## Scenario

  The flow classifies a customer email with a published UiPath Agent, then
  routes based on the Agent's returned intent.

  Use this published Agent resource:

  - Node type: `uipath.core.agent.93f09b44-e635-40f9-8cab-44ca29e748ed@1.0.0`
  - Action id: `classifyIntent`
  - Display label: `Classify Intent`
  - Resource key: `93f09b44-e635-40f9-8cab-44ca29e748ed`
  - Agent name binding default: `ClassifyIntent`
  - Agent folderPath binding default: `Shared`
  - Runtime service type: `Orchestrator.StartAgentJob`
  - Section: `Published`

  ## Flow behavior

  1. In `main()`, use a hardcoded sample email string.
  2. Invoke the Agent with:

     ```typescript
     const raw: string = await executeNode(classifyIntent, JSON.stringify({
       in_text: emailText
     }));
     ```

  3. Parse the Agent result. In dry-run, the action fixture must make the
     Agent return:

     ```json
     { "response": { "intent": "needs_response", "summary": "Customer asked for pricing" } }
     ```

  4. If `response.intent` is `"needs_response"`, call a mock node named
     `needsResponse`; otherwise call a mock node named `archiveOnly`.

  ## Files to write

  - `AgentClassifier.fil`
  - `bindings.json`

  ## Required FIL structure

  `AgentClassifier.fil` must include:

  - `flow agent-classifier { name: "Agent Classifier", version: "1.0.0" };`
  - `trigger manualStart: start;`
  - `action classifyIntent: uipath.core.agent.93f09b44-e635-40f9-8cab-44ca29e748ed@1.0.0 { ... };`
  - mock actions named `needsResponse` and `archiveOnly`
  - `async function main(): Promise<void> { ... }`

  The `classifyIntent` action body must use the Flow v2 Agent resource shape
  from `SKILL.md`:

  ```typescript
  label: "Classify Intent",
  resource: {
    resource: "process",
    resourceSubType: "Agent",
    resourceKey: "93f09b44-e635-40f9-8cab-44ca29e748ed",
    orchestratorType: "agent",
    serviceType: "Orchestrator.StartAgentJob",
    section: "Published",
  },
  resourceBindings: {
    name: "bAgentName",
    folderPath: "bAgentFolder",
  },
  fixture: { response: { intent: "needs_response", summary: "Customer asked for pricing" } },
  ```

  Do **not** add `embeddedDefinitions` or a manifest sidecar for the Agent.
  Flow v2 now synthesizes the v1 Agent definition from `resource` /
  `resourceBindings` during conversion.

  ## Bindings requirements

  `bindings.json` must include two process Agent bindings:

  - `bAgentName`: `resource: "process"`, `resourceSubType: "Agent"`,
    `propertyAttribute: "name"`, `default: "ClassifyIntent"`
  - `bAgentFolder`: `resource: "process"`, `resourceSubType: "Agent"`,
    `propertyAttribute: "folderPath"`, `default: "Shared"`

  ## Verifying your work

  ```bash
  ./parse-fil.sh AgentClassifier.fil
  ./verify.sh
  ./convert.sh AgentClassifier
  uip maestro flow validate AgentClassifier.flow
  uip maestro flow format AgentClassifier.flow
  ```

  Do not use `./verify.sh --live`; live Agent dispatch is intentionally
  unsupported in this first Flow v2 slice.

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "AgentClassifier.fil"
    weight: 1.0

  - type: file_exists
    description: "Bindings exist"
    path: "bindings.json"
    weight: 1.0

  - type: run_command
    description: "No manifest sidecar was authored"
    command: "test ! -e AgentClassifier.manifest.flow"
    timeout: 5
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL parses cleanly"
    command: "./parse-fil.sh AgentClassifier.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "verify.sh dry-run passes with Agent resource preflight"
    command: "./verify.sh"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "FIL uses resource/resourceBindings for the Agent and no embedded definition blob"
    command: |
      python3 -c "
      text = open('AgentClassifier.fil').read()
      assert 'embeddedDefinitions' not in text
      assert 'action classifyIntent: uipath.core.agent.93f09b44-e635-40f9-8cab-44ca29e748ed@1.0.0' in text
      for s in ['resourceSubType', 'Agent', 'resourceKey', '93f09b44-e635-40f9-8cab-44ca29e748ed', 'orchestratorType', 'agent', 'serviceType', 'Orchestrator.StartAgentJob', 'section', 'Published', 'resourceBindings', 'bAgentName', 'bAgentFolder', 'fixture', 'needs_response']:
          assert s in text, s
      assert 'executeNode(classifyIntent' in text
      print('agent FIL resource shape ok')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "bindings.json has process Agent name and folderPath bindings"
    command: |
      python3 -c "
      import json
      b = json.load(open('bindings.json'))['bindings']
      by_id = {e['id']: e for e in b}
      name = by_id['bAgentName']
      folder = by_id['bAgentFolder']
      assert name['resource'] == 'process' and name['resourceSubType'] == 'Agent', name
      assert name['propertyAttribute'] == 'name' and name['default'] == 'ClassifyIntent', name
      assert folder['resource'] == 'process' and folder['resourceSubType'] == 'Agent', folder
      assert folder['propertyAttribute'] == 'folderPath' and folder['default'] == 'Shared', folder
      print('agent bindings ok')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "v2 to v1 conversion succeeds"
    command: "./convert.sh AgentClassifier"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow validates"
    command: "uip maestro flow validate AgentClassifier.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow contains Agent node, synthesized definition, and Agent bindings"
    command: |
      python3 -c "
      import json
      f = json.load(open('AgentClassifier.flow'))
      nodes = f.get('nodes', [])
      defs = f.get('definitions', [])
      agent_nodes = [n for n in nodes if n.get('type') == 'uipath.core.agent.93f09b44-e635-40f9-8cab-44ca29e748ed']
      assert agent_nodes, 'no Agent node in converted flow'
      node = agent_nodes[0]
      assert node.get('model', {}).get('serviceType') == 'Orchestrator.StartAgentJob', node.get('model')
      assert node.get('model', {}).get('bindings', {}).get('resourceSubType') == 'Agent', node.get('model')
      assert any(d.get('nodeType') == node['type'] for d in defs), 'no synthesized Agent definition'
      agent_bindings = [b for b in f.get('bindings', []) if b.get('resourceSubType') == 'Agent']
      assert len(agent_bindings) == 2, agent_bindings
      print('converted Agent flow ok')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: "uip maestro flow format AgentClassifier.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Agent output controls the routing path"
    prompt: |
      Evaluate whether this Flow v2 project actually invokes the Agent in
      the business path and branches on the Agent's parsed output.

      Required:
      1. FIL declares the exact published Agent action `classifyIntent`.
      2. FIL calls `executeNode(classifyIntent, ...)`.
      3. FIL parses the returned JSON and reads `response.intent`.
      4. FIL branches so `needs_response` reaches `needsResponse`, while
         other intents reach `archiveOnly`.
      5. The action body describes `classifyIntent` as a published Agent
         resource node with process Agent bindings, not as a connector.

      Score 1.0 if all five are clearly true; 0.5 if the Agent node exists
      but routing is weak or hardcoded; 0 if the Agent is not in the actual
      decision path.
    files:
      - "AgentClassifier.fil"
      - "bindings.json"
    weight: 2.0
    pass_threshold: 0.7
