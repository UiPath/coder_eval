task_id: uipath-flow-v2-bellevue-weather
description: >
  v2 port of the medium-complexity weather flow: HTTP + Script + Decision +
  branched outputs. Authored as FIL + manifest + bindings instead of
  hand-written .flow JSON. Tests whether the v2 authoring loop reaches the
  same v1-validated outcome with the same scenario.
tags: [flow-v2, fil, generate, http, decision]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 50
  turn_timeout: 1200

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-v2"

initial_prompt: |
  Author a UiPath Flow v2 project named **BellevueWeather** in the current
  directory. Read `SKILL.md` first — it describes the v2 file shape, FIL
  syntax, the manifest envelope, the binding requirements, and the
  authoring loop using `verify.sh`. There is a worked example in `example/`.

  ## Scenario

  Get today's weather in Bellevue, WA from open-meteo. Format a summary
  with a script. If the temperature is greater than 60°F, return
  `{ message: "nice day" }`; otherwise return `{ message: "bring a jacket" }`.

  Bellevue, WA coordinates: latitude 47.6101, longitude -122.2015.
  Use temperature_unit=fahrenheit on the open-meteo URL.

  ## Files to write (project root)

  - `BellevueWeather.fil`       FIL source
  - `BellevueWeather.manifest.flow` Manifest
  - `bindings.json`                Connection IDs (this flow has no
                                   connectors, so an empty bindings array is fine)

  ## Authoring loop

  ```bash
  ./verify.sh                                 # compile + binding check
  ./verify.sh --live                          # actual HTTP fetch (optional)
  ./convert.sh BellevueWeather                # writes BellevueWeather.flow
  uip maestro flow validate BellevueWeather.flow
  uip maestro flow tidy BellevueWeather.flow  # designer-friendly layout
  ```

  Iterate against `verify.sh` first — its compile errors include
  file:line:col, and decisions.json shows what each node received and
  returned. Only run `convert.sh` once verify is happy.

success_criteria:
  - type: file_exists
    description: "FIL source file exists"
    path: "BellevueWeather.fil"
    weight: 1.0

  - type: file_exists
    description: "Manifest exists"
    path: "BellevueWeather.manifest.flow"
    weight: 1.0

  - type: file_exists
    description: "Bindings file exists"
    path: "bindings.json"
    weight: 1.0

  - type: run_command
    description: "FIL compiles to WAT"
    command: "./parse-fil.sh BellevueWeather.fil"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "verify.sh dry-run succeeds"
    command: "./verify.sh"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "v2 → v1 conversion produces BellevueWeather.flow"
    command: "./convert.sh BellevueWeather"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow passes uip maestro flow validate"
    command: "uip maestro flow validate BellevueWeather.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow tidy succeeds"
    command: "uip maestro flow tidy BellevueWeather.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Converted .flow has the expected structural shape (HTTP + script + valid)"
    command: |
      python3 -c "
      import json
      ns = json.load(open('BellevueWeather.flow'))['nodes']
      types = [n['type'] for n in ns]
      assert any(t.startswith('core.action.http') for t in types), f'no HTTP node: {types}'
      assert 'core.action.script' in types, f'no script node: {types}'
      print(f'{len(ns)} nodes: {types}')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow implements the described behavior"
    prompt: |
      Did the agent author a v2 Flow that meets all four:
      (a) fetches Bellevue weather via core.action.http from open-meteo,
      (b) extracts (or otherwise reads) the temperature from the response,
      (c) computes a different result based on whether temperature > 60°F,
      (d) the two results are exactly `{ message: "nice day" }` (warm) and
          `{ message: "bring a jacket" }` (not warm).

      Branching shape — both forms are equally acceptable for v2:
        • a `core.logic.decision` node with separate branch nodes per outcome, OR
        • a ternary / conditional inside a single `core.action.script` node
          (this is idiomatic in v2 because FIL `__script_<id>` helpers must
          be single-expression returns; see the "Script-helper restrictions"
          subsection in SKILL.md).

      Score the FIL source and manifest below. Behavior is what's being
      graded; the chosen branching idiom is not.
    files:
      - "BellevueWeather.fil"
      - "BellevueWeather.manifest.flow"
    weight: 2.0
    pass_threshold: 0.7
