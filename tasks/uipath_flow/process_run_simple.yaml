task_id: uipath-flow-process-run-simple
description: >
  Minimal-prompt evaluation: agent must figure out how to run a UiPath Flow
  process and check its job status using uip CLI with no step-by-step guidance.
tags: [flow, uipcli, simple]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 15

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Use the `uip` CLI to run a Flow process, then check the job status and
  save a summary to run_report.json. You will need to discover available processes
  first. The `uip` CLI is already available.

success_criteria:
  - type: command_executed
    description: "Agent listed processes to find process-key and folder-key"
    tool_name: "Bash"
    command_pattern: 'uip\s+flow\s+process\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran uip flow process run"
    tool_name: "Bash"
    command_pattern: 'uip\s+flow\s+process\s+run'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent checked job status"
    tool_name: "Bash"
    command_pattern: 'uip\s+flow\s+job\s+status'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "run_report.json summary exists"
    path: "run_report.json"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "run_report.json is valid JSON"
    command: "python -c \"import json; json.load(open('run_report.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 2

llm_reviewer:
  enabled: true
