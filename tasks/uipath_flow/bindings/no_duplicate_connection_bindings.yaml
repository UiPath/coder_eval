task_id: flow-bindings-no-duplicates
description: >
  Regression for MST-10236 — `uip maestro flow node configure` previously
  appended brand-new Connection bindings instead of claiming the empty-keyed
  stubs that flow-core hoists at `node add` time. The produced .flow shipped
  with two binding rows per real connection; Studio Web's runtime resolved
  the empty stub first and failed with `Value cannot be null. (Parameter
  'Connection')`. This eval asserts the configured .flow contains no
  empty-keyed Connection bindings and no duplicate (name, propertyAttribute)
  rows under the Connection resource. See:
  https://github.com/UiPath/cli/pull/2197 and
  https://uipath.atlassian.net/browse/MST-10236
tags: [flow, connector, configure, bindings, regression, tier-4, integration]

run_limits:
  max_turns: 50
  turn_timeout: 1500
agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/cli@latest"

initial_prompt: |
  Load the uipath-maestro-flow skill and follow its workflow exactly.

  Build a flow named "BindingsRegression" — Manual Trigger → IS connector
  node → End — saved as `BindingsRegression/flow_files/BindingsRegression.flow`
  with `BindingsRegression/project.uiproj`.

  Configure the connector node exactly once. Do not invoke any "refresh
  schema" workaround afterwards — the bindings shape immediately after
  `node configure` is what this eval inspects.

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: command_executed
    description: "Agent called node configure"
    tool_name: "Bash"
    command_pattern: "uip.*maestro.*flow.*node.*configure"
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow file exists and is valid JSON"
    command: "python3 -c \"import json,glob; flows=glob.glob('**/BindingsRegression*.flow',recursive=True); assert flows, 'No flow found'; f=json.load(open(flows[0])); assert 'nodes' in f and 'bindings' in f, 'flow missing nodes/bindings'\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "No empty-keyed Connection bindings remain after configure"
    command: "python3 -c \"import json,glob; flows=glob.glob('**/BindingsRegression*.flow',recursive=True); assert flows; f=json.load(open(flows[0])); b=f.get('bindings',[]); empty=[x for x in b if x.get('resource')=='Connection' and not x.get('resourceKey')]; assert empty==[], f'Found {len(empty)} empty-keyed Connection binding(s): {empty}'\""
    timeout: 10
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "No duplicate (name, propertyAttribute) under Connection resource"
    command: "python3 -c \"import json,glob; from collections import Counter; flows=glob.glob('**/BindingsRegression*.flow',recursive=True); assert flows; f=json.load(open(flows[0])); b=f.get('bindings',[]); keys=[(x.get('name'),x.get('propertyAttribute')) for x in b if x.get('resource')=='Connection']; dups=[k for k,c in Counter(keys).items() if c>1]; assert not dups, f'Duplicate Connection bindings: {dups}'\""
    timeout: 10
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "ConnectionId binding has matching non-empty resourceKey and default"
    command: "python3 -c \"import json,glob; flows=glob.glob('**/BindingsRegression*.flow',recursive=True); assert flows; f=json.load(open(flows[0])); b=f.get('bindings',[]); conn=[x for x in b if x.get('resource')=='Connection' and x.get('propertyAttribute')=='ConnectionId']; assert conn, 'No ConnectionId binding emitted'; assert all(x.get('resourceKey') and x['resourceKey']==x.get('default') for x in conn), f'Bad ConnectionId binding(s): {conn}'\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "bindings_v2.json (derived artifact), if emitted, also has no empty-keyed Connection rows"
    command: "python3 -c \"import json,glob; b2s=glob.glob('**/bindings_v2.json',recursive=True); b2=json.load(open(b2s[0])) if b2s else {'bindings':[]}; rows=b2 if isinstance(b2,list) else b2.get('bindings',[]); empty=[x for x in rows if isinstance(x,dict) and x.get('resource')=='Connection' and not x.get('resourceKey')]; assert empty==[], f'Empty-keyed Connection row(s) in bindings_v2.json: {empty}'\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
