task_id: flow-bindings-idempotent-reconfigure
description: >
  Step 1 of the DAPField-mirrored upsert in `upsertConnectionResourceBinding`
  is the exact `(name, resource, resourceKey)` match path that refreshes
  `default` instead of appending. This eval covers it: configuring the same
  connector node twice with the same connection details must not grow the
  bindings array. The second configure should be a no-op on row count.
  See https://github.com/UiPath/cli/pull/2197 — the "Step 1: exact match"
  branch of `upsertConnectionResourceBinding`.
tags: [flow, connector, configure, bindings, regression, tier-4, integration]

run_limits:
  max_turns: 60
  turn_timeout: 1500
agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/cli@latest"

initial_prompt: |
  Load the uipath-maestro-flow skill and follow its workflow exactly.

  Build a flow named "BindingsIdempotent" — Manual Trigger → IS connector
  node → End — saved as `BindingsIdempotent/flow_files/BindingsIdempotent.flow`
  with `BindingsIdempotent/project.uiproj`.

  Snapshot the .flow after the first configure:
      cp BindingsIdempotent/flow_files/BindingsIdempotent.flow after_first_configure.flow

  Then run the EXACT SAME `node configure` invocation a second time (same
  node id, same --detail JSON). Snapshot again:
      cp BindingsIdempotent/flow_files/BindingsIdempotent.flow after_second_configure.flow

  Both snapshots go at the sandbox root.

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: command_executed
    description: "Agent called node configure at least twice"
    tool_name: "Bash"
    command_pattern: "uip.*maestro.*flow.*node.*configure"
    min_count: 2
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "after_first_configure.flow snapshot exists"
    path: "after_first_configure.flow"
    weight: 0.5
    pass_threshold: 1.0

  - type: file_exists
    description: "after_second_configure.flow snapshot exists"
    path: "after_second_configure.flow"
    weight: 0.5
    pass_threshold: 1.0

  - type: run_command
    description: "Both snapshots are valid JSON with a `bindings` array"
    command: "python3 -c \"import json; a=json.load(open('after_first_configure.flow')); b=json.load(open('after_second_configure.flow')); assert isinstance(a.get('bindings'),list) and isinstance(b.get('bindings'),list)\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Bindings count did not grow on second configure (idempotent)"
    command: "python3 -c \"import json; a=json.load(open('after_first_configure.flow')).get('bindings',[]); b=json.load(open('after_second_configure.flow')).get('bindings',[]); assert len(a)==len(b), f'Bindings grew from {len(a)} to {len(b)} on re-configure'\""
    timeout: 10
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "No empty-keyed Connection bindings in final snapshot"
    command: "python3 -c \"import json; b=json.load(open('after_second_configure.flow')).get('bindings',[]); empty=[x for x in b if x.get('resource')=='Connection' and not x.get('resourceKey')]; assert empty==[], f'Empty-keyed Connection binding(s) after re-configure: {empty}'\""
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Same ConnectionId resourceKey across both snapshots"
    command: "python3 -c \"import json; a=json.load(open('after_first_configure.flow')).get('bindings',[]); b=json.load(open('after_second_configure.flow')).get('bindings',[]); ak={x.get('resourceKey') for x in a if x.get('resource')=='Connection' and x.get('propertyAttribute')=='ConnectionId'}; bk={x.get('resourceKey') for x in b if x.get('resource')=='Connection' and x.get('propertyAttribute')=='ConnectionId'}; assert ak and ak==bk, f'ConnectionId resourceKey changed across idempotent configure: {ak} -> {bk}'\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
