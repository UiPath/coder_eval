task_id: flow-cli-add-node
description: >
  Add a Decision node to an existing dice-roller flow using CLI mode —
  uip maestro flow node add and edge add. Tests CLI editing of existing flows.
tags: [flow, cli, modify, tier-2]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 40

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/cli@0.1.21"
  template_sources:
    - type: template_dir
      path: "./artifacts"

initial_prompt: |
  Before starting, load the uipath-maestro-flow skill. Read and follow its workflow steps exactly.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation. Build the complete flow end-to-end in a single pass.

  Read the existing flow at baseline.flow. This is a dice-roller flow with a
  manual trigger, a script node, and an end node.

  Using CLI mode (uip commands), add a Decision node after the script node
  that checks if the dice result is greater than 3. Wire the "true" branch
  to a new End node (labeled "High Roll") and the "false" branch to another
  End node (labeled "Low Roll"). You may need to use JSON editing for
  rewiring since CLI edge management may require it.

  Save the result as result.flow. Validate with uip maestro flow validate.

success_criteria:
  - type: file_exists
    description: "Result flow file exists"
    path: "result.flow"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used uip maestro flow commands"
    tool_name: "Bash"
    command_pattern: "uip\\s+maestro\\s+flow"
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Result has Decision node and correct wiring"
    command: "python3 -c \"import json; f=json.load(open('result.flow')); dt=[n for n in f['nodes'] if n['type']=='core.logic.decision']; assert len(dt)>=1, 'No Decision node'; ends=[n for n in f['nodes'] if n['type']=='core.control.end']; ne=len(ends); assert ne>=2, 'Need 2+ End nodes, got %d'%ne; print('OK: Decision + End nodes present')\""
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Result is valid JSON with correct structure"
    command: "python3 -c \"import json; f=json.load(open('result.flow')); assert 'nodes' in f and 'edges' in f and 'definitions' in f; nn=len(f['nodes']); ne=len(f['edges']); assert nn>=5, 'Expected 5+ nodes, got %d'%nn; assert ne>=4, 'Expected 4+ edges, got %d'%ne; print('OK: %d nodes, %d edges'%(nn,ne))\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
