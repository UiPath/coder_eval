task_id: uipath-flow-queue
description: >
  Author a Flow v1 (.flow JSON) project that invokes the OOTB Orchestrator
  Queue create and create-and-wait actions with queue resource bindings.
  V1 counterpart to v2_authoring/queue_v2.
tags: [flow, flow-json, generate, queue, orchestrator, data-operations, non-is-node]

run_limits:
  max_turns: 90
  turn_timeout: 1800
  task_timeout: 2400

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Before starting, load the `uipath-maestro-flow` skill and read its
  SKILL.md. Author the flow as v1 JSON. Do NOT use Flow v2, FIL, or C#.
  Do NOT ask for approval, confirmation, or feedback. Build the complete
  flow end-to-end in a single pass.

  Task-specific override: Queue create/create-and-wait are OOTB Orchestrator
  actions that may not be discoverable from the local Flow node registry in
  this sandbox. Do NOT run `uip tools update`, `uip maestro flow registry
  pull`, or registry `get/search` commands to discover them. Use the required
  node shape and definition below as the source of truth, then validate and
  format the authored `.flow`.

  Create a UiPath Flow project named **QueueOperationsDemo**.

  ## Scenario

  The flow starts manually, creates one queue item, creates a second queue item
  and waits for processing, and returns both Queue action responses.

  Use this queue resource:

  ```json
  { "name": "InvoiceProcessingQueue", "folderPath": "Shared", "key": "queue-key-001" }
  ```

  ## Flow behavior

  1. Start with a manual trigger whose node id is `manualStart`.
  2. Run a Queue create node with id `enqueueInvoice` and label
     `Enqueue Invoice`.
  3. Run a Queue create-and-wait node with id `processInvoiceAndWait` and
     label `Process Invoice And Wait`.
  4. End the flow and map outputs:
     - `created` from `=js:$vars.enqueueInvoice.output`
     - `processed` from `=js:$vars.processInvoiceAndWait.output`

  ## Files to write

  Save the flow as:

  - `QueueOperationsDemo/project.uiproj`
  - `QueueOperationsDemo/flow_files/QueueOperationsDemo.flow`

  ## Required Queue bindings

  Add exactly these queue resource bindings to the top-level `bindings` array:

  ```json
  [
    {
      "id": "bQueueName",
      "name": "name",
      "type": "string",
      "resource": "queue",
      "resourceKey": "queue-key-001",
      "default": "InvoiceProcessingQueue",
      "propertyAttribute": "name"
    },
    {
      "id": "bQueueFolder",
      "name": "folderPath",
      "type": "string",
      "resource": "queue",
      "resourceKey": "queue-key-001",
      "default": "Shared",
      "propertyAttribute": "folderPath"
    }
  ]
  ```

  Do not use connector `binding`/`folderBinding` metadata, `ConnectionId`,
  `FolderKey`, or process `resourceSubType` metadata for these Queue nodes.

  ## Required Queue create node shape

  The `enqueueInvoice` node instance must have:

  - `type: "core.action.queue.create"`
  - `typeVersion: "1.0"`
  - `display.label: "Enqueue Invoice"`
  - `inputs.queue` set to the queue resource object above
  - `inputs.itemData` set to this JSON string:
    `{"invoiceId":"INV-1001","amount":123.45,"source":"flow-v2-eval"}`
  - `inputs.priority: "High"`
  - `inputs.reference: "INV-1001"`
  - `inputs.deferDate: ""`
  - `inputs.dueDate: "2026-06-01T17:00:00Z"`
  - `outputs.output.source: "=response"`
  - `outputs.error.source: "=Error"`
  - `model.type: "bpmn:SendTask"`
  - `model.serviceType: "Orchestrator.CreateQueueItem"`
  - `model.version: "v2"`
  - `model.bindings.resource: "queue"`
  - `model.bindings.resourceKey: "queue-key-001"`
  - `model.bindings.values` containing `name` and `folderPath` entries with
    `propertyAttribute` and defaults from the queue resource
  - `model.context` entries:
    - `{ "name": "name", "type": "string", "value": "=bindings.bQueueName", "default": "InvoiceProcessingQueue" }`
    - `{ "name": "folderPath", "type": "string", "value": "=bindings.bQueueFolder", "default": "Shared" }`
    - `{ "name": "_label", "type": "string", "value": "Enqueue Invoice" }`

  ## Required Queue create-and-wait node shape

  The `processInvoiceAndWait` node instance must have the same queue inputs,
  outputs, bindings, and context shape as `enqueueInvoice`, except:

  - `type: "core.action.queue.create-and-wait"`
  - `display.label: "Process Invoice And Wait"`
  - `inputs.itemData` set to this JSON string:
    `{"invoiceId":"INV-1002","amount":987.65,"needsResult":true}`
  - `inputs.priority: "Normal"`
  - `inputs.reference: "INV-1002"`
  - `inputs.dueDate: "2026-06-02T17:00:00Z"`
  - `model.type: "bpmn:ServiceTask"`
  - `model.serviceType: "Orchestrator.CreateAndWaitForQueueItem"`
  - `_label` context value `Process Invoice And Wait`

  ## Required definitions

  Include matching `definitions[]` entries for every node type used in the
  flow, including both Queue action node types, manual trigger, and end node.

  The Queue create definition must include:

  - `nodeType: "core.action.queue.create"`
  - `version: "1.0"`
  - `category: "data-operations"`
  - `supportsErrorHandling: true`
  - `display.label: "Create queue item"`
  - `display.icon: "list-plus"`
  - `model.type: "bpmn:SendTask"`
  - `model.serviceType: "Orchestrator.CreateQueueItem"`
  - `model.bindings.resource: "queue"`
  - `inputDefinition.properties.queue.type: "object"`
  - `inputDefinition.properties.itemData.type: "string"`
  - `inputDefinition.required: ["queue"]`
  - `inputDefaults.queue: null`
  - `inputDefaults.itemData: ""`
  - `inputDefaults.priority: "Normal"`
  - `outputDefinition.output.source: "=response"`
  - `outputDefinition.error.source: "=Error"`

  The Queue create-and-wait definition must mirror that shape with:

  - `nodeType: "core.action.queue.create-and-wait"`
  - `display.label: "Create and wait for queue item"`
  - `model.type: "bpmn:ServiceTask"`
  - `model.serviceType: "Orchestrator.CreateAndWaitForQueueItem"`

  ## Verifying your work

  ```bash
  $HOME/.bun/bin/uip maestro flow validate QueueOperationsDemo/flow_files/QueueOperationsDemo.flow
  $HOME/.bun/bin/uip maestro flow format QueueOperationsDemo/flow_files/QueueOperationsDemo.flow
  ```

  Iterate until validation succeeds. Do not substitute a mock, connector,
  Agent, RPA/API Workflow, HITL, Summarize, or Batch Transform node for Queue.

success_criteria:
  - type: file_exists
    description: "project.uiproj exists"
    path: "QueueOperationsDemo/project.uiproj"
    weight: 1.0

  - type: file_exists
    description: "Flow file exists"
    path: "QueueOperationsDemo/flow_files/QueueOperationsDemo.flow"
    weight: 1.0

  - type: run_command
    description: "Flow contains the required Queue node shape and validates"
    command: "python3 $TASK_DIR/../shared/check_queue_flow.py --v1-flow QueueOperationsDemo/flow_files/QueueOperationsDemo.flow"
    timeout: 90
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "v1 .flow validates"
    command: "UIPATH_FLOW_CLI=${UIPATH_FLOW_CLI:-$HOME/.bun/bin/uip}; \"$UIPATH_FLOW_CLI\" maestro flow validate QueueOperationsDemo/flow_files/QueueOperationsDemo.flow"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: "UIPATH_FLOW_CLI=${UIPATH_FLOW_CLI:-$HOME/.bun/bin/uip}; \"$UIPATH_FLOW_CLI\" maestro flow format QueueOperationsDemo/flow_files/QueueOperationsDemo.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow invokes Queue create and create-and-wait with queue resource bindings"
    prompt: |
      Did the agent author a v1 .flow JSON that:
      (a) contains `core.action.queue.create` node `enqueueInvoice` and
          `core.action.queue.create-and-wait` node `processInvoiceAndWait`,
          both with `typeVersion: "1.0"`;
      (b) includes queue resource bindings `bQueueName` and `bQueueFolder`
          using `resource: "queue"` and `resourceKey: "queue-key-001"`;
      (c) gives both node instances the required queue `model.bindings` and
          `model.context` entries wired to those bindings;
      (d) sets each node's `inputs.queue`, JSON-string `inputs.itemData`,
          priority, reference, deferDate, and dueDate exactly as requested;
      (e) declares the Queue outputs from `=response` and errors from `=Error`;
      (f) maps End outputs `created` and `processed` to the two Queue outputs;
      (g) includes definitions needed for v1 validation?

      Score 1.0 if all seven pieces are present and structurally connected.
      Subtract 0.14 per missing piece. If either Queue node is replaced by a
      mock, connector, Agent, workflow, HITL, Summarize, or Batch Transform
      node, cap the score at 0.3.
    files:
      - "QueueOperationsDemo/flow_files/QueueOperationsDemo.flow"
    weight: 3.0
    pass_threshold: 0.7
