task_id: uipath-flow-dice-roller
description: >
  Create a UiPath Flow from scratch that simulates rolling a fair six-sided die.
  The agent must use the CLI to scaffold the project, discover available node
  types via the registry, edit the flow JSON to add dice-rolling logic using a
  Script node, and validate the flow.
tags: [flow, uipcli, p0, generate]
max_iterations: 1

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  turn_timeout: 1200

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Create a UiPath Flow project named "DiceRoller" that simulates rolling a six-sided
  die and outputs the result.

success_criteria:
  # ── CLI usage ────────────────────────────────────────────────────────────
  - type: command_executed
    description: "Agent initialized a Flow project"
    tool_name: "Bash"
    command_pattern: 'uip\s+flow\s+init\s+.*DiceRoller'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent explored the node registry"
    tool_name: "Bash"
    command_pattern: 'uip\s+flow\s+registry\s+(search|list|get|pull)'
    min_count: 1
    require_success: false
    weight: 1.0
    pass_threshold: 1.0

  # ── Flow file existence & validity ──────────────────────────────────────
  - type: run_command
    description: "uip flow validate passes on the flow file"
    command: "python3 -c \"import glob,subprocess,sys; flows=glob.glob('**/DiceRoller.flow',recursive=True); sys.exit(1) if not flows else sys.exit(subprocess.run(['uip','flow','validate',flows[0]]).returncode)\""
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # ── Execution checks ────────────────────────────────────────────────────
  - type: run_command
    description: "Flow runs 5 times and produces valid dice rolls (1-6)"
    command: "python3 $TASK_DIR/check_dice_runs.py"
    timeout: 300
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
