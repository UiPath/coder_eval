task_id: uipath-flow-agentic-process
description: >
  Author a Flow v1 (.flow JSON) project that invokes a published Agentic
  Process resource, branches on the returned status, and validates with the
  v1 schema. V1 counterpart to v2_authoring/agentic_process_v2.
tags: [flow, flow-json, generate, agentic-process, process-orchestration, decision, mock, non-is-node]

run_limits:
  max_turns: 90
  turn_timeout: 1800
  task_timeout: 2400

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/cli@0.1.21"

initial_prompt: |
  Before starting, load the `uipath-maestro-flow` skill and read its
  SKILL.md. Author the flow as v1 JSON. Do NOT use Flow v2, FIL, or C#.
  Do NOT ask for approval, confirmation, or feedback. Build the complete
  flow end-to-end in a single pass.

  Create a UiPath Flow project named **CustomerIntakeOrchestration**.

  ## Scenario

  The flow invokes a published Agentic Process for customer intake, then
  branches on the returned status.

  Use this published Agentic Process resource exactly:

  - Node type: `uipath.core.agentic-process.5f9ad95a-b862-46c7-98c3-a9be2e5b922f`
  - Node typeVersion: `1.0.0`
  - Node id: `runOrchestration`
  - Display label: `Run Customer Intake`
  - Resource key: `Shared.Customer Intake Orchestration`
  - Agentic Process name binding id: `bAgenticProcessName`
  - Agentic Process name binding default: `Customer Intake Orchestration`
  - Agentic Process folderPath binding id: `bAgenticProcessFolder`
  - Agentic Process folderPath binding default: `Shared`
  - Runtime service type: `Orchestrator.StartAgenticProcessAsync`
  - Resource sub type: `ProcessOrchestration`
  - Section: `Published`

  ## Flow behavior

  1. Start with a manual trigger.
  2. Invoke `runOrchestration` with an input equivalent to:

     ```json
     { "customerName": "Ada Lovelace" }
     ```

  3. Treat the Agentic Process output shape as:

     ```json
     { "response": { "status": "accepted", "priority": "high" } }
     ```

  4. Add a decision that checks whether the returned status equals `accepted`.
  5. If accepted, call a mock node named `acceptedRoute`.
  6. Otherwise, call a mock node named `reviewRoute`.
  7. End the flow.

  ## Files to write

  Save the flow as:

  - `CustomerIntakeOrchestration/project.uiproj`
  - `CustomerIntakeOrchestration/flow_files/CustomerIntakeOrchestration.flow`

  ## Required Agentic Process node shape

  The Agentic Process node must have:

  - `type: "uipath.core.agentic-process.5f9ad95a-b862-46c7-98c3-a9be2e5b922f"`
  - `typeVersion: "1.0.0"`
  - `inputs.customerName: "Ada Lovelace"`
  - `outputs.output.source: "=result.response"`
  - `outputs.error.source: "=result.Error"`
  - `model.type: "bpmn:CallActivity"`
  - `model.serviceType: "Orchestrator.StartAgenticProcessAsync"`
  - `model.section: "Published"`
  - `model.bindings.resource: "process"`
  - `model.bindings.resourceSubType: "ProcessOrchestration"`
  - `model.bindings.resourceKey: "Shared.Customer Intake Orchestration"`
  - `model.bindings.values.name: "Customer Intake Orchestration"`
  - `model.bindings.values.folderPath: "Shared"`
  - `model.context` entries for `name`, `folderPath`, and `_label`, where
    `name` references `=bindings.bAgenticProcessName` and `folderPath`
    references `=bindings.bAgenticProcessFolder`.

  Put this `model` object directly on the `runOrchestration` node, not only
  on the matching definition:

  ```json
  {
    "type": "bpmn:CallActivity",
    "serviceType": "Orchestrator.StartAgenticProcessAsync",
    "version": "v2",
    "section": "Published",
    "bindings": {
      "resource": "process",
      "resourceSubType": "ProcessOrchestration",
      "resourceKey": "Shared.Customer Intake Orchestration",
      "values": {
        "name": "Customer Intake Orchestration",
        "folderPath": "Shared"
      }
    },
    "context": [
      {
        "name": "name",
        "type": "string",
        "value": "=bindings.bAgenticProcessName",
        "default": "Customer Intake Orchestration"
      },
      {
        "name": "folderPath",
        "type": "string",
        "value": "=bindings.bAgenticProcessFolder",
        "default": "Shared"
      },
      {
        "name": "_label",
        "type": "string",
        "value": "Run Customer Intake"
      }
    ]
  }
  ```

  ## Required bindings

  The top-level `.flow` `bindings` array must include:

  - `bAgenticProcessName`: `resource: "process"`,
    `resourceSubType: "ProcessOrchestration"`,
    `resourceKey: "Shared.Customer Intake Orchestration"`,
    `propertyAttribute: "name"`,
    `default: "Customer Intake Orchestration"`
  - `bAgenticProcessFolder`: `resource: "process"`,
    `resourceSubType: "ProcessOrchestration"`,
    `resourceKey: "Shared.Customer Intake Orchestration"`,
    `propertyAttribute: "folderPath"`,
    `default: "Shared"`

  ## Required definitions

  Include a matching `definitions[]` entry for every node type used in the
  flow, including this Agentic Process node, manual trigger, decision, mock
  nodes, and end node. The Agentic Process definition must include:

  - `category: "agentic-process"`
  - `model.type: "bpmn:CallActivity"`
  - `model.serviceType: "Orchestrator.StartAgenticProcessAsync"`
  - `model.bindings.resourceSubType: "ProcessOrchestration"`
  - `outputDefinition.output.source: "=result.response"`
  - `outputDefinition.error.source: "=result.Error"`

  ## Verifying your work

  The locally-installed `@uipath/cli@0.1.21` (in `node_modules/.bin`)
  predates the `maestro flow` namespace, so use the host-installed
  bun CLI explicitly:

  ```bash
  $HOME/.bun/bin/uip maestro flow validate CustomerIntakeOrchestration/flow_files/CustomerIntakeOrchestration.flow
  $HOME/.bun/bin/uip maestro flow format CustomerIntakeOrchestration/flow_files/CustomerIntakeOrchestration.flow
  ```

  Iterate until validation succeeds. Do not substitute a mock, connector,
  RPA/API Workflow, inline Agent, HITL, Summarize, Batch Transform, or Queue
  node for the Agentic Process resource node.

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: file_exists
    description: "project.uiproj exists"
    path: "CustomerIntakeOrchestration/project.uiproj"
    weight: 1.0

  - type: file_exists
    description: "Flow file exists"
    path: "CustomerIntakeOrchestration/flow_files/CustomerIntakeOrchestration.flow"
    weight: 1.0

  - type: run_command
    description: "Flow contains the required Agentic Process resource shape"
    command: "python3 $TASK_DIR/../shared/check_process_resource_flow.py --kind agentic-process --v1-flow CustomerIntakeOrchestration/flow_files/CustomerIntakeOrchestration.flow"
    timeout: 10
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  # Use the host-installed uip (bun) explicitly. The env_packages pin
  # `@uipath/cli@0.1.21` installs a CLI without the `maestro flow`
  # namespace into node_modules/.bin, which the sandbox prepends to
  # PATH — so a bare `uip maestro flow validate` resolves to the wrong
  # binary. Same override pattern as rpa_workflow_invocation.
  - type: run_command
    description: "v1 .flow validates"
    command: 'UIPATH_FLOW_CLI=${UIPATH_FLOW_CLI:-$HOME/.bun/bin/uip}; "$UIPATH_FLOW_CLI" maestro flow validate CustomerIntakeOrchestration/flow_files/CustomerIntakeOrchestration.flow'
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: 'UIPATH_FLOW_CLI=${UIPATH_FLOW_CLI:-$HOME/.bun/bin/uip}; "$UIPATH_FLOW_CLI" maestro flow format CustomerIntakeOrchestration/flow_files/CustomerIntakeOrchestration.flow'
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow invokes the Agentic Process and branches on response.status"
    prompt: |
      Did the agent author a v1 .flow JSON that:
      (a) invokes the exact published Agentic Process node
          `runOrchestration` with input `customerName = "Ada Lovelace"`;
      (b) models it as an Orchestrator `StartAgenticProcessAsync`
          `bpmn:CallActivity` process resource with
          `resourceSubType: "ProcessOrchestration"` and folder/name bindings;
      (c) branches on `response.status === "accepted"`;
      (d) routes the accepted branch to `acceptedRoute` and the other branch
          to `reviewRoute`;
      (e) includes definitions and bindings needed for v1 validation?

      Score 1.0 if all five pieces are present and structurally connected.
      Subtract 0.2 for each missing piece. If the Agentic Process node is
      replaced by a mock, connector, workflow, inline Agent, HITL, Summarize,
      Batch Transform, or Queue node, cap the score at 0.3.
    files:
      - "CustomerIntakeOrchestration/flow_files/CustomerIntakeOrchestration.flow"
    weight: 3.0
    pass_threshold: 0.7

  - type: command_executed
    description: "Agent attempted v1 validation"
    tool_name: "Bash"
    command_pattern: "uip.*maestro.*flow.*validate.*CustomerIntakeOrchestration"
    min_count: 1
    require_success: false
    weight: 1.0
    pass_threshold: 1.0
