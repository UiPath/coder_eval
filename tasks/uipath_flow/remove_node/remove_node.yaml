task_id: flow-json-remove-node
description: >
  Remove the script node from a dice-roller flow and connect the trigger
  directly to a new End node — edit flow JSON directly, no CLI.
tags: [flow, flow-json, modify, no-cli]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 30

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../../skills/skills/uipath-maestro-flow"
    - type: template_dir
      path: "../shared/baselines"

initial_prompt: |
  You have the uipath-maestro-flow skill available in the current directory.
  Read SKILL.md for instructions on editing .flow files.

  Read the existing flow at baseline.flow. This is a dice-roller flow with a
  manual trigger ("start") and a script node ("rollDice").

  Modify the flow:
  1. Remove the "rollDice" script node
  2. Remove all edges referencing it
  3. Add an End node (core.control.end)
  4. Wire the trigger's "output" port to the End node's "input" port
  5. Remove the script definition if no longer needed
  6. Regenerate variables.nodes

  Follow the skill's "Remove a Node" workflow from the Common Edits section.
  Save the result as result.flow.

success_criteria:
  - type: file_exists
    description: "Result flow file exists"
    path: "result.flow"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Node removed and flow rewired correctly"
    command: "python3 $TASK_DIR/check_edit.py"
    timeout: 10
    score_from_stdout: true
    weight: 5.0
    pass_threshold: 0.7

max_iterations: 2
