task_id: flow-json-bellevue-weather
description: >
  Medium-complexity flow: HTTP + Script + Decision + 2 End nodes.
  Tests whether the agent defaults to JSON authoring mode (no CLI
  node add) when no mode is specified. The prompt does not mention
  CLI or JSON — the skill should default to JSON for OOTB flows.
tags: [flow, flow-json, generate, mode-default, no-cli-expected]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 50

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/cli@0.1.21"
initial_prompt: |
  Create a UiPath Flow project named "BellevueWeather" that gets today's weather
  in Bellevue from open-meteo, formats a summary with a script, and if the
  temperature is greater than 60F returns a summary with a message field 'nice day',
  otherwise the message field should be 'bring a jacket'.

  Do NOT run flow debug — just validate the flow.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation. Build the complete flow end-to-end in a single pass.
  Before starting, load the uipath-maestro-flow skill. Read and follow its workflow steps exactly.

success_criteria:
  # --- Flow correctness ---
  - type: run_command
    description: "Flow file exists and is valid JSON with required structure"
    command: "python3 -c \"import json,glob; flows=glob.glob('**/BellevueWeather*.flow',recursive=True); assert flows, 'No flow found'; f=json.load(open(flows[0])); nn=len(f['nodes']); ne=len(f['edges']); nd=len(f['definitions']); assert nn>=5, 'Expected 5+ nodes, got %d'%nn; print('OK: %d nodes, %d edges, %d defs'%(nn,ne,nd))\""
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow has required node types: trigger, HTTP, script, decision, end"
    command: "python3 -c \"import json,glob; flows=glob.glob('**/BellevueWeather*.flow',recursive=True); assert flows; f=json.load(open(flows[0])); types=set(n['type'] for n in f['nodes']); required={'core.trigger.manual','core.action.http','core.action.script','core.logic.decision','core.control.end'}; missing=required-types; assert not missing, 'Missing node types: %s'%missing; print('OK: all required types present')\""
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow has decision logic referencing temperature and 60"
    command: "python3 -c \"import json,glob; flows=glob.glob('**/BellevueWeather*.flow',recursive=True); assert flows; content=open(flows[0]).read(); assert '60' in content, 'No 60F threshold found'; assert 'nice day' in content.lower() or 'nice_day' in content.lower() or 'niceday' in content.lower(), 'No nice day message'; assert 'jacket' in content.lower(), 'No jacket message'; print('OK: decision logic present')\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow has open-meteo HTTP URL"
    command: "python3 -c \"import json,glob; flows=glob.glob('**/BellevueWeather*.flow',recursive=True); assert flows; content=open(flows[0]).read(); assert 'open-meteo' in content.lower() or 'openmeteo' in content.lower(), 'No open-meteo URL'; print('OK: open-meteo URL present')\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # --- Mode detection: agent should NOT use uip maestro flow node add ---
  # The skill should default to JSON authoring for OOTB-only flows.
  # Use run_command to check turn records since command_executed has no max_count.
  - type: run_command
    description: "Agent did NOT use uip maestro flow node add (defaulted to JSON authoring)"
    command: "echo 'OK: mode detection requires turn records — checked via eval logs'"
    timeout: 5
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 1
