task_id: uipath-flow-complexity-5-nodes
description: >
  Generate a UiPath Flow with exactly 5 nodes covering the most fundamental
  node types: a trigger, a script action, an HTTP action, a decision branch,
  and a terminate node. This is the minimal complexity tier serving as the
  baseline for benchmarking agent flow-generation capability.
tags: [flow, uipcli, generate, complexity-analysis, 5-nodes]

run_limits:
  turn_timeout: 1200
agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Create a UiPath Flow called "ComplexityTest5" that contains exactly
  5 nodes implementing a simple automation scenario.

  ## Scenario
  Build a flow that calls an external API, checks the response status, and
  terminates with an error message if the service is unhealthy.

success_criteria:
  # ── CLI usage ────────────────────────────────────────────────────────────
  - type: command_executed
    description: "Agent explored the node registry"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+registry\s+(pull|list|get|search)'
    min_count: 1
    require_success: false
    weight: 1.0
    pass_threshold: 1.0

  # ── Node count ───────────────────────────────────────────────────────────
  - type: run_command
    description: "Flow contains more than 4 nodes"
    command: "python3 -c \"import json,sys; nodes=json.load(open('ComplexityTest5/ComplexityTest5/ComplexityTest5.flow'))['nodes']; print(f'{len(nodes)} nodes'); sys.exit(0 if len(nodes)>4 else 1)\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── Edge count ───────────────────────────────────────────────────────────
  - type: run_command
    description: "Flow contains more than 3 edges"
    command: "python3 -c \"import json,sys; edges=json.load(open('ComplexityTest5/ComplexityTest5/ComplexityTest5.flow'))['edges']; print(f'{len(edges)} edges'); sys.exit(0 if len(edges)>3 else 1)\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── CLI validation ──────────────────────────────────────────────────────
  - type: run_command
    description: "uip maestro flow validate passes"
    command: "uip maestro flow validate ComplexityTest5/ComplexityTest5/ComplexityTest5.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Qualitative LLM code review"
    prompt: |
      Evaluate the generated 5-node flow:
      1. Does it contain ~5 nodes?
      2. Is the flow semantically correct?
    include_reference: true
    include_agent_output: true
    include_tool_calls: true
    weight: 1.0
    pass_threshold: 0.7
