task_id: uipath-flow-complexity-10-nodes
description: >
  Generate a UiPath Flow with exactly 10 nodes covering core node types:
  triggers, actions (script, HTTP), control flow (decision, loop, merge,
  terminate), and a delay node. This is the baseline complexity tier for
  benchmarking agent flow-generation capability.
tags: [flow, uipcli, generate, complexity-analysis, 10-nodes]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  turn_timeout: 1200

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Create a UiPath Flow project named "ComplexityTest10" that contains exactly
  10 nodes with a realistic automation scenario.

  ## Scenario: Weather-Based Notification Pipeline
  Build a flow that fetches weather data, evaluates conditions, and sends
  notifications through different channels based on the result.

success_criteria:
  # ── CLI usage ────────────────────────────────────────────────────────────
  - type: command_executed
    description: "Agent explored the node registry"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+registry\s+(pull|list|get|search)'
    min_count: 1
    require_success: false
    weight: 1.0
    pass_threshold: 1.0

  # ── Node count ───────────────────────────────────────────────────────────
  - type: run_command
    description: "Flow contains more than 8 nodes"
    command: "python3 -c \"import json,sys; nodes=json.load(open('ComplexityTest10/ComplexityTest10/ComplexityTest10.flow'))['nodes']; print(f'{len(nodes)} nodes'); sys.exit(0 if len(nodes)>8 else 1)\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── Edge count ───────────────────────────────────────────────────────────
  - type: run_command
    description: "Flow contains more than 7 edges"
    command: "python3 -c \"import json,sys; edges=json.load(open('ComplexityTest10/ComplexityTest10/ComplexityTest10.flow'))['edges']; print(f'{len(edges)} edges'); sys.exit(0 if len(edges)>7 else 1)\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── CLI validation ──────────────────────────────────────────────────────
  - type: run_command
    description: "uip maestro flow validate passes"
    command: "uip maestro flow validate ComplexityTest10/ComplexityTest10/ComplexityTest10.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Qualitative LLM code review"
    prompt: |
      Evaluate the generated 10-node flow:
      1. Does it contain ~10 nodes?
      2. Is the flow semantically correct?
    include_reference: true
    include_agent_output: true
    include_tool_calls: true
    weight: 1.0
    pass_threshold: 0.7
