task_id: uipath-flow-complexity-50-nodes
description: >
  Generate a UiPath Flow with exactly 50 nodes covering all node categories:
  core triggers, actions, logic/control flow, connectors (Outlook, Slack,
  Salesforce, Jira, Confluence), AI agents, sub-processes, and RPA workflows.
  This high-complexity tier tests parallel branch construction, nested loops,
  and multi-service orchestration.
tags: [flow, uipcli, generate, complexity-analysis, 50-nodes]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  turn_timeout: 1200

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Create a UiPath Flow project named "ComplexityTest50" that contains exactly
  50 nodes implementing a comprehensive enterprise automation.

  ## Scenario: Employee Onboarding & IT Provisioning Pipeline
  Build a flow that orchestrates the full employee onboarding process:
  HR data collection, IT account provisioning, equipment ordering, training
  assignment, manager notifications, compliance checks, and status reporting.

success_criteria:
  # ── CLI usage ────────────────────────────────────────────────────────────
  - type: command_executed
    description: "Agent explored the node registry"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+registry\s+(pull|list|get|search)'
    min_count: 1
    require_success: false
    weight: 1.0
    pass_threshold: 1.0

  # ── Node count ───────────────────────────────────────────────────────────
  - type: run_command
    description: "Flow contains more than 40 nodes"
    command: "python3 -c \"import json,sys; nodes=json.load(open('ComplexityTest50/ComplexityTest50/ComplexityTest50.flow'))['nodes']; print(f'{len(nodes)} nodes'); sys.exit(0 if len(nodes)>40 else 1)\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── Edge count ───────────────────────────────────────────────────────────
  - type: run_command
    description: "Flow contains more than 39 edges"
    command: "python3 -c \"import json,sys; edges=json.load(open('ComplexityTest50/ComplexityTest50/ComplexityTest50.flow'))['edges']; print(f'{len(edges)} edges'); sys.exit(0 if len(edges)>39 else 1)\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── CLI validation ──────────────────────────────────────────────────────
  - type: run_command
    description: "uip maestro flow validate passes"
    command: "uip maestro flow validate ComplexityTest50/ComplexityTest50/ComplexityTest50.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Qualitative LLM code review"
    prompt: |
      Evaluate the generated 50-node flow:
      1. Does it contain ~50 nodes?
      2. Is the flow semantically correct?
    include_reference: true
    include_agent_output: true
    include_tool_calls: true
    weight: 1.0
    pass_threshold: 0.7
