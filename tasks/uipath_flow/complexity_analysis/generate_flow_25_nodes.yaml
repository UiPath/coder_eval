task_id: uipath-flow-complexity-25-nodes
description: >
  Generate a UiPath Flow with exactly 25 nodes covering core node types plus
  connector integrations (Outlook, Slack, Salesforce). This medium-complexity
  tier tests the agent's ability to wire multi-service automations with
  conditional routing and data transformation.
tags: [flow, uipcli, generate, complexity-analysis, 25-nodes]
max_iterations: 2

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  turn_timeout: 1200

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Create a UiPath Flow project named "ComplexityTest25" that contains exactly
  25 nodes implementing a realistic multi-service automation.

  ## Scenario: Sales Lead Processing Pipeline
  Build a flow that processes incoming sales leads by enriching data from
  Salesforce, classifying urgency via an AI agent, routing notifications
  through Slack and email, and updating CRM records accordingly.

success_criteria:
  # ── CLI usage ────────────────────────────────────────────────────────────
  - type: command_executed
    description: "Agent explored the node registry"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+registry\s+(pull|list|get|search)'
    min_count: 1
    require_success: false
    weight: 1.0
    pass_threshold: 1.0

  # ── Node count ───────────────────────────────────────────────────────────
  - type: run_command
    description: "Flow contains more than 20 nodes"
    command: "python3 -c \"import json,sys; nodes=json.load(open('ComplexityTest25/ComplexityTest25/ComplexityTest25.flow'))['nodes']; print(f'{len(nodes)} nodes'); sys.exit(0 if len(nodes)>20 else 1)\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── Edge count ───────────────────────────────────────────────────────────
  - type: run_command
    description: "Flow contains more than 19 edges"
    command: "python3 -c \"import json,sys; edges=json.load(open('ComplexityTest25/ComplexityTest25/ComplexityTest25.flow'))['edges']; print(f'{len(edges)} edges'); sys.exit(0 if len(edges)>19 else 1)\""
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── CLI validation ──────────────────────────────────────────────────────
  - type: run_command
    description: "uip maestro flow validate passes"
    command: "uip maestro flow validate ComplexityTest25/ComplexityTest25/ComplexityTest25.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

llm_reviewer:
  enabled: true
  prompt: |
    Evaluate the generated 25-node flow:
    1. Does it contain ~25 nodes?
    2. Is the flow semantically correct?
