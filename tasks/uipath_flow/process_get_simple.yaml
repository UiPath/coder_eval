task_id: uipath-flow-process-get-simple
description: >
  Minimal-prompt evaluation: agent must figure out how to get details of a
  UiPath flow process using uip CLI with no step-by-step guidance.
tags: [flow, uipcli, simple]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 12

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Use the `uip` CLI to get the schema and details of a Flow process and save
  the result to process_details.json. You will first need to discover available
  processes. The `uip` CLI is already available.

success_criteria:
  - type: command_executed
    description: "Agent listed processes to find process-key and feed-id"
    tool_name: "Bash"
    command_pattern: 'uip\s+flow\s+process\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran uip flow process get"
    tool_name: "Bash"
    command_pattern: 'uip\s+flow\s+process\s+get'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "process_details.json file exists"
    path: "process_details.json"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "process_details.json is valid JSON"
    command: "python -c \"import json; json.load(open('process_details.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 2

llm_reviewer:
  enabled: true
