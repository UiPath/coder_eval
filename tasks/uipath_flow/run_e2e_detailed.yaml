task_id: uipath-flow-run-e2e-detailed
description: >
  Detailed-prompt E2E evaluation: agent follows step-by-step instructions to
  list flow processes, run the first available process, monitor job status,
  retrieve traces, and produce a comprehensive summary report using uipcli CLI.
tags: [flow, uipcli, detailed, e2e]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 20

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Perform an end-to-end UiPath Flow run using the `uipcli` CLI tool: list
  processes, run the first one, monitor its status, retrieve traces, and
  produce a summary report.

  Be efficient: redirect output directly to files. Do not run unnecessary
  verification commands.

  ## Step 0: Check login
  Run `uipcli login status --format json`. If expired or not logged in,
  run `uipcli login` first.

  ## Step 1: List all flow processes
  Run `uipcli flow process list --format json > processes.json`
  to discover available processes with their process-key and folder-key.

  ## Step 2: Select and run the first process
  Parse processes.json to extract the process-key and folder-key of the
  **first** process in the list. Then run:
    uipcli flow process run <process-key> <folder-key> --format json > run_result.json
  If no processes are available, write to run_result.json:
    {"status": "skipped", "reason": "no processes found"}
  and skip to Step 5.

  ## Step 3: Check job status
  From run_result.json, extract the job-key. Then run:
    uipcli flow job status <job-key> --format json > job_status.json
  Wait a few seconds and check status again to see if it has progressed:
    uipcli flow job status <job-key> --format json > job_status_final.json

  ## Step 4: Retrieve job traces
  Get execution traces for the job:
    uipcli flow job traces <job-key> --format json > job_traces.json 2>&1 &
    PID=$!; sleep 15; kill $PID 2>/dev/null
  If traces output is empty, write:
    {"status": "completed", "reason": "no traces captured in time window"}

  ## Step 5: Write E2E summary report
  Create e2e_report.json:
    {
      "workflow": "list → run → status → traces",
      "process_key": "<process-key or null>",
      "folder_key": "<folder-key or null>",
      "job_key": "<job-key or null>",
      "job_status": "<final status or null>",
      "traces_captured": <true|false>,
      "steps_completed": ["login_check", "list_processes", "run_process", "job_status", "job_traces", "report"],
      "all_files": ["processes.json", "run_result.json", "job_status.json", "job_status_final.json", "job_traces.json"]
    }

  Important notes:
  - The `uipcli` CLI is already available in the environment.
  - `flow process run` requires two positional args: process-key and folder-key.
  - `flow job status` and `flow job traces` require the job-key from the run result.
  - Do NOT use `timeout` command (not on macOS). Do NOT use TodoWrite.

success_criteria:
  - type: command_executed
    description: "Agent checked login status"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+login\s+status'
    min_count: 1
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed flow processes"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+process\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "processes.json file exists"
    path: "processes.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: run_command
    description: "processes.json is valid JSON"
    command: "python -c \"import json; json.load(open('processes.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran a flow process"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+process\s+run'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "run_result.json file exists"
    path: "run_result.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent checked job status"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+job\s+status'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "job_status.json file exists"
    path: "job_status.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: file_exists
    description: "job_status_final.json file exists"
    path: "job_status_final.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent retrieved job traces"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+job\s+traces'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "job_traces.json file exists"
    path: "job_traces.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: file_exists
    description: "e2e_report.json summary exists"
    path: "e2e_report.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "e2e_report.json is valid JSON"
    command: "python -c \"import json; json.load(open('e2e_report.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Report contains all expected E2E fields"
    path: "e2e_report.json"
    includes:
      - "workflow"
      - "process_key"
      - "folder_key"
      - "job_key"
      - "job_status"
      - "traces_captured"
      - "steps_completed"
      - "all_files"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Report confirms E2E workflow"
    path: "e2e_report.json"
    includes:
      - "list_processes"
      - "run_process"
      - "job_status"
      - "job_traces"
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 3

llm_reviewer:
  enabled: true
