task_id: flow-json-agent-invocation
description: >
  Author a Flow v1 (.flow JSON) project that invokes a published UiPath Agent
  resource, branches on the Agent output, and validates with the v1 schema.
  Mirrors the v2_authoring/agent_invocation_v2 task for v1-v2 comparison.
tags: [flow, flow-json, generate, agent, decision, mock, non-is-node]

run_limits:
  max_turns: 80
  turn_timeout: 1200
  task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/cli@0.1.21"

initial_prompt: |
  Before starting, load the `uipath-maestro-flow` skill and read its
  SKILL.md. Author the flow as JSON. Do NOT use Flow v2, FIL, or C#.
  Do NOT ask for approval, confirmation, or feedback. Build the complete
  flow end-to-end in a single pass.

  Create a UiPath Flow project named **AgentClassifier**.

  ## Scenario

  The flow classifies a customer email with a published UiPath Agent, then
  routes based on the Agent's returned intent.

  Use this published Agent resource:

  - Node type: `uipath.core.agent.93f09b44-e635-40f9-8cab-44ca29e748ed`
  - Node typeVersion: `1.0.0`
  - Node id: `classifyIntent`
  - Display label: `Classify Intent`
  - Resource key: `93f09b44-e635-40f9-8cab-44ca29e748ed`
  - Agent name binding id: `bAgentName`
  - Agent name binding default: `ClassifyIntent`
  - Agent folderPath binding id: `bAgentFolder`
  - Agent folderPath binding default: `Shared`
  - Runtime service type: `Orchestrator.StartAgentJob`
  - Section: `Published`

  ## Flow behavior

  1. Start with a manual trigger.
  2. Invoke the Agent node `classifyIntent` with an input text field
     equivalent to `in_text = "Customer asked for pricing"`.
  3. The Agent output shape is:

     ```json
     { "response": { "intent": "needs_response", "summary": "Customer asked for pricing" } }
     ```

  4. Add a decision based on the Agent output intent.
  5. If the intent is `"needs_response"`, call a mock node named
     `needsResponse`; otherwise call a mock node named `archiveOnly`.
  6. End the flow.

  ## Files to write

  Save the flow as:

  - `AgentClassifier/project.uiproj`
  - `AgentClassifier/flow_files/AgentClassifier.flow`

  Include `bindings_v2.json` only if your flow format needs it, but the
  `.flow` itself must include the two Agent process bindings listed below.

  ## Required Agent node shape

  The Agent node must have:

  - `type: "uipath.core.agent.93f09b44-e635-40f9-8cab-44ca29e748ed"`
  - `typeVersion: "1.0.0"`
  - `model.serviceType: "Orchestrator.StartAgentJob"`
  - `model.section: "Published"`
  - `model.bindings.resource: "process"`
  - `model.bindings.resourceSubType: "Agent"`
  - `model.bindings.resourceKey: "93f09b44-e635-40f9-8cab-44ca29e748ed"`
  - `model.bindings.orchestratorType: "agent"`
  - `model.bindings.values.name: "ClassifyIntent"`
  - `model.bindings.values.folderPath: "Shared"`
  - `model.context` entries for `name`, `folderPath`, and `_label`, where
    `name` references `=bindings.bAgentName` and `folderPath` references
    `=bindings.bAgentFolder`.
  - `outputs.output.source: "=result.response"`
  - `outputs.error.source: "=result.Error"`

  ## Required bindings

  The top-level `.flow` `bindings` array must include:

  - `bAgentName`: `resource: "process"`, `resourceSubType: "Agent"`,
    `propertyAttribute: "name"`, `default: "ClassifyIntent"`
  - `bAgentFolder`: `resource: "process"`, `resourceSubType: "Agent"`,
    `propertyAttribute: "folderPath"`, `default: "Shared"`

  ## Required definitions

  Since this is v1 JSON authoring, include a matching `definitions[]` entry
  for every node type used in the flow, including the published Agent node,
  manual trigger, decision, mock nodes, and end node. The Agent definition
  must include `model.serviceType: "Orchestrator.StartAgentJob"`.

  ## Verifying your work

  ```bash
  uip maestro flow validate AgentClassifier/flow_files/AgentClassifier.flow
  uip maestro flow format AgentClassifier/flow_files/AgentClassifier.flow
  ```

  Iterate until validation succeeds.

success_criteria:
  - type: file_exists
    description: "project.uiproj exists"
    path: "AgentClassifier/project.uiproj"
    weight: 1.0

  - type: file_exists
    description: "Flow file exists"
    path: "AgentClassifier/flow_files/AgentClassifier.flow"
    weight: 1.0

  - type: run_command
    description: "Flow file is valid JSON with nodes, edges, definitions, and bindings"
    command: |
      python3 -c "
      import json
      f = json.load(open('AgentClassifier/flow_files/AgentClassifier.flow'))
      assert isinstance(f.get('nodes'), list), 'no nodes array'
      assert isinstance(f.get('edges'), list), 'no edges array'
      assert isinstance(f.get('definitions'), list), 'no definitions array'
      assert isinstance(f.get('bindings'), list), 'no bindings array'
      print(f'OK: {len(f[\"nodes\"])} nodes, {len(f[\"edges\"])} edges, {len(f[\"definitions\"])} defs')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow contains published Agent node with required runtime model"
    command: |
      python3 -c "
      import json
      f = json.load(open('AgentClassifier/flow_files/AgentClassifier.flow'))
      nodes = f.get('nodes', [])
      agents = [n for n in nodes if n.get('type') == 'uipath.core.agent.93f09b44-e635-40f9-8cab-44ca29e748ed']
      assert agents, 'no published Agent node found'
      n = agents[0]
      assert n.get('id') == 'classifyIntent', n.get('id')
      model = n.get('model') or {}
      assert model.get('serviceType') == 'Orchestrator.StartAgentJob', model
      assert model.get('section') == 'Published', model
      bindings = model.get('bindings') or {}
      assert bindings.get('resource') == 'process', bindings
      assert bindings.get('resourceSubType') == 'Agent', bindings
      assert bindings.get('resourceKey') == '93f09b44-e635-40f9-8cab-44ca29e748ed', bindings
      assert bindings.get('orchestratorType') == 'agent', bindings
      assert bindings.get('values', {}).get('name') == 'ClassifyIntent', bindings
      assert bindings.get('values', {}).get('folderPath') == 'Shared', bindings
      context = {e.get('name'): e for e in model.get('context', [])}
      assert context.get('name', {}).get('value') == '=bindings.bAgentName', context
      assert context.get('folderPath', {}).get('value') == '=bindings.bAgentFolder', context
      print('published Agent node model ok')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow has process Agent name and folderPath bindings"
    command: |
      python3 -c "
      import json
      f = json.load(open('AgentClassifier/flow_files/AgentClassifier.flow'))
      by_id = {b.get('id'): b for b in f.get('bindings', [])}
      name = by_id.get('bAgentName')
      folder = by_id.get('bAgentFolder')
      assert name, 'missing bAgentName'
      assert folder, 'missing bAgentFolder'
      assert name.get('resource') == 'process' and name.get('resourceSubType') == 'Agent', name
      assert name.get('propertyAttribute') == 'name' and name.get('default') == 'ClassifyIntent', name
      assert folder.get('resource') == 'process' and folder.get('resourceSubType') == 'Agent', folder
      assert folder.get('propertyAttribute') == 'folderPath' and folder.get('default') == 'Shared', folder
      print('Agent bindings ok')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "All node types have matching definitions"
    command: |
      python3 -c "
      import json
      f = json.load(open('AgentClassifier/flow_files/AgentClassifier.flow'))
      used = {n.get('type') for n in f.get('nodes', [])}
      defined = {d.get('nodeType') for d in f.get('definitions', [])}
      missing = used - defined
      assert not missing, f'missing definitions for: {missing}'
      agent_defs = [d for d in f.get('definitions', []) if d.get('nodeType') == 'uipath.core.agent.93f09b44-e635-40f9-8cab-44ca29e748ed']
      assert agent_defs, 'missing Agent definition'
      assert agent_defs[0].get('model', {}).get('serviceType') == 'Orchestrator.StartAgentJob', agent_defs[0]
      print('definitions ok')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow has Agent output decision with needsResponse/archiveOnly branches"
    command: |
      python3 -c "
      import json
      f = json.load(open('AgentClassifier/flow_files/AgentClassifier.flow'))
      blob = json.dumps(f)
      types = [n.get('type', '') for n in f.get('nodes', [])]
      ids = {n.get('id') for n in f.get('nodes', [])}
      assert 'core.logic.decision' in types, f'no decision node: {types}'
      assert 'needsResponse' in ids, ids
      assert 'archiveOnly' in ids, ids
      assert 'needs_response' in blob, 'decision does not mention needs_response'
      assert 'classifyIntent' in blob, 'decision path does not reference Agent node'
      print('Agent routing shape ok')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow validates with uip maestro flow validate"
    command: "uip maestro flow validate AgentClassifier/flow_files/AgentClassifier.flow"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: "uip maestro flow format AgentClassifier/flow_files/AgentClassifier.flow"
    timeout: 60
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Agent output controls the routing path"
    prompt: |
      Evaluate whether this Flow v1 JSON project actually invokes the Agent
      in the business path and branches on the Agent's parsed output.

      Required:
      1. The flow contains a published Agent node with id `classifyIntent`.
      2. The Agent node is wired after the trigger and before the decision.
      3. The decision reads or is clearly intended to read the Agent output
         intent and checks for `needs_response`.
      4. The `needs_response` path reaches `needsResponse`, while another
         path reaches `archiveOnly`.
      5. The flow uses process Agent bindings, not connector bindings.

      Score 1.0 if all five are clearly true; 0.5 if the Agent node exists
      but routing is weak or hardcoded; 0 if the Agent is not in the actual
      decision path.
    files:
      - "AgentClassifier/flow_files/AgentClassifier.flow"
    weight: 3.0
    pass_threshold: 0.7
