task_id: uipath-flow-node-detailed
description: >
  Detailed-prompt evaluation: agent follows step-by-step instructions to explore
  Flow nodes using uipcli CLI including pull, list, search, and get commands.
tags: [flow, uipcli, detailed]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 14

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Use the `uipcli` CLI tool to explore Flow nodes through all available
  node management commands.

  Be efficient: redirect output directly to files. Do not run unnecessary
  verification commands.

  ## Step 1: Pull node data from registry
  Run all of these in parallel:
    uipcli flow node pull --format json > nodes_pull.json
    uipcli flow node pull --force --format json > nodes_pull_force.json

  ## Step 2: List and search nodes (ALL 4 in ONE parallel batch)
  Run all of these in parallel:
    uipcli flow node list --format json > nodes_list.json
    uipcli flow node list --format yaml > nodes_list.yaml
    uipcli flow node search http --format json > nodes_search_http.json
    uipcli flow node search --filter "category=agent" --format json > nodes_search_agent.json

  ## Step 3: Get node details
  From the list or search output, pick a node type (e.g., `core.action.http`).
  Run:
    uipcli flow node get <nodeType> --format json > node_details.json

  ## Step 4: Write summary report
  Create nodes_report.json:
    {
      "commands_used": ["node pull", "node list", "node search", "node get"],
      "total_nodes_cached": <count from list>,
      "search_keyword_used": "http",
      "search_filter_used": "category=agent",
      "node_type_inspected": "<nodeType>",
      "formats_tested": ["json", "yaml"],
      "options_exercised": ["--format json", "--format yaml", "--force", "--filter"],
      "steps_completed": ["pull", "pull_force", "list", "list_yaml", "search_keyword", "search_filter", "get", "report"]
    }

  Important notes:
  - The `uipcli` CLI is already available in the environment.
  - Node commands work locally after pull — no login required for list/search/get.
  - Use `--format json` unless testing other formats.
  - Maximize parallelism: Step 1 = 2 parallel calls, Step 2 = 4 parallel calls.

success_criteria:
  - type: command_executed
    description: "Agent pulled node data"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+node\s+pull'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "nodes_pull.json exists"
    path: "nodes_pull.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --force on node pull"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+node\s+pull.*--force'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "nodes_pull_force.json exists"
    path: "nodes_pull_force.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed nodes"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+node\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "nodes_list.json exists"
    path: "nodes_list.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed nodes in YAML format"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+node\s+list.*--format\s+yaml'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "nodes_list.yaml exists"
    path: "nodes_list.yaml"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent searched nodes by keyword"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+node\s+search\s+\S+'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "nodes_search_http.json exists"
    path: "nodes_search_http.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --filter on node search"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+node\s+search.*--filter'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "nodes_search_agent.json exists"
    path: "nodes_search_agent.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent got details of a specific node"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+node\s+get\s+\S+'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "node_details.json exists"
    path: "node_details.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "nodes_report.json summary exists"
    path: "nodes_report.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "nodes_report.json is valid JSON"
    command: "python -c \"import json; json.load(open('nodes_report.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Report contains expected summary fields"
    path: "nodes_report.json"
    includes:
      - "commands_used"
      - "total_nodes_cached"
      - "search_keyword_used"
      - "node_type_inspected"
      - "formats_tested"
      - "options_exercised"
      - "steps_completed"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Report confirms options were exercised"
    path: "nodes_report.json"
    includes:
      - "--format json"
      - "--format yaml"
      - "--force"
      - "--filter"
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 2

llm_reviewer:
  enabled: true
