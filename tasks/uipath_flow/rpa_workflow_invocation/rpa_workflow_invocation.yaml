task_id: flow-json-rpa-workflow-invocation
description: >
  Author a Flow v1 (.flow JSON) project that invokes a published RPA Workflow
  process resource, branches on the returned job id, and validates with the v1
  schema. V1 counterpart to v2_authoring/rpa_workflow_invocation_v2.
tags: [flow, flow-json, generate, rpa-workflow, decision, mock, non-is-node]

run_limits:
  max_turns: 120
  turn_timeout: 1200
  task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/cli@0.1.21"

initial_prompt: |
  Before starting, load the `uipath-maestro-flow` skill and read its
  SKILL.md. Author the flow as v1 JSON. Do NOT use Flow v2, FIL, or C#.
  Do NOT ask for approval, confirmation, or feedback. Build the complete
  flow end-to-end in a single pass.

  Create a UiPath Flow project named **RpaWorkflowGate**.

  ## Scenario

  The flow invokes a published RPA Workflow process, then branches based on
  the returned job id.

  Use this published RPA Workflow resource exactly:

  - Node type: `uipath.core.rpa-workflow.7648307a-b180-467c-81f3-06f49a87313b`
  - Node typeVersion: `1.0.0`
  - Node id: `runRobot`
  - Display label: `RPA Workflow12Feb`
  - Resource key: `Shared/sol_with_all_projects.RPA Workflow12Feb`
  - RPA Workflow name binding id: `bRpaName`
  - RPA Workflow name binding default: `RPA Workflow12Feb`
  - RPA Workflow folderPath binding id: `bRpaFolder`
  - RPA Workflow folderPath binding default: `Shared/sol_with_all_projects`
  - Runtime service type: `Orchestrator.StartJob`
  - Resource sub type: `Process`
  - Orchestrator type: `process`
  - Section: `Published`

  ## Flow behavior

  1. Start with a manual trigger.
  2. Invoke `runRobot` with an input equivalent to:

     ```json
     { "newArgument": "" }
     ```

  3. Treat the RPA Workflow output shape as:

     ```json
     { "output": { "jobId": "dry-run-job" } }
     ```

  4. Add a decision that checks whether `output.jobId` is present and not
     an empty string.
  5. If a job id is present, call a mock node named `robotStarted`.
  6. Otherwise, call a mock node named `robotEscalated`.
  7. End the flow.

  ## Files to write

  Save the flow as:

  - `RpaWorkflowGate/project.uiproj`
  - `RpaWorkflowGate/flow_files/RpaWorkflowGate.flow`

  ## Required RPA Workflow node shape

  The RPA Workflow node must have:

  - `type: "uipath.core.rpa-workflow.7648307a-b180-467c-81f3-06f49a87313b"`
  - `typeVersion: "1.0.0"`
  - `inputs.newArgument: ""`
  - `model.serviceType: "Orchestrator.StartJob"`
  - `model.section: "Published"`
  - `model.bindings.resource: "process"`
  - `model.bindings.resourceSubType: "Process"`
  - `model.bindings.resourceKey: "Shared/sol_with_all_projects.RPA Workflow12Feb"`
  - `model.bindings.orchestratorType: "process"`
  - `model.bindings.values.name: "RPA Workflow12Feb"`
  - `model.bindings.values.folderPath: "Shared/sol_with_all_projects"`
  - `model.context` entries for `name`, `folderPath`, and `_label`, where
    `name` references `=bindings.bRpaName` and `folderPath` references
    `=bindings.bRpaFolder`.
  - `outputs.error.source: "=Error"`

  Put this `model` object directly on the `runRobot` node, not only on the
  matching definition:

  ```json
  {
    "type": "bpmn:ServiceTask",
    "serviceType": "Orchestrator.StartJob",
    "version": "v2",
    "section": "Published",
    "bindings": {
      "resource": "process",
      "resourceSubType": "Process",
      "resourceKey": "Shared/sol_with_all_projects.RPA Workflow12Feb",
      "orchestratorType": "process",
      "values": {
        "name": "RPA Workflow12Feb",
        "folderPath": "Shared/sol_with_all_projects"
      }
    },
    "context": [
      {
        "name": "name",
        "type": "string",
        "value": "=bindings.bRpaName",
        "default": "RPA Workflow12Feb"
      },
      {
        "name": "folderPath",
        "type": "string",
        "value": "=bindings.bRpaFolder",
        "default": "Shared/sol_with_all_projects"
      },
      {
        "name": "_label",
        "type": "string",
        "value": "RPA Workflow12Feb"
      }
    ]
  }
  ```

  ## Required bindings

  The top-level `.flow` `bindings` array must include:

  - `bRpaName`: `resource: "process"`, `resourceSubType: "Process"`,
    `resourceKey: "Shared/sol_with_all_projects.RPA Workflow12Feb"`,
    `propertyAttribute: "name"`, `default: "RPA Workflow12Feb"`
  - `bRpaFolder`: `resource: "process"`, `resourceSubType: "Process"`,
    `resourceKey: "Shared/sol_with_all_projects.RPA Workflow12Feb"`,
    `propertyAttribute: "folderPath"`,
    `default: "Shared/sol_with_all_projects"`

  ## Required definitions

  Include a matching `definitions[]` entry for every node type used in the
  flow, including this RPA Workflow node, manual trigger, decision, mock
  nodes, and end node. The RPA Workflow definition must include
  `model.serviceType: "Orchestrator.StartJob"`.

  ## Verifying your work

  The locally-installed `@uipath/cli@0.1.21` (in `node_modules/.bin`)
  predates the `maestro flow` namespace, so use the host-installed
  bun CLI explicitly:

  ```bash
  $HOME/.bun/bin/uip maestro flow validate RpaWorkflowGate/flow_files/RpaWorkflowGate.flow
  $HOME/.bun/bin/uip maestro flow format RpaWorkflowGate/flow_files/RpaWorkflowGate.flow
  ```

  Iterate until validation succeeds. Do not substitute a mock node for the
  RPA Workflow resource node.

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: file_exists
    description: "project.uiproj exists"
    path: "RpaWorkflowGate/project.uiproj"
    weight: 1.0

  - type: file_exists
    description: "Flow file exists"
    path: "RpaWorkflowGate/flow_files/RpaWorkflowGate.flow"
    weight: 1.0

  - type: run_command
    description: "Flow contains the required RPA Workflow process-resource shape"
    command: "python3 $TASK_DIR/../shared/check_process_resource_flow.py --kind rpa --v1-flow RpaWorkflowGate/flow_files/RpaWorkflowGate.flow"
    timeout: 10
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  # Use the host-installed uip (bun) explicitly. The env_packages pin
  # `@uipath/cli@0.1.21` installs a CLI without the `maestro flow`
  # namespace into node_modules/.bin, which the sandbox prepends to
  # PATH — so a bare `uip maestro flow validate` resolves to the wrong
  # binary. Same override pattern as hitl_quickform.
  - type: run_command
    description: "v1 .flow validates"
    command: 'UIPATH_FLOW_CLI=${UIPATH_FLOW_CLI:-$HOME/.bun/bin/uip}; "$UIPATH_FLOW_CLI" maestro flow validate RpaWorkflowGate/flow_files/RpaWorkflowGate.flow'
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: 'UIPATH_FLOW_CLI=${UIPATH_FLOW_CLI:-$HOME/.bun/bin/uip}; "$UIPATH_FLOW_CLI" maestro flow format RpaWorkflowGate/flow_files/RpaWorkflowGate.flow'
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow invokes the RPA Workflow and branches on output.jobId"
    prompt: |
      Did the agent author a v1 .flow JSON that:
      (a) invokes the exact published RPA Workflow node `runRobot` with
          input `newArgument = ""`;
      (b) models it as an Orchestrator `StartJob` process resource with
          `resourceSubType: "Process"` and folder/name bindings;
      (c) branches on `output.jobId` being present/non-empty;
      (d) routes the success branch to `robotStarted` and fallback branch to
          `robotEscalated`;
      (e) includes definitions and bindings needed for v1 validation?

      Score 1.0 if all five pieces are present and structurally connected.
      Subtract 0.2 for each missing piece. If the RPA Workflow node is
      replaced by a mock or connector, cap the score at 0.3.
    files:
      - "RpaWorkflowGate/flow_files/RpaWorkflowGate.flow"
    weight: 3.0
    pass_threshold: 0.7

  - type: command_executed
    description: "Agent attempted v1 validation"
    tool_name: "Bash"
    command_pattern: "uip.*maestro.*flow.*validate.*RpaWorkflowGate"
    min_count: 1
    require_success: false
    weight: 1.0
    pass_threshold: 1.0
