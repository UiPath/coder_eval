task_id: uipath-flow-slack-channel-description
description: >
  Create a UiPath Flow that uses the Slack IS connector to retrieve the
  channel description of #office-bellevue and outputs it. This is an
  end-to-end test that exercises connector discovery, connection binding,
  reference resolution, node configuration, and cloud debug execution.
tags: [flow, uip, p0, generate, connector, e2e]
max_iterations: 1

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  turn_timeout: 1200

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Create a UiPath Flow named "SlackChannelDescription" that retrieves
  the channel description of #office-bellevue and outputs it.

  Do NOT run flow debug — just validate the flow.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation. Build the complete flow end-to-end in a single pass.
  Before starting, load the uipath-flow skill. Read and follow its workflow steps exactly.

success_criteria:
  # ── Flow file validity ─────────────────────────────────────────────────
  - type: run_command
    description: "uip flow validate passes on the flow file"
    command: "python3 -c \"import glob,subprocess,sys; flows=glob.glob('**/SlackChannelDescription*.flow',recursive=True); sys.exit(1) if not flows else sys.exit(subprocess.run(['uip','flow','validate',flows[0],'--output','json']).returncode)\""
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── End-to-end execution ────────────────────────────────────────────────
  - type: run_command
    description: "Flow debug runs successfully and output contains the Bellevue office address"
    command: "python3 $TASK_DIR/check_channel_description.py"
    timeout: 120
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0
