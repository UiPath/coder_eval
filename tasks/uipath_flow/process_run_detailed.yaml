task_id: uipath-flow-process-run-detailed
description: >
  Detailed-prompt evaluation: agent follows step-by-step instructions to run a
  UiPath Flow process, monitor its job status and traces using uipcli CLI.
tags: [flow, uipcli, detailed]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 18

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Use the `uipcli` CLI tool to run a Flow process and monitor its execution.

  Be efficient: redirect output directly to files. Do not run unnecessary
  verification commands.

  ## Step 0: Check login
  Run `uipcli login status --format json`. If expired or not logged in,
  run `uipcli login` first.

  ## Step 1: List processes
  Run `uipcli flow process list --format json > processes.json`
  to discover available processes with their process-key and folder-key.

  ## Step 2: Run a process
  From the list output, extract a `process-key` and `folder-key`. Then run:
    uipcli flow process run <process-key> <folder-key> --format json > run_result.json
  If no processes are available, write to run_result.json:
    {"status": "skipped", "reason": "no processes found"}
  and skip to Step 5.

  ## Step 3: Check job status
  From the run result, extract the job-key. Then run:
    uipcli flow job status <job-key> --format json > job_status.json
  Also try with --detailed flag:
    uipcli flow job status <job-key> --detailed --format json > job_status_detailed.json

  ## Step 4: Get job traces
  Stream traces for the job (use a short timeout since the job may complete quickly):
    uipcli flow job traces <job-key> --format json > job_traces.json 2>&1 &
    PID=$!; sleep 15; kill $PID 2>/dev/null
  If traces output is empty, write:
    {"status": "completed", "reason": "no traces captured in time window"}

  ## Step 5: Write summary report
  Create run_report.json:
    {
      "command_used": "uipcli flow process run",
      "process_key": "<process-key or null>",
      "folder_key": "<folder-key or null>",
      "job_key": "<job-key or null>",
      "job_status": "<status from step 3 or null>",
      "traces_captured": <true|false>,
      "options_exercised": ["--format json", "--detailed"],
      "steps_completed": ["list_processes", "run_process", "job_status", "job_traces", "report"]
    }

  Important notes:
  - The `uipcli` CLI is already available in the environment.
  - `flow process run` requires two positional args: process-key and folder-key.
  - `flow job status` and `flow job traces` require the job-key from the run result.
  - Do NOT use `timeout` command (not on macOS). Do NOT use TodoWrite.

success_criteria:
  - type: command_executed
    description: "Agent listed processes"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+process\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "processes.json file exists"
    path: "processes.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran uipcli flow process run"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+process\s+run'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "run_result.json file exists"
    path: "run_result.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent checked job status"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+job\s+status'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "job_status.json file exists"
    path: "job_status.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --detailed flag on job status"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+job\s+status.*--detailed'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "job_status_detailed.json exists"
    path: "job_status_detailed.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent captured job traces"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+job\s+traces'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "job_traces.json exists"
    path: "job_traces.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: file_exists
    description: "run_report.json summary exists"
    path: "run_report.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "run_report.json is valid JSON"
    command: "python -c \"import json; json.load(open('run_report.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Report contains expected summary fields"
    path: "run_report.json"
    includes:
      - "command_used"
      - "process_key"
      - "folder_key"
      - "job_key"
      - "job_status"
      - "traces_captured"
      - "steps_completed"
    weight: 1.5
    pass_threshold: 1.0

max_iterations: 2

llm_reviewer:
  enabled: true
