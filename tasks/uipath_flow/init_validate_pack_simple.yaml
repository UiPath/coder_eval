task_id: uipath-flow-init-validate-pack-simple
description: >
  Minimal-prompt evaluation: agent must figure out how to initialize, validate,
  and pack a Flow project using uip CLI with no step-by-step guidance.
tags: [flow, uipcli, simple]

max_turns: 12
agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Use the `uip` CLI to create a new Flow project called "TestFlow", validate
  its .flow file, and pack it into a .nupkg package. Save a summary to
  project_report.json. The `uip` CLI is already available.

success_criteria:
  - type: command_executed
    description: "Agent initialized a Flow project"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+init'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent validated a .flow file"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent packed the project"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+pack'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "project_report.json summary exists"
    path: "project_report.json"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "project_report.json is valid JSON"
    command: "python -c \"import json; json.load(open('project_report.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
