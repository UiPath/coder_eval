task_id: flow-json-add-decision
description: >
  Add a Decision node to an existing dice-roller flow using the uipath-maestro-flow
  skill — edit flow JSON directly, no CLI.
tags: [flow, flow-json, modify, no-cli]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 30

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../../skills/skills/uipath-maestro-flow"
    - type: template_dir
      path: "../shared/baselines"

initial_prompt: |
  You have the uipath-maestro-flow skill available in the current directory.
  Read SKILL.md for instructions on editing .flow files.

  Read the existing flow at baseline.flow. This is a dice-roller flow with a
  manual trigger and a script node that rolls a 6-sided die.

  Modify the flow to add a Decision node after the script node that checks
  if the dice result is greater than 3. Wire the "true" branch to a new
  End node (labeled "High Roll") and the "false" branch to another End node
  (labeled "Low Roll").

  Follow the skill's "Add a Node" workflow from the Common Edits section.
  Save the result as result.flow.

success_criteria:
  - type: file_exists
    description: "Result flow file exists"
    path: "result.flow"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Decision node added and wired correctly"
    command: "python3 $TASK_DIR/check_edit.py"
    timeout: 10
    score_from_stdout: true
    weight: 5.0
    pass_threshold: 0.7

max_iterations: 2
