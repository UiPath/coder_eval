task_id: flow-json-rpa-node
description: >
  Create a flow with a dynamic RPA workflow resource node using the uipath-flow
  skill's resource node guides and the uip registry CLI.
tags: [flow, flow-json, generate, dynamic, tier-3, integration]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 50

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/cli@0.1.21"
  template_sources:
    - type: template_dir
      path: "../../../templates/uipath-flow-starter"

initial_prompt: |
  Before starting, load the uipath-flow skill. Read and follow its workflow steps exactly.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation. Build the complete flow end-to-end in a single pass.

  Create a UiPath Flow project named "InvoiceFlow" that:
  1. Starts with a manual trigger
  2. Uses a Script node to prepare input data
  3. Calls an RPA workflow via a dynamic resource node
     - Use `uipcli flow registry pull --force` to refresh the registry
     - Use `uipcli flow registry search "process" --output json` to find available processes
     - Pick any RPA process from the results and add it as a resource node
     - Follow the resource-node-guide.md for the full procedure
  4. Ends with an End node

  If no RPA processes are available in the registry, use a core.logic.mock
  placeholder instead and note what it replaces.

  Save as InvoiceFlow/flow_files/InvoiceFlow.flow with project.uiproj.

success_criteria:
  - type: file_exists
    description: "project.uiproj exists"
    path: "InvoiceFlow/project.uiproj"
    weight: 1.0
    pass_threshold: 1.0

  - type: json_check
    description: "Flow file is valid JSON"
    path: "InvoiceFlow/flow_files/InvoiceFlow.flow"
    assertions:
      - expression: "nodes"
        operator: "type"
        expected: "array"
      - expression: "definitions"
        operator: "type"
        expected: "array"
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Has trigger and at least one resource or mock node"
    command: "python3 -c \"import json; f=json.load(open('InvoiceFlow/flow_files/InvoiceFlow.flow')); types=[n['type'] for n in f['nodes']]; assert 'core.trigger.manual' in types; has_rpa=any(t.startswith('uipath.core.rpa-workflow') or t.startswith('uipath.core.process') for t in types); has_mock='core.logic.mock' in types; assert has_rpa or has_mock, 'No RPA or mock node'; used={n['type'] for n in f['nodes']}; defined={d['nodeType'] for d in f.get('definitions',[])}; missing=used-defined; assert not missing, f'Missing definitions: {missing}'; print(f'OK: RPA={has_rpa}, Mock={has_mock}')\""
    timeout: 10
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent explored the registry"
    tool_name: "Bash"
    command_pattern: "uipcli.*flow.*registry.*(pull|search|get)"
    min_count: 1
    require_success: false
    weight: 2.0
    pass_threshold: 1.0

max_iterations: 2
