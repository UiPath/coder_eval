task_id: uipath-flow-devconnect-email
description: >
  Create a UiPath Flow that reads the latest Outlook email, uses an AI agent
  to classify it into categories (needs response, take action, or other), then
  sends a Slack message if the email needs attention, otherwise tags it in
  Outlook. Tests connector discovery, AI agent node wiring, and conditional
  routing with the Switch node.
initial_prompt: |
  Create a UiPath Flow named "EmailClassifier" that reads my latest Outlook email,
  uses an AI agent to classify it into categories (needs response, take action, or other),
  then sends me a Slack message if it needs attention, otherwise tags it in Outlook.

  After you create the architectural plan, skip detailed phase 2 validation and proceed
  directly to building the flow with the required nodes.
tags: [flow, uip, agent, outlook, slack, switch, intermediate, generate]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Glob", "Grep"]
  plugins:
    - type: "local"
      path: $UIPATH_PLUGIN_MARKETPLACE_DIR/
  max_turns: 60
  turn_timeout: 600

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/uipcli@0.1.3"
  limits:
    timeout: 600
  template_sources:
    - type: template_dir
      path: "../../../../templates/uipath-flow-starter"

success_criteria:
  # ── CLI usage ────────────────────────────────────────────────────────────
  - type: command_executed
    description: "Agent initialized a Flow project"
    tool_name: "Bash"
    command_pattern: 'uip\s+flow\s+init'
    min_count: 1
    require_success: false
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent explored the node registry"
    tool_name: "Bash"
    command_pattern: 'uip\s+flow\s+registry\s+(search|list|get|pull)'
    min_count: 1
    require_success: false
    weight: 1.0
    pass_threshold: 1.0

  # ── Flow file existence & validity ──────────────────────────────────────
  - type: file_check
    description: "Flow file exists and is valid JSON"
    path: "EmailClassifier/EmailClassifier/EmailClassifier.flow"
    patterns:
      - pattern: '^\s*\{'
        must_match: true
    weight: 2.0
    pass_threshold: 1.0

  # ── Node type presence ───────────────────────────────────────────────────
  - type: file_contains
    description: "Flow contains an Outlook get-newest-email node"
    path: "EmailClassifier/EmailClassifier/EmailClassifier.flow"
    includes:
    # Ignoring the following as there's a uipath-mock-outlook
#     - "uipath-microsoft-outlook365"
      - "get-newest-email"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Flow contains an AI agent node for classification"
    path: "EmailClassifier/EmailClassifier/EmailClassifier.flow"
    includes:
      - "agent"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Flow contains a Switch node for conditional routing"
    path: "EmailClassifier/EmailClassifier/EmailClassifier.flow"
    includes:
      - "core.logic.switch"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Flow contains a Slack send-message node"
    path: "EmailClassifier/EmailClassifier/EmailClassifier.flow"
    includes:
      - "slack"
      - "send-message"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Flow contains an Outlook set-email-categories node"
    path: "EmailClassifier/EmailClassifier/EmailClassifier.flow"
    includes:
      - "set-email-categories"
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip flow validate passes on the flow file"
    command: "uip flow validate EmailClassifier/EmailClassifier/EmailClassifier.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # ── Reference comparison ─────────────────────────────────────────────────
  - type: reference_comparison
    description: "Flow structure is similar to the reference solution"
    agent_file: "EmailClassifier/EmailClassifier/EmailClassifier.flow"
    comparison_method: token
    similarity_threshold: 0.3
    weight: 2.0
    pass_threshold: 0.3

max_iterations: 2

llm_reviewer:
  enabled: true
  prompt: |
    Evaluate the agent's EmailClassifier flow against the following requirements:

    1. Does the flow read the latest Outlook email using a connector node?
    2. Does the flow use an AI agent node to classify the email into categories
       (needs response, take action, or other)?
    3. Does the flow use a Switch node to route based on the classification?
    4. Is a Slack message sent when the email needs attention?
    5. Is the Outlook set-email-categories node used for "other" emails?
    6. Is the flow valid JSON and does it pass uip validation?
    7. Did the agent use the registry to discover connector node types?
