task_id: uipath-flow-weather-slack-alert-v2
description: >
  Author a Flow v2 project (FIL + manifest + bindings) that fetches Denver's
  temperature from a free weather API, evaluates if it's warm (>60F) or cold
  (≤60F), and sends a Slack message with the appropriate response.
  Mirror of `weather-slack-alert` for v2 toolchain comparison.
initial_prompt: |
  Author a UiPath Flow v2 project named **WeatherAlert** in the current
  directory. Read `SKILL.md` first — it covers FIL syntax, the manifest
  envelope, the binding requirements, and HTTP/script node patterns.
  There is a worked example in `example/`.

  ## Scenario

  Fetch Denver's current temperature from a free weather API (e.g.
  Open-Meteo), check whether it's warmer than 60°F, and send a Slack DM:
  - if temp > 60°F → message body "its warm"
  - else          → message body "its cold"

  ## Files to write (project root, not under `example/`)

  - `WeatherAlert.fil.ts`        FIL source
  - `WeatherAlert.flow.json`     Manifest
  - `bindings.json`              Connection IDs (stub UUIDs are fine)

  Use these node types:
    - `core.action.http`                                 (fetch the API)
    - `core.action.script`                               (extract the temperature)
    - `core.logic.decision`                              (>60 branch — generated by FIL `if`)
    - `uipath.connector.uipath-salesforce-slack.send-message-to-user`  (×2)

  ## Verifying your work

  ```bash
  ./parse-fil.sh WeatherAlert.fil.ts            # FIL parses
  ./convert.sh WeatherAlert                     # produces WeatherAlert.flow
  uip maestro flow validate WeatherAlert.flow   # must print "Result": "Success"
  ```

  Iterate until validate prints `"Result": "Success"`.

tags: [flow, integration, intermediate, flow-v2]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Glob", "Grep"]
  max_turns: 30

sandbox:
  driver: tempdir
  python:
    env_packages:
      - requests
      - jsonschema
  template_sources:
    - type: template_dir
      path: "../../../../templates/flow-v2"

success_criteria:
  # ── Three v2 source files exist ──────────────────────────────────────────
  - type: file_exists
    description: "FIL source file exists"
    path: "WeatherAlert.fil.ts"
    weight: 1.0

  - type: file_exists
    description: "Manifest exists"
    path: "WeatherAlert.flow.json"
    weight: 1.0

  - type: file_exists
    description: "Bindings exist"
    path: "bindings.json"
    weight: 1.0

  # ── FIL parses cleanly ───────────────────────────────────────────────────
  - type: run_command
    description: "FIL compiles to WAT (parses cleanly)"
    command: "./parse-fil.sh WeatherAlert.fil.ts"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── v2 → v1 conversion succeeds ──────────────────────────────────────────
  - type: run_command
    description: "v2 → v1 conversion produces WeatherAlert.flow"
    command: "./convert.sh WeatherAlert"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # ── Converted .flow has the expected pieces ──────────────────────────────
  # Mirrors the v1 task's content checks but on the converted output.
  - type: json_check
    path: "WeatherAlert.flow"
    description: "Converted flow has nodes/edges and ≥3 nodes"
    assertions:
      - expression: "nodes"
        operator: "exists"
      - expression: "edges"
        operator: "exists"
      - expression: "length(nodes)"
        operator: "gte"
        expected: 3
    weight: 2.0
    pass_threshold: 0.9

  - type: file_check
    description: "Converted flow contains an HTTP node"
    path: "WeatherAlert.flow"
    includes:
      - "core.action.http"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_check
    description: "Converted flow contains decision logic at the 60-degree threshold"
    path: "WeatherAlert.flow"
    includes:
      - "core.logic.decision"
      - "60"
    weight: 1.5
    pass_threshold: 0.8

  - type: file_check
    description: "Converted flow contains the Slack messages"
    path: "WeatherAlert.flow"
    includes:
      - "uipath-salesforce-slack"
      - "its warm"
      - "its cold"
    weight: 1.5
    pass_threshold: 0.8

  # ── uip maestro flow validate ────────────────────────────────────────────
  - type: run_command
    description: "Converted .flow passes uip maestro flow validate"
    command: "uip maestro flow validate WeatherAlert.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # ── Semantic correctness ─────────────────────────────────────────────────
  - type: llm_judge
    description: "Flow implements the described behavior"
    prompt: |
      Did the agent author a v2 Flow that:
      (a) fetches Denver's temperature from a weather API,
      (b) branches on whether the temperature is greater than 60°F,
      (c) sends a Slack message containing "its warm" on the warm branch and
          "its cold" on the cold branch?
      Look at `WeatherAlert.fil.ts` for the logic, `WeatherAlert.flow.json`
      for the node wiring, and `WeatherAlert.flow` for the converted output.
    include_agent_output: true
    include_tool_calls: true
    weight: 2.0
    pass_threshold: 0.7
