task_id: uipath-flow-hr-onboarding
description: >
  Create a UiPath Flow JSON file for end-to-end HR onboarding. The flow should
  send a job offer email, use AI to determine acceptance, validate documents,
  run background checks, create pre-hire records, and in parallel handle Coupa,
  Jira, and Slack notifications. Include AI-based training recommendations with
  human review and calendar event scheduling. Validate the flow structure.
initial_prompt: |
  Create a UiPath flow for end-to-end HR onboarding called `hr_onboarding`. It should send a job offer email and wait for a response, use an AI agent to determine if the offer was accepted, then run document validation and a background check. If everything passes, create the pre-hire record, then in parallel create a purchase requisition in Coupa, a Jira ticket for IT setup, and notify on Slack. Have an AI agent recommend training, send it through a human review, and schedule an onboarding calendar event.
tags: [flow, integration, complex, multi-agent]
task_timeout: 2400

max_turns: 100
turn_timeout: 1200
agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Glob", "Grep"]
  plugins:
    - type: "local"
      path: $UIPATH_PLUGIN_MARKETPLACE_DIR/

sandbox:
  driver: tempdir
  python:
    env_packages:
      - requests
      - jsonschema

success_criteria:
  # ── File existence ────────────────────────────────────────────────────────
  - type: file_exists
    path: "hr_onboarding/hr_onboarding/hr_onboarding.flow"
    description: "hr_onboarding.flow file exists"
    weight: 1.0

  # ── Valid JSON structure ───────────────────────────────────────────────────
  - type: json_check
    path: "hr_onboarding/hr_onboarding/hr_onboarding.flow"
    description: "File is valid JSON with nodes and edges"
    assertions:
      - expression: "nodes"
        operator: "exists"
      - expression: "edges"
        operator: "exists"
      - expression: "length(nodes)"
        operator: "gte"
        expected: 3
    weight: 2.0
    pass_threshold: 0.9

  # ── Email/Outlook integration ─────────────────────────────────────────────────
  - type: file_check
    description: "Flow contains email node for job offer"
    path: "hr_onboarding/hr_onboarding/hr_onboarding.flow"
    includes:
      - "outlook"
    weight: 1.5
    pass_threshold: 0.8

  # ── AI Agent nodes ──────────────────────────────────────────────────────────
  - type: file_check
    description: "Flow contains AI agent nodes for decision and recommendations"
    path: "hr_onboarding/hr_onboarding/hr_onboarding.flow"
    includes:
      - "agent"
    weight: 1.5
    pass_threshold: 0.8

  # ── Decision and control flow nodes ────────────────────────────────────────────────────────
  - type: file_check
    description: "Flow contains decision and merge nodes for branching logic"
    path: "hr_onboarding/hr_onboarding/hr_onboarding.flow"
    includes:
      - "Decision"
      - "Merge"
    weight: 1.5
    pass_threshold: 0.8

  # ── Parallel integration nodes ───────────────────────────────────────────────────────
  - type: file_check
    description: "Flow contains nodes for Coupa, Jira, and Slack integrations"
    path: "hr_onboarding/hr_onboarding/hr_onboarding.flow"
    includes:
      - "coupa"
      - "jira"
      - "slack"
    weight: 1.5
    pass_threshold: 0.8

  # ── Human review and calendar nodes ────────────────────────────────────────────────────
  - type: file_check
    description: "Flow contains human review and calendar event nodes"
    path: "hr_onboarding/hr_onboarding/hr_onboarding.flow"
    includes:
      - "review"
      - "calendar"
    weight: 1.5
    pass_threshold: 0.8

  # ── Validate with uipcli ────────────────────────────────────────────────────
  - type: run_command
    description: "Flow passes uip maestro flow validate"
    command: "cd hr_onboarding && uip maestro flow validate hr_onboarding/hr_onboarding.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
