task_id: "uipath-flow-triggering"
description: "Measure the UiPath Flow skill's triggering precision/recall across a labeled prompt dataset."
tags: [triggering, classification, uipath-flow]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  # Skill must be allowed so the agent can invoke the flow skill when appropriate.
  # Read/Write included so the agent isn't starved of basic tools when it decides
  # NOT to use Skill — removing them would bias the decision toward "don't invoke".
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  # Keep per-iteration reasoning bounded so the suite runs in reasonable time.
  max_turns: 3
  # Plugins are intentionally unset here. Provide the UiPath skills plugin at
  # experiment / CLI level so the Skill tool has a flow skill to invoke.
  plugins:
    - type: "local"
      path: "$PLUGIN_PATH"

sandbox:
  driver: "tempdir"
  python: null

# One agent turn per row is enough for a triggering decision. The agent has
# up to agent.max_turns inner turns to reason and call Skill within that one
# outer iteration.

dataset:
  path: "triggering.jsonl"
  sample: 5

initial_prompt: "${row.prompt}"

success_criteria:
  - type: "skill_triggered"
    expected: "${row.should_trigger}"
    description: "Agent invoked a Skill tool iff should_trigger=yes for row ${row.id}"
    # Suite-level gates. Tune as the skill matures. With ~247 rows (≈117 yes,
    # ≈130 no), an accuracy of 0.75 + balanced recall ≈ 0.7 is a reasonable
    # starting bar.
    suite_thresholds:
      accuracy: 0.75
      recall.yes: 0.70
      recall.no: 0.70
