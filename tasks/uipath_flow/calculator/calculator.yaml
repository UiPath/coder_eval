task_id: flow-json-calculator
description: >
  Create a calculator .flow project with input variables using the uipath-maestro-flow
  skill — no CLI, pure JSON authoring with bundled schemas.
tags: [flow, flow-json, generate, no-cli]

run_limits:
  max_turns: 50
  turn_timeout: 900
agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../../skills/skills/uipath-maestro-flow"

initial_prompt: |
  You have the uipath-maestro-flow skill available in the current directory.
  Read SKILL.md for complete instructions on building .flow files.

  Create a UiPath Flow project named "Calculator" that takes two number inputs
  `a` and `b`, multiplies them together, and returns the result.

  Follow the skill's Quick Start workflow:
  1. Create Calculator/project.uiproj
  2. Use project-scaffold-template.json as your starting point (it has input variables)
  3. Declare two input variables `a` and `b` (type: number, direction: in)
  4. Write a script that multiplies them: $vars.start.output.a * $vars.start.output.b
  5. Save as Calculator/flow_files/Calculator.flow
  6. Run the validation checklist

post_run:
  - command: 'mkdir -p _outputs && find . -type d \( -name .uipath -o -name .claude -o -name .venv -o -name node_modules -o -name tools -o -name example -o -name _outputs -o -name .git -o -name .flow-run \) -prune -o -type f \( -name "*.flow" -o -name "*.fil" -o -name "bindings*.json" \) -exec sh -c ''f="${1#./}"; mkdir -p "_outputs/$(dirname "$f")" && cp "$1" "_outputs/$f"'' _ {} \; && find _outputs -type f -exec chmod a-w {} +'
    timeout: 30

success_criteria:
  - type: file_exists
    description: "project.uiproj exists"
    path: "Calculator/project.uiproj"
    weight: 1.0
    pass_threshold: 1.0

  - type: json_check
    description: "Flow file is valid JSON with required fields"
    path: "Calculator/flow_files/Calculator.flow"
    assertions:
      - expression: "nodes"
        operator: "type"
        expected: "array"
      - expression: "edges"
        operator: "type"
        expected: "array"
      - expression: "definitions"
        operator: "type"
        expected: "array"
      - expression: "variables.globals"
        operator: "type"
        expected: "array"
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Structural comparison against reference flow"
    command: "python3 $TASK_DIR/../shared/check_flow_structure.py Calculator/flow_files/Calculator.flow $TASK_DIR/../shared/references/calculator-multiply.flow"
    timeout: 10
    score_from_stdout: true
    weight: 5.0
    pass_threshold: 0.7

  - type: run_command
    description: "Has two number input variables"
    command: "python3 -c \"import json; f=json.load(open('Calculator/flow_files/Calculator.flow')); g=f.get('variables',{}).get('globals',[]); inputs=[v for v in g if v.get('direction')=='in' and v.get('type')=='number']; assert len(inputs)>=2, f'Expected 2 number inputs, got {len(inputs)}'; print(f'OK: {len(inputs)} number input variables')\""
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
