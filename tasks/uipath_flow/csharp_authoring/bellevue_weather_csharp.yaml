task_id: uipath-flow-csharp-bellevue-weather
description: >
  C# port of the Bellevue weather task. Tests HTTP node invocation via
  direct ExecuteNodeAsync, plus C# arithmetic + branching on the response.
tags: [flow-csharp, csharp, generate, http, decision]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 60
  turn_timeout: 1500

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-csharp"

initial_prompt: |
  Author a UiPath C# Flow workflow named **BellevueWeather** in the current
  directory. Read `SKILL.md` first.

  ## Scenario

  Get today's weather in Bellevue, WA from open-meteo. Compute a result based
  on temperature: if greater than 60°F, return `{ message: "nice day" }`;
  otherwise return `{ message: "bring a jacket" }`.

  Bellevue, WA coordinates: latitude 47.6101, longitude -122.2015. Use
  `temperature_unit=fahrenheit` on the open-meteo URL.

  ## C# pattern for HTTP

  Open-meteo doesn't have a generated connector class. Use direct
  `ExecuteNodeAsync` against the `core.action.http` synthetic node:

  ```csharp
  string responseRaw = await connector.ExecuteNodeAsync(
      "core.action.http",
      "fetchWeather",
      "",  // bindingId — public HTTP doesn't need a connection
      "{\"url\":\"https://api.open-meteo.com/v1/forecast?latitude=47.6101&longitude=-122.2015&current=temperature_2m&temperature_unit=fahrenheit\",\"method\":\"GET\"}");
  ```

  The result is the raw JSON response body (per LiveConnector's HTTP shape:
  `{ body, headers, statusCode }`). The CS2FIL analyzer rejects raw
  `JsonElement` navigation (CS2FIL019); use **typed records + `Deserialize<T>`**:

  ```csharp
  public record CurrentWeather(double temperature_2m);
  public record MeteoBody(CurrentWeather current);
  public record HttpResult(MeteoBody body, int statusCode);

  HttpResult parsed = JsonSerializer.Deserialize<HttpResult>(responseRaw)!;
  double temp = parsed.body.current.temperature_2m;
  ```

  Then branch on whether `temp > 60`.

  Either branching idiom works:
  - `if (temp > 60) { ... return "nice day"; } else { ... return "bring a jacket"; }`
  - or a ternary inside a single expression

  ## Phases

  ```bash
  dotnet new csflow --name BellevueWeather
  cd BellevueWeather
  dotnet build && dotnet run -- --test
  cd ..
  ./convert-to-v1.sh BellevueWeather
  ./validate.sh    BellevueWeather
  ```

success_criteria:
  - type: file_exists
    description: "C# project Workflow.cs exists"
    path: "BellevueWeather/Workflow.cs"
    weight: 1.0
  - type: run_command
    description: "C# project builds"
    command: "dotnet build BellevueWeather/BellevueWeather.csproj"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "C# project runs in test mode"
    command: "dotnet run --project BellevueWeather -- --test"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: file_exists
    description: "Bindings file exists at project root"
    path: "bindings.json"
    weight: 1.0
  - type: file_exists
    description: "v1 .flow exists"
    path: "BellevueWeather.flow"
    weight: 1.0
  - type: run_command
    description: "v1 .flow validates"
    command: "uip maestro flow validate BellevueWeather.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "tidy succeeds"
    command: "uip maestro flow format BellevueWeather.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: run_command
    description: "Converted .flow has an HTTP node"
    command: |
      python3 -c "
      import json
      ns = json.load(open('BellevueWeather.flow'))['nodes']
      types = [n['type'] for n in ns]
      assert any(t.startswith('core.action.http') for t in types), f'no HTTP node: {types}'
      print(f'{len(ns)} nodes')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: llm_judge
    description: "Workflow implements the described behavior"
    prompt: |
      Did the agent author a C# workflow that meets all four:
      (a) fetches Bellevue weather via core.action.http (direct
          ExecuteNodeAsync) from open-meteo,
      (b) extracts the temperature from the response,
      (c) computes a different result based on whether temperature > 60°F,
      (d) the two results are exactly `{ message: "nice day" }` and
          `{ message: "bring a jacket" }`.

      Branching idiom is irrelevant — `if/else`, ternary, or any
      equivalent are all fine.
    files:
      - "BellevueWeather/Workflow.cs"
      - "BellevueWeather.flow"
    weight: 2.0
    pass_threshold: 0.7
