task_id: uipath-flow-csharp-order-notify
description: >
  C# port of the order-notify task: read latest unread email via Outlook 365,
  if at least one exists post a Slack message to #orders with the subject.
  Smallest reasonable C# task — two connectors, one branch, exercises the
  full lifecycle.
tags: [flow-csharp, csharp, generate, connector, slack]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 60
  turn_timeout: 1500

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-csharp"

initial_prompt: |
  Author a UiPath C# Flow workflow named **OrderNotify** in the current
  directory. Read `SKILL.md` first.

  ## Scenario

  When a customer order email arrives in Outlook, post a Slack message to
  `#orders` summarizing it; do nothing if there's no new email.

  1. Get the most-recent unread email from the Outlook inbox.
  2. If at least one email exists, send a Slack message to `#orders` with the
     email's subject in the message body. Otherwise end without posting.

  Discover the connector classes:

  ```bash
  dotnet run --project ~/src/flow-v2/csharp/src/CS2FIL -- dump-registry \
    --csharp-root ~/src/flow-v2/csharp 2>/dev/null \
    | python3 -c "import json,sys; [print(f'{c[\"shortClassName\"]:35s} {c[\"nodeType\"]}') for c in json.load(sys.stdin) if 'outlook' in c['nodeType'] and 'email' in c['nodeType'].lower()]"
  ```

  You'll need the `GetEmailList`-style class for Outlook 365 and the
  `SendMessageToChannel`-style class for Slack.

  ## Phases

  ```bash
  dotnet new csflow --name OrderNotify
  cd OrderNotify
  dotnet build
  dotnet run -- --test
  cd ..
  ./convert-to-v1.sh OrderNotify
  ./validate.sh    OrderNotify
  ```

success_criteria:
  - type: file_exists
    description: "C# project Workflow.cs exists"
    path: "OrderNotify/Workflow.cs"
    weight: 1.0
  - type: run_command
    description: "C# project builds"
    command: "dotnet build OrderNotify/OrderNotify.csproj"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "C# project runs in test mode"
    command: "dotnet run --project OrderNotify -- --test"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: file_exists
    description: "Bindings file exists at project root"
    path: "bindings.json"
    weight: 1.0
  - type: file_exists
    description: "v1 .flow exists"
    path: "OrderNotify.flow"
    weight: 1.0
  - type: run_command
    description: "v1 .flow validates"
    command: "uip maestro flow validate OrderNotify.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "tidy succeeds"
    command: "uip maestro flow tidy OrderNotify.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: run_command
    description: "Converted .flow uses Outlook + Slack connectors and a decision branch"
    command: |
      python3 -c "
      import json
      ns = json.load(open('OrderNotify.flow'))['nodes']
      types = [n['type'] for n in ns]
      assert any('outlook365' in t for t in types), f'no Outlook node: {types}'
      assert any('salesforce-slack' in t for t in types), f'no Slack node: {types}'
      assert 'core.logic.decision' in types, f'no decision node: {types}'
      print(f'{len(ns)} nodes')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: llm_judge
    description: "Workflow implements the described behavior"
    prompt: |
      Did the agent author a C# workflow that:
      (a) reads emails via the Outlook 365 connector class,
      (b) branches on whether at least one email exists, and
      (c) sends a Slack message via the Slack connector class on the "exists"
          path only?
    files:
      - "OrderNotify/Workflow.cs"
      - "OrderNotify.flow"
    weight: 2.0
    pass_threshold: 0.7
