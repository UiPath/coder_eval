task_id: uipath-flow-csharp-calculator
description: >
  C# port of the calculator task — multiply two numbers. Different flavor than
  the v2 version: bare C# arithmetic on locals (e.g. `int result = a * b;`) is
  elided by v2-to-v1's dead-code pass, so the math must be dispatched as a
  `core.action.script` node via the raw `IConnector.ExecuteNodeAsync(...)` API.
  Tests local-variable handling (a, b become flow vars after conversion) and
  that the converted v1 `.flow` contains an observable `core.action.script` node.
tags: [flow-csharp, csharp, generate, variables]

run_limits:
  max_turns: 50
  turn_timeout: 1200

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../../templates/flow-csharp"

initial_prompt: |
  Author a UiPath C# Flow workflow named **Calculator** in the current
  directory. Read `SKILL.md` first.

  ## Scenario

  Multiply two numeric inputs `a` and `b` and produce the result. The
  converted v1 `.flow` MUST contain an observable `core.action.script`
  node that does the math — bare C# locals like `int result = a * b;`
  get dropped by v2-to-v1's dead-code pass because nothing reads them.

  The pattern: dispatch a `core.action.script` node via the raw
  `IConnector.ExecuteNodeAsync(...)` API. The script body is a v1 `=js:`
  expression; capture the raw return string into `result`:

  ```csharp
  public async Task Execute()
  {
      int a = 7;
      int b = 6;
      string scriptInput =
          "{\"script\":\"return " + a + " * " + b + ";\"}";
      string result = await connector.ExecuteNodeAsync(
          "core.action.script", "multiply", "", scriptInput);
  }
  ```

  cs2fil promotes `a` and `b` to FIL `const` declarations (which become
  v1 flow variables) and the `ExecuteNodeAsync` call to a v1
  `core.action.script` node whose output is bound to `result`. The
  `"return " + a + " * " + b + ";"` concatenation is recognized — the
  converter inlines the variable values into the emitted script body.

  `core.action.script` is a synthetic node type with no generated wrapper
  class, so dispatch goes through the lower-level `IConnector.ExecuteNodeAsync`
  rather than `Flow.ExecuteNode(connector, action(), ...)`.

  ## Phases

  ```bash
  dotnet new csflow --name Calculator
  cd Calculator
  # replace Workflow.cs with the calculator logic — keep it simple
  dotnet build
  cd ..
  ./verify.sh Calculator
  ./convert-to-v1.sh Calculator
  ./validate.sh    Calculator
  ```

post_run:
  - command: './snapshot-outputs.sh'
    timeout: 30


success_criteria:
  - type: file_exists
    description: "C# project Workflow.cs exists"
    path: "Calculator/Workflow.cs"
    weight: 1.0
  - type: run_command
    description: "C# project builds"
    command: "dotnet build Calculator/Calculator.csproj"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "C# project verifies via csflowrun (cs2fil → flow-run --dry-run)"
    command: "./verify.sh Calculator"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "Workflow.cs contains a multiplication and references a, b"
    command: |
      python3 -c "
      src = open('Calculator/Workflow.cs').read()
      assert '*' in src, f'expected multiplication operator, Workflow.cs was:\n{src}'
      assert 'a' in src and 'b' in src, f'expected a, b in Workflow.cs'
      print('multiplication present')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: file_exists
    description: "Bindings file exists at project root"
    path: "bindings.json"
    weight: 1.0
  - type: file_exists
    description: "v1 .flow exists"
    path: "Calculator.flow"
    weight: 1.0
  - type: run_command
    description: "v1 .flow contains a core.action.script node that does the multiplication"
    command: |
      python3 -c "
      import json
      f = json.load(open('Calculator.flow'))
      ns = f.get('nodes', [])
      types = [n.get('type', '') for n in ns]
      scripts = [n for n in ns if n.get('type') == 'core.action.script']
      assert scripts, f'no core.action.script node in v1 .flow (types={types}). Plain C# arithmetic gets elided — dispatch a script node via IConnector.ExecuteNodeAsync.'
      print(f'{len(scripts)} script node(s) found')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "v1 .flow validates"
    command: "uip maestro flow validate Calculator.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "tidy succeeds"
    command: "uip maestro flow format Calculator.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: llm_judge
    description: "Workflow multiplies a and b"
    prompt: |
      Does the workflow compute the product of two numeric variables `a`
      and `b`?

      Score 1.0 if `a` and `b` are declared as locals (or named anything
      similar) at the top of `Execute()` and `result = a * b` (or equivalent)
      is computed.

      Don't penalize: choice of int vs double, hard-coded values vs
      computed-from-input, additional logic around the arithmetic.

      Score 0.5 if multiplication is present but the operands aren't
      named `a` and `b`.
      Score 0 if no multiplication appears.
    files:
      - "Calculator/Workflow.cs"
      - "Calculator.flow"
    weight: 2.0
    pass_threshold: 0.7
