task_id: uipath-flow-process-list-detailed
description: >
  Detailed-prompt evaluation: agent follows step-by-step instructions to list
  UiPath flow processes using uipcli CLI with various options and formats.
tags: [flow, uipcli, detailed]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 12

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Use the `uipcli` CLI tool to list flow processes in multiple formats and with
  various options, then save a summary report.

  Be efficient: redirect output directly to files instead of running commands
  twice. Do not run unnecessary verification commands -- the files will be
  validated automatically.

  ## Step 0: Check login
  Run `uipcli login status --format json`. If expired or not logged in,
  run `uipcli login` first.

  ## Step 1: List processes in JSON format
  Run `uipcli flow process list --format json > processes.json`
  to list all flow processes and save to file.

  ## Step 2: List processes in YAML format
  Run `uipcli flow process list --format yaml > processes.yaml`
  to get the same data in YAML format.

  ## Step 3: List processes with --limit option
  Run `uipcli flow process list --format json --limit 5 > processes_limited.json`
  to list only the first 5 processes. If `--limit` is not supported, write to
  processes_limited.json:
    {"status": "skipped", "reason": "--limit option not supported"}

  ## Step 4: Write summary report
  Create process_list_report.json with the following structure:
    {
      "command_used": "uipcli flow process list",
      "total_processes_found": <count from step 1>,
      "formats_tested": ["json", "yaml"],
      "options_exercised": ["--format json", "--format yaml", "--limit"],
      "steps_completed": ["list_json", "list_yaml", "list_limited", "report"]
    }

  Important notes:
  - The `uipcli` CLI is already available in the environment.
  - Use `--format json` for JSON output unless testing other formats.
  - Some commands may require an active login session.

success_criteria:
  - type: file_exists
    description: "processes.json file exists"
    path: "processes.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran uipcli flow process list"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+process\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "processes.json is valid JSON"
    command: "python -c \"import json; json.load(open('processes.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "processes.json contains process data"
    path: "processes.json"
    includes:
      - "Name"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --format yaml option"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+flow\s+process\s+list.*--format\s+yaml'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "processes.yaml from YAML format run exists"
    path: "processes.yaml"
    weight: 0.5
    pass_threshold: 1.0

  - type: file_exists
    description: "processes_limited.json exists"
    path: "processes_limited.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: file_exists
    description: "process_list_report.json summary exists"
    path: "process_list_report.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "process_list_report.json is valid JSON"
    command: "python -c \"import json; json.load(open('process_list_report.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Report contains expected summary fields"
    path: "process_list_report.json"
    includes:
      - "command_used"
      - "total_processes_found"
      - "formats_tested"
      - "options_exercised"
      - "steps_completed"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Report confirms formats were tested"
    path: "process_list_report.json"
    includes:
      - "--format json"
      - "--format yaml"
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 2

llm_reviewer:
  enabled: true
