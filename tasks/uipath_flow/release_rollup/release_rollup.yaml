task_id: flow-json-release-rollup
description: >
  Complex Flow v1 (.flow JSON) authoring task. Combines a free HTTP API
  (GitHub releases) with three connectors (Outlook, Slack, Jira). Tests an
  agent's ability to compose a non-trivial flow by hand: 20+ nodes, a loop, a
  pair of nested decisions, multi-connector fan-out, and per-iteration
  counters with a final aggregation pass. Mirrors the csharp_authoring and
  v2_authoring versions of the same scenario for cross-flavor comparison.
tags: [flow, flow-json, generate, http, decision, loop, multi-connector, complex]

task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 120
  turn_timeout: 1800

sandbox:
  driver: tempdir
  python: {}
  node:
    env_packages:
      - "@uipath/cli@0.1.21"

initial_prompt: |
  Before starting, load the `uipath-maestro-flow` skill and read its
  SKILL.md. Author the flow as JSON (do NOT use `uip maestro flow node add`
  — pure JSON authoring). Do NOT ask for approval, confirmation, or feedback.
  Build the complete flow end-to-end in a single pass.

  Create a UiPath Flow project named **ReleaseRollup** that performs a daily
  rollup of new GitHub releases for a list of tracked open-source projects.

  ## Tracked repos (hardcoded in the flow)

  ```
  ["nodejs/node", "python/cpython", "microsoft/typescript",
   "kubernetes/kubernetes", "facebook/react"]
  ```

  ## Per-repo logic

  1. Fetch the latest release from
     `https://api.github.com/repos/{repo}/releases/latest` via a
     `core.action.http` node (no auth needed; rate limit is 60/hr
     unauthenticated, fine for 5 repos). The response body has `name`,
     `tag_name`, `published_at`, `body` (release notes), `html_url`.
  2. Compute days since publish using a `core.action.script` node and the
     `=js:` runtime — `(Date.now() - new Date($vars.X.output.body.published_at).getTime()) / 86400000`.
  3. **Decision 1** (`core.logic.decision`): is the release new (≤ 7 days
     old)?
     - **No** — increment a `skipped` counter (a `setvar` script node) and
       merge back to the loop continuation.
     - **Yes** — increment a `seen` counter, then check whether the title or
       body contains a security keyword (substring match for any of
       `"CVE"`, `"security"`, `"vulnerability"`, `"advisory"`).
       - **Decision 2** (`core.logic.decision`): security release?
         - **Yes**: increment `securityCount`, then dispatch:
           - `uipath.connector.uipath-atlassian-jira.create-issue` —
             project `Maestro`, summary `"Security release: {repo} {tag_name}"`,
             description = release notes, assignee = the current user.
           - `uipath.connector.uipath-salesforce-slack.send-message-to-user`
             — recipient `@Dustin Metzgar`, body = release notes URL.
           - `uipath.connector.uipath-microsoft-outlook365.send-email` — to
             `dustin.metzgar@uipath.com`, subject `"[SECURITY] {repo}
             released {tag_name}"`, body = release notes.
         - **No**: increment `normalCount`, then dispatch:
           - Slack DM to `@Dustin Metzgar` with `"{repo} released
             {tag_name}"`.
           - Outlook email to `dustin.metzgar@uipath.com`, subject
             `"{repo} released {tag_name}"`, body = release notes.

  ## After the loop

  Send one final Outlook email to `dustin.metzgar@uipath.com` with subject
  `"Daily release rollup"` and a body summarising the three counters
  (`skipped`, `normalCount`, `securityCount`).

  ## Connector discovery

  Use the SKILL.md's 6-step connector configuration workflow for each of the
  three connectors:

  ```bash
  uip is connections list --output json | jq '.Data[] | select(.ConnectorKey | startswith("uipath-microsoft-outlook365"))'
  uip is connections list --output json | jq '.Data[] | select(.ConnectorKey | startswith("uipath-salesforce-slack"))'
  uip is connections list --output json | jq '.Data[] | select(.ConnectorKey | startswith("uipath-atlassian-jira"))'

  uip maestro flow registry get uipath.connector.uipath-microsoft-outlook365.send-email --output json
  uip maestro flow registry get uipath.connector.uipath-salesforce-slack.send-message-to-user --output json
  uip maestro flow registry get uipath.connector.uipath-atlassian-jira.create-issue --output json
  ```

  ## Output

  Save the flow as `ReleaseRollup/flow_files/ReleaseRollup.flow` with a
  `ReleaseRollup/project.uiproj`. Include `bindings_v2.json` if your flow's
  connector nodes reference symbolic bindings.

  ## Verifying your work

  ```bash
  uip maestro flow validate ReleaseRollup/flow_files/ReleaseRollup.flow
  uip maestro flow tidy     ReleaseRollup/flow_files/ReleaseRollup.flow
  ```

  Iterate until validate prints `"Result": "Success"`. Validation errors
  point at fields in node `inputs` or `embeddedDefinitions`; tidy errors
  usually mean an edge points at a missing port.

success_criteria:
  - type: run_command
    description: "Flow file exists and is valid JSON"
    command: |
      python3 -c "
      import json, glob
      flows = glob.glob('**/flow_files/ReleaseRollup.flow', recursive=True)
      assert flows, 'No ReleaseRollup*.flow file found'
      f = json.load(open(flows[0]))
      assert isinstance(f.get('nodes'), list), 'no nodes array'
      assert isinstance(f.get('edges'), list), 'no edges array'
      print(f'OK: {len(f[\"nodes\"])} nodes, {len(f[\"edges\"])} edges, {len(f.get(\"definitions\", []))} defs')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "Flow has 20+ nodes"
    command: |
      python3 -c "
      import json, glob
      flows = glob.glob('**/flow_files/ReleaseRollup.flow', recursive=True)
      f = json.load(open(flows[0]))
      n = len(f['nodes'])
      assert n >= 20, f'expected 20+ nodes, got {n}'
      print(f'{n} nodes')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "Flow uses GitHub HTTP, Outlook, Slack, and Jira"
    command: |
      python3 -c "
      import json, glob
      flows = glob.glob('**/flow_files/ReleaseRollup.flow', recursive=True)
      f = json.load(open(flows[0]))
      types = [n.get('type', '') for n in f['nodes']]
      blob = json.dumps(f)
      assert any(t.startswith('core.action.http') for t in types), f'no HTTP node: {types}'
      assert 'api.github.com' in blob, 'GitHub API URL not in flow'
      assert any('uipath-microsoft-outlook365' in t for t in types), f'no Outlook node: {types}'
      assert any('uipath-salesforce-slack' in t for t in types), f'no Slack node: {types}'
      assert any('uipath-atlassian-jira' in t for t in types), f'no Jira node: {types}'
      print('all four required pieces present')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "Flow has loop + nested decisions"
    command: |
      python3 -c "
      import json, glob
      flows = glob.glob('**/flow_files/ReleaseRollup.flow', recursive=True)
      f = json.load(open(flows[0]))
      types = [n.get('type', '') for n in f['nodes']]
      loops = [t for t in types if t == 'core.logic.loop']
      decisions = [t for t in types if t == 'core.logic.decision']
      assert loops, f'no loop node: {types}'
      assert len(decisions) >= 2, f'expected ≥2 decision nodes (new-release + security), got {len(decisions)}'
      print(f'{len(loops)} loop(s), {len(decisions)} decision(s)')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "All node types have matching definitions"
    command: |
      python3 -c "
      import json, glob
      flows = glob.glob('**/flow_files/ReleaseRollup.flow', recursive=True)
      f = json.load(open(flows[0]))
      used = {n.get('type', '') for n in f['nodes']}
      defined = {d.get('nodeType', '') for d in f.get('definitions', [])}
      missing = used - defined
      assert not missing, f'missing definitions for: {missing}'
      print(f'OK: all {len(used)} node types have definitions')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "Flow validates with uip maestro flow validate"
    command: |
      python3 -c "
      import glob, subprocess, sys
      flows = glob.glob('**/flow_files/ReleaseRollup.flow', recursive=True)
      assert flows, 'no flow file found'
      r = subprocess.run(['uip', 'maestro', 'flow', 'validate', flows[0]], capture_output=True, text=True)
      print(r.stdout)
      print(r.stderr, file=sys.stderr)
      sys.exit(r.returncode)
      "
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "tidy succeeds"
    command: |
      python3 -c "
      import glob, subprocess, sys
      flows = glob.glob('**/flow_files/ReleaseRollup.flow', recursive=True)
      r = subprocess.run(['uip', 'maestro', 'flow', 'tidy', flows[0]], capture_output=True, text=True)
      print(r.stdout)
      print(r.stderr, file=sys.stderr)
      sys.exit(r.returncode)
      "
    timeout: 60
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: run_command
    description: "Flow references the recipient email and Maestro Jira project"
    command: |
      python3 -c "
      import glob
      flows = glob.glob('**/flow_files/ReleaseRollup.flow', recursive=True)
      content = open(flows[0]).read()
      assert 'dustin.metzgar@uipath.com' in content, 'recipient email not in flow'
      assert 'Maestro' in content, 'Jira project Maestro not in flow'
      print('OK: recipient + project present')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: command_executed
    description: "Agent fetched real connections via `uip is connections list`"
    tool_name: "Bash"
    command_pattern: "uip.*is.*connections.*list"
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0
  - type: command_executed
    description: "Agent looked up at least one node type via `uip maestro flow registry get`"
    tool_name: "Bash"
    command_pattern: "uip.*maestro.*flow.*registry.*get"
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0
  - type: llm_judge
    description: "Flow implements the rollup logic end-to-end"
    prompt: |
      Did the agent author a v1 .flow JSON that:
      (a) iterates over a hardcoded list of GitHub repos via a
          `core.logic.loop` node;
      (b) fetches each repo's latest release via `core.action.http` against
          `api.github.com/repos/<repo>/releases/latest`;
      (c) decides whether the release is "new" (within 7 days);
      (d) if new, decides whether it looks security-related (CVE/security
          /vulnerability/advisory keyword in the title or body);
      (e) on the security branch, dispatches all three of: Jira create-issue
          (project = Maestro, summary mentions repo+tag), Slack
          send-message-to-user (DM to Dustin), and Outlook send-email
          (to dustin.metzgar@uipath.com);
      (f) on the non-security new-release branch, dispatches Slack +
          Outlook (no Jira);
      (g) maintains counters (skipped / normalCount / securityCount) updated
          across iterations (setvar script nodes);
      (h) sends a final Outlook digest email summarising the counters.

      Score 1.0 if all eight pieces are present and structurally correct.
      Subtract 0.1 per missing piece; floor at 0.

      Wiring also matters: the Loop node's `output` port must connect to the
      first node of the body, the body's terminus must connect back to the
      Loop's `loopBack` port, and the Loop's `success` port must connect to
      the post-loop aggregation chain. If wiring is fundamentally broken
      (loop body has no loopBack, branches don't merge), cap at 0.4.
    files:
      - "ReleaseRollup/flow_files/ReleaseRollup.flow"
    weight: 3.0
    pass_threshold: 0.7
