task_id: uipath-flow-run-e2e-simple
description: >
  Minimal-prompt E2E evaluation: agent must list flow processes, run the first
  available process, check job status, and retrieve job traces using uip CLI
  with no step-by-step guidance.
tags: [flow, uipcli, simple, e2e]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 15

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Using the `uip` CLI (already available), perform an end-to-end flow run:
  list all flow processes, run the first one, check the job status, get traces,
  and save a final summary to e2e_report.json.

success_criteria:
  - type: command_executed
    description: "Agent listed flow processes"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+process\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran a flow process"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+process\s+run'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent checked job status"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+job\s+status'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent retrieved job traces"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+job\s+traces'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "e2e_report.json summary exists"
    path: "e2e_report.json"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "e2e_report.json is valid JSON"
    command: "python -c \"import json; json.load(open('e2e_report.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 3

llm_reviewer:
  enabled: true
