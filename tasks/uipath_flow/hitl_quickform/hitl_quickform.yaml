task_id: uipath-flow-hitl-quickform
description: >
  Author a Flow v1 (.flow JSON) project with a HITL quickform approval node,
  downstream decision, and valid v1 schema. V1 counterpart to
  v2_authoring/hitl_quickform_v2.
tags: [flow, flow-json, generate, hitl, quickform, decision, mock, non-is-node]

run_limits:
  max_turns: 80
  turn_timeout: 1800
  task_timeout: 2400

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Before starting, load the `uipath-maestro-flow` skill and read its
  SKILL.md. Author the flow as v1 JSON. Do NOT use Flow v2, FIL, or C#.
  Do NOT ask for approval, confirmation, or feedback. Build the complete
  flow end-to-end in a single pass.
  Use the required node and definition shapes below as the source of truth;
  do not spend time searching registries or example projects unless validation
  fails.

  Create a UiPath Flow project named **ExpenseApprovalHitl**.

  ## Scenario

  A manager reviews an expense in an Action Center HITL quickform. The form
  shows the amount as read-only input, then captures approval and comments.
  The flow branches after the human task completes.

  ## Flow behavior

  1. Start with a manual trigger.
  2. Run one HITL quickform node with id `reviewExpense` and label
     `Review Expense`.
  3. The quickform must include:
     - `type: "quick"`
     - an input number field `amount`
     - an output boolean field `approved`
     - an output text field `comments`
     - outcomes named `Approve` and `Reject`
     - recipient delivery through `ActionCenter`
     - priority `Low`
  4. Wire the HITL node's `completed` source port to a downstream decision.
  5. If `approved` is true, route to a mock node named `approvedRoute`.
  6. Otherwise, route to a mock node named `rejectedRoute`.
  7. End the flow.

  ## Files to write

  Save the flow as:

  - `ExpenseApprovalHitl/project.uiproj`
  - `ExpenseApprovalHitl/flow_files/ExpenseApprovalHitl.flow`

  ## Required HITL node shape

  The HITL node must have:

  - `type: "uipath.human-in-the-loop"`
  - `typeVersion: "1.0"`
  - `id: "reviewExpense"`
  - `inputs.type: "quick"`
  - `inputs.schema.fields` entries for `amount`, `approved`, and `comments`
  - `inputs.schema.outcomes` entries named `Approve` and `Reject`
  - `outputs.output.source: "=result"`
  - `outputs.status.source: "=result.Action"`

  Use this output block:

  ```json
  {
    "output": {
      "type": "object",
      "description": "Task result data",
      "source": "=result",
      "var": "output",
      "properties": {
        "approved": { "type": "boolean" },
        "comments": { "type": "string" },
        "Action": {
          "type": "string",
          "enum": ["Approve", "Reject"],
          "default": "Approve"
        }
      }
    },
    "status": {
      "type": "string",
      "description": "Task completion status",
      "source": "=result.Action",
      "var": "status",
      "enum": ["Approve", "Reject"],
      "default": "Approve"
    }
  }
  ```

  ## Required definitions

  Include a matching `definitions[]` entry for every node type used in the
  flow, including this HITL node, manual trigger, decision, mock nodes, and
  end node. The HITL definition must include:

  - `nodeType: "uipath.human-in-the-loop"`
  - `version: "1.0"`
  - `model.type: "bpmn:UserTask"`
  - `model.serviceType: "Actions.HITL"`

  ## Verifying your work

  ```bash
  $HOME/.bun/bin/uip maestro flow validate ExpenseApprovalHitl/flow_files/ExpenseApprovalHitl.flow
  $HOME/.bun/bin/uip maestro flow format ExpenseApprovalHitl/flow_files/ExpenseApprovalHitl.flow
  ```

  Iterate until validation succeeds. Do not substitute a mock, connector, or
  app-based HITL resource for the quickform node.

success_criteria:
  - type: file_exists
    description: "project.uiproj exists"
    path: "ExpenseApprovalHitl/project.uiproj"
    weight: 1.0

  - type: file_exists
    description: "Flow file exists"
    path: "ExpenseApprovalHitl/flow_files/ExpenseApprovalHitl.flow"
    weight: 1.0

  - type: run_command
    description: "Flow contains the required HITL quickform shape and validates"
    command: "python3 $TASK_DIR/../shared/check_hitl_quickform_flow.py --v1-flow ExpenseApprovalHitl/flow_files/ExpenseApprovalHitl.flow"
    timeout: 90
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "v1 .flow validates"
    command: "UIPATH_FLOW_CLI=${UIPATH_FLOW_CLI:-$HOME/.bun/bin/uip}; \"$UIPATH_FLOW_CLI\" maestro flow validate ExpenseApprovalHitl/flow_files/ExpenseApprovalHitl.flow"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "format succeeds"
    command: "UIPATH_FLOW_CLI=${UIPATH_FLOW_CLI:-$HOME/.bun/bin/uip}; \"$UIPATH_FLOW_CLI\" maestro flow format ExpenseApprovalHitl/flow_files/ExpenseApprovalHitl.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Flow uses a HITL quickform and branches on approval"
    prompt: |
      Did the agent author a v1 .flow JSON that:
      (a) contains exactly one `uipath.human-in-the-loop` quickform node named
          `reviewExpense`;
      (b) captures output fields `approved` and `comments` with outcomes
          `Approve` and `Reject`;
      (c) wires the HITL `completed` source port to a downstream decision;
      (d) branches true approval to `approvedRoute` and rejection to
          `rejectedRoute`;
      (e) includes definitions needed for v1 validation?

      Score 1.0 if all five pieces are present and structurally connected.
      Subtract 0.2 for each missing piece. If the HITL node is replaced by a
      mock, connector, or app-based resource, cap the score at 0.3.
    files:
      - "ExpenseApprovalHitl/flow_files/ExpenseApprovalHitl.flow"
    weight: 3.0
    pass_threshold: 0.7
