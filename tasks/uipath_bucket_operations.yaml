task_id: uipath-bucket-operations
description: "Create a script that uploads and downloads files from UiPath buckets"
tags: [golden, integration, uipath-python, network]

agent:
  type: claude-code

sandbox:
  driver: tempdir
  python:
    env_packages:
      - uipath>=2.1.75
      - python-dotenv>=1.0
  template_sources:
    - type: template_dir
      path: "../templates/uipath-starter"

initial_prompt: |
  Create a Python script called bucket_operations.py that does a round-trip test with
  UiPath storage buckets: write a local file, upload it to a bucket, download it back
  to a different local path, and verify the content matches.

  Use the UiPath Python SDK for the bucket operations. Print status messages so it's
  clear what's happening at each step.

  Put everything in a def main() function (don't make SDK calls at module level — it
  needs credentials that aren't available at import time). Add the standard
  if __name__ == "__main__": main() guard at the bottom. Load env vars with dotenv.

  Keep it to one file.

success_criteria:
  - type: file_exists
    description: "bucket_operations.py file exists"
    path: "bucket_operations.py"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Script imports required modules"
    path: "bucket_operations.py"
    includes:
      - "load_dotenv"
      - "UiPath"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Script uses correct upload parameters"
    path: "bucket_operations.py"
    includes:
      - "buckets.upload"
      - "blob_file_path="
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Script uses correct download parameters"
    path: "bucket_operations.py"
    includes:
      - "buckets.download"
      - "destination_path="
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Script verifies content matches"
    path: "bucket_operations.py"
    includes:
      - "open("
      - ".read()"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Has main() function entrypoint"
    path: "bucket_operations.py"
    includes:
      - "def main"
    weight: 1.5
    pass_threshold: 1.0

  - type: import_check
    description: "Python syntax valid and all imports resolve"
    path: "bucket_operations.py"
    weight: 3.5
    pass_threshold: 1.0
    timeout: 30


max_iterations: 1

reference:
  code: |
    from dotenv import load_dotenv
    from uipath.platform import UiPath


    def main():
        load_dotenv()
        sdk = UiPath()

        bucket_name = "default"
        remote_path = "test/sample.txt"
        local_upload = "upload_sample.txt"
        local_download = "download_sample.txt"
        test_content = "Hello from UiPath SDK test!"

        with open(local_upload, "w") as f:
            f.write(test_content)

        sdk.buckets.upload(
            name=bucket_name,
            blob_file_path=remote_path,
            source_path=local_upload,
        )
        print("Upload successful")

        sdk.buckets.download(
            name=bucket_name,
            blob_file_path=remote_path,
            destination_path=local_download,
        )
        print("Download successful")

        with open(local_download) as f:
            downloaded_content = f.read()

        if downloaded_content == test_content:
            print("Content matches!")
        else:
            print("Content mismatch!")


    if __name__ == "__main__":
        main()

llm_reviewer:
  enabled: true
  prompt: |
    Evaluate if the bucket operations script is complete and correct:

    1. Does it use sdk.buckets.upload() with keyword args name=, blob_file_path=, and source_path= or content=?
    2. Does it use sdk.buckets.download() with keyword args name=, blob_file_path=, destination_path=?
    3. Does it read the downloaded file from disk (download returns None, writes to file)?
    4. Does it verify the content matches?
    5. Is the output clear and shows success/failure?
