task_id: uipath-is-connections-detailed
description: >
  Detailed-prompt evaluation: agent follows step-by-step instructions to manage
  UiPath Integration Service connections using uip CLI. Covers listing
  (with options including --folder-key), pinging, creating (with real browser OAuth),
  and editing connections.
tags: [is, uipcli, detailed]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 25

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  You are working with the UiPath Integration Service CLI (`uip`).
  Your goal is to demonstrate a full connections management workflow,
  exercise the CLI options, and save a summary report to connections_report.json.

  Be efficient: save output directly via redirect or tee, don't verify files
  manually, and don't use todo lists or other tracking tools.

  ## Step 0: Check login
  Run `uip login status --output json`. If expired or not logged in,
  run `uip login` first.

  ## Step 1: List connections
  List connections for the Zoho Desk connector, saving output directly:
    uip is connections list uipath-zoho-desk --output json > connections_list.json

  ## Step 2: List connections with options
  a) With --refresh:
       uip is connections list uipath-zoho-desk --output json --refresh > connections_list_refresh.json
  b) With --output yaml:
       uip is connections list uipath-zoho-desk --output yaml > connections_list.yaml
  c) With --folder-key:
    First, extract a folder key from the connections_list.json output (connections
    have a "FolderKey" or "folder.key" field). If a folder key is available, run:
      uip is connections list uipath-zoho-desk --folder-key <folder-key> --output json > connections_list_folder.json
    If no folder key is found in the connections data, write to connections_list_folder.json:
      {"status": "skipped", "reason": "no folder key found in connections"}

  ## Step 3: Ping a connection
  If connections exist, ping one:
    uip is connections ping <connection-id> --output json > connection_ping.json
  If no connections, write: {"status": "skipped", "reason": "no connections found"}

  ## Step 4: Create a connection (browser OAuth)
  Run the create command (opens browser for OAuth, polls up to 5 min).
  Run it in the background, wait 120s for the user to authenticate, then kill it:
    uip is connections create uipath-zoho-desk --output json > /tmp/create_out.txt 2>&1 &
    PID=$!; sleep 120; kill $PID 2>/dev/null
  Copy /tmp/create_out.txt to connection_create_attempt.json (or write a skip note if empty).

  ## Step 5: Attempt edit (non-interactive)
  If connections exist, attempt re-auth with --no-browser (8s timeout):
    uip is connections edit <connection-id> --no-browser --output json > /tmp/edit_out.txt 2>&1 &
    PID=$!; sleep 8; kill $PID 2>/dev/null
  Save to connection_edit_attempt.json (or write a skip note if no connections).

  ## Step 6: Write summary report
  Create connections_report.json:
    {
      "connector_used": "uipath-zoho-desk",
      "connections_found": <count>,
      "ping_result": "<enabled|disabled|error|skipped>",
      "create_attempted": true,
      "create_used_browser": true,
      "edit_attempted": <true|false>,
      "edit_used_no_browser": <true|false>,
      "folder_key_used": "<folder-key or null>",
      "options_exercised": ["--output json", "--output yaml", "--refresh", "--folder-key"],
      "steps_completed": ["list_connections", "list_with_options", "ping", "create_attempt", "edit_attempt", "report"]
    }

  Important notes:
  - The `uip` CLI is already available.
  - Use --output json unless testing other formats.
  - Step 5 create opens a REAL browser — wait 120s for user to complete OAuth.
  - Step 6 edit uses --no-browser and 8s timeout since it's non-interactive.
  - Do NOT use `timeout` command (not on macOS). Do NOT use TodoWrite.

success_criteria:
  # -- Step 1: List connections --
  - type: command_executed
    description: "Agent listed connections for a connector"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+connections\s+list'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "connections_list.json file exists"
    path: "connections_list.json"
    weight: 1.0
    pass_threshold: 1.0

  # -- Step 3: Options usage --
  - type: command_executed
    description: "Agent used --refresh option on connections list"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+connections\s+list\s+\S+.*--refresh'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "connections_list_refresh.json from --refresh run exists"
    path: "connections_list_refresh.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --output yaml option"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+connections\s+list\s+\S+.*--output\s+yaml'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "connections_list.yaml from YAML format run exists"
    path: "connections_list.yaml"
    weight: 0.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --folder-key option on connections list"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+connections\s+list\s+\S+.*--folder-key'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: file_exists
    description: "connections_list_folder.json from --folder-key run exists"
    path: "connections_list_folder.json"
    weight: 0.5
    pass_threshold: 1.0

  # -- Step 4: Ping (file required; command is conditional) --
  - type: file_exists
    description: "connection_ping.json file exists (ping result or skip note)"
    path: "connection_ping.json"
    weight: 1.0
    pass_threshold: 1.0

  # -- Step 5: Create attempt (browser OAuth, no --no-browser) --
  - type: command_executed
    description: "Agent attempted create for a connector"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+connections\s+create\s+\S+'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "connection_create_attempt.json file exists"
    path: "connection_create_attempt.json"
    weight: 1.0
    pass_threshold: 1.0

  # -- Step 6: Edit attempt (file required; command is conditional) --
  - type: file_exists
    description: "connection_edit_attempt.json file exists (edit result or skip note)"
    path: "connection_edit_attempt.json"
    weight: 1.0
    pass_threshold: 1.0

  # -- Step 7: Summary report --
  - type: file_exists
    description: "connections_report.json summary exists"
    path: "connections_report.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "connections_report.json is valid JSON"
    command: "python -c \"import json; json.load(open('connections_report.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Report contains expected summary fields"
    path: "connections_report.json"
    includes:
      - "connector_used"
      - "connections_found"
      - "ping_result"
      - "create_attempted"
      - "create_used_browser"
      - "edit_attempted"
      - "folder_key_used"
      - "options_exercised"
      - "steps_completed"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Report confirms options were exercised"
    path: "connections_report.json"
    includes:
      - "--output json"
      - "--output yaml"
      - "--refresh"
      - "--folder-key"
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 2

llm_reviewer:
  enabled: true
