task_id: byod_smoke_test
description: |
  Smoke test for Bring Your Own Docker (BYOD) feature.

  Verifies that custom Docker images (built by extending coder-eval-agent)
  can be used by setting sandbox.docker.image in task configuration.

  To run this test:
  1. Build the custom image: docker build -t byod-custom-image:0.1.0 templates/byod_smoke_test/
  2. Run: coder-eval run --task tasks/byod_smoke_test.yaml

  The custom image adds a marker file at build time; success criteria checks
  for this file to confirm the custom image was actually used.

tags: [smoke, smoke-pass, byod, docker]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]

sandbox:
  driver: docker
  docker:
    image: byod-custom-image:0.1.0
    network: bridge
    env_passthrough_extra:
      - BEDROCK_MODEL
  limits:
    timeout: 60

# The custom image bakes a marker at /opt/byod_marker (an absolute container
# path OUTSIDE the /work workspace). Under --driver docker grading runs on the
# HOST over the copied-out workspace, so it cannot see /opt directly. The agent
# runs INSIDE the container (where /opt exists), so it surfaces the marker into
# its workspace; the criterion then grades that copied-out file host-side. The
# read only succeeds if the custom image was actually used (a non-BYOD image has
# no /opt/byod_marker), so the marker's content still proves BYOD worked.
initial_prompt: |
  Read the file /opt/byod_marker and write its exact contents into a new file
  named byod_marker_proof.txt in your current working directory. Do nothing else.

success_criteria:
  - type: file_contains
    path: byod_marker_proof.txt
    includes: ["BYOD custom image loaded"]
    description: Agent surfaced the image-baked /opt/byod_marker into the workspace (verifies the custom image was used, grade-outside-compatible)
