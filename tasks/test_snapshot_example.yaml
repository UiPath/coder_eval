task_id: "test_snapshot_example"
description: "Example task demonstrating snapshot configuration"
tags: [example, basic]

agent:
  type: "claude-code"
  permission_mode: acceptEdits
  allowed_tools: ["Bash"]
  max_turns: 3

sandbox:
  driver: "tempdir"
  python: {}

  # Snapshot configuration
  snapshots:
    mode: "hybrid"  # Options: disabled, full, incremental, hybrid
    checkpoint_frequency: 2  # Full snapshot every 2 iterations (hybrid mode only)
    ignore_patterns:
      - "*.log"
      - "temp_*"

initial_prompt: |
  Create a simple Python script called hello.py that prints "Hello, World!".

success_criteria:
  - type: "file_exists"
    path: "hello.py"
    description: "hello.py file should exist"
    weight: 1.0
    pass_threshold: 1.0

  - type: "run_command"
    command: "python hello.py"
    expected_exit_code: 0
    description: "Script should run successfully"
    weight: 2.0
    pass_threshold: 1.0

  - type: "run_command"
    command: "python hello.py"
    expected_stdout: "Hello, World!"
    stdout_match: "exact"
    description: "Script should output 'Hello, World!'"
    weight: 2.0
    pass_threshold: 1.0
