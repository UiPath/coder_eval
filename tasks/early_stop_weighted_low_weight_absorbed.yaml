task_id: "early_stop_weighted_low_weight_absorbed"
description: >
  Weighted early-stop (GitHub issue #61, item 1): a LOW-weight armed criterion
  misfiring must not unilaterally truncate the run once run_limits.
  stop_early_gate_threshold is below 1.0. Two armed criteria: a HIGH-weight
  (0.8) positive ("ran python app.py", stop_early.on_pass: stop) and a LOW-weight (0.2)
  distractor ("never called curl", an empty stop_early block). If the distractor misfires
  alone, the ceiling (best case: the positive still passes) is 0.8, which
  still clears the 0.7 gate threshold — so the watcher must keep running
  instead of fail-stopping, and the low-weight failure must not sink the
  final armed_criteria_passed gate either (weighted score 0.8 >= 0.7). Once
  the positive resolves, its on_pass=stop floor (0.8/0.8 = 1.0 over the
  on_pass=stop subset) meets the threshold and the run pass-stops. Gating is
  FIRED-ONLY: the weighted armed gate applies only when the watcher actually
  cuts the run; a run that completes naturally gates strict-AND over the full
  criteria set (armed or not). This is a NON-CI example task
  (deliberately untagged for smoke-pass/smoke-fail): agent behavior around
  curl is not deterministic enough for a live-agent CI assertion — run it
  manually with `coder-eval run` to observe the mechanism.
tags: [early-stop, weighted-early-stop]

initial_prompt: >
  Create a Python file named app.py in the current working directory that
  prints 'Hello, Claude!'. Then run it with: python app.py
  Do not use curl for anything in this task.

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Read", "Write", "Bash"]

run_limits:
  max_turns: 20
  stop_early_gate_threshold: 0.7

success_criteria:
  - type: "command_executed"
    description: "Agent ran the script (the HIGH-weight positive signal)"
    tool_name: "Bash"
    command_pattern: "python app\\.py"
    min_count: 1
    weight: 0.8
    stop_early:
      on_pass: stop
  - type: "command_executed"
    description: "Agent did NOT call curl (the LOW-weight distractor)"
    tool_name: "Bash"
    command_pattern: "curl"
    min_count: 0
    max_count: 0
    weight: 0.2
    stop_early: {}
  - type: "file_exists"
    path: "app.py"
    description: "app.py must exist (advisory — not armed, only gates a full run)"
