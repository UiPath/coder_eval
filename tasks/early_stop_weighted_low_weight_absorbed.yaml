task_id: "early_stop_weighted_low_weight_absorbed"
description: >
  Weighted early-stop (GitHub issue #61, item 1): a LOW-weight armed criterion
  misfiring must not unilaterally truncate the run once run_limits.
  stop_early_gate_threshold is below 1.0. Two armed criteria: a HIGH-weight
  (0.8) positive ("ran python app.py") and a LOW-weight (0.2) distractor
  ("never called curl"). If the distractor misfires alone, the ceiling
  (best case: the positive still passes) is 0.8, which still clears the 0.7
  gate threshold — so the watcher must keep running instead of fail-stopping,
  and the low-weight failure must not sink the final armed_criteria_passed
  gate either (weighted score 0.8 >= 0.7). Note: the weighted forgiveness
  applies only when the watcher itself fires the stop (pass-stops here once
  the positive resolves, regardless of the distractor) — a stop_early: true
  run that instead completes naturally still gates on the full strict-AND
  set, unaffected by weight. This is a NON-CI example task (deliberately
  untagged for smoke-pass/smoke-fail): agent behavior around curl is not
  deterministic enough for a live-agent CI assertion — run it manually with
  `coder-eval run` to observe the mechanism.
tags: [early-stop, weighted-early-stop]

initial_prompt: >
  Create a Python file named app.py in the current working directory that
  prints 'Hello, Claude!'. Then run it with: python app.py
  Do not use curl for anything in this task.

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Read", "Write", "Bash"]

run_limits:
  max_turns: 20
  stop_early: true
  stop_early_gate_threshold: 0.7

success_criteria:
  - type: "command_executed"
    description: "Agent ran the script (the HIGH-weight positive signal)"
    tool_name: "Bash"
    command_pattern: "python app\\.py"
    min_count: 1
    weight: 0.8
    stop_when: "auto"
  - type: "command_executed"
    description: "Agent did NOT call curl (the LOW-weight distractor)"
    tool_name: "Bash"
    command_pattern: "curl"
    min_count: 0
    max_count: 0
    weight: 0.2
    stop_when: "auto"
  - type: "file_exists"
    path: "app.py"
    description: "app.py must exist (advisory — not armed, only gates a full run)"
