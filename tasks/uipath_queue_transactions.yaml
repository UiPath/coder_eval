task_id: uipath-queue-transactions
description: "Create a script that processes queue transactions with proper completion handling"
tags: [integration, uipath-python, network]

agent:
  type: claude-code
  permission_mode: acceptEdits

sandbox:
  driver: tempdir
  python_version: "3.13"
  template_sources:
    - type: template_dir
      path: "../templates/uipath-starter"
  env_packages:
    - uipath>=2.1.75
    - python-dotenv>=1.0

initial_prompt: |
  Create a Python script (queue_transactions.py) that demonstrates transaction-based queue processing.

  The script should:
  - Load environment variables and initialize UiPath SDK
  - Import TransactionItem and TransactionItemResult from uipath.models.queues
  - Create 3 transaction items with specific_content containing data
  - List transaction items and filter by queue name and status
  - Process each transaction (simulate some work)
  - Complete each transaction with TransactionItemResult (is_successful + output)
  - Handle failures by marking transactions as failed
  - Print clear status messages

  Important:
  - TransactionItem uses 'name' for queue name and 'specific_content' for data
  - Use sdk.queues.create_transaction_item() with no_robot=True
  - Complete with sdk.queues.complete_transaction_item(transaction_key, result)

success_criteria:
  - type: file_exists
    description: "queue_transactions.py file exists"
    path: "queue_transactions.py"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Script imports required modules"
    path: "queue_transactions.py"
    includes:
      - "from uipath import UiPath"
      - "from uipath.models.queues import TransactionItem"
      - "TransactionItemResult"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Script creates TransactionItem instances"
    path: "queue_transactions.py"
    includes:
      - "TransactionItem"
      - "name="
      - "specific_content="
    weight: 2.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Script creates transactions"
    path: "queue_transactions.py"
    includes:
      - "queues.create_transaction_item"
      - "no_robot="
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Script completes transactions"
    path: "queue_transactions.py"
    includes:
      - "queues.complete_transaction_item"
      - "TransactionItemResult"
    weight: 2.5
    pass_threshold: 1.0

  - type: run_command
    description: "Python syntax is valid"
    command: "python -m py_compile queue_transactions.py"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: reference_comparison
    description: "Code structure matches reference implementation"
    agent_file: "queue_transactions.py"
    comparison_method: "ast"
    similarity_threshold: 0.65
    weight: 2.0
    pass_threshold: 0.65

max_iterations: 5

reference:
  code: |
    #!/usr/bin/env python3
    from dotenv import load_dotenv
    from uipath import UiPath
    from uipath.models.queues import TransactionItem, TransactionItemResult

    load_dotenv()
    sdk = UiPath()

    queue_name = "TransactionQueue"

    print(f"Queue Transaction Processing - Queue: {queue_name}")
    print("=" * 60)

    # Create transactions
    print("\nCreating transaction items...")
    transaction_keys = []

    for i in range(3):
        transaction = TransactionItem(
            name=queue_name,
            specific_content={
                "id": i + 1,
                "value": (i + 1) * 100,
                "description": f"Transaction {i + 1}"
            }
        )

        try:
            response = sdk.queues.create_transaction_item(
                item=transaction,
                no_robot=True
            )
            data = response.json()
            key = data.get('Key')
            transaction_keys.append(key)
            print(f"  ✓ Created transaction {i + 1}: Key={key}")
        except Exception as e:
            print(f"  ✗ Error creating transaction {i + 1}: {e}")

    # Process transactions
    print(f"\nProcessing {len(transaction_keys)} transactions...")
    for i, key in enumerate(transaction_keys, 1):
        try:
            # Simulate processing
            result_data = {
                "processed_id": i,
                "status": "completed",
                "processed_at": "2024-01-01T00:00:00Z"
            }

            result = TransactionItemResult(
                is_successful=True,
                output=result_data
            )

            sdk.queues.complete_transaction_item(
                transaction_key=key,
                result=result
            )
            print(f"  ✓ Completed transaction {i}")

        except Exception as e:
            print(f"  ✗ Error processing transaction {i}: {e}")

            # Mark as failed
            result = TransactionItemResult(
                is_successful=False,
                processing_exception={"message": str(e)}
            )

            try:
                sdk.queues.complete_transaction_item(
                    transaction_key=key,
                    result=result
                )
                print(f"  ✓ Marked transaction {i} as failed")
            except Exception as e2:
                print(f"  ✗ Could not mark transaction {i} as failed: {e2}")

    print("\n" + "=" * 60)
    print("✓ Transaction processing complete!")

llm_reviewer:
  enabled: true
  prompt: |
    Evaluate if the queue transactions script is complete and correct:

    1. Does it import TransactionItem and TransactionItemResult?
    2. Does it create TransactionItem with 'name' and 'specific_content'?
    3. Does it use sdk.queues.create_transaction_item() with no_robot=True?
    4. Does it complete transactions using sdk.queues.complete_transaction_item()?
    5. Does it handle both success and failure cases?
    6. Is the code structure clear and well-organized?
