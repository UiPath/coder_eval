task_id: uipath-queue-transactions
description: "Create a script that processes queue transactions with proper completion handling"
tags: [golden, integration, uipath-python, network]

agent:
  type: claude-code

sandbox:
  driver: tempdir
  python:
    env_packages:
      - uipath>=2.1.75
      - python-dotenv>=1.0
  template_sources:
    - type: template_dir
      path: "../templates/uipath-starter"

initial_prompt: |
  Create a Python script called queue_transactions.py that shows how to work with
  UiPath Orchestrator queues in a transactional pattern.

  The script should create a few transaction items on a queue, then loop through them
  and mark each one as completed. If something goes wrong processing a transaction,
  mark it as failed instead. Print clear status messages throughout.

  Use the UiPath Python SDK's queue methods and the proper transaction item models.
  Put everything in a def main() function — don't call the SDK at module level since
  credentials aren't available at import time. Add if __name__ == "__main__": main()
  at the bottom. Load env vars with dotenv.

  Keep it to one file.

success_criteria:
  - type: file_exists
    description: "queue_transactions.py file exists"
    path: "queue_transactions.py"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Script imports required modules"
    path: "queue_transactions.py"
    includes:
      - "UiPath"
      - "TransactionItem"
      - "TransactionItemResult"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Script creates TransactionItem instances"
    path: "queue_transactions.py"
    includes:
      - "TransactionItem("
      - "specific_content="
    weight: 2.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Script creates and completes transactions"
    path: "queue_transactions.py"
    includes:
      - "create_transaction_item"
      - "complete_transaction_item"
    weight: 2.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Script handles success and failure"
    path: "queue_transactions.py"
    includes:
      - "is_successful"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Has main() function entrypoint"
    path: "queue_transactions.py"
    includes:
      - "def main"
    weight: 1.5
    pass_threshold: 1.0

  - type: import_check
    description: "Python syntax valid and all imports resolve"
    path: "queue_transactions.py"
    weight: 3.5
    pass_threshold: 1.0
    timeout: 30

  - type: llm_judge
    description: "Qualitative LLM code review"
    prompt: |
      Evaluate if the queue transactions script is complete and correct:

      1. Does it import TransactionItem and TransactionItemResult from uipath.platform.orchestrator.queues?
      2. Does it create TransactionItem with name= and specific_content=?
      3. Does it use sdk.queues.create_transaction_item(item, no_robot=True) with positional args?
      4. Does it complete with sdk.queues.complete_transaction_item(transaction_key, result)?
      5. Does it handle both success (is_successful=True) and failure (is_successful=False)?
      6. Is the code structure clear and well-organized?
    include_reference: true
    include_agent_output: true
    include_tool_calls: true
    weight: 1.0
    pass_threshold: 0.7

reference:
  code: |
    from dotenv import load_dotenv
    from uipath.platform import UiPath
    from uipath.platform.orchestrator.queues import TransactionItem, TransactionItemResult

    def main():
        load_dotenv()
        sdk = UiPath()

        queue_name = "TransactionQueue"
        transaction_keys = []

        for i in range(3):
            transaction = TransactionItem(
                name=queue_name,
                specific_content={"id": i + 1, "value": (i + 1) * 100},
            )
            try:
                response = sdk.queues.create_transaction_item(transaction, no_robot=True)
                key = response.json().get("Key")
                transaction_keys.append(key)
                print(f"Created transaction {i + 1}: Key={key}")
            except Exception as e:
                print(f"Error creating transaction {i + 1}: {e}")

        for i, key in enumerate(transaction_keys, 1):
            try:
                result = TransactionItemResult(
                    is_successful=True,
                    output={"processed_id": i, "status": "completed"},
                )
                sdk.queues.complete_transaction_item(key, result)
                print(f"Completed transaction {i}")
            except Exception as e:
                print(f"Error processing transaction {i}: {e}")
                fail_result = TransactionItemResult(
                    is_successful=False,
                    processing_exception={"message": str(e)},
                )
                try:
                    sdk.queues.complete_transaction_item(key, fail_result)
                except Exception:
                    pass

    if __name__ == "__main__":
        main()

    print("\nTransaction processing complete!")
