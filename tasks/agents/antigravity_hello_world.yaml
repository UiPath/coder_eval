task_id: antigravity_hello_world
description: |
  A simple hello world task for testing the Antigravity agent (Google's Gemini
  coding harness) on the default tempdir driver. The agent is asked to create a
  Python script that prints "Hello, Antigravity!" and verify it runs.

tags:
  - antigravity
  - streaming
  - basic

agent:
  type: antigravity
  model: gemini-3.1-pro-preview
  thinking_level: medium

initial_prompt: |
  Create a simple Python script called `hello.py` that prints "Hello, Antigravity!" when run.
  Then run it to confirm it works. The script should be executable and complete.

success_criteria:
  - type: file_exists
    path: hello.py
    description: "The file hello.py must be created."
    weight: 0.3

  - type: file_contains
    path: hello.py
    includes:
      - "print"
      - "Hello, Antigravity"
    description: "The script must contain a print statement and the greeting."
    weight: 0.4

  - type: run_command
    command: "python hello.py"
    description: "The script must execute and output the greeting."
    weight: 0.3

run_limits:
  max_turns: 5
  task_timeout: 360
  turn_timeout: 300
