task_id: "ca-fix-broken-imports"
description: >
  The email-parser agent has broken imports (typo and unused wrong import) and
  cannot run. Diagnose and fix all import errors so the agent runs successfully.
initial_prompt: |
  The UiPath agent in this directory is broken. When I try to run it, I get import errors.
  Please diagnose and fix all issues so this command succeeds:
  `uv run uipath run parse '{"raw_email": "From: alice@example.com\nSubject: Hello\nBody: Hi there"}'`
max_iterations: 3
tags: [agents, fix, imports, t2]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/broken-imports-agent

success_criteria:
  - type: "import_check"
    path: "main.py"
    description: "All imports in main.py must resolve"
    weight: 3.0
    pass_threshold: 1.0

  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath run parse.*"
    min_count: 1
    require_success: true
    description: "Agent must run successfully after fix"
    weight: 4.0
