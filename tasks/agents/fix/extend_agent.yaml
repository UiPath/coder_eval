task_id: "ca-fix-extend-agent"
description: >
  Extend an existing word-count agent with additional functionality: add
  a new output field (unique_words) and handle edge cases (empty input).
  Tests the agent's ability to modify existing code without breaking it.
initial_prompt: |
  I have a word-count UiPath agent in this directory. Please extend it:
  1. Add a new output field: unique_words (int) — count of unique words (case-insensitive)
  2. Handle empty string input gracefully (word_count=0, unique_words=0)
  3. Re-run `uv run uipath init` after the changes
  4. Verify it works: `uv run uipath run word_count '{"text": "the cat sat on the mat"}'`
     Expected: word_count=6, unique_words=5
tags: [agents, fix, extend, t2]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  template_sources:
    - type: "template_dir"
      path: ../templates/word-count-deployable

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes:
      - "unique_words"
      - "word_count"
      - "@traced()"
    description: "main.py has both word_count and unique_words fields"
    weight: 2.0

  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath init.*"
    min_count: 1
    require_success: true
    description: "uipath init was re-run after changes"
    weight: 1.0

  - type: "run_command"
    command: "uv run uipath run word_count '{\"text\": \"the cat sat on the mat\"}'"
    timeout: 60
    expected_stdout: "unique_words"
    stdout_match: "contains"
    description: "Agent output includes unique_words field"
    weight: 2.0

  - type: "run_command"
    command: "uv run uipath run word_count '{\"text\": \"the cat sat on the mat\"}'"
    timeout: 60
    expected_stdout: "\"unique_words\": 5"
    stdout_match: "contains"
    description: "unique_words count is correct (5 unique words)"
    weight: 3.0

  - type: "run_command"
    command: "uv run uipath run word_count '{\"text\": \"\"}'"
    timeout: 60
    expected_stdout: "\"unique_words\": 0"
    stdout_match: "contains"
    description: "Empty input returns unique_words=0"
    weight: 2.0
