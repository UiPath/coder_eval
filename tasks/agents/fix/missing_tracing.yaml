task_id: "ca-fix-missing-tracing"
description: >
  The currency-converter agent is missing the @traced() decorator required
  for UiPath monitoring. Add it without breaking the agent's functionality.
initial_prompt: |
  My UiPath agent is missing the required @traced() decorator for monitoring.
  Please add it so the agent is properly traced in UiPath Cloud.
  After adding it, verify the agent still runs correctly with:
  `uv run uipath run convert '{"amount": 100, "target_currency": "EUR"}'`
tags: [agents, fix, tracing, t1]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/missing-tracing-agent

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes:
      - "from uipath.tracing import traced"
      - "@traced()"
    description: "@traced() decorator must be present with correct import"
    weight: 4.0
    pass_threshold: 1.0

  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath run convert.*"
    min_count: 1
    require_success: true
    description: "Agent runs correctly after tracing is added"
    weight: 3.0
