task_id: "ca-fix-wrong-import-path"
description: >
  The agent uses `from uipath import UiPath` which is a wrong import path —
  the correct import is `from uipath.platform import UiPath`. This is one
  of the most common mistakes the skill explicitly warns against.
initial_prompt: |
  My UiPath agent fails with an ImportError when I try to run it. Please fix it
  and verify it runs correctly with:
  `uv run uipath run greet '{"name": "World"}'`
tags: [agents, fix, import-path, t1]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/wrong-import-path-agent

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["from uipath.platform import UiPath"]
    excludes: ["from uipath import UiPath"]
    description: "Must use correct import path: from uipath.platform import UiPath"
    weight: 4.0
    pass_threshold: 1.0

  - type: "import_check"
    path: "main.py"
    description: "All imports resolve"
    weight: 2.0

  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath run greet.*"
    min_count: 1
    require_success: true
    description: "Agent must run successfully after fix"
    weight: 3.0
