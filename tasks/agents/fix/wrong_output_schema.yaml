task_id: "ca-fix-wrong-output-schema"
description: >
  The string-reverser agent's Output model uses field name 'reversed' but the
  evaluation set expects 'reversed_text'. Fix the agent schema so evals pass.
initial_prompt: |
  My UiPath agent's evaluations are failing due to a schema mismatch.
  The eval set expects the output field to be named 'reversed_text', but the agent
  returns 'reversed'. Please fix the agent code so the evaluations pass.
  Do NOT modify the evaluation files.
  After fixing, re-run `uv run uipath init` and verify the evals pass.
tags: [agents, fix, schema, t2]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/wrong-schema-agent

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["reversed_text"]
    excludes: ["    reversed:"]
    description: "Output model uses 'reversed_text' field name"
    weight: 2.0

  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath init.*"
    min_count: 1
    require_success: true
    description: "uipath init was re-run after schema fix"
    weight: 1.0

  - type: "uipath_eval"
    description: "String reverser evals pass after schema fix"
    agent_name: reverse
    eval_set: evaluations/eval-sets/smoke-test.json
    thresholds:
      ExactMatchEvaluator: 1.0
    weight: 5.0
    pass_threshold: 1.0
