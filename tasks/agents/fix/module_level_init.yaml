task_id: "ca-fix-module-level-init"
description: >
  The asset-reader agent instantiates UiPath() at module level, which causes
  uipath init to fail because auth hasn't run yet. Fix it to use lazy
  initialization inside the function, then run uipath init successfully.
initial_prompt: |
  My UiPath agent fails when I run `uv run uipath init`. Please diagnose and fix it,
  then successfully run `uv run uipath init`.
tags: [agents, fix, anti-pattern, module-level-init, t2]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/module-level-init-agent

success_criteria:
  - type: "file_check"
    path: "main.py"
    patterns:
      - pattern: "^(?:sdk|uipath_client|client|uipath)\\s*=\\s*UiPath\\(\\)"
        must_match: false
        flags: 8
    description: "No module-level UiPath() instantiation"
    weight: 3.0
    pass_threshold: 1.0

  - type: "file_check"
    path: "main.py"
    includes: ["UiPath()"]
    description: "UiPath() must still be used somewhere (inside the function)"
    weight: 1.0

  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath init.*"
    min_count: 1
    require_success: true
    description: "uipath init must succeed after the fix"
    weight: 4.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "entry-points.json generated by uipath init"
    weight: 2.0
