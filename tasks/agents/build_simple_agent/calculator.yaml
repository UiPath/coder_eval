task_id: "uipath_calculator_agent"
description: "Create a UiPath calculator agent that takes 2 numbers and one operator as input and produces a number as output."
initial_prompt: |
  Create a UiPath calculator agent in the current directory that takes 2 numbers as input and produces a number as output.
  The input numbers should be named "a" and "b" and "operator" should be allowed to take values "+", "-", "*" or "/".
  The agent should be called "calculator" and it should be defined in "main.py". The entrypoint function should be called "calculator".
  It should not contain any evaluations.
tags: [uipath, agents]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Glob", "Grep"]
  plugins:
    - type: "local"
      path: ../skills

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["def calculator", "operator"]
    patterns:
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py has correct agent structure with Input/Output models and tracing"
    weight: 2.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "uipath init was run (entry-points.json generated)"
    weight: 1.0

  - type: "uipath_eval"
    description: "Verify calculator agent evaluation metrics"
    agent_name: calculator
    eval_set: evaluations/eval-sets/default.json
    thresholds:
      ExactMatchEvaluator: 1.0
    weight: 4.0
