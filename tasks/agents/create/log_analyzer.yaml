task_id: "ca-create-log-analyzer"
description: Build an agent that analyzes structured application log entries.
tags: [agents, create, simple-function, t2]
initial_prompt_file: prompts/log_analyzer.md
max_iterations: 3

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["@traced()", "def analyze_logs", "error_count", "warning_count", "unique_sources"]
    patterns:
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py has correct agent structure"
    weight: 2.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "uipath init was run"
    weight: 2.0

  - type: "import_check"
    path: "main.py"
    description: "All imports resolve"
    weight: 1.0

  - type: "run_command"
    command: "uv run uipath run analyze_logs '{\"log_text\": \"[2024-01-15 10:30:00] [ERROR] [auth-service] Login failed\\n[2024-01-15 10:31:00] [WARN] [db-service] Slow query\\n[2024-01-15 10:32:00] [ERROR] [auth-service] Token expired\", \"severity_filter\": \"ERROR\"}'"
    timeout: 60
    expected_stdout: "auth-service"
    stdout_match: "contains"
    description: "Filters and returns ERROR entries"
    weight: 3.0

  - type: "run_command"
    command: "uv run uipath run analyze_logs '{\"log_text\": \"[2024-01-15 10:30:00] [ERROR] [auth-service] Login failed\\n[2024-01-15 10:31:00] [WARN] [db-service] Slow query\\n[2024-01-15 10:32:00] [INFO] [api-gateway] Request received\"}'"
    timeout: 60
    expected_stdout: "\"total_lines\": 3"
    stdout_match: "contains"
    description: "Counts total lines correctly"
    weight: 3.0

  - type: "commands_efficiency"
    expected_commands: 18
    description: "Complete within command budget"
    weight: 0.5
    pass_threshold: 0.3
