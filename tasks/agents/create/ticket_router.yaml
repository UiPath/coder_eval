task_id: "ca-create-ticket-router"
description: Build an agent that routes support tickets to teams with SLA calculation.
tags: [agents, create, simple-function, t3]
initial_prompt_file: prompts/ticket_router.md

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["@traced()", "def route_ticket", "team", "priority", "sla_hours", "escalate"]
    patterns:
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py has correct agent structure"
    weight: 2.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "uipath init was run"
    weight: 2.0

  - type: "import_check"
    path: "main.py"
    description: "All imports resolve"
    weight: 1.0

  - type: "run_command"
    command: "uv run uipath run route_ticket '{\"ticket_title\": \"Payment failed\", \"ticket_body\": \"I tried to pay but my card was charged twice\", \"customer_tier\": \"enterprise\"}'"
    timeout: 60
    expected_stdout: "billing"
    stdout_match: "contains"
    description: "Payment issue routed to billing"
    weight: 3.0

  - type: "run_command"
    command: "uv run uipath run route_ticket '{\"ticket_title\": \"URGENT: API crash\", \"ticket_body\": \"Our integration is completely down, this is an outage\", \"customer_tier\": \"enterprise\"}'"
    timeout: 60
    expected_stdout: "true"
    stdout_match: "contains"
    description: "Enterprise outage ticket escalated"
    weight: 3.0

  - type: "commands_efficiency"
    expected_commands: 18
    description: "Complete within command budget"
    weight: 0.5
    pass_threshold: 0.3
