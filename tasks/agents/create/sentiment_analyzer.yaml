task_id: "ca-create-sentiment-analyzer"
description: Build an agent that analyzes sentiment in customer feedback using keyword matching.
tags: [agents, create, simple-function, t2]
initial_prompt_file: prompts/sentiment_analyzer.md

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["@traced()", "def analyze_sentiment", "sentiment", "confidence", "key_phrases"]
    patterns:
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py has correct agent structure"
    weight: 2.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "uipath init was run"
    weight: 2.0

  - type: "import_check"
    path: "main.py"
    description: "All imports resolve"
    weight: 1.0

  - type: "run_command"
    command: "uv run uipath run analyze_sentiment '{\"text\": \"This product is amazing and wonderful, I love it!\", \"language\": \"en\"}'"
    timeout: 60
    expected_stdout: "positive"
    stdout_match: "contains"
    description: "Positive text correctly classified"
    weight: 3.0

  - type: "run_command"
    command: "uv run uipath run analyze_sentiment '{\"text\": \"Terrible experience, the worst product ever\", \"language\": \"en\"}'"
    timeout: 60
    expected_stdout: "negative"
    stdout_match: "contains"
    description: "Negative text correctly classified"
    weight: 3.0

  - type: "commands_efficiency"
    expected_commands: 18
    description: "Complete within command budget"
    weight: 0.5
    pass_threshold: 0.3
