task_id: "ca-create-invoice-parser"
description: Build an agent that parses structured invoice text into fields.
tags: [agents, create, simple-function, t2]
initial_prompt_file: prompts/invoice_parser.md
max_iterations: 3

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["@traced()", "def parse_invoice", "vendor_name", "invoice_number", "total_amount"]
    patterns:
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py has correct agent structure"
    weight: 2.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "uipath init was run"
    weight: 2.0

  - type: "import_check"
    path: "main.py"
    description: "All imports resolve"
    weight: 1.0

  - type: "run_command"
    command: "uv run uipath run parse_invoice '{\"invoice_text\": \"Vendor: Acme Corp\\nInvoice: INV-001\\nItems:\\n- Widget A: 100.00\\n- Widget B: 250.00\\nTotal: 350.00\"}'"
    timeout: 60
    expected_stdout: "Acme Corp"
    stdout_match: "contains"
    description: "Parses vendor name from invoice"
    weight: 3.0

  - type: "run_command"
    command: "uv run uipath run parse_invoice '{\"invoice_text\": \"Vendor: Acme Corp\\nInvoice: INV-001\\nItems:\\n- Widget A: 100.00\\n- Widget B: 250.00\\nTotal: 350.00\"}'"
    timeout: 60
    expected_stdout: "350"
    stdout_match: "contains"
    description: "Parses total amount from invoice"
    weight: 3.0

  - type: "commands_efficiency"
    expected_commands: 18
    description: "Complete within command budget"
    weight: 0.5
    pass_threshold: 0.3
