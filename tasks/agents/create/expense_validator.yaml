task_id: "ca-create-expense-validator"
description: Build an agent that validates expense reports against business rules.
tags: [agents, create, simple-function, t3]
initial_prompt_file: prompts/expense_validator.md

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["@traced()", "def validate_expenses", "is_valid", "violations", "total_amount"]
    patterns:
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py has correct agent structure"
    weight: 2.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "uipath init was run"
    weight: 2.0

  - type: "import_check"
    path: "main.py"
    description: "All imports resolve"
    weight: 1.0

  - type: "run_command"
    command: "uv run uipath run validate_expenses '{\"employee_name\": \"Alice\", \"expenses\": \"[{\\\"description\\\": \\\"Flight\\\", \\\"amount\\\": 400, \\\"category\\\": \\\"travel\\\"}, {\\\"description\\\": \\\"Dinner\\\", \\\"amount\\\": 50, \\\"category\\\": \\\"meals\\\"}]\", \"daily_limit\": 500}'"
    timeout: 60
    expected_stdout: "true"
    stdout_match: "contains"
    description: "Valid expenses pass validation"
    weight: 3.0

  - type: "run_command"
    command: "uv run uipath run validate_expenses '{\"employee_name\": \"Bob\", \"expenses\": \"[{\\\"description\\\": \\\"Luxury hotel\\\", \\\"amount\\\": 600, \\\"category\\\": \\\"travel\\\"}]\", \"daily_limit\": 500}'"
    timeout: 60
    expected_stdout: "false"
    stdout_match: "contains"
    description: "Expense exceeding daily limit is invalid"
    weight: 3.0

  - type: "commands_efficiency"
    expected_commands: 18
    description: "Complete within command budget"
    weight: 0.5
    pass_threshold: 0.3
