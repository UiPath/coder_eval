task_id: "ca-create-meeting-scheduler"
description: Build an agent that finds available meeting slots given a busy schedule.
tags: [agents, create, simple-function, t3]
initial_prompt_file: prompts/meeting_scheduler.md
max_iterations: 4

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["@traced()", "def find_slots", "available_slots", "slot_count", "longest_gap_minutes"]
    patterns:
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py has correct agent structure"
    weight: 2.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "uipath init was run"
    weight: 2.0

  - type: "import_check"
    path: "main.py"
    description: "All imports resolve"
    weight: 1.0

  - type: "run_command"
    command: "uv run uipath run find_slots '{\"busy_slots\": \"[{\\\"start\\\": \\\"09:00\\\", \\\"end\\\": \\\"10:00\\\"}, {\\\"start\\\": \\\"14:00\\\", \\\"end\\\": \\\"15:00\\\"}]\", \"meeting_duration_minutes\": 60, \"work_start\": \"09:00\", \"work_end\": \"17:00\"}'"
    timeout: 60
    expected_stdout: "10:00"
    stdout_match: "contains"
    description: "Finds slots between busy periods"
    weight: 3.0

  - type: "commands_efficiency"
    expected_commands: 20
    description: "Complete within command budget"
    weight: 0.5
    pass_threshold: 0.3
