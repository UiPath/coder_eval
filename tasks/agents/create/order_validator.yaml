task_id: "ca-create-order-validator"
description: Build an agent that validates e-commerce orders against business rules.
tags: [agents, create, simple-function, t3]
initial_prompt_file: prompts/order_validator.md
max_iterations: 3

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["@traced()", "def validate_order", "is_valid", "errors", "total_before_discount"]
    patterns:
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py has correct agent structure"
    weight: 2.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "uipath init was run"
    weight: 2.0

  - type: "import_check"
    path: "main.py"
    description: "All imports resolve"
    weight: 1.0

  - type: "run_command"
    command: "uv run uipath run validate_order '{\"order\": \"{\\\"customer_email\\\": \\\"alice@example.com\\\", \\\"items\\\": [{\\\"sku\\\": \\\"A1\\\", \\\"quantity\\\": 2, \\\"price\\\": 29.99}], \\\"shipping_country\\\": \\\"US\\\", \\\"discount_code\\\": \\\"SAVE10\\\"}\"}'"
    timeout: 60
    expected_stdout: "true"
    stdout_match: "contains"
    description: "Valid order passes validation"
    weight: 3.0

  - type: "run_command"
    command: "uv run uipath run validate_order '{\"order\": \"{\\\"customer_email\\\": \\\"invalid-email\\\", \\\"items\\\": [{\\\"sku\\\": \\\"A1\\\", \\\"quantity\\\": 0, \\\"price\\\": 29.99}], \\\"shipping_country\\\": \\\"USA\\\"}\"}'"
    timeout: 60
    expected_stdout: "false"
    stdout_match: "contains"
    description: "Invalid order fails validation (bad email, zero quantity, 3-char country)"
    weight: 3.0

  - type: "commands_efficiency"
    expected_commands: 18
    description: "Complete within command budget"
    weight: 0.5
    pass_threshold: 0.3
