task_id: "ca-create-resume-scorer"
description: Build an agent that scores resumes against job requirements with skill matching.
tags: [agents, create, simple-function, t2]
initial_prompt_file: prompts/resume_scorer.md

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes: ["@traced()", "def score_resume", "match_score", "recommendation"]
    patterns:
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py has correct agent structure"
    weight: 2.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "uipath init was run"
    weight: 2.0

  - type: "import_check"
    path: "main.py"
    description: "All imports resolve"
    weight: 1.0

  - type: "run_command"
    command: "uv run uipath run score_resume '{\"resume_skills\": [\"Python\", \"SQL\", \"Java\", \"AWS\", \"Docker\"], \"required_skills\": [\"Python\", \"SQL\", \"Java\", \"C++\"], \"preferred_skills\": [\"AWS\", \"Docker\", \"Kubernetes\"]}'"
    timeout: 60
    expected_stdout: "partial_match"
    stdout_match: "contains"
    description: "3 required × 10 + 2 preferred × 5 = 40 → partial_match"
    weight: 3.0

  - type: "run_command"
    command: "uv run uipath run score_resume '{\"resume_skills\": [\"Python\", \"SQL\", \"Java\", \"Go\", \"C++\", \"Rust\", \"TypeScript\", \"AWS\", \"Docker\", \"Kubernetes\"], \"required_skills\": [\"Python\", \"SQL\", \"Java\", \"Go\", \"C++\", \"Rust\", \"TypeScript\"], \"preferred_skills\": [\"AWS\", \"Docker\", \"Kubernetes\"]}'"
    timeout: 60
    expected_stdout: "strong_match"
    stdout_match: "contains"
    description: "7 required × 10 + 3 preferred × 5 = 85 → strong_match"
    weight: 3.0

  - type: "commands_efficiency"
    expected_commands: 18
    description: "Complete within command budget"
    weight: 0.5
    pass_threshold: 0.3
