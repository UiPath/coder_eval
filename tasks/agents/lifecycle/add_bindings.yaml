task_id: "ca-lifecycle-add-bindings"
description: >
  An agent uses UiPath assets and buckets. Add the correct resource bindings
  to bindings.json so the agent can be deployed with environment-specific
  overrides. Tests knowledge of the bindings reference.
initial_prompt: |
  I have a UiPath agent that uses two platform resources:
  - An asset named "ApiKey" (retrieved via sdk.assets.retrieve)
  - A bucket named "DataStore" (used via sdk.buckets.upload/download)

  Please update the bindings.json file to declare these resource bindings so
  they can be overridden per environment when deployed to Orchestrator.

  The bindings.json file should follow the v2.0 format with entries for both resources.
tags: [agents, lifecycle, bindings, t2]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  template_sources:
    - type: "template_dir"
      path: ../templates/word-count-deployable

success_criteria:
  - type: "file_exists"
    path: "bindings.json"
    description: "bindings.json must exist"
    weight: 1.0

  - type: "file_check"
    path: "bindings.json"
    includes: ["ApiKey", "DataStore"]
    description: "bindings.json references both resources"
    weight: 3.0
    pass_threshold: 1.0

  - type: "json_check"
    path: "bindings.json"
    assertions:
      - expression: "bindings"
        operator: "exists"
    description: "bindings.json has valid structure"
    weight: 2.0
