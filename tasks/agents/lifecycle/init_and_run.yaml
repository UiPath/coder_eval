task_id: "ca-lifecycle-init-and-run"
description: >
  An agent project exists with main.py and pyproject.toml but no entry-points.json.
  Run uipath init to generate schemas, then run the agent to verify it works.
initial_prompt: |
  I have a UiPath agent in this directory but I haven't run `uipath init` yet.
  Please initialize it and then run it with this input:
  `uv run uipath run sort_items '{"items": ["cherry", "apple", "banana"]}'`
max_iterations: 3
tags: [agents, lifecycle, init, run, t2]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/uninitialized-agent

success_criteria:
  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath init.*"
    min_count: 1
    require_success: true
    description: "uipath init must be run successfully"
    weight: 3.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "entry-points.json must exist after init"
    weight: 2.0

  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath run sort_items.*"
    min_count: 1
    require_success: true
    description: "Agent must run successfully"
    weight: 3.0

  - type: "commands_efficiency"
    expected_commands: 6
    description: "Init+run should be efficient"
    weight: 1.0
    pass_threshold: 0.5
