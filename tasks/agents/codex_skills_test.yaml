task_id: codex_skills_test
description: Test that CodexAgent installs SKILL.md files for the turn and removes them before grading

tags:
  - codex
  - streaming
  - skills

agent:
  type: codex
  model: gpt-5.5
  permission_mode: acceptEdits
  plugins:
    - type: local
      path: "$PLUGIN_PATH"

initial_prompt: |
  Run `find .agents/skills -name SKILL.md | wc -l` and write the number it prints, and
  nothing else, to skill_count.txt.

success_criteria:
  - type: run_command
    description: find should see at least one SKILL.md under .agents/skills
    command: grep -Eq '^[[:space:]]*[1-9][0-9]*[[:space:]]*$' skill_count.txt
    expected_exit_code: 0

  - type: run_command
    description: The skill copies are gone by grading time
    command: test ! -e .agents
    expected_exit_code: 0
