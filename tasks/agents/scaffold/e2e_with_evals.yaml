task_id: "ca-scaffold-e2e-with-evals"
description: >
  Build a BMI calculator agent end-to-end: create the agent, init, run it to
  verify, add ExactMatch evaluations, and confirm evaluations pass.
initial_prompt: |
  Create a complete UiPath agent project from scratch in the current directory:

  1. Agent: bmi-calculator
     - Input: weight_kg (float), height_m (float)
     - Output: bmi (float rounded to 2 decimal places), category (string)
     - Categories: "Underweight" if bmi < 18.5, "Normal" if 18.5 <= bmi < 25,
       "Overweight" if 25 <= bmi < 30, "Obese" if bmi >= 30
     - Entry point function: calculate_bmi (in main.py)
     - Must use @traced()

  2. Register it in uipath.json and run `uv run uipath init`

  3. Run the agent to verify:
     `uv run uipath run calculate_bmi '{"weight_kg": 70, "height_m": 1.75}'`

  4. Create an ExactMatch evaluator at evaluations/evaluators/exact-match.json
     Create an eval set at evaluations/eval-sets/smoke-test.json with 3 test cases:
     - weight_kg=70, height_m=1.75 → bmi=22.86, category="Normal"
     - weight_kg=50, height_m=1.75 → bmi=16.33, category="Underweight"
     - weight_kg=100, height_m=1.75 → bmi=32.65, category="Obese"

  5. Run the evaluations:
     `uv run uipath eval calculate_bmi evaluations/eval-sets/smoke-test.json --no-report`
max_iterations: 5
tags: [agents, scaffold, evaluate, e2e, t4]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes:
      - "@traced()"
      - "class Input(BaseModel)"
      - "class Output(BaseModel)"
      - "bmi"
      - "category"
      - "calculate_bmi"
    patterns:
      - pattern: "^(?:sdk|uipath|client)\\s*=\\s*UiPath\\(\\)"
        must_match: false
        flags: 8
    description: "main.py has correct structure"
    weight: 2.0

  - type: "file_check"
    path: "pyproject.toml"
    excludes: ["[build-system]"]
    description: "No [build-system] in pyproject.toml"
    weight: 1.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "uipath init was run"
    weight: 1.0

  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath run calculate_bmi.*"
    min_count: 1
    require_success: true
    description: "Agent was executed at least once"
    weight: 2.0

  - type: "file_exists"
    path: "evaluations/evaluators/exact-match.json"
    description: "ExactMatch evaluator must exist"
    weight: 1.0

  - type: "json_check"
    path: "evaluations/eval-sets/smoke-test.json"
    assertions:
      - expression: "evaluations | length(@)"
        operator: "gte"
        expected: 3
      - expression: "evaluatorRefs"
        operator: "exists"
    description: "Eval set has at least 3 test cases"
    weight: 2.0

  - type: "command_executed"
    tool_name: "Bash"
    command_pattern: ".*uipath eval calculate_bmi.*smoke-test.*"
    min_count: 1
    require_success: true
    description: "Evaluation was run"
    weight: 2.0

  - type: "uipath_eval"
    description: "Agent passes BMI evaluations"
    agent_name: calculate_bmi
    eval_set: evaluations/eval-sets/smoke-test.json
    thresholds:
      ExactMatchEvaluator: 0.9
    weight: 4.0
    pass_threshold: 0.9

  - type: "commands_efficiency"
    expected_commands: 15
    description: "Complete within command budget"
    weight: 1.0
    pass_threshold: 0.5
