task_id: "ca-scaffold-string-transformer"
description: >
  Create a multi-operation string transformer agent. Tests that the agent
  creates Pydantic models with enum-like fields, handles multiple operations,
  includes @traced, and can run and pass evals. Simpler than sentence-stats
  since it doesn't need uipath init to pass structurally.
initial_prompt: |
  Create a UiPath agent in the current directory that transforms strings.
  - Input: text (string), operation (string: "upper", "lower", "reverse", "title")
  - Output: result (string), original_length (int), operation_applied (string)
  - Entry point function name: transform (in main.py)
  - Must use @traced() decorator
  - Register the function in uipath.json under "functions" key
  - Then run `uv run uipath init` to generate entry-points.json
tags: [agents, scaffold, simple-function, t2]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_check"
    path: "main.py"
    includes:
      - "@traced()"
      - "def transform"
      - "result"
      - "original_length"
      - "operation_applied"
    patterns:
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py has correct structure with transform function"
    weight: 3.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "entry-points.json must exist (uipath init was run)"
    weight: 2.0

  - type: "import_check"
    path: "main.py"
    description: "All imports resolve"
    weight: 1.0

  - type: "run_command"
    command: "uv run uipath run transform '{\"text\": \"Hello World\", \"operation\": \"upper\"}'"
    timeout: 60
    expected_stdout: "HELLO WORLD"
    stdout_match: "contains"
    description: "Agent correctly transforms to uppercase"
    weight: 3.0

  - type: "run_command"
    command: "uv run uipath run transform '{\"text\": \"Hello World\", \"operation\": \"reverse\"}'"
    timeout: 60
    expected_stdout: "dlroW olleH"
    stdout_match: "contains"
    description: "Agent correctly reverses the string"
    weight: 3.0

  - type: "commands_efficiency"
    expected_commands: 18
    description: "Complete within command budget"
    weight: 0.5
    pass_threshold: 0.3
