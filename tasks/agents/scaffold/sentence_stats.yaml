task_id: "ca-scaffold-sentence-stats"
description: >
  Scaffold a new simple-function UiPath agent named 'sentence-stats' that
  accepts a text string and returns character_count, word_count, and
  sentence_count as integers. Agent must use @traced() and lazy init.
initial_prompt: |
  Create a new UiPath agent in the current directory.
  - Agent name: sentence-stats
  - Input: text (string)
  - Output: character_count (int), word_count (int), sentence_count (int)
  - Entry point function name: analyze (in main.py)
  - Count sentences by splitting on ". ", "! ", "? " and trailing punctuation
  - Use @traced() decorator on the function
  - After creating main.py, register it in uipath.json and run `uv run uipath init`
  - Do NOT add a [build-system] section to pyproject.toml
  - Do NOT instantiate UiPath() at module level
max_iterations: 3
tags: [agents, scaffold, simple-function, t2]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

sandbox:
  driver: "tempdir"
  python: {}
  template_sources:
    - type: "template_dir"
      path: ../templates/pyproject-starter

success_criteria:
  - type: "file_exists"
    path: "main.py"
    description: "main.py must exist"
    weight: 1.0

  - type: "file_check"
    path: "main.py"
    includes:
      - "from pydantic import BaseModel"
      - "@traced()"
      - "character_count"
      - "word_count"
      - "sentence_count"
      - "def analyze"
    patterns:
      - pattern: "^(?:sdk|uipath|client)\\s*=\\s*UiPath\\(\\)"
        must_match: false
        flags: 8
      - pattern: "class Input\\(BaseModel\\)"
        must_match: true
      - pattern: "class Output\\(BaseModel\\)"
        must_match: true
    description: "main.py must have correct structure, tracing, and no module-level init"
    weight: 3.0

  - type: "file_check"
    path: "pyproject.toml"
    excludes: ["[build-system]", "hatchling", "setuptools"]
    includes: ["uipath", "requires-python"]
    description: "pyproject.toml must not have [build-system] section"
    weight: 1.0

  - type: "file_exists"
    path: "entry-points.json"
    description: "entry-points.json must exist (created by uipath init)"
    weight: 2.0

  - type: "import_check"
    path: "main.py"
    description: "All imports in main.py must resolve correctly"
    weight: 1.0

  - type: "uipath_eval"
    description: "Agent must pass ExactMatch evaluation for sentence stats"
    agent_name: analyze
    eval_set: evaluations/eval-sets/sentence-stats.json
    thresholds:
      ExactMatchEvaluator: 1.0
    weight: 4.0
    pass_threshold: 1.0

  - type: "commands_efficiency"
    expected_commands: 20
    description: "Agent should complete within expected command budget"
    weight: 1.0
    pass_threshold: 0.5
