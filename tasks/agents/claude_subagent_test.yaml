task_id: claude_subagent_test
description: |
  Exercises sub-agent token attribution: the agent delegates a subtask to a
  spawned sub-agent (Claude's Task tool), then records the result. Drives the
  sub_agent_usage telemetry path so per-sub-agent token capture can be compared
  against the Codex counterpart.

tags:
  - claude
  - streaming
  - sub-agent

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools:
    - Task
    - Bash
    - Read
    - Write
  # Self-contained sandbox — no host CLAUDE.md/settings injected.
  setting_sources: []

initial_prompt: |
  Delegate this to a SUB-AGENT (use the Task tool to spawn one). Instruct the
  sub-agent to compute the sum of the integers from 1 to 100 inclusive by RUNNING
  A SHELL COMMAND with its Bash tool (for example `python3 -c "print(sum(range(1,101)))"`
  or `seq 1 100 | paste -sd+ | bc`) — it must execute a command, not reason the
  number out in its head. When the sub-agent returns the result, write just that
  number to a file named answer.txt in the working directory, and stop. Do not
  compute the sum yourself — have the sub-agent do it via Bash.

success_criteria:
  - type: file_contains
    path: answer.txt
    includes: ["5050"]
    description: "answer.txt must contain the sub-agent's computed sum (5050)."

run_limits:
  max_turns: 12
  task_timeout: 240
  turn_timeout: 120
