task_id: season-n8n
description: >
  n8n-only task (no direct flow parallel; closest shape is
  `skill-flow-feet-inches` — Switch on input). POST webhook takes a quarter
  (1-4), returns the corresponding season name. Exercises Switch on integer
  with four cases converging on a single response. Agent has the n8n-mcp
  read+validate subset, paralleling flow's `uip maestro flow registry` +
  `uip maestro flow validate` loop.
tags: [n8n, workflow-json, switch, mcp]

run_limits:
  max_turns: 30
agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Glob"
    - "Grep"
    - "mcp__n8n-mcp__search_nodes"
    - "mcp__n8n-mcp__get_node"
    - "mcp__n8n-mcp__validate_workflow"
    - "mcp__n8n-mcp__validate_node"
    - "mcp__n8n-mcp__tools_documentation"
  claude_settings:
    mcpServers:
      n8n-mcp:
        type: stdio
        command: npx
        args: ["-y", "n8n-mcp"]
        env:
          MCP_MODE: stdio
          LOG_LEVEL: error
          DISABLE_CONSOLE_OUTPUT: "true"

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Write an n8n workflow JSON at `Season.json`. It should expose a POST webhook
  taking `quarter` (an integer 1-4) in the body and respond with
  `{"season": "Spring"|"Summer"|"Fall"|"Winter"}`. Mapping: 1→Spring, 2→Summer,
  3→Fall, 4→Winter.

success_criteria:
  - type: file_exists
    description: "Season.json exists"
    path: "Season.json"
    weight: 1.0
    pass_threshold: 1.0

  # Informational: n8n-mcp's validate is stronger than flow's, so we surface
  # the signal but don't gate on it (pass_threshold 0.0). Parity with the
  # `uip maestro flow validate` self-check available to the flow agent.
  - type: run_command
    description: "n8n-mcp validate_workflow (informational, never fails)"
    command: "python3 $TASK_DIR/../shared/validate_workflow_mcp.py Season.json"
    timeout: 180
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Deploy to live n8n, invoke webhook for each quarter, verify season"
    command: "python3 $TASK_DIR/check_season_e2e.py Season.json"
    timeout: 60
    score_from_stdout: true
    weight: 8.0
    pass_threshold: 1.0
