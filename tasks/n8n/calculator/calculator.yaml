task_id: calculator-n8n
description: >
  n8n version of `skill-flow-calculator`: POST webhook takes two numbers `a` and
  `b`, returns their product. Smallest reasonable shape — webhook + arithmetic
  in a single Code node. Agent has the n8n-mcp read+validate subset, paralleling
  flow's `uip maestro flow registry` + `uip maestro flow validate` loop.
tags: [n8n, workflow-json, generate, mcp, flow-parallel]

run_limits:
  max_turns: 30
agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Glob"
    - "Grep"
    - "mcp__n8n-mcp__search_nodes"
    - "mcp__n8n-mcp__get_node"
    - "mcp__n8n-mcp__validate_workflow"
    - "mcp__n8n-mcp__validate_node"
    - "mcp__n8n-mcp__tools_documentation"
  claude_settings:
    mcpServers:
      n8n-mcp:
        type: stdio
        command: npx
        args: ["-y", "n8n-mcp"]
        env:
          MCP_MODE: stdio
          LOG_LEVEL: error
          DISABLE_CONSOLE_OUTPUT: "true"

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Write an n8n workflow JSON at `Calculator.json`. It should expose a POST
  webhook that takes two numbers `a` and `b` in the request body and responds
  with their product.

success_criteria:
  - type: file_exists
    description: "Calculator.json exists"
    path: "Calculator.json"
    weight: 1.0
    pass_threshold: 1.0

  # Informational: n8n-mcp's validate is stronger than flow's, so we surface
  # the signal but don't gate on it (pass_threshold 0.0). Parity with the
  # `uip maestro flow validate` self-check available to the flow agent.
  - type: run_command
    description: "n8n-mcp validate_workflow (informational, never fails)"
    command: "python3 $TASK_DIR/../shared/validate_workflow_mcp.py Calculator.json"
    timeout: 180
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0

  # End-to-end check: deploys the agent's workflow to a live n8n via the public
  # REST API (which itself validates the JSON), activates it, POSTs random
  # inputs to the webhook, and verifies the multiplication. Requires N8N_API_URL
  # (default http://localhost:5678) and N8N_API_KEY in the env when the eval
  # runs. The check script cleans up the deployed workflow before exiting.
  - type: run_command
    description: "Deploy to live n8n, invoke webhook, verify a*b response"
    command: "python3 $TASK_DIR/check_calculator_e2e.py Calculator.json"
    timeout: 60
    score_from_stdout: true
    weight: 8.0
    pass_threshold: 1.0
