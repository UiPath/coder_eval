task_id: multi-city-weather-n8n
description: >
  n8n version of `skill-flow-multi-city-weather`: iterates over Seattle,
  Phoenix, and New York; fetches each city's current temperature from
  open-meteo; classifies warm/cold (>60F); and aggregates the per-city
  results into a single array. Structural checks only (no live execution).
  Agent has the n8n-mcp read+validate subset, paralleling flow's
  `uip maestro flow registry` + `uip maestro flow validate` loop.
tags: [n8n, workflow-json, loop, http, mcp, flow-parallel]

run_limits:
  max_turns: 45

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Glob"
    - "Grep"
    - "mcp__n8n-mcp__search_nodes"
    - "mcp__n8n-mcp__get_node"
    - "mcp__n8n-mcp__validate_workflow"
    - "mcp__n8n-mcp__validate_node"
    - "mcp__n8n-mcp__tools_documentation"
  claude_settings:
    mcpServers:
      n8n-mcp:
        type: stdio
        command: npx
        args: ["-y", "n8n-mcp"]
        env:
          MCP_MODE: stdio
          LOG_LEVEL: error
          DISABLE_CONSOLE_OUTPUT: "true"

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Write an n8n workflow JSON at `MultiCityWeather.json`. It should:

  1. Start on a manual trigger (`n8n-nodes-base.manualTrigger`).
  2. Hardcode the city list — Seattle, Phoenix, New York — with their
     latitude/longitude (e.g. in a Code node that emits one item per
     city, or as an inline array fed into a splitOut).
  3. Loop one city at a time using either
     `n8n-nodes-base.splitInBatches` (batchSize 1) or
     `n8n-nodes-base.splitOut` over the city array.
  4. For each city, call open-meteo via `n8n-nodes-base.httpRequest`:
     `https://api.open-meteo.com/v1/forecast?latitude=...&longitude=...`
     `&current=temperature_2m&temperature_unit=fahrenheit`.
  5. Classify each result as `warm` (>60F) or `cold` in a Code node
     or an IF node.
  6. Aggregate the three per-city results back into a single array
     containing `{city, temperature, verdict}` for each.

success_criteria:
  - type: file_exists
    description: "MultiCityWeather.json exists"
    path: "MultiCityWeather.json"
    weight: 1.0
    pass_threshold: 1.0

  # Informational: n8n-mcp's validate is stronger than flow's, so we surface
  # the signal but don't gate on it (pass_threshold 0.0). Parity with the
  # `uip maestro flow validate` self-check available to the flow agent.
  - type: run_command
    description: "n8n-mcp validate_workflow (informational, never fails)"
    command: "python3 $TASK_DIR/../shared/validate_workflow_mcp.py MultiCityWeather.json"
    timeout: 180
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Required primitives present (loop, HTTP, classifier)"
    command: |
      python3 -c "
      import json
      types = {n['type'] for n in json.load(open('MultiCityWeather.json')).get('nodes', [])}
      assert types & {'n8n-nodes-base.splitInBatches', 'n8n-nodes-base.splitOut'}, f'no loop primitive: {types}'
      assert 'n8n-nodes-base.httpRequest' in types, f'no HTTP node: {types}'
      assert types & {'n8n-nodes-base.if', 'n8n-nodes-base.code', 'n8n-nodes-base.function'}, f'no classifier: {types}'
      print('OK')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
