task_id: slack-weather-pipeline-n8n
description: >
  n8n version of `skill-flow-slack-weather-pipeline`: reads a Slack channel
  description, extracts the city in a Code node, fetches the current weather
  from open-meteo, and branches on a warm/cold verdict. Structural checks only
  (no live execution). Agent has the n8n-mcp read+validate subset, paralleling
  flow's `uip maestro flow registry` + `uip maestro flow validate` loop.
tags: [n8n, workflow-json, http, decision, multi-connector, mcp, flow-parallel]

run_limits:
  max_turns: 45

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Glob"
    - "Grep"
    - "mcp__n8n-mcp__search_nodes"
    - "mcp__n8n-mcp__get_node"
    - "mcp__n8n-mcp__validate_workflow"
    - "mcp__n8n-mcp__validate_node"
    - "mcp__n8n-mcp__tools_documentation"
  claude_settings:
    mcpServers:
      n8n-mcp:
        type: stdio
        command: npx
        args: ["-y", "n8n-mcp"]
        env:
          MCP_MODE: stdio
          LOG_LEVEL: error
          DISABLE_CONSOLE_OUTPUT: "true"

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Write an n8n workflow JSON at `SlackWeatherPipeline.json`. It should:

  1. Start on a manual trigger (`n8n-nodes-base.manualTrigger`).
  2. Read the description of the Slack channel `#office-bellevue` using
     `n8n-nodes-base.slack` (channel info / get operation).
  3. Extract the city name from the description in a Code node
     (`n8n-nodes-base.code`).
  4. Fetch the current temperature in Fahrenheit for that city from
     open-meteo. Use `n8n-nodes-base.httpRequest` against
     `https://api.open-meteo.com/v1/forecast` with `latitude`,
     `longitude`, `current=temperature_2m`, `temperature_unit=fahrenheit`.
     You can hardcode a small city→lat/long map in the Code node and
     pass lat/long to the HTTP node via expressions.
  5. Use an IF node to branch on `temperature > 60`:
     - True: output `{"verdict": "warm office today"}`.
     - False: output `{"verdict": "cold office today"}`.

  Credentials don't need to be wired to real accounts — only the workflow
  structure is being checked.

success_criteria:
  - type: file_exists
    description: "SlackWeatherPipeline.json exists"
    path: "SlackWeatherPipeline.json"
    weight: 1.0
    pass_threshold: 1.0

  # Informational: n8n-mcp's validate is stronger than flow's, so we surface
  # the signal but don't gate on it (pass_threshold 0.0). Parity with the
  # `uip maestro flow validate` self-check available to the flow agent.
  - type: run_command
    description: "n8n-mcp validate_workflow (informational, never fails)"
    command: "python3 $TASK_DIR/../shared/validate_workflow_mcp.py SlackWeatherPipeline.json"
    timeout: 180
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Required node types present (Slack, HTTP, IF, code-like)"
    command: |
      python3 -c "
      import json
      types = {n['type'] for n in json.load(open('SlackWeatherPipeline.json')).get('nodes', [])}
      required = {'n8n-nodes-base.slack', 'n8n-nodes-base.httpRequest', 'n8n-nodes-base.if'}
      missing = required - types
      assert not missing, f'missing: {missing} (have {types})'
      assert types & {'n8n-nodes-base.code', 'n8n-nodes-base.function'}, f'no Code/Function: {types}'
      print('OK')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
