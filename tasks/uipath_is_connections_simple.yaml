task_id: uipath-is-connections-simple
description: >
  Minimal-prompt evaluation: agent must figure out how to list and ping
  Integration Service connections using uipcli CLI with no step-by-step guidance.
tags: [is, uipcli, simple]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]
  max_turns: 15

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Use the `uipcli` CLI tool to list Integration Service connections for the
  Zoho Desk connector (uipath-zoho-desk), verify one is active by pinging it,
  and save the results. Save the connection list to connections_list.json and the
  ping result to connection_ping.json.

success_criteria:
  - type: file_exists
    description: "connections_list.json file exists"
    path: "connections_list.json"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "connections_list.json is valid JSON"
    command: "python -c \"import json; json.load(open('connections_list.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "connections_list.json contains connection data"
    path: "connections_list.json"
    includes:
      - "Id"
      - "Name"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed connections"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+is\s+connections\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "connection_ping.json file exists"
    path: "connection_ping.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent pinged a connection"
    tool_name: "Bash"
    command_pattern: 'uipcli\s+is\s+connections\s+ping'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

max_iterations: 2

llm_reviewer:
  enabled: true
