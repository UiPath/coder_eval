task_id: run-limits-subagent-cap
description: >-
  Proves run_limits.max_tool_calls counts main-thread tool calls only. The main
  thread makes exactly two calls (Task, then Write) and the sub-agent it spawns
  makes at least one Bash call. With a cap of 2 the task must end SUCCESS with
  answer.txt written and model_used equal to the main model. If sub-agent calls
  counted, the cap would trip at Task + Bash and answer.txt would never exist.

tags:
  - run-limits
  - sub-agent
  - claude

agent:
  type: claude-code

initial_prompt: |
  Delegate this to a SUB-AGENT (use the Task tool to spawn one). Instruct the
  sub-agent to compute the sum of the integers from 1 to 100 inclusive by RUNNING
  A SHELL COMMAND with its Bash tool (for example `python3 -c "print(sum(range(1,101)))"`
  or `seq 1 100 | paste -sd+ | bc`) — it must execute a command, not reason the
  number out in its head. When the sub-agent returns the result, write just that
  number to a file named answer.txt in the working directory, and stop. Do not
  compute the sum yourself — have the sub-agent do it via Bash.
  Make exactly two tool calls yourself: the Task call, then the Write call.

success_criteria:
  - type: file_contains
    path: answer.txt
    includes: ["5050"]
    description: "answer.txt must contain the sub-agent's computed sum (5050)."

run_limits:
  max_tool_calls: 2
  turn_timeout: 180
  task_timeout: 300
