task_id: uipath-classification-agent
description: "Create a text classification agent using UiPath LangChain"
tags: [golden, uipath-langchain, network]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash"]

sandbox:
  driver: tempdir
  python:
    env_packages:
      - uipath-langchain>=0.0.140
      - pydantic>=2.0
      - python-dotenv>=1.0
  template_sources:
    - type: template_dir
      path: "../templates/uipath-starter"

initial_prompt: |
  Write your solution in main.py (overwrite the existing file).

  I need a text classification agent that takes a piece of customer feedback and sorts it
  into one of several categories (e.g. "positive", "negative", "neutral", "question",
  "complaint"). The caller should be able to pass in which categories are valid.

  Use UiPathChat as the LLM and Pydantic models for the input (text + category list)
  and output (chosen category + confidence score). Prefer structured output over parsing
  raw LLM text — it's way more reliable.

  The entrypoint should be a main() function with typed input/output. Load env vars
  with dotenv so credentials work locally.

  Keep it to one file, no extras.

success_criteria:
  - type: file_exists
    description: "main.py file exists"
    path: "main.py"
    weight: 0.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Uses UiPathChat from uipath_langchain"
    path: "main.py"
    includes:
      - "UiPathChat"
      - "uipath_langchain"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Uses Pydantic BaseModel for type safety"
    path: "main.py"
    includes:
      - "BaseModel"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Defines input model with categories"
    path: "main.py"
    includes:
      - "categories"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Defines output model with confidence score"
    path: "main.py"
    includes:
      - "confidence"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Loads environment variables properly"
    path: "main.py"
    includes:
      - "load_dotenv"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Has main() function with type annotations"
    path: "main.py"
    includes:
      - "def main"
      - "-> "
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Python syntax is valid"
    command: "python -m py_compile main.py"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Module imports resolve correctly"
    command: "python -c 'import main'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.5
    pass_threshold: 1.0

max_iterations: 1

reference:
  code: |
    from dotenv import load_dotenv
    from pydantic import BaseModel, Field
    from langchain_core.messages import HumanMessage, SystemMessage
    from uipath_langchain.chat import UiPathChat

    load_dotenv()


    class ClassificationInput(BaseModel):
        text: str
        categories: list[str] = ["positive", "negative", "neutral", "question", "complaint"]


    class ClassificationOutput(BaseModel):
        category: str
        confidence: float = Field(ge=0.0, le=1.0)


    class _LLMClassification(BaseModel):
        category: str
        confidence: float = Field(ge=0.0, le=1.0)


    def main(input: ClassificationInput) -> ClassificationOutput:
        categories_str = ", ".join(f'"{c}"' for c in input.categories)

        llm = UiPathChat(model="gpt-4o-mini-2024-07-18")
        structured_llm = llm.with_structured_output(_LLMClassification)

        result = structured_llm.invoke([
            SystemMessage(content="You are a text classification assistant. Choose exactly one category."),
            HumanMessage(content=f"Classify into one of [{categories_str}]:\n\n{input.text}"),
        ])

        if result.category not in input.categories:
            return ClassificationOutput(category=input.categories[0], confidence=0.0)

        return ClassificationOutput(category=result.category, confidence=result.confidence)

llm_reviewer:
  enabled: true
  prompt: |
    Evaluate if the classification agent is complete and follows modern UiPath patterns:

    1. Does it use UiPathChat from uipath_langchain.chat?
    2. Are input/output models properly defined with Pydantic BaseModel?
    3. Does it accept dynamic categories as input?
    4. Does it load environment variables with dotenv?
    5. Does it use with_structured_output() or similar for reliable parsing?
    6. Does it have a main() function with proper type signatures?
