task_id: "hello_date_delegate_smoke_test"
description: "Smoke-test the Delegate agent harness: create and run a small Python script."
initial_prompt: "Create a Python file named app.py in the current working directory that prints 'Hello, Delegate!' on one line, and today's date in YYYY-MM-DD format on the next line. Use the datetime module. Then run the script with: python app.py"
# No `smoke-pass`: that tag routes a task into the CI E2E bucket, which has no
# UiPath auth or @uipath/delegate-sdk install. Run this task locally (or in a
# job that provisions both) instead.
tags: [smoke, basic, pure-python, delegate]

run_limits:
  expected_turns: 5
  task_timeout: 600

agent:
  type: "delegate"
  # Pin a model your tenant+environment actually serves; the framework's
  # inherited default is a Claude id the Delegate backend may not have
  # deployed. virtuoso-1-5 is the Delegate SDK's own default.
  model: "virtuoso-1-5"
  enable_computer_use: false

success_criteria:
  - type: "file_exists"
    path: "app.py"
    description: "The file app.py must be created."
  - type: "file_contains"
    path: "app.py"
    includes: ["Hello, Delegate!", "datetime"]
    description: "The script must contain the required string and import."
  - type: "run_command"
    command: "python app.py"
    timeout: 10
    description: "The script must execute successfully."
