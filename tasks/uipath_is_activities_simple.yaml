task_id: uipath-is-activities-simple
description: >
  Minimal-prompt evaluation: agent must figure out how to list Integration Service
  activities using uip CLI with no step-by-step guidance.
tags: [is, uipcli, simple]

max_turns: 10
agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash", "Read", "Write"]

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Use the `uip` CLI tool to list all non-trigger Integration Service activities
  for the Zoho Desk connector (uipath-zoho-desk) and save the output to
  activities.json in the current directory.

success_criteria:
  - type: file_exists
    description: "activities.json file exists"
    path: "activities.json"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "activities.json is valid JSON"
    command: "python -c \"import json; json.load(open('activities.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "activities.json contains activity data"
    path: "activities.json"
    includes:
      - "ActivityList"
      - "Name"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran uip is activities list"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+activities\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0
