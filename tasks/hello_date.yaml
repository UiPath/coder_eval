task_id: "hello_date_smoke_test"
description: "Create a Python script that prints 'Hello, Claude!' then the current date."
initial_prompt: "Create a Python file named app.py in the current working directory that prints 'Hello, Claude!' on one line, and today's date in YYYY-MM-DD format on the next line. Use the datetime module. Then run the script with: python app.py"
tags: [smoke, smoke-pass, golden, basic, pure-python]

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"  # Safer default
  allowed_tools: ["Read", "Write", "Bash"]

success_criteria:
  - type: "file_exists"
    path: "app.py"
    description: "The file app.py must be created."
  - type: "file_contains"
    path: "app.py"
    includes: ["Hello, Claude!", "datetime"]
    description: "The script must contain the required string and import."
  - type: "run_command"
    command: "python app.py"
    timeout: 10
    description: "The script must execute successfully."
