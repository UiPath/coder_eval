task_id: uipath-calculator-agent
description: "Create a calculator agent using UiPath LangGraph StateGraph"
tags: [golden, uipath-langchain, network]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Bash"]

sandbox:
  driver: tempdir
  python:
    env_packages:
      - uipath-langchain>=0.0.140
      - pydantic>=2.0
      - python-dotenv>=1.0
  template_sources:
    - type: template_dir
      path: "../templates/uipath-starter"

initial_prompt: |
  Write your solution in main.py (overwrite the existing file).

  I need a simple calculator built as a LangGraph StateGraph agent. It should take two
  numbers and an operator (+, -, *, /) and return the result along with a human-readable
  description of what it computed (like "10 + 5 = 15").

  Use Pydantic BaseModel for the input and output schemas, and wire up a single
  "calculate" node in the graph (START -> calculate -> END). Make sure division by zero
  doesn't crash it.

  The entrypoint should be a main() function with typed input/output, following the
  standard UiPath coded agents pattern.

  Keep it to one file, no extras.

success_criteria:
  - type: file_exists
    description: "main.py file exists"
    path: "main.py"
    weight: 0.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Uses LangGraph StateGraph"
    path: "main.py"
    includes:
      - "langgraph.graph"
      - "StateGraph"
      - "START"
      - "END"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Uses Pydantic BaseModel for types"
    path: "main.py"
    includes:
      - "BaseModel"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Defines input model with operator field"
    path: "main.py"
    includes:
      - "operator"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Defines output model with operation description"
    path: "main.py"
    includes:
      - "operation"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Creates StateGraph with proper configuration"
    path: "main.py"
    includes:
      - "StateGraph("
      - "add_node"
      - "add_edge"
      - "compile"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Implements calculate function"
    path: "main.py"
    includes:
      - "def calculate"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Python syntax is valid"
    command: "python -m py_compile main.py"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Module imports resolve correctly"
    command: "python -c 'import main'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.5
    pass_threshold: 1.0

max_iterations: 1

reference:
  code: |
    from pydantic import BaseModel
    from langgraph.graph import StateGraph, START, END


    class CalculatorInput(BaseModel):
        a: float
        b: float
        operator: str


    class CalculatorOutput(BaseModel):
        result: float
        operation: str


    def calculate(state: CalculatorInput) -> CalculatorOutput:
        if state.operator == "+":
            result = state.a + state.b
        elif state.operator == "-":
            result = state.a - state.b
        elif state.operator == "*":
            result = state.a * state.b
        elif state.operator == "/":
            result = state.a / state.b if state.b != 0 else 0
        else:
            result = 0

        return CalculatorOutput(
            result=result,
            operation=f"{state.a} {state.operator} {state.b} = {result}",
        )


    def main(input: CalculatorInput) -> CalculatorOutput:
        builder = StateGraph(
            state_schema=CalculatorInput,
            input=CalculatorInput,
            output=CalculatorOutput,
        )
        builder.add_node("calculate", calculate)
        builder.add_edge(START, "calculate")
        builder.add_edge("calculate", END)

        graph = builder.compile()
        result = graph.invoke(input)
        return CalculatorOutput(**result)

llm_reviewer:
  enabled: true
  prompt: |
    Evaluate if the calculator agent is complete and follows UiPath LangGraph patterns:

    1. Does it use LangGraph StateGraph with proper configuration?
    2. Are input/output models properly defined with Pydantic BaseModel?
    3. Does it implement a calculate node function?
    4. Does the graph flow from START -> calculate -> END?
    5. Can it handle +, -, *, / operations?
    6. Does it handle division by zero?
