task_id: n8n-release-rollup
description: >
  Author a complete n8n workflow JSON for a release-rollup scenario:
  iterate a hardcoded list of GitHub repos, fetch each repo's latest
  release, branch on security keywords, fan out to Jira + Slack +
  Outlook on the security branch and Slack + Outlook on the normal
  branch. Mirror of release_rollup_v2 / flow-json-release-rollup for
  apples-to-apples cross-tool comparison.
tags: [n8n, generate, http, decision, loop, multi-connector, complex]

task_timeout: 1800

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  max_turns: 120
  turn_timeout: 1800

sandbox:
  driver: tempdir
  python: {}
  template_sources:
    - type: template_dir
      path: "../../templates/n8n"

initial_prompt: |
  Author an n8n workflow named **ReleaseRollup** as a single
  `workflow.json` file in the current directory. Read `SKILL.md` first.

  ## Scenario

  Daily rollup of new GitHub releases for a list of tracked open-source
  projects. For each repo, fetch its latest release; if the release is
  less than 7 days old, fan out to Outlook + Slack (and Jira if it looks
  security-related). End with a digest email summarising counts.

  ### Tracked repos (hardcoded in the workflow)

  ```
  ["nodejs/node", "python/cpython", "microsoft/typescript",
   "kubernetes/kubernetes", "facebook/react"]
  ```

  ### Per-repo logic

  1. Fetch the latest release from
     `https://api.github.com/repos/{repo}/releases/latest` via an
     `n8n-nodes-base.httpRequest` node (no auth needed). The response
     has `name`, `tag_name`, `published_at`, `body` (release notes),
     `html_url`.
  2. Decide: is the release new (≤ 7 days old)? Compare
     `published_at` to `$now` minus 7 days.
     - **No** — skip; route into the post-loop aggregation.
     - **Yes** — check whether the title or body contains a security
       keyword (case-insensitive contains: `"CVE"`, `"security"`,
       `"vulnerability"`, `"advisory"`).
       - **Security**: dispatch all three:
         - Jira (`n8n-nodes-base.jira`) — project `MAESTRO`, summary
           `"Security release: {repo} {tag_name}"`, description = release
           notes.
         - Slack (`n8n-nodes-base.slack`) DM to user `U_DUSTIN` with the
           release notes URL.
         - Outlook (`n8n-nodes-base.microsoftOutlook`) email to
           `dustin.metzgar@uipath.com`, subject `"[SECURITY] {repo}
           released {tag_name}"`, body = release notes.
       - **Normal**: dispatch Slack DM + Outlook email (no Jira), same
         recipients, subject `"{repo} released {tag_name}"`.

  ### After the loop

  Send one final Outlook digest email to `dustin.metzgar@uipath.com`
  with subject `"Daily release rollup"` summarising the counts of
  skipped, normal, and security releases.

  ## Files to write (project root)

  - `workflow.json`   the complete n8n workflow

  Credentials don't need to be wired to real accounts — `verify.sh`
  imports the workflow structurally without executing it.

  ## Verifying your work

  ```bash
  ./verify.sh workflow.json
  ```

  A clean import looks like `Successfully imported 1 workflow.` —
  iterate against this first; if you hit `NOT NULL constraint failed`
  you've forgotten the top-level `id`, and JSON parse errors point at
  the malformed location.

  ## Discovering node parameter shapes

  To see exactly what fields a node accepts:

  ```bash
  n8n export:nodes --output=/tmp/nodes.json
  python3 -c "
  import json
  n = next(x for x in json.load(open('/tmp/nodes.json')) if x['name'] == 'n8n-nodes-base.jira')
  print(json.dumps(n.get('properties', [])[:6], indent=2))
  "
  ```

success_criteria:
  - type: file_exists
    description: "workflow.json exists"
    path: "workflow.json"
    weight: 1.0
  - type: run_command
    description: "workflow.json is valid JSON"
    command: "python3 -c 'import json; json.load(open(\"workflow.json\"))'"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "n8n imports the workflow without errors"
    command: "./verify.sh workflow.json"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "Workflow has the required node types (HTTP, IF, Slack, Outlook, Jira)"
    command: |
      python3 -c "
      import json
      w = json.load(open('workflow.json'))
      types = {n['type'] for n in w.get('nodes', [])}
      required = {
        'n8n-nodes-base.httpRequest',
        'n8n-nodes-base.if',
        'n8n-nodes-base.slack',
        'n8n-nodes-base.microsoftOutlook',
        'n8n-nodes-base.jira',
      }
      missing = required - types
      assert not missing, f'missing required node types: {missing}'
      print(f'OK: {len(w[\"nodes\"])} nodes, all required types present')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: "Workflow has iteration (splitInBatches or splitOut) + ≥1 decision"
    command: |
      python3 -c "
      import json
      w = json.load(open('workflow.json'))
      types = [n['type'] for n in w.get('nodes', [])]
      loops = sum(1 for t in types if t in ('n8n-nodes-base.splitInBatches', 'n8n-nodes-base.splitOut'))
      decisions = sum(1 for t in types if t in ('n8n-nodes-base.if', 'n8n-nodes-base.switch'))
      assert loops >= 1, f'no loop/splitOut node: {types}'
      assert decisions >= 2, f'expected ≥2 decision nodes (new + security), got {decisions}'
      print(f'iter: {loops}, decisions: {decisions}')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: "Workflow references GitHub releases URL + recipient/project"
    command: |
      python3 -c "
      import json
      raw = open('workflow.json').read()
      assert 'api.github.com/repos' in raw, 'GitHub releases URL not in workflow'
      assert 'dustin.metzgar@uipath.com' in raw, 'recipient email not in workflow'
      assert 'MAESTRO' in raw or 'Maestro' in raw, 'Jira project key not in workflow'
      print('OK')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
  - type: run_command
    description: "Connections wire HTTP → decision → 3 connectors on the security branch"
    command: |
      python3 -c "
      import json
      w = json.load(open('workflow.json'))
      conns = w.get('connections', {})
      nodes_by_name = {n['name']: n for n in w.get('nodes', [])}
      # Find the IF node that splits on the security keywords (heuristic: has 'CVE' or
      # 'security' in any condition's rightValue, OR is the only IF connected to >= 3
      # downstream targets across its two outputs).
      def edges_from(name):
          out = conns.get(name, {}).get('main', [])
          # flatten port-arrays
          return [(i, t['node']) for i, port in enumerate(out) for t in port]
      ifs = [n for n in w['nodes'] if n['type'] == 'n8n-nodes-base.if']
      assert ifs, 'no IF node'
      # Look for any IF whose true-port reaches Slack + Outlook + Jira
      found = False
      for ifn in ifs:
          targets_per_port = {}
          for i, t in edges_from(ifn['name']):
              targets_per_port.setdefault(i, []).append(t)
          for port, ts in targets_per_port.items():
              types = {nodes_by_name[t]['type'] for t in ts if t in nodes_by_name}
              if {'n8n-nodes-base.slack', 'n8n-nodes-base.microsoftOutlook', 'n8n-nodes-base.jira'}.issubset(types):
                  found = True
                  break
          if found: break
      assert found, 'no IF port fans out to Slack + Outlook + Jira (security branch missing)'
      print('OK: security fan-out wired')
      "
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: llm_judge
    description: "Workflow implements the rollup logic end-to-end"
    prompt: |
      Did the agent author an n8n workflow that:
      (a) iterates over a hardcoded list of GitHub repos (splitInBatches
          or splitOut + loop);
      (b) fetches each repo's latest release via HTTP Request against
          `api.github.com/repos/<repo>/releases/latest`;
      (c) decides whether the release is "new" (within 7 days);
      (d) if new, decides whether it looks security-related
          (CVE/security/vulnerability/advisory keyword);
      (e) on the security branch, dispatches all three of: Jira create
          issue (project = MAESTRO, summary mentions repo+tag), Slack
          message, Outlook send-email (to dustin.metzgar@uipath.com);
      (f) on the non-security new-release branch, dispatches Slack +
          Outlook (no Jira);
      (g) maintains counts (skipped / normal / security) across
          iterations;
      (h) sends a final Outlook digest email summarising the counters.

      Score 1.0 if all eight pieces are present and structurally
      correct. Subtract 0.1 per missing piece; floor at 0.
    files:
      - "workflow.json"
    weight: 3.0
    pass_threshold: 0.7
