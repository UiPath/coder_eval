task_id: "early_stop_decision_budget_exceeded"
description: >
  Decision-step budget (GitHub issue #61, item 3): the armed command_executed
  criterion caps at max_steps_to_decide: 3 — if the agent hasn't run the
  script within its first 3 tool calls, EarlyStopWatcher fires
  reason=decision_budget_exceeded and the run is force-failed outright,
  bypassing the weighted stop_early_gate_threshold gate entirely (a criterion
  that never reached a verdict has nothing meaningful to weigh against the
  advisory file_exists criterion below). This is a NON-CI example task
  (deliberately untagged for smoke-pass/smoke-fail): the agent's actual
  exploration behavior is not deterministic enough for a live-agent CI
  assertion — run it manually with `coder-eval run` to observe the mechanism.
tags: [early-stop, decision-budget]

initial_prompt: >
  Before doing anything else, spend at least 5 tool calls exploring the
  repository (ls, find, read a few files) before creating app.py. Then create
  a Python file named app.py that prints 'Hello, Claude!' and run it with:
  python app.py

agent:
  type: "claude-code"
  permission_mode: "acceptEdits"
  allowed_tools: ["Read", "Write", "Bash", "Glob"]

run_limits:
  max_turns: 20
  stop_early: true

success_criteria:
  - type: "command_executed"
    description: "Agent ran the script within its decision budget"
    tool_name: "Bash"
    command_pattern: "python app\\.py"
    min_count: 1
    stop_when: "auto"
    max_steps_to_decide: 3
  - type: "file_exists"
    path: "app.py"
    description: "app.py must exist (advisory — not armed, only gates a full run)"
