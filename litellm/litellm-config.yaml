# LiteLLM proxy config for the coder_eval `litellm` (open-weight) backend.
#
# Full guide (when to run the proxy, how to add models): litellm/README.md
#
# Translates Anthropic Messages (what the Claude Code SDK speaks) <-> Bedrock
# Converse (what the non-Claude open-weight models speak), so the native `Skill`
# tool and UiPath skills fire unchanged. Verified 2026-07-21: HTTP 200 on both
# models via POST /v1/messages, and tool_use blocks survive the translation.
#
# Two ways to run the proxy:
#   - Manual: the operator starts the proxy and points coder_eval at it via
#     LITELLM_BASE_URL (coder_eval owns no proxy lifecycle).
#   - Autostart: coder_eval spawns the proxy against this same file, or an
#     always-on docker sidecar mounts it.
#
# Required env in the proxy's environment (NOT committed):
#   AWS_BEARER_TOKEN_BEDROCK  — Bedrock bearer token (LiteLLM forwards it).
#   AWS_REGION=eu-north-1      — EU residency (Stockholm).
#   LITELLM_MASTER_KEY         — the virtual key clients present as LITELLM_AUTH_TOKEN.
#
# Run manually:
#   uvx --from 'litellm[proxy]' litellm --config litellm/litellm-config.yaml --port 4000

model_list:
  # DeepSeek V3.2 — cost lead ($0.74 / $2.22 per Mtok).
  - model_name: deepseek.v3.2
    litellm_params:
      model: bedrock/converse/deepseek.v3.2
      aws_region_name: eu-north-1
  # GLM 5 — quality lead ($1.20 / $3.84 per Mtok, eu-north-1).
  - model_name: zai.glm-5
    litellm_params:
      model: bedrock/converse/zai.glm-5
      aws_region_name: eu-north-1
  # Kimi K2.5 (Moonshot AI) — Bedrock eu-north-1 (bare id, Converse).
  - model_name: moonshotai.kimi-k2.5
    litellm_params:
      model: bedrock/converse/moonshotai.kimi-k2.5
      aws_region_name: eu-north-1
  # OpenRouter models — cost-optimization path. Not on Bedrock; OpenRouter is
  # OpenAI-format, so LiteLLM does the Anthropic<->OpenAI translation.
  #
  # provider routing (extra_body.provider): OpenRouter is a multi-provider router,
  # and the harness can't tell which upstream actually served a given call — so
  # letting it silently fall back to an arbitrary provider would make latency and
  # behavior instrumentation hard to interpret. Instead, `provider.only` restricts
  # each model to a HARD allowlist of providers we've observed to be reliable (a
  # request is never served outside this set), `sort: price` tries them
  # cheapest-first, and `allow_fallbacks: false` keeps routing from substituting a
  # provider outside the vetted set. This also fixes the original single-pin 429:
  # with no `only` list the global cheapest could be a contended provider (Baidu
  # for deepseek-v4-pro) that 429s with nowhere to go — the curated set is
  # known-good upstreams instead. Cost is exact regardless of which listed provider
  # serves the call (cost_logger.py books the real per-call usage.cost).
  #
  # extra_body.usage.include (set on every model below): ask OpenRouter to return
  # the ACTUAL per-call usage.cost + cache tokens for the provider it routed to. The
  # Anthropic response the SDK receives has no slot for these, so cost_logger.py (the
  # callback in litellm_settings) reads them proxy-side and writes one JSONL record
  # per call for the harness to join back by the x-ce-* correlation headers.
  - model_name: moonshotai/kimi-k3
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        # usage.include + provider pin — see the OpenRouter note above.
        usage:
          include: true
        provider:
          sort: price
          allow_fallbacks: false
          only: ["baseten", "together", "fireworks"]
  - model_name: z-ai/glm-5.2
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        # usage.include + provider pin — see the OpenRouter note above.
        usage:
          include: true
        provider:
          sort: price
          allow_fallbacks: false
          only: ["novita", "streamlake", "gmicloud", "alibaba"]
  - model_name: deepseek/deepseek-v4-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        # usage.include + provider pin — see the OpenRouter note above.
        usage:
          include: true
        provider:
          sort: price
          allow_fallbacks: false
          only: ["streamlake", "gmicloud", "novita", "alibaba"]

litellm_settings:
  # Silently drop provider-unsupported OpenAI/Anthropic params rather than 400.
  drop_params: true
  # Per-call ACTUAL-cost + cache capture for the open-weight backend. Appends one
  # JSONL record per call to $LITELLM_COST_LOG (set in start-litellm.sh). Reads
  # OpenRouter's real usage.cost, NOT LiteLLM's response_cost (0.0 for models it
  # doesn't price). See cost_logger.py for the full rationale.
  callbacks: cost_logger.proxy_handler_instance

general_settings:
  # Read the virtual key from the environment — never hardcode a secret here.
  master_key: os.environ/LITELLM_MASTER_KEY
