[project]
name = "coder-eval-dashboard"
version = "0.1.0"
description = "ADX dashboard ingestion and schema management for coder-eval results"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.19.0",
    "azure-kusto-data>=4.6.1",
    "azure-storage-blob>=12.24.0",
    "pydantic-settings>=2.13.1",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
dashboard = "dashboard.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
